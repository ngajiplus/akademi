<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Admin NgajiPlus - Kelola Materi Video"
  >

  <title>Admin NgajiPlus</title>


  <!-- SUPABASE -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <script src="supabase-config.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #f6f8f7;

      color:
        #202a24;

    }


    a {
      text-decoration: none;
    }


    /* ================================
       HEADER
    ================================= */

    header {

      background:
        white;

      border-bottom:
        1px solid #e5e9e6;

    }


    .header-inner {

      max-width:
        1100px;

      margin:
        auto;

      padding:
        15px 20px;

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

    }


    .logo {

      color:
        #238b57;

      font-weight:
        bold;

      font-size:
        20px;

    }


    .logout-btn {

      border:
        none;

      background:
        #eeeeee;

      padding:
        9px 15px;

      border-radius:
        8px;

      cursor:
        pointer;

    }


    /* ================================
       MAIN
    ================================= */

    main {

      max-width:
        1100px;

      margin:
        auto;

      padding:
        30px 15px;

    }


    .page-title {

      margin-bottom:
        20px;

    }


    .page-title h1 {

      margin:
        0 0 5px;

      font-size:
        28px;

    }


    .page-title p {

      margin:
        0;

      color:
        #737b76;

    }


    /* ================================
       CARD
    ================================= */

    .card {

      background:
        white;

      border:
        1px solid #e3e8e5;

      border-radius:
        16px;

      padding:
        20px;

      margin-bottom:
        20px;

    }


    .card h2 {

      margin-top:
        0;

      font-size:
        20px;

    }


    /* ================================
       FORM
    ================================= */

    .form-group {

      margin-bottom:
        15px;

    }


    label {

      display:
        block;

      font-size:
        14px;

      font-weight:
        bold;

      margin-bottom:
        7px;

    }


    input,
    textarea,
    select {

      width:
        100%;

      padding:
        12px;

      border:
        1px solid #d9dedb;

      border-radius:
        9px;

      font-size:
        14px;

      background:
        white;

      outline:
        none;

    }


    input:focus,
    textarea:focus,
    select:focus {

      border-color:
        #238b57;

    }


    textarea {

      min-height:
        110px;

      resize:
        vertical;

    }


    /* ================================
       CHECKBOX
    ================================= */

    .checkbox-group {

      display:
        flex;

      align-items:
        center;

      gap:
        8px;

      margin:
        10px 0 18px;

    }


    .checkbox-group input {

      width:
        auto;

    }


    .checkbox-group label {

      margin:
        0;

      font-weight:
        normal;

    }


    /* ================================
       BUTTON
    ================================= */

    .btn {

      border:
        none;

      padding:
        12px 18px;

      border-radius:
        9px;

      cursor:
        pointer;

      font-weight:
        bold;

      font-size:
        14px;

    }


    .btn-save {

      width:
        100%;

      background:
        #008b4b;

      color:
        white;

    }


    .btn-save:hover {

      background:
        #00733e;

    }


    .btn-save:disabled {

      background:
        #aaa;

      cursor:
        not-allowed;

    }


    .btn-delete {

      background:
        #ffe4e4;

      color:
        #b42318;

      margin-top:
        10px;

    }


    /* ================================
       MESSAGE
    ================================= */

    .message {

      margin-top:
        15px;

      padding:
        12px;

      border-radius:
        8px;

      font-size:
        14px;

      display:
        none;

    }


    .success {

      display:
        block;

      background:
        #e8f7ee;

      color:
        #18794e;

    }


    .error {

      display:
        block;

      background:
        #fff1f1;

      color:
        #b42318;

    }


    /* ================================
       MATERIAL LIST
    ================================= */

    .material-item {

      border:
        1px solid #e3e8e5;

      border-radius:
        12px;

      padding:
        15px;

      margin-bottom:
        12px;

    }


    .material-title {

      font-size:
        17px;

      font-weight:
        bold;

      margin-bottom:
        6px;

    }


    .material-info {

      color:
        #737b76;

      font-size:
        13px;

      line-height:
        1.6;

    }


    .badge {

      display:
        inline-block;

      padding:
        4px 8px;

      border-radius:
        50px;

      font-size:
        11px;

      font-weight:
        bold;

      margin-top:
        5px;

    }


    .badge-free {

      background:
        #e8f7ee;

      color:
        #18794e;

    }


    .badge-premium {

      background:
        #fff3d6;

      color:
        #9a6700;

    }


    .empty {

      text-align:
        center;

      padding:
        35px;

      color:
        #777;

    }


    .loading {

      text-align:
        center;

      padding:
        30px;

      color:
        #777;

    }


    /* ================================
       RESPONSIVE
    ================================= */

    @media (
      max-width: 600px
    ) {

      .header-inner {

        padding:
          12px 15px;

      }


      main {

        padding:
          20px 12px;

      }


      .page-title h1 {

        font-size:
          24px;

      }


      .card {

        padding:
          15px;

      }

    }

  </style>

</head>



<body>


<!-- =================================
     HEADER
================================= -->

<header>

  <div class="header-inner">


    <div class="logo">

      📖 NgajiPlus Admin

    </div>


    <button
      id="logoutBtn"
      class="logout-btn"
    >

      Keluar

    </button>


  </div>

</header>



<!-- =================================
     MAIN
================================= -->

<main>


  <div class="page-title">

    <h1>
      🎬 Kelola Materi Video
    </h1>

    <p>
      Tambahkan dan kelola materi pembelajaran
      NgajiPlus.
    </p>

  </div>



  <!-- =================================
       FORM TAMBAH
  ================================== -->

  <section class="card">


    <h2>
      ➕ Tambah Materi
    </h2>


    <form id="materialForm">


      <!-- JUDUL -->

      <div class="form-group">

        <label for="judul">
          Judul Materi
        </label>

        <input
          type="text"
          id="judul"
          placeholder="Contoh: Belajar Membaca Al-Fatihah"
          required
        >

      </div>



      <!-- DESKRIPSI -->

      <div class="form-group">

        <label for="deskripsi">
          Deskripsi
        </label>

        <textarea
          id="deskripsi"
          placeholder="Tuliskan deskripsi materi..."
          required
        ></textarea>

      </div>



      <!-- KATEGORI -->

      <div class="form-group">

        <label for="kategori">
          Kategori
        </label>

        <select
          id="kategori"
          required
        >

          <option value="">
            Pilih Kategori
          </option>

          <option value="Al-Qur'an & Tahsin">
            Al-Qur'an & Tahsin
          </option>

          <option value="Fiqih">
            Fiqih
          </option>

          <option value="Aqidah">
            Aqidah
          </option>

          <option value="Akhlak & Adab">
            Akhlak & Adab
          </option>

          <option value="Bahasa Arab">
            Bahasa Arab
          </option>

          <option value="Hadits">
            Hadits
          </option>

          <option value="Tafsir">
            Tafsir
          </option>

          <option value="Sejarah Islam">
            Sejarah Islam
          </option>

        </select>

      </div>



      <!-- URL VIDEO -->

      <div class="form-group">

        <label for="url">
          URL Video
        </label>

        <input
          type="url"
          id="url"
          placeholder="https://youtube.com/watch?v=..."
          required
        >

      </div>



      <!-- THUMBNAIL -->

      <div class="form-group">

        <label for="thumbnail">
          URL Thumbnail
          <span style="font-weight:normal;">
            (opsional)
          </span>
        </label>

        <input
          type="url"
          id="thumbnail"
          placeholder="https://..."
        >

      </div>



      <!-- PREMIUM -->

      <div class="checkbox-group">

        <input
          type="checkbox"
          id="premium"
        >

        <label for="premium">

          🔐 Jadikan Materi Premium

        </label>

      </div>



      <!-- BUTTON -->

      <button
        type="submit"
        class="btn btn-save"
        id="saveBtn"
      >

        💾 Simpan Materi

      </button>


    </form>


    <div
      id="message"
      class="message"
    ></div>


  </section>



  <!-- =================================
       DAFTAR MATERIAL
  ================================== -->

  <section class="card">


    <h2>
      📚 Daftar Materi
    </h2>


    <div
      id="materialsList"
    >

      <div class="loading">

        ⏳ Memuat materi...

      </div>

    </div>


  </section>


</main>



<script>


// ==================================================
// CEK SUPABASE
// ==================================================

if (
  typeof supabaseClient === "undefined"
) {

  alert(
    "Supabase belum terhubung. Periksa supabase-config.js"
  );

}



// ==================================================
// ELEMENT
// ==================================================

const form =
  document.getElementById(
    "materialForm"
  );


const message =
  document.getElementById(
    "message"
  );


const materialsList =
  document.getElementById(
    "materialsList"
  );


const saveBtn =
  document.getElementById(
    "saveBtn"
  );



// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



// ==================================================
// PESAN
// ==================================================

function showMessage(
  text,
  type
) {

  message.textContent =
    text;

  message.className =
    "message " +
    type;

}



// ==================================================
// CEK LOGIN
// ==================================================

async function checkLogin() {


  const {
    data: {
      session
    }
  } =
  await supabaseClient
    .auth
    .getSession();


  if (!session) {

    window.location.href =
      "login.html";

    return null;

  }


  return session;

}



// ==================================================
// AMBIL MATERIAL
// ==================================================

async function loadMaterials() {


  materialsList.innerHTML = `

    <div class="loading">

      ⏳ Memuat materi...

    </div>

  `;


  const {
    data,
    error
  } =
  await supabaseClient

    .from("materials")

    .select("*")

    .order(
      "id",
      {
        ascending: false
      }
    );


  if (error) {

    console.error(
      error
    );


    materialsList.innerHTML = `

      <div class="message error">

        ❌ Gagal mengambil materi.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    materialsList.innerHTML = `

      <div class="empty">

        📚 Belum ada materi.

      </div>

    `;

    return;

  }


  materialsList.innerHTML =
    data
      .map(
        material => {


          const premium =
            material.premium === true;


          return `

            <div
              class="material-item"
            >


              <div
                class="material-title"
              >

                ${escapeHtml(
                  material.judul ||
                  "Tanpa Judul"
                )}

              </div>


              <div
                class="material-info"
              >

                Kategori:
                ${escapeHtml(
                  material.kategori ||
                  "-"
                )}

                <br>

                Tipe:
                ${escapeHtml(
                  material.tipe ||
                  "video"
                )}

                <br>

                Status:

                <span
                  class="
                    badge
                    ${
                      premium
                      ? "badge-premium"
                      : "badge-free"
                    }
                  "
                >

                  ${
                    premium
                    ? "🔐 Premium"
                    : "🟢 Gratis"
                  }

                </span>

              </div>


              <button
                class="btn btn-delete"
                onclick="
                  deleteMaterial(
                    '${escapeHtml(
                      material.id
                    )}'
                  )
                "
              >

                🗑️ Hapus

              </button>


            </div>

          `;

        }
      )
      .join("");

}



// ==================================================
// TAMBAH MATERIAL
// ==================================================

form.addEventListener(
  "submit",
  async function(event) {


    event.preventDefault();


    saveBtn.disabled =
      true;


    saveBtn.textContent =
      "⏳ Menyimpan...";


    message.className =
      "message";


    const judul =
      document
        .getElementById(
          "judul"
        )
        .value
        .trim();


    const deskripsi =
      document
        .getElementById(
          "deskripsi"
        )
        .value
        .trim();


    const kategori =
      document
        .getElementById(
          "kategori"
        )
        .value;


    const url =
      document
        .getElementById(
          "url"
        )
        .value
        .trim();


    const thumbnail =
      document
        .getElementById(
          "thumbnail"
        )
        .value
        .trim();


    const premium =
      document
        .getElementById(
          "premium"
        )
        .checked;



    // ==========================================
    // INSERT
    // ==========================================

    const {
      data,
      error
    } =
    await supabaseClient

      .from("materials")

      .insert({

        judul:
          judul,

        deskripsi:
          deskripsi,

        kategori:
          kategori,

        /*
          INI PERBAIKAN UTAMA

          Database Anda membutuhkan
          kolom "tipe".
        */

        tipe:
          "video",

        url:
          url,

        thumbnail:
          thumbnail || null,

        premium:
          premium

      })

      .select();


    // ==========================================
    // ERROR
    // ==========================================

    if (error) {

      console.error(
        error
      );


      showMessage(
        "❌ Gagal menyimpan: " +
        error.message,
        "error"
      );


      saveBtn.disabled =
        false;

      saveBtn.textContent =
        "💾 Simpan Materi";

      return;

    }


    // ==========================================
    // BERHASIL
    // ==========================================

    showMessage(
      "✅ Materi berhasil disimpan!",
      "success"
    );


    form.reset();


    await loadMaterials();


    saveBtn.disabled =
      false;

    saveBtn.textContent =
      "💾 Simpan Materi";


  }
);



// ==================================================
// HAPUS MATERIAL
// ==================================================

async function deleteMaterial(
  id
) {


  const yakin =
    confirm(
      "Apakah Anda yakin ingin menghapus materi ini?"
    );


  if (!yakin) {

    return;

  }


  const {
    error
  } =
  await supabaseClient

    .from("materials")

    .delete()

    .eq(
      "id",
      id
    );


  if (error) {

    console.error(
      error
    );


    alert(
      "Gagal menghapus materi: " +
      error.message
    );

    return;

  }


  alert(
    "✅ Materi berhasil dihapus."
  );


  loadMaterials();

}



// ==================================================
// LOGOUT
// ==================================================

document
  .getElementById(
    "logoutBtn"
  )
  .addEventListener(
    "click",
    async function() {


      await supabaseClient
        .auth
        .signOut();


      window.location.href =
        "login.html";

    }
  );



// ==================================================
// MULAI
// ==================================================

async function start() {

  const session =
    await checkLogin();


  if (!session) {

    return;

  }


  loadMaterials();

}


start();


</script>


</body>

  </html>
