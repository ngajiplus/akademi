<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Admin - NgajiPlus</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f8f7;
  color:#202a24;
}

/* HEADER */

header{
  background:white;
  border-bottom:1px solid #e5e9e6;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#238b57;
  font-weight:bold;
  font-size:18px;
}

.logout{
  border:0;
  background:#f1f1f1;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
}


/* MAIN */

main{
  max-width:1100px;
  margin:auto;
  padding:30px 20px;
}

h1{
  margin:0 0 8px;
  font-size:28px;
}

.subtitle{
  color:#737b76;
  margin-bottom:25px;
}


/* CARD */

.card{
  background:white;
  border:1px solid #e3e8e5;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
}

.card h2{
  margin-top:0;
  font-size:20px;
}


/* FORM */

.form-group{
  margin-bottom:15px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #d9dfdb;
  border-radius:9px;
  font-size:14px;
  background:white;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  outline:none;
  border-color:#238b57;
}


/* TYPE GRID */

.type-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.type-option{
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  cursor:pointer;
  text-align:center;
}

.type-option:hover{
  background:#eef7f1;
}

.type-option input{
  width:auto;
  margin-right:5px;
}


/* PREMIUM */

.premium-box{
  background:#fff8e8;
  border:1px solid #f0d98c;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
}

.premium-box label{
  margin:0;
  cursor:pointer;
}

.premium-box input{
  width:auto;
  margin-right:7px;
}


/* BUTTON */

.btn{
  border:0;
  padding:11px 17px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

.btn-primary{
  background:#238b57;
  color:white;
}

.btn-primary:hover{
  background:#1b7548;
}

.btn-danger{
  background:#ffe4e4;
  color:#b42318;
}

.btn-youtube{
  background:#fff1df;
  color:#d66a00;
}

.btn-audio{
  background:#e9f4ff;
  color:#1769aa;
}

.btn-pdf{
  background:#f0e9ff;
  color:#7042b8;
}


/* STATUS */

.success{
  background:#e9f8ef;
  color:#16834d;
  padding:12px;
  border-radius:9px;
  margin-top:15px;
}

.error{
  background:#fff0f0;
  color:#b42318;
  padding:12px;
  border-radius:9px;
  margin-top:15px;
}

.loading{
  text-align:center;
  color:#777;
  padding:30px;
}


/* MATERIAL */

.material{
  border:1px solid #e1e5e2;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}

.material h3{
  margin:0 0 7px;
  font-size:17px;
}

.description{
  color:#777;
  font-size:13px;
  margin-bottom:10px;
}

.meta{
  font-size:12px;
  color:#666;
  line-height:1.8;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  margin-right:5px;
}

.badge-free{
  background:#e5f8eb;
  color:#16834d;
}

.badge-premium{
  background:#fff0bd;
  color:#8a6500;
}

.badge-video{
  background:#eee;
  color:#555;
}

.badge-audio{
  background:#e6f2ff;
  color:#1769aa;
}

.badge-pdf{
  background:#f0e8ff;
  color:#7042b8;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px;
}


/* URL BOX */

.url-help{
  font-size:12px;
  color:#777;
  margin-top:6px;
}


/* MOBILE */

@media(max-width:700px){

  .header-inner{
    padding:12px 15px;
  }

  main{
    padding:25px 15px;
  }

  h1{
    font-size:24px;
  }

  .type-grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<header>

<div class="header-inner">

<div class="logo">
📖 NgajiPlus Admin
</div>

<button
  class="logout"
  onclick="logout()"
>
Keluar
</button>

</div>

</header>



<main>


<h1>
🎬 Kelola Materi
</h1>

<div class="subtitle">
Tambahkan dan kelola materi Video, Audio, dan PDF NgajiPlus Akademi.
</div>



<!-- ============================= -->
<!-- FORM TAMBAH -->
<!-- ============================= -->

<div class="card">

<h2>
➕ Tambah Materi
</h2>


<form id="materialForm">


<!-- JUDUL -->

<div class="form-group">

<label>
Judul Materi
</label>

<input
  type="text"
  id="judul"
  placeholder="Contoh: Belajar Fiqih Shalat"
  required
>

</div>



<!-- DESKRIPSI -->

<div class="form-group">

<label>
Deskripsi
</label>

<textarea
  id="deskripsi"
  placeholder="Tuliskan deskripsi materi..."
></textarea>

</div>



<!-- KATEGORI -->

<div class="form-group">

<label>
Kategori
</label>

<select
  id="kategori"
  required
>

<option value="Al-Qur'an & Tahsin">
Al-Qur'an & Tahsin
</option>

<option value="Fiqih">
Fiqih
</option>

<option value="Aqidah">
Aqidah
</option>

<option value="Akhlak & Adab">
Akhlak & Adab
</option>

<option value="Bahasa Arab">
Bahasa Arab
</option>

<option value="Hadits">
Hadits
</option>

<option value="Tafsir">
Tafsir
</option>

<option value="Sejarah Islam">
Sejarah Islam
</option>

</select>

</div>



<!-- TIPE -->

<div class="form-group">

<label>
Tipe Materi
</label>

<div class="type-grid">


<label class="type-option">

<input
  type="radio"
  name="type"
  value="video"
  checked
>

🎥 Video

</label>



<label class="type-option">

<input
  type="radio"
  name="type"
  value="audio"
>

🎧 Audio

</label>



<label class="type-option">

<input
  type="radio"
  name="type"
  value="pdf"
>

📄 PDF

</label>


</div>

</div>



<!-- URL -->

<div class="form-group">

<label id="urlLabel">
URL Video YouTube
</label>

<input
  type="url"
  id="url"
  placeholder="https://www.youtube.com/watch?v=..."
  required
>

<div
  class="url-help"
  id="urlHelp"
>
Masukkan link video YouTube.
</div>

</div>



<!-- THUMBNAIL -->

<div class="form-group">

<label>
URL Thumbnail
</label>

<input
  type="url"
  id="thumbnail"
  placeholder="https://..."
>

<div class="url-help">
Opsional. Kosongkan jika tidak memiliki thumbnail.
</div>

</div>



<!-- PREMIUM -->

<div class="premium-box">

<label>

<input
  type="checkbox"
  id="premium"
>

🔐 Jadikan Materi Premium

</label>

</div>



<button
  type="submit"
  class="btn btn-primary"
>

💾 Simpan Materi

</button>


<div id="formMessage"></div>


</form>

</div>



<!-- ============================= -->
<!-- DAFTAR MATERI -->
<!-- ============================= -->

<div class="card">

<h2>
📚 Daftar Materi
</h2>

<div id="materialsList">

<div class="loading">
⏳ Memuat materi...
</div>

</div>

</div>


</main>



<script>


// =====================================================
// VARIABEL
// =====================================================

let materials = [];



// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}



// =====================================================
// CEK SUPABASE
// =====================================================

if(
  typeof supabaseClient === "undefined"
){

  document.getElementById(
    "materialsList"
  ).innerHTML = `

    <div class="error">

      ❌ Supabase belum terhubung.

      <br><br>

      Periksa file
      <strong>supabase-config.js</strong>.

    </div>

  `;

}



// =====================================================
// UBAH LABEL URL BERDASARKAN TIPE
// =====================================================

function updateUrlField(){

  const selected =
    document.querySelector(
      'input[name="type"]:checked'
    );

  if(!selected){
    return;
  }

  const type =
    selected.value;


  const label =
    document.getElementById(
      "urlLabel"
    );

  const input =
    document.getElementById(
      "url"
    );

  const help =
    document.getElementById(
      "urlHelp"
    );


  if(type === "video"){

    label.textContent =
      "URL Video YouTube";

    input.placeholder =
      "https://www.youtube.com/watch?v=...";

    help.textContent =
      "Masukkan link video YouTube.";

  }


  else if(type === "audio"){

    label.textContent =
      "URL File Audio";

    input.placeholder =
      "https://.../audio.mp3";

    help.textContent =
      "Masukkan link file audio MP3 atau audio yang dapat dibuka melalui browser.";

  }


  else if(type === "pdf"){

    label.textContent =
      "URL File PDF";

    input.placeholder =
      "https://.../materi.pdf";

    help.textContent =
      "Masukkan link file PDF.";

  }

}



// =====================================================
// EVENT TIPE
// =====================================================

document
  .querySelectorAll(
    'input[name="type"]'
  )
  .forEach(
    radio => {

      radio.addEventListener(
        "change",
        updateUrlField
      );

    }
  );



// =====================================================
// AMBIL MATERI
// =====================================================

async function loadMaterials(){

  const list =
    document.getElementById(
      "materialsList"
    );


  list.innerHTML = `

    <div class="loading">

      ⏳ Memuat materi...

    </div>

  `;


  try{

    const result =
      await supabaseClient

        .from("materials")

        .select("*")

        .order(
          "id",
          {
            ascending:false
          }
        );


    if(result.error){

      throw result.error;

    }


    materials =
      result.data || [];


    displayMaterials(
      materials
    );


  }

  catch(error){

    console.error(
      error
    );


    list.innerHTML = `

      <div class="error">

        ❌ Gagal mengambil materi.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}



// =====================================================
// TAMPILKAN MATERI
// =====================================================

function displayMaterials(data){

  const list =
    document.getElementById(
      "materialsList"
    );


  if(!data.length){

    list.innerHTML = `

      <div class="loading">

        📚 Belum ada materi.

      </div>

    `;

    return;

  }


  list.innerHTML = data
    .map(
      material => {


        const type =
          String(
            material.type || "video"
          )
          .toLowerCase();


        const premium =
          material.premium === true;


        let typeBadge = "";

        let typeName = "";

        let buttonClass =
          "btn-youtube";

        let buttonText =
          "▶️ Buka YouTube";


        if(type === "audio"){

          typeBadge =
            "badge-audio";

          typeName =
            "🎧 Audio";

          buttonClass =
            "btn-audio";

          buttonText =
            "🎧 Buka Audio";

        }


        else if(type === "pdf"){

          typeBadge =
            "badge-pdf";

          typeName =
            "📄 PDF";

          buttonClass =
            "btn-pdf";

          buttonText =
            "📄 Buka PDF";

        }


        else{

          typeBadge =
            "badge-video";

          typeName =
            "🎥 Video";

          buttonClass =
            "btn-youtube";

          buttonText =
            "▶️ Buka YouTube";

        }



        const accessBadge =
          premium

          ?

          `
            <span class="badge badge-premium">
              🔐 Premium
            </span>
          `

          :

          `
            <span class="badge badge-free">
              🟢 Gratis
            </span>
          `;



        let openButton = "";


        if(material.url){

          openButton = `

            <a
              href="${escapeHtml(material.url)}"
              target="_blank"
              rel="noopener noreferrer"
              class="btn ${buttonClass}"
            >

              ${buttonText}

            </a>

          `;

        }


        return `

          <div class="material">

            <h3>
              ${escapeHtml(
                material.judul ||
                "Tanpa Judul"
              )}
            </h3>


            <div class="description">

              ${escapeHtml(
                material.deskripsi ||
                "Tidak ada deskripsi."
              )}

            </div>


            <div class="meta">

              📁 Kategori:
              ${escapeHtml(
                material.kategori ||
                "-"
              )}

              <br>

              ${typeName}


              <br>

              ${accessBadge}

            </div>


            <div class="actions">

              ${openButton}


              <button
                class="btn btn-danger"
                onclick="deleteMaterial(${Number(material.id)})"
              >

                🗑️ Hapus

              </button>

            </div>

          </div>

        `;

      }
    )
    .join("");

}



// =====================================================
// SIMPAN MATERI
// =====================================================

document
  .getElementById(
    "materialForm"
  )
  .addEventListener(
    "submit",
    async function(event){

      event.preventDefault();


      const message =
        document.getElementById(
          "formMessage"
        );


      message.innerHTML = `

        <div class="loading">

          ⏳ Menyimpan materi...

        </div>

      `;


      const judul =
        document.getElementById(
          "judul"
        ).value.trim();


      const deskripsi =
        document.getElementById(
          "deskripsi"
        ).value.trim();


      const kategori =
        document.getElementById(
          "kategori"
        ).value;


      const type =
        document.querySelector(
          'input[name="type"]:checked'
        ).value;


      const url =
        document.getElementById(
          "url"
        ).value.trim();


      const thumbnail =
        document.getElementById(
          "thumbnail"
        ).value.trim();


      const premium =
        document.getElementById(
          "premium"
        ).checked;



      // ==============================
      // VALIDASI YOUTUBE
      // ==============================

      if(type === "video"){

        const isYoutube =
          url.includes(
            "youtube.com/"
          ) ||
          url.includes(
            "youtu.be/"
          );


        if(!isYoutube){

          message.innerHTML = `

            <div class="error">

              ❌ Untuk tipe Video,
              masukkan URL YouTube yang benar.

            </div>

          `;

          return;

        }

      }



      // ==============================
      // DATA
      // ==============================

      const data = {

        judul:
          judul,

        deskripsi:
          deskripsi,

        kategori:
          kategori,

        type:
          type,

        url:
          url,

        premium:
          premium

      };


      // Thumbnail hanya jika diisi

      if(thumbnail){

        data.thumbnail =
          thumbnail;

      }



      // ==============================
      // INSERT
      // ==============================

      try{

        const result =
          await supabaseClient

            .from("materials")

            .insert(
              data
            );


        if(result.error){

          throw result.error;

        }


        message.innerHTML = `

          <div class="success">

            ✅ Materi berhasil disimpan!

          </div>

        `;


        // RESET FORM

        document
          .getElementById(
            "materialForm"
          )
          .reset();


        // Kembalikan Video

        document
          .querySelector(
            'input[name="type"][value="video"]'
          )
          .checked = true;


        updateUrlField();


        // Muat ulang

        await loadMaterials();


      }

      catch(error){

        console.error(
          "INSERT ERROR:",
          error
        );


        message.innerHTML = `

          <div class="error">

            ❌ Gagal menyimpan materi.

            <br><br>

            ${escapeHtml(
              error.message ||
              "Terjadi kesalahan."
            )}

          </div>

        `;

      }

    }
  );



// =====================================================
// HAPUS MATERI
// =====================================================

async function deleteMaterial(id){

  if(!id){
    return;
  }


  const yakin =
    confirm(
      "Yakin ingin menghapus materi ini?"
    );


  if(!yakin){
    return;
  }


  try{

    const result =
      await supabaseClient

        .from("materials")

        .delete()

        .eq(
          "id",
          id
        );


    if(result.error){

      throw result.error;

    }


    alert(
      "Materi berhasil dihapus."
    );


    await loadMaterials();


  }

  catch(error){

    console.error(
      "DELETE ERROR:",
      error
    );


    alert(
      "Gagal menghapus materi: " +
      error.message
    );

  }

}



// =====================================================
// LOGOUT
// =====================================================

async function logout(){

  try{

    await supabaseClient.auth.signOut();

  }

  catch(error){

    console.error(
      error
    );

  }


  window.location.href =
    "login.html";

}



// =====================================================
// MULAI
// =====================================================

updateUrlField();

loadMaterials();


</script>


</body>

  </html>
