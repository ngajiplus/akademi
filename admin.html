<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NgajiPlus Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f8f6;
  color:#202a24;
}

header{
  background:white;
  border-bottom:1px solid #e5e9e6;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#168b57;
  font-weight:bold;
}

.logout{
  border:0;
  background:#f1f1f1;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
}

main{
  max-width:1100px;
  margin:auto;
  padding:30px 15px;
}

h1{
  margin:0 0 5px;
}

.subtitle{
  color:#777;
  margin-bottom:25px;
}

.box{
  background:white;
  border:1px solid #e2e8e4;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
}

label{
  display:block;
  font-weight:bold;
  font-size:13px;
  margin:15px 0 7px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:14px;
  background:white;
}

textarea{
  min-height:100px;
}

button{
  border:0;
  cursor:pointer;
}

.save-button{
  margin-top:18px;
  background:#008f58;
  color:white;
  padding:12px 18px;
  border-radius:9px;
  font-weight:bold;
}

.save-button:disabled{
  opacity:.6;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  display:none;
  line-height:1.5;
}

.success{
  display:block;
  background:#e4f8ed;
  color:#087a47;
}

.error{
  display:block;
  background:#ffe9e9;
  color:#b42318;
}


/* LOGIN */

.login-page{
  min-height:calc(100vh - 55px);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:55px 15px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.login-title{
  text-align:center;
  color:#168b57;
  font-size:21px;
  font-weight:bold;
}

.login-subtitle{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-top:5px;
  margin-bottom:25px;
}

.login-button{
  width:100%;
  background:#008f58;
  color:white;
  padding:13px;
  border-radius:9px;
  font-weight:bold;
  margin-top:15px;
}

.login-button:disabled{
  opacity:.6;
}

.loading{
  text-align:center;
  padding:30px;
  color:#777;
}

.material{
  border:1px solid #e1e5e2;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}

.material h3{
  margin-top:0;
}

.material-info{
  font-size:13px;
  color:#666;
  line-height:1.7;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.badge-free{
  background:#ddf7e7;
  color:#087a47;
}

.badge-premium{
  background:#fff0b8;
  color:#8a6200;
}

.material-buttons{
  margin-top:10px;
  display:flex;
  gap:8px;
}

.open-button{
  background:#fff0d5;
  color:#b65f00;
  padding:8px 12px;
  border-radius:8px;
  text-decoration:none;
  font-size:13px;
}

.delete-button{
  background:#ffe3e3;
  color:#b42318;
  padding:8px 12px;
  border-radius:8px;
}

.hidden{
  display:none !important;
}

@media(max-width:600px){

  main{
    padding:20px 12px;
  }

}

</style>

</head>

<body>


<header>

<div class="header-inner">

<div class="logo">
📖 NgajiPlus Admin
</div>

<button
  id="logoutButton"
  class="logout hidden"
  onclick="logout()"
>
Keluar
</button>

</div>

</header>


<!-- =====================================================
LOGIN
===================================================== -->

<div id="loginPage" class="login-page">

<div class="login-box">

<div class="login-title">
📖 NgajiPlus Akademi
</div>

<div class="login-subtitle">
Login Admin
</div>


<label for="email">
Email
</label>

<input
  type="email"
  id="email"
  placeholder="Masukkan email admin"
  autocomplete="email"
>


<label for="password">
Password
</label>

<input
  type="password"
  id="password"
  placeholder="Masukkan password"
  autocomplete="current-password"
>


<button
  id="loginButton"
  class="login-button"
  onclick="login()"
>
🔐 Masuk
</button>


<div
  id="loginMessage"
  class="message"
></div>

</div>

</div>


<!-- =====================================================
ADMIN
===================================================== -->

<main
  id="adminPage"
  class="hidden"
>

<h1>
🎬 Kelola Materi
</h1>

<div class="subtitle">
Tambahkan dan kelola materi Video, Audio, dan PDF NgajiPlus Akademi.
</div>


<div class="box">

<h2>
➕ Tambah Materi
</h2>


<label>
Judul Materi
</label>

<input
  type="text"
  id="judul"
  placeholder="Contoh: Belajar Fiqih Shalat"
>


<label>
Deskripsi
</label>

<textarea
  id="deskripsi"
  placeholder="Tuliskan deskripsi materi..."
></textarea>


<label>
Kategori
</label>

<select id="kategori">

<option>Al-Qur'an & Tahsin</option>
<option>Fiqih</option>
<option>Aqidah</option>
<option>Akhlak & Adab</option>
<option>Bahasa Arab</option>
<option>Hadits</option>
<option>Tafsir</option>
<option>Sejarah Islam</option>

</select>


<label>
Tipe Materi
</label>

<select id="tipe">

<option value="video">
🎥 Video
</option>

<option value="audio">
🎧 Audio
</option>

<option value="pdf">
📄 PDF
</option>

</select>


<label>
🔗 URL Materi
</label>

<input
  type="url"
  id="url"
  placeholder="https://..."
>


<label>
🖼️ URL Thumbnail
</label>

<input
  type="url"
  id="thumbnail"
  placeholder="https://..."
>


<div
  style="
    margin-top:15px;
    padding:12px;
    background:#fff8df;
    border-radius:10px;
  "
>

<label>

<input
  type="checkbox"
  id="premium"
  style="width:auto"
>

🔐 Jadikan Materi Premium

</label>

</div>


<button
  id="saveButton"
  class="save-button"
  onclick="saveMaterial()"
>
💾 Simpan Materi
</button>


<div
  id="saveMessage"
  class="message"
></div>

</div>


<!-- DAFTAR -->

<div class="box">

<div style="
  display:flex;
  justify-content:space-between;
  align-items:center;
">

<h2>
📚 Daftar Materi
</h2>

<button
  onclick="loadMaterials()"
  style="
    padding:8px 12px;
    border-radius:8px;
    background:#e8f5ef;
  "
>
🔄 Refresh
</button>

</div>


<div id="materialsList">

<div class="loading">
⏳ Mengambil data materi...
</div>

</div>

</div>

</main>


<script>


// =====================================================
// CEK SUPABASE
// =====================================================

console.log("ADMIN: JavaScript berjalan.");

console.log(
  "ADMIN: supabaseClient =",
  typeof supabaseClient
);


if(
  typeof supabaseClient === "undefined"
){

  document.getElementById(
    "loginMessage"
  ).className =
    "message error";

  document.getElementById(
    "loginMessage"
  ).style.display =
    "block";

  document.getElementById(
    "loginMessage"
  ).innerHTML =
    "❌ supabaseClient tidak ditemukan.<br><br>" +
    "Periksa file supabase-config.js";

}


// =====================================================
// LOGIN
// =====================================================

async function login(){

  const button =
    document.getElementById(
      "loginButton"
    );

  const message =
    document.getElementById(
      "loginMessage"
    );

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  message.className =
    "message";

  message.style.display =
    "none";


  if(!email){

    showLoginMessage(
      "❌ Email wajib diisi.",
      "error"
    );

    return;

  }


  if(!password){

    showLoginMessage(
      "❌ Password wajib diisi.",
      "error"
    );

    return;

  }


  try{

    button.disabled = true;

    button.innerText =
      "⏳ Memeriksa...";


    console.log(
      "LOGIN: mencoba login",
      email
    );


    const result =
      await supabaseClient
        .auth
        .signInWithPassword({

          email:
            email,

          password:
            password

        });


    console.log(
      "LOGIN RESULT:",
      result
    );


    if(result.error){

      throw result.error;

    }


    if(!result.data.session){

      throw new Error(
        "Login berhasil tetapi session tidak ditemukan."
      );

    }


    showLoginMessage(
      "✅ Login berhasil. Membuka Admin...",
      "success"
    );


    setTimeout(
      function(){

        showAdmin();

      },
      500
    );


  }

  catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );


    let text =
      error.message ||
      "Login gagal.";


    if(
      text.includes(
        "Invalid login credentials"
      )
    ){

      text =
        "Email atau password salah.";

    }


    showLoginMessage(
      "❌ " + text,
      "error"
    );


  }

  finally{

    button.disabled = false;

    button.innerText =
      "🔐 Masuk";

  }

}


// =====================================================
// PESAN LOGIN
// =====================================================

function showLoginMessage(
  text,
  type
){

  const message =
    document.getElementById(
      "loginMessage"
    );


  message.className =
    "message " + type;


  message.style.display =
    "block";


  message.innerHTML =
    text;

}


// =====================================================
// CEK SESSION
// =====================================================

async function checkSession(){

  try{

    console.log(
      "SESSION: mengecek session..."
    );


    const result =
      await supabaseClient
        .auth
        .getSession();


    console.log(
      "SESSION RESULT:",
      result
    );


    if(result.error){

      console.error(
        result.error
      );

      return;

    }


    const session =
      result.data.session;


    if(session){

      console.log(
        "SESSION: ditemukan"
      );

      showAdmin();

    }

    else{

      console.log(
        "SESSION: belum login"
      );

    }

  }

  catch(error){

    console.error(
      "SESSION ERROR:",
      error
    );

  }

}


// =====================================================
// TAMPILKAN ADMIN
// =====================================================

function showAdmin(){

  document
    .getElementById("loginPage")
    .classList
    .add("hidden");


  document
    .getElementById("adminPage")
    .classList
    .remove("hidden");


  document
    .getElementById("logoutButton")
    .classList
    .remove("hidden");


  loadMaterials();

}


// =====================================================
// LOGOUT
// =====================================================

async function logout(){

  try{

    const result =
      await supabaseClient
        .auth
        .signOut();


    if(result.error){

      throw result.error;

    }


    document
      .getElementById("adminPage")
      .classList
      .add("hidden");


    document
      .getElementById("logoutButton")
      .classList
      .add("hidden");


    document
      .getElementById("loginPage")
      .classList
      .remove("hidden");


    document
      .getElementById("password")
      .value = "";


    showLoginMessage(
      "✅ Anda sudah keluar.",
      "success"
    );

  }

  catch(error){

    alert(
      "❌ Gagal keluar:\n\n" +
      error.message
    );

  }

}


// =====================================================
// SIMPAN MATERI
// =====================================================

async function saveMaterial(){

  const button =
    document.getElementById(
      "saveButton"
    );


  const message =
    document.getElementById(
      "saveMessage"
    );


  try{

    button.disabled = true;

    message.className =
      "message success";

    message.style.display =
      "block";

    message.innerText =
      "⏳ Menyimpan materi...";


    const judul =
      document
        .getElementById("judul")
        .value
        .trim();


    const deskripsi =
      document
        .getElementById("deskripsi")
        .value
        .trim();


    const kategori =
      document
        .getElementById("kategori")
        .value;


    const tipe =
      document
        .getElementById("tipe")
        .value;


    const url =
      document
        .getElementById("url")
        .value
        .trim();


    const thumbnail =
      document
        .getElementById("thumbnail")
        .value
        .trim();


    const premium =
      document
        .getElementById("premium")
        .checked;


    if(!judul){

      throw new Error(
        "Judul materi wajib diisi."
      );

    }


    if(!url){

      throw new Error(
        "URL materi wajib diisi."
      );

    }


    const data = {

      judul:
        judul,

      deskripsi:
        deskripsi,

      kategori:
        kategori,

      tipe:
        tipe,

      type:
        tipe,

      url:
        url,

      thumbnail:
        thumbnail || null,

      premium:
        premium

    };


    console.log(
      "INSERT DATA:",
      data
    );


    const result =
      await supabaseClient
        .from("materials")
        .insert(data);


    console.log(
      "INSERT RESULT:",
      result
    );


    if(result.error){

      throw result.error;

    }


    message.className =
      "message success";

    message.style.display =
      "block";

    message.innerText =
      "✅ Materi berhasil disimpan!";


    document
      .getElementById("judul")
      .value = "";


    document
      .getElementById("deskripsi")
      .value = "";


    document
      .getElementById("url")
      .value = "";


    document
      .getElementById("thumbnail")
      .value = "";


    document
      .getElementById("premium")
      .checked = false;


    loadMaterials();

  }

  catch(error){

    console.error(
      "SAVE ERROR:",
      error
    );


    message.className =
      "message error";

    message.style.display =
      "block";

    message.innerHTML =
      "❌ Gagal menyimpan:<br><br>" +
      escapeHtml(
        error.message
      );

  }

  finally{

    button.disabled = false;

  }

}


// =====================================================
// LOAD MATERI
// =====================================================

async function loadMaterials(){

  const list =
    document.getElementById(
      "materialsList"
    );


  list.innerHTML =
    '<div class="loading">⏳ Mengambil data materi...</div>';


  try{

    const result =
      await supabaseClient
        .from("materials")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(result.error){

      throw result.error;

    }


    const materials =
      result.data || [];


    if(materials.length === 0){

      list.innerHTML =
        '<div class="loading">📚 Belum ada materi.</div>';

      return;

    }


    list.innerHTML =
      materials
        .map(
          createMaterialCard
        )
        .join("");

  }

  catch(error){

    console.error(
      "LOAD ERROR:",
      error
    );


    list.innerHTML =

      '<div class="message error" style="display:block">' +

      '❌ Gagal mengambil materi.<br><br>' +

      escapeHtml(
        error.message
      ) +

      '</div>';

  }

}


// =====================================================
// CARD
// =====================================================

function createMaterialCard(
  material
){

  const tipe =
    material.type ||
    material.tipe ||
    "video";


  const icon =
    tipe === "audio"
      ? "🎧"
      : tipe === "pdf"
        ? "📄"
        : "🎥";


  const badge =
    material.premium === true

      ?

      '<span class="badge badge-premium">🔐 Premium</span>'

      :

      '<span class="badge badge-free">🟢 Gratis</span>';


  const url =
    material.url || "";


  return `

    <div class="material">

      <h3>
        ${icon}
        ${escapeHtml(
          material.judul ||
          "Tanpa Judul"
        )}
      </h3>

      <div class="material-info">

        ${escapeHtml(
          material.deskripsi ||
          ""
        )}

        <br>

        📁 Kategori:
        ${escapeHtml(
          material.kategori ||
          "-"
        )}

        <br>

        ${icon}
        Tipe:
        ${escapeHtml(
          tipe
        )}

        <br><br>

        ${badge}

      </div>


      <div class="material-buttons">

        ${
          url
          ?

          `
          <a
            href="${escapeHtml(url)}"
            target="_blank"
            rel="noopener noreferrer"
            class="open-button"
          >
            🔗 Buka
          </a>
          `

          :

          ""
        }


        <button
          class="delete-button"
          onclick="deleteMaterial('${String(material.id)}')"
        >
          🗑️ Hapus
        </button>

      </div>

    </div>

  `;

}


// =====================================================
// HAPUS
// =====================================================

async function deleteMaterial(id){

  if(
    !confirm(
      "Yakin ingin menghapus materi ini?"
    )
  ){

    return;

  }


  try{

    const result =
      await supabaseClient
        .from("materials")
        .delete()
        .eq(
          "id",
          id
        );


    if(result.error){

      throw result.error;

    }


    alert(
      "✅ Materi berhasil dihapus."
    );


    loadMaterials();

  }

  catch(error){

    alert(
      "❌ Gagal menghapus:\n\n" +
      error.message
    );

  }

}


// =====================================================
// ESCAPE
// =====================================================

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// =====================================================
// MULAI
// =====================================================

window.addEventListener(
  "load",
  function(){

    console.log(
      "ADMIN: halaman selesai dimuat."
    );


    checkSession();

  }
);

</script>

</body>
  </html>
