<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

    name="viewport"

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f7f5;

      color: #202a24;

    }


    /* =========================
       HEADER
    ========================= */

    header {

      background: white;

    }


    .header-inner {

      max-width: 1100px;

      margin: auto;

      display: flex;

      justify-content:

      font-weight: bold;

      font-size: 20px;

    }

      background: #f1f1f1;

      color: #333;

      padding: 9px 14px;

      border-radius: 8px;

    }

      background: #e5e5e5;

    }


    /* =========================
       MAIN
    ========================= */

    main {

      max-width: 1100px;

      margin: auto;

      padding: 30px 20px 60px;

    }


    h1 {

      margin-top: 0;

      font-size: 30px;

    }


    .subtitle {

      color: #737b76;

      margin-bottom: 25px;

    }


    /* =========================
       BOX
    ========================= */

    .box {

      background: white;

      border:
        1px solid #e2e7e4;

      border-radius: 16px;

      padding: 25px;

      margin-bottom: 25px;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,.03);

    }


    .box h2 {

      margin-top: 0;

      font-size: 21px;

    }


    /* =========================
       FORM
    ========================= */

    .form-group {

      margin-bottom: 16px;

    }


    label {

      display: block;

      font-size: 14px;

      font-weight: bold;

      margin-bottom: 7px;

    }


    input,
    textarea,
    select {

      width: 100%;

      padding: 12px 13px;

      border:
        1px solid #d9dfdc;

      border-radius: 9px;

      font-family: inherit;

      font-size: 14px;

      background: white;

      outline: none;

    }


    input:focus,
    textarea:focus,
    select:focus {

      border-color:
        #079455;

      box-shadow:
        0 0 0 3px
        rgba(7,148,85,.10);

    }


    textarea {

      min-height: 110px;

      resize: vertical;

    }


    .checkbox-row {

      display: flex;

      align-items: center;

      gap: 9px;

      margin:
        10px 0 20px;

    }


    .checkbox-row input {

      width: auto;

    }


    .checkbox-row label {

      margin: 0;

      font-weight: normal;

    }


    /* =========================
       BUTTON
    ========================= */

    .btn {

      border: none;

      padding: 12px 18px;

      border-radius: 9px;

      cursor: pointer;

      font-weight: bold;

      font-size: 14px;

    }


    .btn-primary {

      background: #087f4f;

      color: white;

    }


    .btn-primary:hover {

      background: #066b42;

    }


    .btn-danger {

      background: #ffe5e5;

      color: #b42318;

    }


    .btn-danger:hover {

      background: #ffd5d5;

    }


    .btn-secondary {

      background: #eee;

      color: #333;

    }


    /* =========================
       MESSAGE
    ========================= */

    .message {

      display: none;

      padding: 13px 15px;

      border-radius: 9px;

      margin-top: 15px;

      font-size: 14px;

    }


    .message.success {

      display: block;

      background: #e9f8ef;

      color: #087f4f;

    }


    .message.error {

      display: block;

      background: #fff0f0;

      color: #b42318;

    }


    /* =========================
       LOADING
    ========================= */

    .loading {

      text-align: center;

      padding: 30px;

      color: #777;

    }


    /* =========================
       MATERIAL LIST
    ========================= */

    .material-list {

      display: grid;

      gap: 15px;

    }


    .material-item {

      border:
        1px solid #e1e6e3;

      border-radius: 12px;

      padding: 17px;

      background: #fff;

    }


    .material-item.premium {

      border-color:
        #35463c;

      background:
        #202a24;

      color: white;

    }


    .material-title {

      font-weight: bold;

      font-size: 17px;

      margin-bottom: 7px;

    }


    .material-description {

      color: #737b76;

      font-size: 13px;

      margin-bottom: 10px;

    }


    .premium
    .material-description {

      color: #c6cec9;

    }


    .badge {

      display: inline-block;

      padding: 5px 9px;

      border-radius: 50px;

      font-size: 11px;

      font-weight: bold;

      margin-right: 5px;

    }


    .badge-free {

      background: #eaf8ef;

      color: #087f4f;

    }


    .badge-premium {

      background: #35463c;

      color: #b9e4c8;

    }


    .badge-category {

      background: #f0f2f1;

      color: #555;

    }


    .premium

      background: #35463c;

      color: #d8e7de;

    }


    .material-actions {

      display: flex;

      gap: 8px;

      margin-top: 13px;

      flex-wrap: wrap;

    }


    /* =========================
       URL
    ========================= */

    .url-text {

      font-size: 12px;

      color: #777;

      word-break: break-all;

      margin-top: 8px;

    }


    .premium
    .url-text {

      color: #bfcac4;

    }


    /* =========================
       EMPTY
    ========================= */

    .empty {

      text-align: center;

      padding: 40px 20px;

      color: #777;

      border-radius: 12px;

    }


    /* =========================
       RESPONSIVE
    ========================= */

      .header-inner {

      }

  </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <div class="header-inner">

    <div class="logo">

    </div>


    <button

    >

</header>


<!-- =========================
     MAIN
========================= -->

<main>


  <h1>

    🎬 Kelola Materi Video

  </h1>


  <div class="subtitle">

    Tambahkan dan kelola materi video

  </div>


  <!-- =========================
       TAMBAH MATERI
  ========================= -->

  <section class="box">

    <h2>

            Bahasa Arab

          </option>

  <!-- =========================
       DAFTAR MATERI
  ========================= -->

  <section class="box">

    <h2>

      📚 Daftar Materi

    </h2>


    <div
      id="materialList"
      class="material-list"
    >

      <div class="loading">

        ⏳ Memuat materi...

      </div>

    </div>

  </section>


</main>


<script>


// =====================================================
// VARIABEL
// =====================================================

let materials = [];


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// =====================================================
// CEK LOGIN
// =====================================================

async function getCurrentSession() {

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();


  if (error) {

    console.error(error);

    return null;

  }


  return data.session;

}


// =====================================================
// CEK ADMIN
// =====================================================

async function checkAdmin() {

  const session =
    await getCurrentSession();


  if (!session) {

    window.location.href =
      "login.html";

    return false;

  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("admin_users")
    .select("id")
    .eq(
      "id",
      session.user.id
    )
    .maybeSingle();


  if (
    error ||
    !data
  ) {

    alert(
      "❌ Anda bukan admin."
    );

    window.location.href =
      "dashboard.html";

    return false;

  }


  return true;

}


// =====================================================
// FORMAT URL YOUTUBE
// =====================================================

function normalizeYoutubeUrl(url) {

  if (!url) {

    return "";

  }


  url =
    url.trim();


  /*
    Jika admin memasukkan
    youtube.com/watch?v=...
    kita gunakan langsung.

    Jika memasukkan youtu.be/...
    juga tetap bisa.
  */


  if (
    url.includes("youtube.com") ||
    url.includes("youtu.be")
  ) {

    return url;

  }


  return url;

}


// =====================================================
// LOAD MATERIALS
// =====================================================

async function loadMaterials() {

  const list =
    document.getElementById(
      "materialList"
    );


  list.innerHTML = `

    <div class="loading">

      ⏳ Memuat materi...

    </div>

  `;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("materials")
    .select(
      "id, judul, deskripsi, kategori, tipe, url, thumbnail, premium, created_at"
    )
    .eq(
      "tipe",
      "video"
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (error) {

    console.error(error);


    list.innerHTML = `

      <div class="message error">

        ❌ Gagal mengambil materi.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

    return;

  }


  materials =
    data || [];


  renderMaterials();

}


// =====================================================
// RENDER MATERIALS
// =====================================================

function renderMaterials() {

  const list =
    document.getElementById(
      "materialList"
    );


  if (
    materials.length === 0
  ) {

    list.innerHTML = `

      <div class="empty">

        📚 Belum ada materi video.

      </div>

    `;

    return;

  }


  list.innerHTML =
    materials
      .map(
        material => {


          const premium =
            material.premium === true;


          return `

            <article
              class="
                material-item
                ${
                  premium
                    ? "premium"
                    : ""
                }
              "
            >


              <div
                class="material-title"
              >

                ${escapeHtml(
                  material.judul ||
                  "Tanpa Judul"
                )}

              </div>


              <div
                class="material-description"
              >

                ${escapeHtml(
                  material.deskripsi ||
                  "Tidak ada deskripsi."
                )}

              </div>


              <div>

                <span
                  class="
                    badge
                    badge-category
                  "
                >

                  ${escapeHtml(
                    material.kategori ||
                    "Pembelajaran"
                  )}

                </span>


                ${
                  premium

                  ?

                  `

                    <span
                      class="
                        badge
                        badge-premium
                      "
                    >

                      🔐 Premium

                    </span>

                  `

                  :

                  `

                    <span
                      class="
                        badge
                        badge-free
                      "
                    >

                      🟢 Gratis

                    </span>

                  `

                }

              </div>


              ${
                material.url

                ?

                `

                  <div
                    class="url-text"
                  >

                    🎥
                    ${escapeHtml(
                      material.url
                    )}

                  </div>

                `

                :

                ""

              }


              <div
                class="material-actions"
              >

                ${
                  material.url

                  ?

                  `

                    <a
                      href="${escapeHtml(
                        material.url
                      )}"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="btn btn-secondary"
                    >

                      ▶️ Buka Video

                    </a>

                  `

                  :

                  ""

                }


                <button
                  class="btn btn-danger"
                  onclick="
                    deleteMaterial(
                      ${Number(
                        material.id
                      )}
                    )
                  "
                >

                  🗑️ Hapus

                </button>


              </div>


            </article>

          `;

        }
      )
      .join("");

}


// =====================================================
// SIMPAN MATERI
// =====================================================

document
  .getElementById(
    "materialForm"
  )
  .addEventListener(
    "submit",
    async function(event) {


      event.preventDefault();


      const button =
        document.getElementById(
          "saveButton"
        );


      const message =
        document.getElementById(
          "formMessage"
        );


      const judul =
        document
          .getElementById(
            "judul"
          )
          .value
          .trim();


      const deskripsi =
        document
          .getElementById(
            "deskripsi"
          )
          .value
          .trim();


      const kategori =
        document
          .getElementById(
            "kategori"
          )
          .value;


      const url =
        normalizeYoutubeUrl(
          document
            .getElementById(
              "url"
            )
            .value
        );


      const thumbnail =
        document
          .getElementById(
            "thumbnail"
          )
          .value
          .trim();


      const premium =
        document
          .getElementById(
            "premium"
          )
          .checked;


      // ---------------------------------------------
      // VALIDASI
      // ---------------------------------------------

      if (!judul) {

        showMessage(
          "❌ Judul materi wajib diisi.",
          "error"
        );

        return;

      }


      if (!url) {

        showMessage(
          "❌ URL YouTube wajib diisi.",
          "error"
        );

        return;

      }


      if (
        !url.includes(
          "youtube.com"
        ) &&
        !url.includes(
          "youtu.be"
        )
      ) {

        showMessage(
          "❌ URL harus berupa link YouTube.",
          "error"
        );

        return;

      }


      // ---------------------------------------------
      // TOMBOL LOADING
      // ---------------------------------------------

      button.disabled =
        true;


      button.textContent =
        "⏳ Menyimpan...";


      hideMessage();


      // ---------------------------------------------
      // DATA
      // ---------------------------------------------

      const materialData = {

        judul:
          judul,

        deskripsi:
          deskripsi,

        kategori:
          kategori,

        /*
          INI YANG MEMPERBAIKI
          ERROR SEBELUMNYA.
        */

        tipe:
          "video",

        url:
          url,

        thumbnail:
          thumbnail || null,

        premium:
          premium

      };


      console.log(
        "Data yang dikirim:",
        materialData
      );


      // ---------------------------------------------
      // INSERT
      // ---------------------------------------------

      const {
        data,
        error
      } =
      await supabaseClient
