<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="NgajiPlus Akademi - Admin">

<title>NgajiPlus Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f8f6;
    color:#202a24;
}

header{
    background:#ffffff;
    border-bottom:1px solid #e2e8e4;
    position:sticky;
    top:0;
    z-index:100;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    padding:12px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#008f58;
    font-weight:bold;
    font-size:15px;
}

.header-buttons{
    display:flex;
    gap:8px;
}

.header-button{
    border:0;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:12px;
}

.dashboard-button{
    background:#e8f6ef;
    color:#087a47;
}

.logout{
    background:#f1f1f1;
    color:#444;
}

main{
    max-width:1100px;
    margin:auto;
    padding:25px 15px 50px;
}

h1{
    margin:0 0 5px;
    font-size:25px;
}

h2{
    margin-top:0;
    font-size:19px;
}

.subtitle{
    color:#777;
    font-size:13px;
    margin-bottom:20px;
}

.box{
    background:white;
    border:1px solid #e2e8e4;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    font-size:13px;
    margin:15px 0 7px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #d9e1dc;
    border-radius:9px;
    font-size:14px;
    background:#fff;
    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#009b59;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.save-button{
    margin-top:18px;
    background:#008f58;
    color:white;
    padding:12px 18px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.save-button:disabled{
    opacity:.6;
}

.cancel-button{
    margin-top:18px;
    margin-left:8px;
    background:#eeeeee;
    color:#444;
    padding:12px 18px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:9px;
    line-height:1.5;
    display:none;
    font-size:13px;
}

.success{
    display:block;
    background:#e4f8ed;
    color:#087a47;
}

.error{
    display:block;
    background:#ffe9e9;
    color:#b42318;
}

.warning{
    display:block;
    background:#fff7d6;
    color:#806400;
}


/* ==============================
LOGIN
============================== */

.login-page{
    min-height:calc(100vh - 55px);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:55px 15px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.login-title{
    text-align:center;
    color:#168b57;
    font-size:21px;
    font-weight:bold;
}

.login-subtitle{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-top:5px;
    margin-bottom:25px;
}

.login-button{
    width:100%;
    background:#008f58;
    color:white;
    padding:13px;
    border-radius:9px;
    font-weight:bold;
    margin-top:15px;
    cursor:pointer;
}

.login-button:disabled{
    opacity:.6;
}


/* ==============================
MATERIAL LIST
============================== */

.list-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.refresh-button{
    padding:8px 12px;
    border-radius:8px;
    background:#e8f5ef;
    color:#087a47;
    border:0;
    cursor:pointer;
    font-weight:bold;
}

.loading{
    text-align:center;
    padding:30px;
    color:#777;
}

.material{
    border:1px solid #e1e5e2;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
    background:#fff;
}

.material-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.material-title{
    margin:0 0 8px;
    font-size:16px;
}

.material-info{
    font-size:13px;
    color:#666;
    line-height:1.8;
}

.material-thumbnail{
    width:130px;
    height:75px;
    object-fit:cover;
    border-radius:8px;
    background:#d9f5e6;
    flex-shrink:0;
}

.no-thumbnail{
    width:130px;
    height:75px;
    background:#d9f5e6;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    flex-shrink:0;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.badge-free{
    background:#ddf7e7;
    color:#087a47;
}

.badge-premium{
    background:#fff0b8;
    color:#8a6200;
}

.material-buttons{
    margin-top:12px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.open-button,
.edit-button,
.delete-button{
    padding:8px 12px;
    border-radius:8px;
    border:0;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
    text-decoration:none;
}

.open-button{
    background:#e9f6ff;
    color:#1269a0;
}

.edit-button{
    background:#fff0d5;
    color:#a85e00;
}

.delete-button{
    background:#ffe3e3;
    color:#b42318;
}

.hidden{
    display:none !important;
}

.preview-box{
    margin-top:10px;
    display:none;
}

.preview-box img{
    max-width:250px;
    max-height:150px;
    border-radius:10px;
    border:1px solid #ddd;
}


/* ==============================
MOBILE
============================== */

@media(max-width:700px){

    .form-grid{
        grid-template-columns:1fr;
        gap:0;
    }

    .material-top{
        flex-direction:column;
    }

    .material-thumbnail,
    .no-thumbnail{
        width:100%;
        height:150px;
    }

}

@media(max-width:500px){

    main{
        padding:20px 12px 40px;
    }

    .box{
        padding:15px;
    }

    h1{
        font-size:22px;
    }

    .header-button{
        padding:7px 9px;
        font-size:11px;
    }

    .logo{
        font-size:13px;
    }

}

</style>

</head>


<body>


<header>

<div class="header-inner">

<div class="logo">
📖 NgajiPlus Admin
</div>

<div class="header-buttons">

<a
    href="akademi.html"
    id="dashboardButton"
    class="header-button dashboard-button hidden"
>
📚 Akademi
</a>

<button
    id="logoutButton"
    class="header-button logout hidden"
    onclick="logout()"
>
Keluar
</button>

</div>

</div>

</header>



<!-- =========================================
LOGIN
========================================= -->

<div
    id="loginPage"
    class="login-page"
>

<div class="login-box">

<div class="login-title">
📖 NgajiPlus Akademi
</div>

<div class="login-subtitle">
Login Admin
</div>


<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    placeholder="Masukkan email admin"
    autocomplete="email"
>


<label for="password">
Password
</label>

<input
    type="password"
    id="password"
    placeholder="Masukkan password"
    autocomplete="current-password"
>


<button
    id="loginButton"
    class="login-button"
    onclick="login()"
>
🔐 Masuk
</button>


<div
    id="loginMessage"
    class="message"
></div>

</div>

</div>



<!-- =========================================
ADMIN PAGE
========================================= -->

<main
    id="adminPage"
    class="hidden"
>

<h1>
🎬 Kelola Materi
</h1>

<div class="subtitle">
Tambahkan dan kelola materi Video, Audio, dan PDF NgajiPlus Akademi.
</div>



<!-- =========================================
FORM
========================================= -->

<div class="box">

<h2 id="formTitle">
➕ Tambah Materi
</h2>


<label for="judul">
Judul Materi
</label>

<input
    type="text"
    id="judul"
    placeholder="Contoh: Belajar Fiqih Shalat"
>


<label for="deskripsi">
Deskripsi
</label>

<textarea
    id="deskripsi"
    placeholder="Tuliskan deskripsi materi..."
></textarea>


<div class="form-grid">


<div>

<label for="kategori">
Kategori
</label>

<select id="kategori">

<option value="Al-Qur'an & Tahsin">
Al-Qur'an & Tahsin
</option>

<option value="Fiqih">
Fiqih
</option>

<option value="Aqidah">
Aqidah
</option>

<option value="Akhlak & Adab">
Akhlak & Adab
</option>

<option value="Bahasa Arab">
Bahasa Arab
</option>

<option value="Hadits">
Hadits
</option>

<option value="Tafsir">
Tafsir
</option>

<option value="Sejarah Islam">
Sejarah Islam
</option>

</select>

</div>


<div>

<label for="tipe">
Tipe Materi
</label>

<select id="tipe">

<option value="video">
🎥 Video
</option>

<option value="audio">
🎧 Audio
</option>

<option value="pdf">
📄 PDF
</option>

</select>

</div>

</div>



<label for="url">
🔗 URL Materi
</label>

<input
    type="url"
    id="url"
    placeholder="https://www.youtube.com/watch?v=..."
>


<label for="thumbnail">
🖼️ URL Thumbnail
</label>

<input
    type="url"
    id="thumbnail"
    placeholder="https://..."
    oninput="previewThumbnail()"
>


<div
    id="thumbnailPreview"
    class="preview-box"
>

<img
    id="previewImage"
    src=""
    alt="Preview"
>

</div>



<div
    style="
        margin-top:15px;
        padding:12px;
        background:#fff8df;
        border-radius:10px;
    "
>

<label
    style="
        margin:0;
        display:flex;
        align-items:center;
        gap:8px;
    "
>

<input
    type="checkbox"
    id="premium"
    style="width:auto"
>

🔐 Jadikan Materi Premium

</label>

</div>



<div>

<button
    id="saveButton"
    class="save-button"
    onclick="saveMaterial()"
>
💾 Simpan Materi
</button>

<button
    id="cancelButton"
    class="cancel-button hidden"
    onclick="cancelEdit()"
>
❌ Batal Edit
</button>

</div>


<div
    id="saveMessage"
    class="message"
></div>

</div>



<!-- =========================================
DAFTAR MATERI
========================================= -->

<div class="box">

<div class="list-header">

<h2 style="margin:0">
📚 Daftar Materi
</h2>

<button
    class="refresh-button"
    onclick="loadMaterials()"
>
🔄 Refresh
</button>

</div>


<div id="materialsList">

<div class="loading">
⏳ Mengambil data materi...
</div>

</div>

</div>

</main>



<script>


/* =====================================================
VARIABLE
===================================================== */

let editingId = null;


/* =====================================================
CEK SUPABASE
===================================================== */

console.log(
    "ADMIN: JavaScript berjalan."
);

console.log(
    "ADMIN: supabaseClient =",
    typeof supabaseClient
);


if(
    typeof supabaseClient === "undefined"
){

    document.getElementById(
        "loginMessage"
    ).className =
        "message error";

    document.getElementById(
        "loginMessage"
    ).style.display =
        "block";

    document.getElementById(
        "loginMessage"
    ).innerHTML =
        "❌ supabaseClient tidak ditemukan.<br><br>" +
        "Periksa file supabase-config.js";

}


/* =====================================================
LOGIN
===================================================== */

async function login(){

    const button =
        document.getElementById(
            "loginButton"
        );

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;


    if(!email){

        showLoginMessage(
            "❌ Email wajib diisi.",
            "error"
        );

        return;

    }


    if(!password){

        showLoginMessage(
            "❌ Password wajib diisi.",
            "error"
        );

        return;

    }


    try{

        button.disabled = true;

        button.innerText =
            "⏳ Memeriksa...";


        const result =
            await supabaseClient.auth.signInWithPassword({

                email:email,

                password:password

            });


        if(result.error){

            throw result.error;

        }


        if(!result.data.session){

            throw new Error(
                "Session login tidak ditemukan."
            );

        }


        showLoginMessage(
            "✅ Login berhasil.",
            "success"
        );


        setTimeout(
            function(){

                showAdmin();

            },
            500
        );

    }

    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        let text =
            error.message ||
            "Login gagal.";


        if(
            text.includes(
                "Invalid login credentials"
            )
        ){

            text =
                "Email atau password salah.";

        }


        showLoginMessage(
            "❌ " + text,
            "error"
        );

    }

    finally{

        button.disabled = false;

        button.innerText =
            "🔐 Masuk";

    }

}


/* =====================================================
LOGIN MESSAGE
===================================================== */

function showLoginMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "loginMessage"
        );


    message.className =
        "message " + type;

    message.style.display =
        "block";

    message.innerHTML =
        escapeHtml(text);

}


/* =====================================================
SESSION
===================================================== */

async function checkSession(){

    try{

        const result =
            await supabaseClient.auth.getSession();


        if(result.error){

            console.error(
                result.error
            );

            return;

        }


        if(result.data.session){

            showAdmin();

        }

    }

    catch(error){

        console.error(
            "SESSION ERROR:",
            error
        );

    }

}


/* =====================================================
SHOW ADMIN
===================================================== */

function showAdmin(){

    document
        .getElementById("loginPage")
        .classList
        .add("hidden");


    document
        .getElementById("adminPage")
        .classList
        .remove("hidden");


    document
        .getElementById("logoutButton")
        .classList
        .remove("hidden");


    document
        .getElementById("dashboardButton")
        .classList
        .remove("hidden");


    loadMaterials();

}


/* =====================================================
LOGOUT
===================================================== */

async function logout(){

    try{

        const result =
            await supabaseClient.auth.signOut();


        if(result.error){

            throw result.error;

        }


        location.reload();

    }

    catch(error){

        alert(
            "❌ Gagal keluar:\n\n" +
            error.message
        );

    }

}


/* =====================================================
PREVIEW THUMBNAIL
===================================================== */

function previewThumbnail(){

    const url =
        document
            .getElementById("thumbnail")
            .value
            .trim();


    const box =
        document.getElementById(
            "thumbnailPreview"
        );


    const image =
        document.getElementById(
            "previewImage"
        );


    if(!url){

        box.style.display =
            "none";

        image.src =
            "";

        return;

    }


    image.src =
        url;

    box.style.display =
        "block";

}


/* =====================================================
SAVE / UPDATE MATERIAL
===================================================== */

async function saveMaterial(){

    const button =
        document.getElementById(
            "saveButton"
        );

    const message =
        document.getElementById(
            "saveMessage"
        );


    const judul =
        document
            .getElementById("judul")
            .value
            .trim();


    const deskripsi =
        document
            .getElementById("deskripsi")
            .value
            .trim();


    const kategori =
        document
            .getElementById("kategori")
            .value;


    const tipe =
        document
            .getElementById("tipe")
            .value;


    const url =
        document
            .getElementById("url")
            .value
            .trim();


    const thumbnail =
        document
            .getElementById("thumbnail")
            .value
            .trim();


    const premium =
        document
            .getElementById("premium")
            .checked;


    try{

        if(!judul){

            throw new Error(
                "Judul materi wajib diisi."
            );

        }


        if(!url){

            throw new Error(
                "URL materi wajib diisi."
            );

        }


        button.disabled = true;


        message.className =
            "message success";

        message.style.display =
            "block";


        message.innerText =
            editingId
            ?
            "⏳ Memperbarui materi..."
            :
            "⏳ Menyimpan materi...";


        /*
         * PENTING:
         * Hanya menggunakan kolom yang ada
         * pada tabel materials Anda.
         */

        const data = {

            judul:
                judul,

            deskripsi:
                deskripsi,

            kategori:
                kategori,

            tipe:
                tipe,

            url:
                url,

            thumbnail:
                thumbnail || null,

            premium:
                premium

        };


        let result;


        /* =========================
           UPDATE
        ========================= */

        if(editingId){

            result =
                await supabaseClient
                    .from("materials")
                    .update(data)
                    .eq(
                        "id",
                        editingId
                    );

        }


        /* =========================
           INSERT
        ========================= */

        else{

            result =
                await supabaseClient
                    .from("materials")
                    .insert(data);

        }


        if(result.error){

            throw result.error;

        }


        message.className =
            "message success";

        message.style.display =
            "block";


        message.innerText =
            editingId
            ?
            "✅ Materi berhasil diperbarui!"
            :
            "✅ Materi berhasil ditambahkan!";


        clearForm();


        await loadMaterials();

    }

    catch(error){

        console.error(
            "SAVE ERROR:",
            error
        );


        message.className =
            "message error";

        message.style.display =
            "block";


        message.innerHTML =
            "❌ Gagal menyimpan:<br><br>" +
            escapeHtml(
                error.message
            );

    }

    finally{

        button.disabled = false;

    }

}


/* =====================================================
LOAD MATERIALS
===================================================== */

async function loadMaterials(){

    const list =
        document.getElementById(
            "materialsList"
        );


    list.innerHTML =
        '<div class="loading">⏳ Mengambil data materi...</div>';


    try{

        const result =
            await supabaseClient
                .from("materials")
                .select(
                    "id,judul,deskripsi,kategori,tipe,url,thumbnail,premium,created_at"
                )
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(result.error){

            throw result.error;

        }


        const materials =
            result.data || [];


        if(materials.length === 0){

            list.innerHTML =
                '<div class="loading">📚 Belum ada materi.</div>';

            return;

        }


        list.innerHTML =
            materials
                .map(
                    createMaterialCard
                )
                .join("");

    }

    catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );


        list.innerHTML =

            '<div class="message error" style="display:block">' +

            '❌ Gagal mengambil materi.<br><br>' +

            escapeHtml(
                error.message
            ) +

            '</div>';

    }

}


/* =====================================================
CREATE CARD
===================================================== */

function createMaterialCard(
    material
){

    const tipe =
        String(
            material.tipe || "video"
        ).toLowerCase();


    let icon =
        "🎥";


    if(tipe === "audio"){

        icon =
            "🎧";

    }

    else if(tipe === "pdf"){

        icon =
            "📄";

    }


    const badge =
        material.premium === true

        ?

        '<span class="badge badge-premium">🔐 Premium</span>'

        :

        '<span class="badge badge-free">🟢 Gratis</span>';


    let thumbnailHTML;


    if(material.thumbnail){

        thumbnailHTML =

            `<img
                class="material-thumbnail"
                src="${escapeAttribute(material.thumbnail)}"
                alt="${escapeAttribute(material.judul || "Materi")}"
                onerror="this.outerHTML='<div class=&quot;no-thumbnail&quot;>${icon}</div>'"
            >`;

    }

    else{

        thumbnailHTML =
            `<div class="no-thumbnail">
                ${icon}
             </div>`;

    }


    const url =
        material.url || "";


    return `

        <div class="material">

            <div class="material-top">

                <div style="flex:1">

                    <h3 class="material-title">

                        ${icon}

                        ${escapeHtml(
                            material.judul ||
                            "Tanpa Judul"
                        )}

                    </h3>


                    <div class="material-info">

                        ${escapeHtml(
                            material.deskripsi ||
                            "Tidak ada deskripsi."
                        )}

                        <br>

                        📁 Kategori:
                        <strong>
                            ${escapeHtml(
                                material.kategori ||
                                "-"
                            )}
                        </strong>

                        <br>

                        📌 Tipe:
                        <strong>
                            ${escapeHtml(
                                tipe
                            )}
                        </strong>

                        <br><br>

                        ${badge}

                    </div>

                </div>


                ${thumbnailHTML}

            </div>


            <div class="material-buttons">


                ${
                    url
                    ?

                    `
                    <a
                        href="${escapeAttribute(url)}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="open-button"
                    >
                        🔗 Buka
                    </a>
                    `

                    :

                    ""
                }


                <button
                    class="edit-button"
                    onclick="editMaterial(${Number(material.id)})"
                >
                    ✏️ Edit
                </button>


                <button
                    class="delete-button"
                    onclick="deleteMaterial(${Number(material.id)})"
                >
                    🗑️ Hapus
                </button>


            </div>

        </div>

    `;

}


/* =====================================================
EDIT MATERIAL
===================================================== */

async function editMaterial(id){

    try{

        const result =
            await supabaseClient
                .from("materials")
                .select(
                    "id,judul,deskripsi,kategori,tipe,url,thumbnail,premium"
                )
                .eq(
                    "id",
                    id
                )
                .single();


        if(result.error){

            throw result.error;

        }


        const material =
            result.data;


        editingId =
            material.id;


        document.getElementById(
            "judul"
        ).value =
            material.judul || "";


        document.getElementById(
            "deskripsi"
        ).value =
            material.deskripsi || "";


        document.getElementById(
            "kategori"
        ).value =
            material.kategori || "Fiqih";


        document.getElementById(
            "tipe"
        ).value =
            material.tipe || "video";


        document.getElementById(
            "url"
        ).value =
            material.url || "";


        document.getElementById(
            "thumbnail"
        ).value =
            material.thumbnail || "";


        document.getElementById(
            "premium"
        ).checked =
            material.premium === true;


        document.getElementById(
            "formTitle"
        ).innerText =
            "✏️ Edit Materi";


        document.getElementById(
            "saveButton"
        ).innerText =
            "💾 Simpan Perubahan";


        document.getElementById(
            "cancelButton"
        ).classList
        .remove("hidden");


        previewThumbnail();


        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

    catch(error){

        alert(
            "❌ Gagal membuka materi:\n\n" +
            error.message
        );

    }

}

/* =====================================================
DELETE
===================================================== */

async function deleteMaterial(id){

    const yakin =
        confirm(
            "Yakin ingin menghapus materi ini?"
        );


    if(!yakin){

        return;

    }


    try{

        const result =
            await supabaseClient
                .from("materials")
                .delete()
                .eq(
                    "id",
                    id
                );


        if(result.error){

            throw result.error;

        }


        alert(
            "✅ Materi berhasil dihapus."
        );


        await loadMaterials();

    }

    catch(error){

        console.error(
            "DELETE ERROR:",
            error
        );


        alert(
            "❌ Gagal menghapus:\n\n" +
            error.message
        );

    }

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value){

    return escapeHtml(value);

}
