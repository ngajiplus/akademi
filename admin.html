<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin NgajiPlus</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f5f7f6;

      color: #202a24;

    }


    header {

      background: white;

      border-bottom: 1px solid #ddd;

      padding: 18px 20px;

    }


    .header-inner {

      max-width: 1000px;

      margin: auto;

      display: flex;

      justify-content: space-between;

      align-items: center;

    }


    .logo {

      color: #238b57;

      font-size: 22px;

      font-weight: bold;

    }


    .logout {

      border: none;

      background: #eee;

      padding: 9px 15px;

      border-radius: 8px;

      cursor: pointer;

    }


    main {

      max-width: 1000px;

      margin: auto;

      padding: 30px 20px;

    }


    h1 {

      margin-top: 0;

    }


    .card {

      background: white;

      border: 1px solid #e1e6e3;

      border-radius: 15px;

      padding: 25px;

      margin-bottom: 25px;

    }


    label {

      display: block;

      font-weight: bold;

      margin-top: 15px;

      margin-bottom: 7px;

    }


    input,
    textarea,
    select {

      width: 100%;

      padding: 12px;

      border: 1px solid #d5dbd7;

      border-radius: 8px;

      font-size: 14px;

    }


    textarea {

      min-height: 100px;

      resize: vertical;

    }


    .checkbox {

      display: flex;

      align-items: center;

      gap: 10px;

      margin-top: 15px;

    }


    .checkbox input {

      width: auto;

    }


    button {

      cursor: pointer;

    }


    .save-btn {

      margin-top: 20px;

      width: 100%;

      padding: 13px;

      border: none;

      border-radius: 9px;

      background: #238b57;

      color: white;

      font-weight: bold;

      font-size: 15px;

    }


    .save-btn:hover {

      background: #197344;

    }


    .message {

      margin-top: 15px;

      padding: 12px;

      border-radius: 8px;

      display: none;

    }


    .success {

      display: block;

      background: #e8f7ee;

      color: #187a46;

    }


    .error {

      display: block;

      background: #fff0f0;

      color: #b42318;

    }


    .material-item {

      border: 1px solid #e2e6e3;

      border-radius: 12px;

      padding: 15px;

      margin-top: 12px;

    }


    .material-item h3 {

      margin: 0 0 7px;

    }


    .material-info {

      color: #68716c;

      font-size: 13px;

    }


    .delete-btn {

      margin-top: 10px;

      border: none;

      background: #ffe5e5;

      color: #b42318;

      padding: 8px 12px;

      border-radius: 7px;

    }


    .loading {

      text-align: center;

      color: #777;

      padding: 20px;

    }


    @media (max-width: 600px) {

      main {

        padding: 20px 15px;

      }

      .header-inner {

        gap: 10px;

      }

    }

  </style>

</head>


<body>


<header>

  <div class="header-inner">

    <div class="logo">
      📖 NgajiPlus Admin
    </div>

    <button
      class="logout"
      id="logoutBtn"
    >
      Keluar
    </button>

  </div>

</header>


<main>


  <h1>
    🎬 Kelola Materi Video
  </h1>


  <!-- TAMBAH MATERI -->

  <section class="card">

    <h2>
      ➕ Tambah Materi
    </h2>


    <form id="materialForm">


      <label>
        Judul Materi
      </label>

      <input
        type="text"
        id="judul"
        placeholder="Contoh: Belajar Membaca Al-Qur'an"
        required
      >



      <label>
        Deskripsi
      </label>

      <textarea
        id="deskripsi"
        placeholder="Deskripsi materi..."
      ></textarea>



      <label>
        Kategori
      </label>

      <select
        id="kategori"
        required
      >

        <option value="">
          Pilih kategori
        </option>

        <option value="Al-Qur'an & Tahsin">
          Al-Qur'an & Tahsin
        </option>

        <option value="Fiqih">
          Fiqih
        </option>

        <option value="Aqidah">
          Aqidah
        </option>

        <option value="Akhlak & Adab">
          Akhlak & Adab
        </option>

        <option value="Bahasa Arab">
          Bahasa Arab
        </option>

        <option value="Hadits">
          Hadits
        </option>

        <option value="Tafsir">
          Tafsir
        </option>

        <option value="Sejarah Islam">
          Sejarah Islam
        </option>

      </select>



      <label>
        URL Video
      </label>

      <input
        type="url"
        id="url"
        placeholder="https://www.youtube.com/watch?v=..."
        required
      >



      <label>
        URL Thumbnail
      </label>

      <input
        type="url"
        id="thumbnail"
        placeholder="https://..."
      >



      <div class="checkbox">

        <input
          type="checkbox"
          id="premium"
        >

        <span>
          🔐 Jadikan Materi Premium
        </span>

      </div>



      <button
        type="submit"
        class="save-btn"
      >
        💾 Simpan Materi
      </button>


      <div
        id="message"
        class="message"
      ></div>


    </form>

  </section>



  <!-- DAFTAR MATERI -->

  <section class="card">

    <h2>
      📚 Daftar Materi
    </h2>


    <div
      id="materialsList"
    >

      <div class="loading">
        ⏳ Memuat materi...
      </div>

    </div>

  </section>


</main>



<script>


// =================================================
// CEK ADMIN
// =================================================

async function checkAdmin() {


  const {
    data: {
      session
    }
  } =
  await supabaseClient.auth.getSession();


  if (!session) {

    window.location.href =
      "login.html";

    return null;

  }


  return session;

}



// =================================================
// TAMPIL PESAN
// =================================================

function showMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message " + type;

}



// =================================================
// TAMBAH MATERI
// =================================================

document
  .getElementById(
    "materialForm"
  )
  .addEventListener(
    "submit",
    async function(event) {


      event.preventDefault();


      const judul =
        document
          .getElementById(
            "judul"
          )
          .value
          .trim();


      const deskripsi =
        document
          .getElementById(
            "deskripsi"
          )
          .value
          .trim();


      const kategori =
        document
          .getElementById(
            "kategori"
          )
          .value;


      const url =
        document
          .getElementById(
            "url"
          )
          .value
          .trim();


      const thumbnail =
        document
          .getElementById(
            "thumbnail"
          )
          .value
          .trim();


      const premium =
        document
          .getElementById(
            "premium"
          )
          .checked;



      const {
        error
      } =
      await supabaseClient
        .from("materials")
        .insert([

          {

            judul:
              judul,

            deskripsi:
              deskripsi,

            kategori:
              kategori,

            url:
              url,

            thumbnail:
              thumbnail || null,

            premium:
              premium

          }

        ]);



      if (error) {

        console.error(error);


        showMessage(
          "❌ Gagal menyimpan: " +
          error.message,
          "error"
        );

        return;

      }



      showMessage(
        "✅ Materi berhasil ditambahkan!",
        "success"
      );


      document
        .getElementById(
          "materialForm"
        )
        .reset();


      loadMaterials();

    }
  );



// =================================================
// AMBIL DAFTAR MATERI
// =================================================

async function loadMaterials() {


  const container =
    document.getElementById(
      "materialsList"
    );


  container.innerHTML = `

    <div class="loading">
      ⏳ Memuat materi...
    </div>

  `;



  const {
    data,
    error
  } =
  await supabaseClient

    .from("materials")

    .select("*")

    .order(
      "id",
      {
        ascending: false
      }
    );



  if (error) {

    container.innerHTML = `

      <div class="message error">

        ❌ ${escapeHtml(
          error.message
        )}

      </div>

    `;

    return;

  }



  if (!data.length) {

    container.innerHTML = `

      <div class="loading">

        📚 Belum ada materi.

      </div>

    `;

    return;

  }



  container.innerHTML =

    data
      .map(
        material => `

          <div
            class="material-item"
          >

            <h3>

              ${escapeHtml(
                material.judul
              )}

            </h3>


            <div
              class="material-info"
            >

              Kategori:
              ${escapeHtml(
                material.kategori ||
                "-"
              )}

              <br>

              Status:
              ${
                material.premium
                ?
                "🔐 Premium"
                :
                "🟢 Gratis"
              }

            </div>


            <button
              class="delete-btn"
              onclick="deleteMaterial(${material.id})"
            >

              🗑️ Hapus

            </button>

          </div>

        `
      )
      .join("");

}



// =================================================
// HAPUS MATERI
// =================================================

async function deleteMaterial(
  id
) {


  const yakin =
    confirm(
      "Yakin ingin menghapus materi ini?"
    );


  if (!yakin) {

    return;

  }



  const {
    error
  } =
  await supabaseClient

    .from("materials")

    .delete()

    .eq(
      "id",
      id
    );



  if (error) {

    alert(
      "❌ Gagal menghapus: " +
      error.message
    );

    return;

  }



  alert(
    "✅ Materi berhasil dihapus."
  );


  loadMaterials();

}



// =================================================
// ESCAPE HTML
// =================================================

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



// =================================================
// LOGOUT
// =================================================

document
  .getElementById(
    "logoutBtn"
  )
  .addEventListener(
    "click",
    async function() {


      await supabaseClient
        .auth
        .signOut();


      window.location.href =
        "index.html";

    }
  );



// =================================================
// MULAI
// =================================================

async function start() {

  const session =
    await checkAdmin();


  if (!session) {

    return;

  }


  loadMaterials();

}


start();

</script>


</body>

  </html>
