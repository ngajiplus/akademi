<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin NgajiPlus</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f5f7f6;

      color: #202a24;

    }


    header {

      background: white;

      border-bottom:
        1px solid #e2e7e4;

    }


    .header-inner {

      max-width: 1100px;

      margin: auto;

      padding: 15px 20px;

      display: flex;

      justify-content:
        space-between;

      align-items: center;

    }


    .logo {

      color: #238b57;

      font-size: 20px;

      font-weight: bold;

    }


    button {

      border: none;

      cursor: pointer;

    }


    .logout {

      background: #eee;

      padding: 9px 15px;

      border-radius: 8px;

    }


    main {

      max-width: 1100px;

      margin: auto;

      padding: 30px 15px;

    }


    h1 {

      margin-top: 0;

    }


    .card {

      background: white;

      border: 1px solid #e1e6e3;

      border-radius: 15px;

      padding: 20px;

      margin-bottom: 25px;

    }


    .card h2 {

      margin-top: 0;

    }


    label {

      display: block;

      margin-top: 15px;

      margin-bottom: 6px;

      font-weight: bold;

      font-size: 14px;

    }


    input,
    textarea,
    select {

      width: 100%;

      padding: 12px;

      border: 1px solid #d8dedb;

      border-radius: 8px;

      font-family: inherit;

      font-size: 14px;

    }


    textarea {

      min-height: 100px;

      resize: vertical;

    }


    .premium-row {

      margin-top: 15px;

      display: flex;

      align-items: center;

      gap: 8px;

    }


    .premium-row input {

      width: auto;

    }


    .save-btn {

      width: 100%;

      margin-top: 18px;

      padding: 13px;

      background: #008f4c;

      color: white;

      border-radius: 8px;

      font-weight: bold;

      font-size: 15px;

    }


    .save-btn:disabled {

      opacity: .6;

    }


    .message {

      margin-top: 15px;

      padding: 12px;

      border-radius: 8px;

      display: none;

    }


    .success {

      display: block;

      background: #e9f8ef;

      color: #16733f;

    }


    .error {

      display: block;

      background: #fff0f0;

      color: #b42318;

    }


    .material-item {

      border: 1px solid #e0e5e2;

      border-radius: 12px;

      padding: 15px;

      margin-bottom: 12px;

    }


    .material-title {

      font-weight: bold;

      font-size: 17px;

      margin-bottom: 7px;

    }


    .material-info {

      color: #707873;

      font-size: 13px;

      line-height: 1.6;

    }


    .badge {

      display: inline-block;

      padding: 4px 8px;

      border-radius: 20px;

      font-size: 11px;

      margin-top: 5px;

    }


    .badge-premium {

      background: #fff0c7;

      color: #8a5a00;

    }


    .badge-free {

      background: #e9f8ef;

      color: #16733f;

    }


    .delete-btn {

      margin-top: 10px;

      padding: 8px 12px;

      border-radius: 7px;

      background: #ffe5e5;

      color: #b42318;

    }


    .loading {

      text-align: center;

      padding: 30px;

      color: #777;

    }


    @media(max-width:600px) {

      main {

        padding: 20px 12px;

      }

      .header-inner {

        padding: 12px;

      }

    }

  </style>

</head>


<body>


<header>

  <div class="header-inner">

    <div class="logo">
      📖 NgajiPlus Admin
    </div>


    <button
      class="logout"
      id="logoutBtn"
    >
      Keluar
    </button>

  </div>

</header>



<main>


  <h1>
    🎬 Kelola Materi Video
  </h1>



  <!-- ================================================= -->
  <!-- FORM TAMBAH MATERI -->
  <!-- ================================================= -->

  <section class="card">

    <h2>
      ➕ Tambah Materi
    </h2>


    <form id="materialForm">


      <label>
        Judul Materi
      </label>

      <input
        type="text"
        id="judul"
        placeholder="Contoh: Belajar Fiqih Shalat"
        required
      >



      <label>
        Deskripsi
      </label>

      <textarea
        id="deskripsi"
        placeholder="Tuliskan deskripsi materi..."
      ></textarea>



      <label>
        Kategori
      </label>

      <select
        id="kategori"
        required
      >

        <option value="Al-Qur'an & Tahsin">
          Al-Qur'an & Tahsin
        </option>

        <option value="Fiqih">
          Fiqih
        </option>

        <option value="Aqidah">
          Aqidah
        </option>

        <option value="Akhlak & Adab">
          Akhlak & Adab
        </option>

        <option value="Bahasa Arab">
          Bahasa Arab
        </option>

        <option value="Hadits">
          Hadits
        </option>

        <option value="Tafsir">
          Tafsir
        </option>

        <option value="Sejarah Islam">
          Sejarah Islam
        </option>

      </select>



      <!-- ============================================= -->
      <!-- INI BAGIAN YANG MEMPERBAIKI ERROR -->
      <!-- ============================================= -->

      <label>
        Tipe Materi
      </label>

      <select
        id="tipe"
        required
      >

        <option value="video">
          🎥 Video
        </option>

        <option value="audio">
          🎧 Audio
        </option>

        <option value="pdf">
          📄 PDF
        </option>

      </select>



      <label>
        URL Video / Materi
      </label>

      <input
        type="url"
        id="url"
        placeholder="https://youtube.com/watch?v=..."
        required
      >



      <label>
        URL Thumbnail
      </label>

      <input
        type="url"
        id="thumbnail"
        placeholder="https://..."
      >



      <div class="premium-row">

        <input
          type="checkbox"
          id="premium"
        >

        <label
          for="premium"
          style="margin:0;font-weight:normal;"
        >
          🔐 Jadikan Materi Premium
        </label>

      </div>



      <button
        type="submit"
        class="save-btn"
        id="saveBtn"
      >

        💾 Simpan Materi

      </button>


      <div
        id="message"
        class="message"
      ></div>


    </form>

  </section>



  <!-- ================================================= -->
  <!-- DAFTAR MATERI -->
  <!-- ================================================= -->

  <section class="card">

    <h2>
      📚 Daftar Materi
    </h2>


    <div id="materialsList">

      <div class="loading">
        ⏳ Memuat materi...
      </div>

    </div>

  </section>


</main>



<script>


// =====================================================
// CEK LOGIN ADMIN
// =====================================================

async function checkAdmin() {


  const {
    data: {
      session
    }
  } =
  await supabaseClient.auth.getSession();


  if (!session) {

    window.location.href =
      "login.html";

    return false;

  }


  return true;

}



// =====================================================
// TAMPILKAN PESAN
// =====================================================

function showMessage(
  text,
  type
) {


  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message " + type;


}



// =====================================================
// SIMPAN MATERI
// =====================================================

document
  .getElementById(
    "materialForm"
  )
  .addEventListener(
    "submit",
    async function(event) {


      event.preventDefault();


      const saveBtn =
        document.getElementById(
          "saveBtn"
        );


      saveBtn.disabled =
        true;


      saveBtn.textContent =
        "⏳ Menyimpan...";


      showMessage(
        "",
        ""
      );



      // -----------------------------------------------
      // AMBIL DATA FORM
      // -----------------------------------------------

      const judul =
        document
          .getElementById("judul")
          .value
          .trim();


      const deskripsi =
        document
          .getElementById("deskripsi")
          .value
          .trim();


      const kategori =
        document
          .getElementById("kategori")
          .value;


      const tipe =
        document
          .getElementById("tipe")
          .value;


      const url =
        document
          .getElementById("url")
          .value
          .trim();


      const thumbnail =
        document
          .getElementById("thumbnail")
          .value
          .trim();


      const premium =
        document
          .getElementById("premium")
          .checked;



      // -----------------------------------------------
      // INSERT KE SUPABASE
      // -----------------------------------------------

      const {
        data,
        error
      } =
      await supabaseClient
        .from("materials")
        .insert([

          {

            judul:
              judul,

            deskripsi:
              deskripsi || null,

            kategori:
              kategori,

            // PENTING:
            // INI YANG MEMPERBAIKI ERROR "tipe"

            tipe:
              tipe,

            url:
              url,

            thumbnail:
              thumbnail || null,

            premium:
              premium

          }

        ])
        .select()
        .single();



      // -----------------------------------------------
      // JIKA ERROR
      // -----------------------------------------------

      if (error) {


        console.error(
          error
        );


        showMessage(
          "❌ Gagal menyimpan: " +
          error.message,
          "error"
        );


        saveBtn.disabled =
          false;


        saveBtn.textContent =
          "💾 Simpan Materi";


        return;

      }



      // -----------------------------------------------
      // BERHASIL
      // -----------------------------------------------

      showMessage(
        "✅ Materi berhasil disimpan!",
        "success"
      );


      document
        .getElementById(
          "materialForm"
        )
        .reset();


      saveBtn.disabled =
        false;


      saveBtn.textContent =
        "💾 Simpan Materi";


      loadMaterials();

    }
  );



// =====================================================
// AMBIL DAFTAR MATERI
// =====================================================

async function loadMaterials() {


  const list =
    document.getElementById(
      "materialsList"
    );


  list.innerHTML = `

    <div class="loading">

      ⏳ Memuat materi...

    </div>

  `;



  const {
    data,
    error
  } =
  await supabaseClient
    .from("materials")
    .select("*")
    .order(
      "created_at",
      {
        ascending: false
      }
    );



  if (error) {


    console.error(
      error
    );


    list.innerHTML = `

      <div class="message error">

        ❌ Gagal mengambil materi.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;


    return;

  }



  if (!data || data.length === 0) {


    list.innerHTML = `

      <div class="loading">

        📚 Belum ada materi.

      </div>

    `;


    return;

  }



  list.innerHTML =
    data
      .map(
        material => {


          const premium =
            material.premium === true;


          return `

            <div
              class="material-item"
            >


              <div
                class="material-title"
              >

                ${escapeHtml(
                  material.judul ||
                  "Tanpa Judul"
                )}

              </div>



              <div
                class="material-info"
              >

                Kategori:
                ${escapeHtml(
                  material.kategori ||
                  "-"
                )}

                <br>

                Tipe:
                ${escapeHtml(
                  material.tipe ||
                  "-"
                )}

                <br>

                Status:

                <span
                  class="
                    badge
                    ${
                      premium
                      ? "badge-premium"
                      : "badge-free"
                    }
                  "
                >

                  ${
                    premium
                    ? "🔐 Premium"
                    : "🟢 Gratis"
                  }

                </span>

              </div>



              <button
                class="delete-btn"
                onclick="
                  deleteMaterial(
                    '${material.id}'
                  )
                "
              >

                🗑️ Hapus

              </button>


            </div>

          `;

        }
      )
      .join("");

}



// =====================================================
// HAPUS MATERI
// =====================================================

async function deleteMaterial(
  id
) {


  const yakin =
    confirm(
      "Yakin ingin menghapus materi ini?"
    );


  if (!yakin) {

    return;

  }



  const {
    error
  } =
  await supabaseClient
    .from("materials")
    .delete()
    .eq(
      "id",
      id
    );



  if (error) {


    alert(
      "❌ Gagal menghapus: " +
      error.message
    );


    return;

  }



  alert(
    "✅ Materi berhasil dihapus."
  );


  loadMaterials();

}



// =====================================================
// LOGOUT
// =====================================================

document
  .getElementById(
    "logoutBtn"
  )
  .addEventListener(
    "click",
    async function() {


      await supabaseClient.auth
        .signOut();


      window.location.href =
        "index.html";

    }
  );



// =====================================================
// KEAMANAN HTML
// =====================================================

function escapeHtml(
  value
) {


  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



// =====================================================
// MULAI
// =====================================================

(async function() {


  const admin =
    await checkAdmin();


  if (!admin) {

    return;

  }


  loadMaterials();

})();


</script>


</body>

        </html>
