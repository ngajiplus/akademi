<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - NgajiPlus</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8f6;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 18px 20px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      margin: 0;
      color: #008f5a;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout {
      background: #eee;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 15px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    h3 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .save {
      margin-top: 18px;
      background: #008f5a;
      color: white;
      width: 100%;
      font-size: 16px;
    }

    .cancel {
      margin-top: 10px;
      background: #eee;
      width: 100%;
      display: none;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .material {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
    }

    .material h4 {
      margin: 0 0 8px;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      margin-right: 5px;
    }

    .gratis {
      background: #dcfce7;
      color: #166534;
    }

    .premium {
      background: #fef3c7;
      color: #92400e;
    }

    .actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .edit {
      background: #e0f2fe;
      color: #0369a1;
    }

    .delete {
      background: #fee2e2;
      color: #b91c1c;
    }

    .type {
      background: #f1f5f9;
      color: #475569;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }

    @media(max-width:600px) {
      main {
        padding: 12px;
      }

      header {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <h2>🎓 NgajiPlus Admin</h2>
    <small>Manajemen Materi Pembelajaran</small>
  </div>

  <button class="logout" onclick="logout()">
    Keluar
  </button>
</header>

<main>

  <!-- TAMBAH MATERI -->
  <div class="box">

    <h3 id="formTitle">➕ Tambah Materi</h3>

    <label>Judul Materi</label>
    <input
      type="text"
      id="judul"
      placeholder="Contoh: Belajar Fiqih Shalat"
    >

    <label>Kategori</label>
    <select id="kategori">
      <option value="Al-Qur'an & Tahsin">📖 Al-Qur'an & Tahsin</option>
      <option value="Fiqih">🕌 Fiqih</option>
      <option value="Aqidah">💎 Aqidah</option>
      <option value="Akhlak & Adab">🌿 Akhlak & Adab</option>
      <option value="Bahasa Arab">🇸🇦 Bahasa Arab</option>
      <option value="Hadits">📚 Hadits</option>
      <option value="Tafsir">📖 Tafsir</option>
      <option value="Sejarah Islam">🕌 Sejarah Islam</option>
      <option value="Hafalan">🎧 Hafalan</option>
      <option value="Lainnya">📦 Lainnya</option>
    </select>

    <label>Jenis Materi</label>
    <select id="tipe">
      <option value="video">🎥 Video</option>
      <option value="audio">🎧 Audio</option>
      <option value="pdf">📄 PDF</option>
    </select>

    <label>URL Materi</label>
    <input
      type="url"
      id="url"
      placeholder="https://..."
    >

    <label>Thumbnail URL</label>
    <input
      type="url"
      id="thumbnail"
      placeholder="https://..."
    >

    <label>Deskripsi</label>
    <textarea
      id="deskripsi"
      placeholder="Tuliskan deskripsi materi..."
    ></textarea>

    <label>
      <input
        type="checkbox"
        id="premium"
        style="width:auto"
      >
      🔒 Materi Premium
    </label>

    <button class="save" onclick="simpanMateri()">
      💾 Simpan Materi
    </button>

    <button
      class="cancel"
      id="cancelBtn"
      onclick="batalEdit()"
    >
      Batal Edit
    </button>

    <div id="message" class="message"></div>

  </div>


  <!-- DAFTAR MATERI -->
  <div class="box">

    <h3>📚 Daftar Materi</h3>

    <div id="materialList">
      <div class="loading">
        Memuat materi...
      </div>
    </div>

  </div>

</main>


<script>

  // =====================================================
  // SUPABASE
  // =====================================================

  const SUPABASE_URL = "https://ksgywgdrfskqsufchbcm.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_HmFKwHMCISfN_YOoiLx3-A_MWnG9yG7";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // =====================================================
  // VARIABEL EDIT
  // =====================================================

  let editId = null;


  // =====================================================
  // CEK LOGIN DAN ADMIN
  // =====================================================

  async function cekAdmin() {

    const {
      data: { user },
      error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {

      alert("Silakan login terlebih dahulu.");

      window.location.href = "login.html";

      return false;
    }

    const { data: admin, error: adminError } =
      await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();

    if (adminError || !admin) {

      alert("Anda bukan admin.");

      window.location.href = "dashboard.html";

      return false;
    }

    return true;
  }


  // =====================================================
  // LOAD MATERI
  // =====================================================

  async function loadMateri() {

    const list =
      document.getElementById("materialList");

    const { data, error } =
      await supabaseClient
        .from("materials")
        .select("*")
        .order("id", { ascending: false });

    if (error) {

      list.innerHTML =
        `<p>❌ Gagal memuat materi: ${error.message}</p>`;

      return;
    }

    if (!data || data.length === 0) {

      list.innerHTML =
        "<p>Belum ada materi.</p>";

      return;
    }

    list.innerHTML = "";

    data.forEach(material => {

      const premiumBadge =
        material.premium
          ? `<span class="badge premium">🔒 PREMIUM</span>`
          : `<span class="badge gratis">🟢 GRATIS</span>`;

      const typeBadge =
        `<span class="badge type">${material.tipe || "-"}</span>`;

      const item =
        document.createElement("div");

      item.className = "material";

      item.innerHTML = `

        <h4>
          ${escapeHTML(material.judul || "Tanpa Judul")}
        </h4>

        <div>
          ${premiumBadge}
          ${typeBadge}

          <span class="badge type">
            ${escapeHTML(material.kategori || "-")}
          </span>
        </div>

        <p>
          ${escapeHTML(material.deskripsi || "")}
        </p>

        <small>
          ${escapeHTML(material.url || "")}
        </small>

        <div class="actions">

          <button
            class="edit"
            onclick="editMateri(${material.id})"
          >
            ✏️ Edit
          </button>

          <button
            class="delete"
            onclick="hapusMateri(${material.id})"
          >
            🗑️ Hapus
          </button>

        </div>
      `;

      list.appendChild(item);

    });
  }


  // =====================================================
  // SIMPAN / UPDATE MATERI
  // =====================================================

  async function simpanMateri() {

    const judul =
      document.getElementById("judul").value.trim();

    const kategori =
      document.getElementById("kategori").value;

    const tipe =
      document.getElementById("tipe").value;

    const url =
      document.getElementById("url").value.trim();

    const thumbnail =
      document.getElementById("thumbnail").value.trim();

    const deskripsi =
      document.getElementById("deskripsi").value.trim();

    const premium =
      document.getElementById("premium").checked;


    if (!judul) {

      tampilkanPesan(
        "Judul materi wajib diisi.",
        true
      );

      return;
    }

    if (!url) {

      tampilkanPesan(
        "URL materi wajib diisi.",
        true
      );

      return;
    }


    const dataMateri = {

      judul,
      kategori,
      tipe,
      url,
      thumbnail,
      deskripsi,
      premium

    };


    let result;


    if (editId) {

      result =
        await supabaseClient
          .from("materials")
          .update(dataMateri)
          .eq("id", editId);

    } else {

      result =
        await supabaseClient
          .from("materials")
          .insert([dataMateri]);

    }


    if (result.error) {

      tampilkanPesan(
        "❌ Gagal: " + result.error.message,
        true
      );

      return;
    }


    tampilkanPesan(
      editId
        ? "✅ Materi berhasil diperbarui."
        : "✅ Materi berhasil ditambahkan.",
      false
    );


    bersihkanForm();

    await loadMateri();

  }


  // =====================================================
  // EDIT
  // =====================================================

  async function editMateri(id) {

    const { data, error } =
      await supabaseClient
        .from("materials")
        .select("*")
        .eq("id", id)
        .single();

    if (error) {

      alert(error.message);

      return;
    }


    editId = id;


    document.getElementById("judul").value =
      data.judul || "";

    document.getElementById("kategori").value =
      data.kategori || "Lainnya";

    document.getElementById("tipe").value =
      data.tipe || "video";

    document.getElementById("url").value =
      data.url || "";

    document.getElementById("thumbnail").value =
      data.thumbnail || "";

    document.getElementById("deskripsi").value =
      data.deskripsi || "";

    document.getElementById("premium").checked =
      data.premium === true;


    document.getElementById("formTitle").innerText =
      "✏️ Edit Materi";

    document.getElementById("cancelBtn").style.display =
      "block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  // =====================================================
  // HAPUS
  // =====================================================

  async function hapusMateri(id) {

    const yakin =
      confirm(
        "Yakin ingin menghapus materi ini?"
      );

    if (!yakin) return;


    const { error } =
      await supabaseClient
        .from("materials")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "❌ Gagal menghapus: " +
        error.message
      );

      return;
    }


    alert("✅ Materi berhasil dihapus.");

    await loadMateri();

  }


  // =====================================================
  // BATAL EDIT
  // =====================================================

  function batalEdit() {

    editId = null;

    bersihkanForm();

    document.getElementById("formTitle").innerText =
      "➕ Tambah Materi";

    document.getElementById("cancelBtn").style.display =
      "none";

  }


  // =====================================================
  // BERSIHKAN FORM
  // =====================================================

  function bersihkanForm() {

    editId = null;

    document.getElementById("judul").value = "";
    document.getElementById("url").value = "";
    document.getElementById("thumbnail").value = "";
    document.getElementById("deskripsi").value = "";
    document.getElementById("premium").checked = false;

  }


  // =====================================================
  // PESAN
  // =====================================================

  function tampilkanPesan(text, error) {

    const box =
      document.getElementById("message");

    box.style.display = "block";

    box.innerText = text;

    if (error) {

      box.style.background = "#fee2e2";
      box.style.color = "#991b1b";

    } else {

      box.style.background = "#dcfce7";
      box.style.color = "#166534";

    }


    setTimeout(() => {

      box.style.display = "none";

    }, 4000);

  }


  // =====================================================
  // ESCAPE HTML
  // =====================================================

  function escapeHTML(text) {

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // =====================================================
  // LOGOUT
  // =====================================================

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href = "login.html";

  }


  // =====================================================
  // MULAI
  // =====================================================

  async function mulai() {

    const isAdmin = await cekAdmin();

    if (!isAdmin) return;

    await loadMateri();

  }


  mulai();

</script>

</body>
  </html>
