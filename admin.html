<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NgajiPlus Admin - Kelola Materi Video</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f6;
      color: #202b27;
    }

    header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #008f5a;
      font-size: 20px;
      font-weight: bold;
    }

    .logout {
      border: none;
      background: #f1f1f1;
      padding: 9px 15px;
      border-radius: 8px;
      cursor: pointer;
    }

    .container {
      width: 95%;
      max-width: 900px;
      margin: 25px auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border: 1px solid #e4e4e4;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-top: 16px;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .premium-row {
      margin-top: 17px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .premium-row input {
      width: auto;
    }

    .btn {
      border: none;
      background: #008f5a;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 18px;
    }

    .btn:hover {
      background: #007849;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #e7f8ef;
      color: #08753f;
    }

    .error {
      background: #ffe8e8;
      color: #b42323;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    .material {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .material-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .material-description {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .material-info {
      font-size: 13px;
      color: #666;
      line-height: 1.7;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .free {
      background: #e5f8ed;
      color: #008f5a;
    }

    .premium {
      background: #fff0c7;
      color: #9a6900;
    }

    .actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .delete-btn {
      background: #ffe3e3;
      color: #c62828;
      border: none;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .youtube-btn {
      background: #eeeeee;
      color: #333;
      padding: 8px 12px;
      border-radius: 7px;
      text-decoration: none;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .access {
      text-align: center;
      background: #fff8df;
      color: #7a5c00;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {

      .container {
        width: 94%;
      }

      header {
        padding: 12px 15px;
      }

      .logo {
        font-size: 16px;
      }

      .card {
        padding: 16px;
      }

    }

  </style>
</head>


<body>

<header>

  <div class="logo">
    📖 NgajiPlus Admin
  </div>

  <button
    class="logout"
    onclick="logout()"
  >
    Keluar
  </button>

</header>


<div class="container">

  <h1>🎬 Kelola Materi Video</h1>

  <div class="subtitle">
    Tambahkan dan kelola materi video NgajiPlus Akademi.
  </div>


  <div
    id="accessMessage"
    class="access"
  >
    ⏳ Memeriksa akses admin...
  </div>


  <!-- TAMBAH MATERI -->

  <div class="card">

    <h2>
      ➕ Tambah Materi Video
    </h2>


    <form id="materialForm">

      <label>
        Judul Materi
      </label>

      <input
        type="text"
        id="judul"
        placeholder="Contoh: Belajar Fiqih Shalat"
        required
      >


      <label>
        Deskripsi
      </label>

      <textarea
        id="deskripsi"
        placeholder="Tuliskan deskripsi materi..."
      ></textarea>


      <label>
        Kategori
      </label>

      <select id="kategori">

        <option value="Al-Qur'an & Tahsin">
          Al-Qur'an & Tahsin
        </option>

        <option value="Fiqih">
          Fiqih
        </option>

        <option value="Aqidah">
          Aqidah
        </option>

        <option value="Akhlak & Adab">
          Akhlak & Adab
        </option>

        <option value="Bahasa Arab">
          Bahasa Arab
        </option>

        <option value="Hadits">
          Hadits
        </option>

        <option value="Sejarah Islam">
          Sejarah Islam
        </option>

        <option value="Pendidikan Anak">
          Pendidikan Anak
        </option>

        <option value="Lainnya">
          Lainnya
        </option>

      </select>


      <label>
        URL Video YouTube
      </label>

      <input
        type="url"
        id="url"
        placeholder="https://www.youtube.com/watch?v=..."
        required
      >


      <label>
        URL Thumbnail
      </label>

      <input
        type="url"
        id="thumbnail"
        placeholder="https://..."
      >


      <div class="premium-row">

        <input
          type="checkbox"
          id="premium"
        >

        <label
          for="premium"
          style="margin:0;font-weight:normal;"
        >
          🔐 Jadikan Materi Premium
        </label>

      </div>


      <button
        type="submit"
        class="btn"
        id="saveButton"
      >
        💾 Simpan Materi
      </button>


      <div
        id="formMessage"
        class="message"
      ></div>

    </form>

  </div>


  <!-- DAFTAR MATERI -->

  <div class="card">

    <h2>
      📚 Daftar Materi
    </h2>

    <div id="materialList">

      <div class="loading">
        ⏳ Memuat materi...
      </div>

    </div>

  </div>

</div>


<script>

  /* =====================================
     KONFIGURASI SUPABASE
  ===================================== */

  const SUPABASE_URL =
    "https://ksgywgdrfskqsufchbcm.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_HmFKwHMCISfN_YOoiLx3-A_MWnG9yG7";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* =====================================
     ELEMENT
  ===================================== */

  const materialList =
    document.getElementById("materialList");

  const materialForm =
    document.getElementById("materialForm");

  const formMessage =
    document.getElementById("formMessage");

  const accessMessage =
    document.getElementById("accessMessage");

  const saveButton =
    document.getElementById("saveButton");


  /* =====================================
     FORMAT URL YOUTUBE
  ===================================== */

  function youtubeUrl(url) {

    if (!url) {
      return "";
    }

    return url.trim();

  }


  /* =====================================
     TAMPILKAN PESAN
  ===================================== */

  function showMessage(
    message,
    type
  ) {

    formMessage.textContent =
      message;

    formMessage.className =
      "message " + type;

    formMessage.style.display =
      "block";

  }


  /* =====================================
     LOAD MATERI
     LANGSUNG DARI TABLE MATERIALS
  ===================================== */

  async function loadMaterials() {

    materialList.innerHTML =
      `
        <div class="loading">
          ⏳ Mengambil data dari Supabase...
        </div>
      `;


    try {

      const {
        data,
        error
      } =
      await supabaseClient

        .from("materials")

        .select(
          `
            id,
            judul,
            deskripsi,
            kategori,
            tipe,
            url,
            thumbnail,
            premium,
            created_at
          `
        )

        .order(
          "created_at",
          {
            ascending: false
          }
        );


      if (error) {

        console.error(
          "Supabase error:",
          error
        );

        throw error;

      }


      console.log(
        "Materi:",
        data
      );


      if (!data || data.length === 0) {

        materialList.innerHTML =
          `
            <div class="empty">
              📭 Belum ada materi.
            </div>
          `;

        return;

      }


      materialList.innerHTML =
        data
          .map(
            material =>
              createMaterialHTML(material)
          )
          .join("");


    } catch (error) {

      console.error(error);

      materialList.innerHTML =
        `
          <div class="message error"
               style="display:block">

            ❌ Gagal mengambil materi.

            <br><br>

            ${escapeHTML(
              error.message ||
              "Kesalahan tidak diketahui"
            )}

          </div>
        `;

    }

  }


  /* =====================================
     HTML MATERI
  ===================================== */

  function createMaterialHTML(material) {

    const isPremium =
      material.premium === true;


    const badge =
      isPremium

        ? `
          <span class="badge premium">
            🔐 Premium
          </span>
        `

        : `
          <span class="badge free">
            🟢 Gratis
          </span>
        `;


    const youtube =
      material.url
        ? `
          <a
            class="youtube-btn"
            href="${escapeAttribute(material.url)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ▶️ Buka YouTube
          </a>
        `
        : "";


    return `

      <div class="material">

        <div class="material-title">

          ${escapeHTML(
            material.judul || "Tanpa judul"
          )}

        </div>


        <div class="material-description">

          ${escapeHTML(
            material.deskripsi || ""
          )}

        </div>


        <div class="material-info">

          📂 Kategori:
          <b>
            ${escapeHTML(
              material.kategori || "-"
            )}
          </b>

          <br>

          🎬 Tipe:
          <b>
            ${escapeHTML(
              material.tipe || "video"
            )}
          </b>

          <br>

          ${badge}

        </div>


        <div class="actions">

          ${youtube}

          <button
            class="delete-btn"
            onclick="deleteMaterial(${material.id})"
          >
            🗑️ Hapus
          </button>

        </div>

      </div>

    `;

  }


  /* =====================================
     TAMBAH MATERI
  ===================================== */

  materialForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      saveButton.disabled =
        true;

      saveButton.textContent =
        "⏳ Menyimpan...";


      formMessage.style.display =
        "none";


      const judul =
        document
          .getElementById("judul")
          .value
          .trim();


      const deskripsi =
        document
          .getElementById("deskripsi")
          .value
          .trim();


      const kategori =
        document
          .getElementById("kategori")
          .value;


      const url =
        document
          .getElementById("url")
          .value
          .trim();


      const thumbnail =
        document
          .getElementById("thumbnail")
          .value
          .trim();


      const premium =
        document
          .getElementById("premium")
          .checked;


      try {

        const {
          data,
          error
        } =
        await supabaseClient

          .from("materials")

          .insert({

            judul:
              judul,

            deskripsi:
              deskripsi,

            kategori:
              kategori,

            tipe:
              "video",

            url:
              youtubeUrl(url),

            thumbnail:
              thumbnail || null,

            premium:
              premium

          })

          .select();


        if (error) {

          console.error(
            error
          );

          throw error;

        }


        console.log(
          "Berhasil:",
          data
        );


        showMessage(
          "✅ Materi berhasil disimpan!",
          "success"
        );


        materialForm.reset();


        await loadMaterials();


      } catch (error) {

        console.error(
          error
        );


        showMessage(
          "❌ Gagal menyimpan: " +
          (
            error.message ||
            "Kesalahan tidak diketahui"
          ),
          "error"
        );

      }


      saveButton.disabled =
        false;

      saveButton.textContent =
        "💾 Simpan Materi";

    }
  );


  /* =====================================
     HAPUS MATERI
  ===================================== */

  async function deleteMaterial(id) {

    const yakin =
      confirm(
        "Yakin ingin menghapus materi ini?"
      );


    if (!yakin) {
      return;
    }


    try {

      const {
        error
      } =
      await supabaseClient

        .from("materials")

        .delete()

        .eq(
          "id",
          id
        );


      if (error) {

        throw error;

      }


      alert(
        "✅ Materi berhasil dihapus."
      );


      await loadMaterials();


    } catch (error) {

      console.error(
        error
      );


      alert(
        "❌ Gagal menghapus: " +
        error.message
      );

    }

  }


  /* =====================================
     ESCAPE HTML
  ===================================== */

  function escapeHTML(value) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }


    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  function escapeAttribute(value) {

    return escapeHTML(value);

  }


  /* =====================================
     LOGOUT
  ===================================== */

  async function logout() {

    await supabaseClient
      .auth
      .signOut();


    window.location.href =
      "index.html";

  }


  /* =====================================
     CEK LOGIN
  ===================================== */

  async function checkLogin() {

    try {

      const {
        data
      } =
      await supabaseClient
        .auth
        .getSession();


      if (
        !data ||
        !data.session
      ) {

        accessMessage.innerHTML =
          "⚠️ Anda belum login.";

        materialForm.style.display =
          "none";

        return;

      }


      accessMessage.innerHTML =
        "✅ Login berhasil. Mengambil data materi...";


      /*
        Untuk sementara kita tidak menggunakan
        get_material_catalog atau
        get_available_materials.

        Data diambil langsung dari:
        public.materials
      */


      await loadMaterials();


      accessMessage.style.display =
        "none";


    } catch (error) {

      console.error(
        error
      );


      accessMessage.innerHTML =
        "❌ Gagal memeriksa login.";

    }

  }


  /* =====================================
     JALANKAN
  ===================================== */

  checkLogin();

</script>

</body>

        </html>
