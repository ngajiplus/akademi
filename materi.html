    /* ==============================

<script>


// ==================================================
// VARIABEL
// ==================================================

let allMaterials = [];

let availableMaterials = [];

let currentSession = null;

let isMember = false;



// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



// ==================================================
// CEK SESSION
// ==================================================

async function getSession() {

  const {
    data,
    error
  } =
  await supabaseClient.auth
    .getSession();


  if (error) {

    console.error(
      "SESSION ERROR:",
      error
    );

  }


  return data.session;

}



// ==================================================
// CEK MEMBERSHIP
// ==================================================

async function checkMembership(
  session
) {

  if (!session) {

    return false;

  }


  const {
    data: profile,
    error
  } =
  await supabaseClient

    .from("profiles")

    .select(
      "status, berlaku_sampai"
    )

    .eq(
      "id",
      session.user.id
    )

    .single();


  if (error) {

    console.error(
      "PROFILE ERROR:",
      error
    );

    return false;

  }


  if (!profile) {

    return false;

  }


  const status =
    String(
      profile.status || ""
    )
    .toLowerCase()
    .trim();


  if (
    status !== "aktif"
  ) {

    return false;

  }


  // Jika tidak ada tanggal
  // berarti tidak dibatasi tanggal

  if (
    profile.berlaku_sampai
  ) {

    const expiry =
      new Date(
        profile.berlaku_sampai
      );


    if (
      expiry <= new Date()
    ) {

      return false;

    }

  }


  return true;

}



// ==================================================
// UPDATE STATUS
// ==================================================

function updateStatus() {

  const box =
    document.getElementById(
      "statusBox"
    );


  if (!currentSession) {

    box.className =
      "status-free";


    box.innerHTML = `

      🔐 Anda belum login.
      Materi gratis dapat dipelajari.
      Materi premium membutuhkan membership.

    `;

    return;

  }


  if (isMember) {

    box.className =
      "status-member";


    box.innerHTML = `

      👑 <strong>Membership Aktif</strong>
      — Anda dapat mengakses materi premium.

    `;

  }
  else {

    box.className =
      "status-free";


    box.innerHTML = `

      🟢 <strong>Akses Gratis</strong>
      — Upgrade membership untuk membuka materi premium.

    `;

  }

}



// ==================================================
// AMBIL KATALOG
// ==================================================

async function loadCatalog() {


  const container =
    document.getElementById(
      "materialsContainer"
    );


  container.innerHTML = `

    <div class="loading">

      ⏳ Mengambil data dari Supabase...

    </div>

  `;


  try {


    // ----------------------------------------------
    // CEK LOGIN
    // ----------------------------------------------

    currentSession =
      await getSession();


    // ----------------------------------------------
    // CEK MEMBER
    // ----------------------------------------------

    isMember =
      await checkMembership(
        currentSession
      );


    updateStatus();


    // ----------------------------------------------
    // AMBIL KATALOG PUBLIK
    // ----------------------------------------------

    const {
      data: catalog,
      error: catalogError
    } =
    await supabaseClient.rpc(
      "get_material_catalog"
    );


    if (catalogError) {

      throw catalogError;

    }


    allMaterials =
      catalog || [];


    // ----------------------------------------------
    // AMBIL MATERIAL YANG BOLEH DIAKSES
    // ----------------------------------------------

    availableMaterials = [];


    if (isMember) {


      const {
        data: available,
        error: availableError
      } =
      await supabaseClient.rpc(
        "get_available_materials"
      );


      if (availableError) {

        console.error(
          "AVAILABLE ERROR:",
          availableError
        );

      }
      else {

        availableMaterials =
          available || [];

      }

    }


    // ----------------------------------------------
    // TAMPILKAN
    // ----------------------------------------------

    displayMaterials(
      allMaterials
    );


  }
  catch (error) {


    console.error(
      "LOAD ERROR:",
      error
    );


    container.innerHTML = `

      <div class="error">

        ❌ Gagal mengambil materi.

        <br><br>

        ${escapeHtml(
          error.message ||
          "Terjadi kesalahan."
        )}

      </div>

    `;

  }

}



// ==================================================
// CEK AKSES MATERI
// ==================================================

function canAccessMaterial(
  material
) {


  // GRATIS

  if (
    material.premium !== true
  ) {

    return true;

  }


  // PREMIUM

  if (!isMember) {

    return false;

  }


  return availableMaterials.some(
    item =>
      String(item.id) ===
      String(material.id)
  );

}



// ==================================================
// AMBIL URL
// ==================================================

function getMaterialUrl(
  material
) {


  // -----------------------------------------------
  // MATERIAL GRATIS
  // -----------------------------------------------

  if (
    material.premium !== true
  ) {

    return material.url || "";

  }


  // -----------------------------------------------
  // MATERIAL PREMIUM
  // URL DIAMBIL DARI RPC
  // -----------------------------------------------

  if (!isMember) {

    return "";

  }


  const found =
    availableMaterials.find(
      item =>
        String(item.id) ===
        String(material.id)
    );


  if (!found) {

    return "";

  }


  return found.url || "";

}



// ==================================================
// TAMPILKAN MATERIAL
// ==================================================

function displayMaterials(
  materials
) {


  const container =
    document.getElementById(
      "materialsContainer"
    );


  if (!materials.length) {

    container.innerHTML = `

      <div class="empty">

        📚 Belum ada materi.

      </div>

    `;

    return;

  }


  container.innerHTML =

    materials

      .map(
        material => {


          const premium =
            material.premium === true;


          const accessible =
            canAccessMaterial(
              material
            );


          const materialUrl =
            getMaterialUrl(
              material
            );


          // ========================================
          // THUMBNAIL
          // ========================================

          let thumbnail;


          if (
            material.thumbnail
          ) {

            thumbnail = `

              <img

                src="${escapeHtml(
                  material.thumbnail
                )}"

                alt="${escapeHtml(
                  material.judul ||
                  "Materi"
                )}"

              >

            `;

          }
          else {

            thumbnail =
              premium
                ? "🔒"
                : "🎥";

          }



          // ========================================
          // BUTTON
          // ========================================

          let button;


          // PREMIUM TIDAK BOLEH DIAKSES

          if (
            premium &&
            !accessible
          ) {

            button = `

              <a

                href="login.html"

                class="
                  material-button
                  premium-button
                "

              >

                🔐 Login / Upgrade

              </a>

            `;

          }


          // BOLEH DIAKSES + ADA URL

          else if (
            accessible &&
            materialUrl
          ) {

            button = `

              <a

                href="${escapeHtml(
                  materialUrl
                )}"

                target="_blank"

                rel="noopener noreferrer"

                class="material-button"

              >

                ▶️ Mulai Belajar

              </a>

            `;

          }


          // BOLEH DIAKSES TAPI URL KOSONG

          else {

            button = `

              <div

                class="material-button"

                style="
                  background:#ddd;
                  color:#555;
                "

              >

                ⚠️ Link belum tersedia

              </div>

            `;

          }



          // ========================================
          // LABEL
          // ========================================

          let label;


          if (premium) {

            label = `

              <div class="premium-label">

                🔐 Materi Premium

              </div>

            `;

          }
          else {

            label = `

              <div class="free-label">

                🟢 Materi Gratis
