<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="Materi pembelajaran NgajiPlus Akademi"
>

<meta
    name="theme-color"
    content="#009b59"
>

<title>Materi - NgajiPlus Akademi</title>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
}


html{
    scroll-behavior:smooth;
}


body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5faf7;
    color:#1f2933;
}


a{
    text-decoration:none;
    color:inherit;
}


button{
    font-family:inherit;
}


/* =====================================================
   HEADER
===================================================== */

header{
    background:white;
    border-bottom:1px solid #e5ebe7;
    position:sticky;
    top:0;
    z-index:1000;
}


.nav{
    max-width:1200px;
    margin:auto;
    padding:10px 18px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}


.logo{
    color:#008f55;
    font-weight:bold;
    font-size:14px;
}


.dashboard-btn{
    background:#009b59;
    color:white;

    border:0;
    border-radius:8px;

    padding:8px 13px;

    font-size:11px;
    font-weight:bold;
}


/* =====================================================
   MAIN
===================================================== */

main{
    max-width:1200px;
    margin:auto;

    padding:25px 20px 60px;
}


/* =====================================================
   BACK BUTTON
===================================================== */

.back{
    display:inline-block;

    margin-bottom:15px;

    color:#008f55;

    font-size:11px;
    font-weight:bold;
}


.back:hover{
    text-decoration:underline;
}


/* =====================================================
   MATERIAL BOX
===================================================== */

.material-box{
    background:white;

    border:1px solid #e1e9e4;

    border-radius:14px;

    padding:20px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.04);
}


/* =====================================================
   CATEGORY
===================================================== */

.category{
    display:inline-block;

    background:#edf8f2;
    color:#008f55;

    padding:5px 9px;

    border-radius:20px;

    font-size:10px;
    font-weight:bold;

    margin-bottom:8px;
}


/* =====================================================
   TITLE
===================================================== */

.title{
    margin:0 0 7px;

    font-size:25px;

    color:#1f2933;
}


.description{
    margin:0 0 20px;

    color:#7a8580;

    font-size:12px;
}


/* =====================================================
   PLAYER
===================================================== */

.player-wrapper{
    width:100%;

    background:#111;

    border-radius:12px;

    overflow:hidden;

    position:relative;

    margin-bottom:18px;
}


.video-frame{
    width:100%;

    aspect-ratio:16/9;

    display:block;

    border:0;
}


.audio-player{
    width:100%;

    padding:35px 20px;

    background:#eef9f3;
}


.audio-player audio{
    width:100%;
}


/* =====================================================
   PDF
===================================================== */

.pdf-frame{
    width:100%;

    height:700px;

    border:0;

    background:white;
}


/* =====================================================
   THUMBNAIL
===================================================== */

.thumbnail{
    width:100%;

    max-height:600px;

    object-fit:contain;

    display:block;

    background:#d9f5e6;
}


/* =====================================================
   INFO
===================================================== */

.info{
    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-bottom:18px;
}


.info-badge{
    padding:5px 9px;

    border-radius:20px;

    font-size:10px;

    background:#f0f5f2;

    color:#64716b;
}


.info-free{
    background:#dcf8e7;
    color:#087b45;
}


.info-premium{
    background:#fff0b7;
    color:#8b6900;
}


/* =====================================================
   BUTTON
===================================================== */

.open-source{
    display:inline-block;

    background:#009b59;
    color:white;

    border:0;

    border-radius:8px;

    padding:10px 15px;

    font-size:11px;

    font-weight:bold;

    cursor:pointer;
}


.open-source:hover{
    background:#00834b;
}


/* =====================================================
   LOADING
===================================================== */

.loading{
    background:white;

    border-radius:14px;

    padding:50px 20px;

    text-align:center;

    color:#777;

    font-size:13px;
}


/* =====================================================
   ERROR
===================================================== */

.error{
    background:white;

    border:1px solid #f1c4c0;

    border-radius:14px;

    padding:30px 20px;

    text-align:center;

    color:#b42318;

    font-size:13px;
}


/* =====================================================
   LOCK
===================================================== */

.lock-box{
    text-align:center;

    background:#fff8d9;

    border:1px solid #f0df91;

    border-radius:12px;

    padding:35px 20px;

    margin-bottom:20px;
}


.lock-icon{
    font-size:45px;

    margin-bottom:10px;
}


.lock-title{
    font-size:18px;

    font-weight:bold;

    margin-bottom:7px;
}


.lock-text{
    color:#75621c;

    font-size:12px;

    margin-bottom:18px;
}


.login-link{
    display:inline-block;

    background:#009b59;

    color:white;

    padding:10px 16px;

    border-radius:8px;

    font-size:11px;

    font-weight:bold;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    background:#0c1711;

    color:white;

    padding:30px 20px;
}


.footer-inner{
    max-width:1200px;

    margin:auto;
}


.footer-logo{
    color:#55c990;

    font-weight:bold;

    font-size:13px;

    margin-bottom:5px;
}


.footer-text{
    color:#91a098;

    font-size:10px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    main{
        padding:
            20px
            15px
            45px;
    }


    .material-box{
        padding:15px;

        border-radius:12px;
    }


    .title{
        font-size:21px;
    }


    .description{
        font-size:11px;
    }


    .pdf-frame{
        height:600px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

<div class="nav">

<div class="logo">
📖 NgajiPlus Akademi
</div>


<a
    href="dashboard.html"
    class="dashboard-btn"
>
📊 Dashboard
</a>

</div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main>


<a
    href="akademi.html"
    class="back"
>
← Kembali ke Akademi
</a>


<div id="content">

<div class="loading">
⏳ Memuat materi...
</div>

</div>


</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

<div class="footer-inner">

<div class="footer-logo">
📖 NgajiPlus Akademi
</div>


<div class="footer-text">
Platform pembelajaran Islam berupa Video, Audio dan PDF.
</div>

</div>

</footer>



<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ksgywgdrfskqsufchbcm.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_HmFKwHMCISfN_YOoiLx3-A_MWnG9yG7";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =====================================================
   ELEMENT
===================================================== */

const content =
document.getElementById("content");


/* =====================================================
   GET ID DARI URL
===================================================== */

const params =
new URLSearchParams(
    window.location.search
);


const materialId =
params.get("id");


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function escapeAttribute(value){

    return escapeHTML(value);

}


/* =====================================================
   YOUTUBE ID
===================================================== */

function getYouTubeId(url){

    if(!url){
        return null;
    }


    try{

        const parsed =
            new URL(url);


        /* youtube.com/watch?v= */

        if(
            parsed.hostname.includes("youtube.com") &&
            parsed.searchParams.get("v")
        ){

            return parsed.searchParams.get("v");

        }


        /* youtube.com/live/ID */

        const liveMatch =
            parsed.pathname.match(
                /\/live\/([^/?]+)/
            );


        if(liveMatch){

            return liveMatch[1];

        }


        /* youtube.com/shorts/ID */

        const shortsMatch =
            parsed.pathname.match(
                /\/shorts\/([^/?]+)/
            );


        if(shortsMatch){

            return shortsMatch[1];

        }


        /* youtu.be/ID */

        if(
            parsed.hostname === "youtu.be"
        ){

            return parsed.pathname
                .replace("/","")
                .split("?")[0];

        }


    }catch(error){

        console.error(
            "URL ERROR:",
            error
        );

    }


    return null;

}


/* =====================================================
   YOUTUBE PLAYER
===================================================== */

function youtubePlayer(url){

    const youtubeId =
        getYouTubeId(url);


    if(!youtubeId){

        return `
            <div class="error">
                ❌ URL YouTube tidak valid.
            </div>
        `;

    }


    return `
        <div class="player-wrapper">

            <iframe
                class="video-frame"
                src="https://www.youtube.com/embed/${encodeURIComponent(youtubeId)}"
                title="Video Pembelajaran"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>

        </div>
    `;

}


/* =====================================================
   AUDIO PLAYER
===================================================== */

function audioPlayer(url){

    return `
        <div class="player-wrapper">

            <div class="audio-player">

                <audio
                    controls
                    preload="metadata"
                >

                    <source
                        src="${escapeAttribute(url)}"
                    >

                    Browser Anda tidak mendukung audio.

                </audio>

            </div>

        </div>
    `;

}


/* =====================================================
   PDF PLAYER
===================================================== */

function pdfPlayer(url){

    return `
        <div class="player-wrapper">

            <iframe
                class="pdf-frame"
                src="${escapeAttribute(url)}"
                title="PDF Pembelajaran">
            </iframe>

        </div>
    `;

}


/* =====================================================
   VIDEO / AUDIO / PDF
===================================================== */

function renderPlayer(item){

    const type =
        String(item.tipe || "")
            .toLowerCase()
            .trim();


    if(type === "video"){

        return youtubePlayer(
            item.url
        );

    }


    if(type === "audio"){

        return audioPlayer(
            item.url
        );

    }


    if(type === "pdf"){

        return pdfPlayer(
            item.url
        );

    }


    /* DEFAULT */

    return `
        <div class="error">

            ⚠️ Tipe materi tidak dikenali.

            <br><br>

            <a
                href="${escapeAttribute(item.url)}"
                target="_blank"
                rel="noopener noreferrer"
                class="open-source"
            >
                🔗 Buka Materi
            </a>

        </div>
    `;

}


/* =====================================================
   CEK MEMBERSHIP
===================================================== */

async function checkMembership(user){

    if(!user){

        return false;

    }


    const {
        data: profile,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select(
            "id,nama,status,paket,berlaku_sampai"
        )
        .eq(
            "id",
            user.id
        )
        .maybeSingle();


    if(error){

        console.error(
            "PROFILE ERROR:",
            error
        );

        return false;

    }


    if(!profile){

        return false;

    }


    const statusAktif =
        String(
            profile.status || ""
        )
        .toLowerCase()
        .trim()
        === "aktif";


    let tanggalAktif = false;


    if(profile.berlaku_sampai){

        const tanggal =
            new Date(
                profile.berlaku_sampai
            );


        const sekarang =
            new Date();


        tanggalAktif =
            tanggal >= sekarang;

    }


    return (
        statusAktif &&
        tanggalAktif
    );

}


/* =====================================================
   LOAD MATERIAL
===================================================== */

async function loadMaterial(){

    if(!materialId){

        content.innerHTML = `
            <div class="error">

                ❌ ID materi tidak ditemukan.

                <br><br>

                <a
                    href="akademi.html"
                    class="open-source"
                >
                    ← Kembali ke Akademi
                </a>

            </div>
        `;

        return;

    }


    /* ================================================
       AMBIL USER
    ================================================ */

    const {
        data: {
            user
        }
    } =
    await supabaseClient.auth.getUser();


    /* ================================================
       AMBIL MATERIAL
    ================================================ */

    const {
        data: item,
        error
    } =
    await supabaseClient
        .from("materials")
        .select(`
            id,
            judul,
            kategori,
            tipe,
            url,
            thumbnail,
            premium
        `)
        .eq(
            "id",
            materialId
        )
        .maybeSingle();


    if(error){

        console.error(
            "MATERIAL ERROR:",
            error
        );


        content.innerHTML = `
            <div class="error">

                ❌ Gagal mengambil materi.

                <br><br>

                ${escapeHTML(error.message)}

            </div>
        `;

        return;

    }


    /* ================================================
       MATERI TIDAK ADA
    ================================================ */

    if(!item){

        content.innerHTML = `
            <div class="error">

                ❌ Materi tidak ditemukan.

                <br><br>

                <a
                    href="akademi.html"
                    class="open-source"
                >
                    ← Kembali ke Akademi
                </a>

            </div>
        `;

        return;

    }


    /* ================================================
       CEK PREMIUM
    ================================================ */

    let membershipActive = false;


    if(user){

        membershipActive =
            await checkMembership(user);

    }


    /* ================================================
       JIKA PREMIUM DAN BELUM MEMBER
    ================================================ */

    if(
        item.premium === true &&
        !membershipActive
    ){

        content.innerHTML = `

            <div class="material-box">

                <span class="category">
                    📚 ${escapeHTML(item.kategori || "Materi")}
                </span>


                <h1 class="title">
                    ${escapeHTML(item.judul || "Materi")}
                </h1>


                <p class="description">
                    Materi ini khusus untuk member premium.
                </p>


                <div class="lock-box">

                    <div class="lock-icon">
                        🔐
                    </div>


                    <div class="lock-title">
                        Membership Diperlukan
                    </div>


                    <div class="lock-text">

                        Silakan login dan pastikan
                        membership Anda masih aktif
                        untuk mengakses materi ini.

                    </div>


                    ${
                        user
                        ?
                        `
                        <a
                            href="dashboard.html"
                            class="login-link"
                        >
                            📊 Cek Membership
                        </a>
                        `
                        :
                        `
                        <a
                            href="login.html"
                            class="login-link"
                        >
                            🔐 Login
                        </a>
                        `
                    }

                </div>


                <a
                    href="akademi.html"
                    class="open-source"
                >
                    ← Kembali ke Akademi
                </a>

            </div>

        `;

        return;

    }


    /* ================================================
       MATERI BOLEH DIAKSES
    ================================================ */

    let playerHTML =
        renderPlayer(item);


    /* ================================================
       THUMBNAIL UNTUK NON VIDEO
    ================================================ */

    let thumbnailHTML = "";


    if(
        item.thumbnail &&
        String(item.tipe || "")
            .toLowerCase()
            !== "video"
    ){

        thumbnailHTML = `

            <img
                class="thumbnail"
                src="${escapeAttribute(item.thumbnail)}"
                alt="${escapeAttribute(item.judul || "Materi")}"
                onerror="this.style.display='none'"
            >

        `;

    }


    /* ================================================
       TAMPILKAN
    ================================================ */

    content.innerHTML = `

        <div class="material-box">


            <span class="category">

                📚 ${escapeHTML(
                    item.kategori || "Materi"
                )}

            </span>


            <h1 class="title">

                ${escapeHTML(
                    item.judul || "Tanpa Judul"
                )}

            </h1>


            <p class="description">

                Materi pembelajaran
                ${escapeHTML(
                    item.judul || ""
                )}

            </p>


            <div class="info">

                <span class="info-badge">

                    ${
                        String(item.tipe || "")
                            .toLowerCase()
                            === "video"
                        ? "🎥 Video"
                        :
                        String(item.tipe || "")
                            .toLowerCase()
                            === "audio"
                        ? "🎧 Audio"
                        :
                        String(item.tipe || "")
                            .toLowerCase()
                            === "pdf"
                        ? "📄 PDF"
                        :
                        "📚 Materi"
                    }

                </span>


                ${
                    item.premium === true
                    ?
                    `
                    <span
                        class="info-badge info-premium"
                    >
                        🔐 Premium
                    </span>
                    `
                    :
                    `
                    <span
                        class="info-badge info-free"
                    >
                        ✓ Gratis
                    </span>
                    `
                }

            </div>


            ${thumbnailHTML}


            ${playerHTML}


            <a
                href="akademi.html"
                class="open-source"
            >
                ← Kembali ke Akademi
            </a>


        </div>

    `;


    /* ================================================
       TITLE BROWSER
    ================================================ */

    document.title =
        item.judul +
        " - NgajiPlus Akademi";

}


/* =====================================================
   JALANKAN
===================================================== */

loadMaterial();


/* =====================================================
   AUTH CHANGE
===================================================== */

supabaseClient.auth.onAuthStateChange(
    async (
        event,
        session
    ) => {

        if(
            event === "SIGNED_IN" ||
            event === "SIGNED_OUT" ||
            event === "TOKEN_REFRESHED"
        ){

            await loadMaterial();

        }

    }
);

</script>


</body>

</html>
