<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Video Pembelajaran - NgajiPlus</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f8f7;
  color:#202a24;
}

a{
  text-decoration:none;
}

header{
  background:white;
  border-bottom:1px solid #e5e9e6;
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#238b57;
  font-weight:bold;
  font-size:21px;
}

nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

nav a{
  color:#555;
  padding:8px 12px;
  border-radius:8px;
  font-size:14px;
}

nav a:hover{
  background:#eef7f1;
  color:#238b57;
}

main{
  max-width:1100px;
  margin:auto;
  padding:40px 20px;
}

.page-title{
  text-align:center;
  margin-bottom:30px;
}

.page-title h1{
  margin:0 0 8px;
  font-size:34px;
}

.page-title p{
  margin:0;
  color:#737b76;
}

#statusBox{
  background:white;
  border:1px solid #e5e9e6;
  border-radius:14px;
  padding:14px;
  text-align:center;
  margin-bottom:20px;
  color:#555;
}

.status-member{
  background:#eaf8ef !important;
  color:#16834d !important;
}

.status-free{
  background:#fff8e8 !important;
  color:#946200 !important;
}

.filter-box{
  background:white;
  padding:18px;
  border-radius:15px;
  border:1px solid #e5e9e6;
  margin-bottom:25px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.filter-box input,
.filter-box select{
  padding:12px;
  border:1px solid #ddd;
  border-radius:9px;
  background:white;
  font-size:14px;
}

.filter-box input{
  flex:1;
  min-width:200px;
}

#materialsContainer{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.material-card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  border:1px solid #e3e8e5;
}

.material-card.premium{
  background:#202a24;
  color:white;
}

.thumbnail{
  height:170px;
  background:#e5f2e9;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
  overflow:hidden;
}

.premium .thumbnail{
  background:#35463c;
}

.thumbnail img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.material-body{
  padding:20px;
}

.material-type{
  display:inline-block;
  padding:5px 9px;
  border-radius:50px;
  background:#eef7f1;
  color:#238b57;
  font-size:11px;
  font-weight:bold;
  margin-bottom:10px;
}

.premium .material-type{
  background:#35463c;
  color:#b9e4c8;
}

.material-body h3{
  margin:0 0 8px;
  font-size:18px;
}

.material-description{
  color:#737b76;
  font-size:14px;
  line-height:1.6;
  min-height:45px;
}

.premium .material-description{
  color:#c6cec9;
}

.free-label{
  margin-top:10px;
  font-size:12px;
  color:#238b57;
}

.premium-label{
  margin-top:10px;
  font-size:12px;
  color:#b9e4c8;
}

.material-button{
  display:block;
  text-align:center;
  margin-top:15px;
  padding:11px;
  border-radius:9px;
  background:#238b57;
  color:white;
  font-weight:bold;
  font-size:14px;
  border:0;
  width:100%;
  cursor:pointer;
}

.premium-button{
  background:white;
  color:#202a24;
}

.loading{
  grid-column:1/-1;
  background:white;
  padding:50px;
  text-align:center;
  border-radius:15px;
  color:#777;
}

.error{
  grid-column:1/-1;
  background:#fff1f1;
  color:#b42318;
  padding:20px;
  border-radius:12px;
  text-align:center;
}

.empty{
  grid-column:1/-1;
  background:white;
  padding:50px;
  text-align:center;
  border-radius:15px;
  color:#777;
}

@media(max-width:800px){

  #materialsContainer{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:550px){

  .header-inner{
    flex-direction:column;
    gap:10px;
  }

  nav{
    width:100%;
    justify-content:center;
  }

  main{
    padding:30px 15px;
  }

  #materialsContainer{
    grid-template-columns:1fr;
  }

  .page-title h1{
    font-size:28px;
  }

}

</style>

</head>


<body>


<header>

<div class="header-inner">

<a
  href="index.html"
  class="logo"
>
📖 NgajiPlus
</a>

<nav>

<a href="index.html">
Beranda
</a>

<a href="materi.html">
Video
</a>

<a href="audio.html">
Audio
</a>

<a href="pdf.html">
PDF
</a>

<a href="dashboard.html">
Dashboard
</a>

</nav>

</div>

</header>


<main>


<div class="page-title">

<h1>
🎥 Video Pembelajaran
</h1>

<p>
Temukan berbagai materi pembelajaran
yang tersedia di NgajiPlus.
</p>

</div>


<div id="statusBox">

⏳ Memeriksa akses...

</div>


<div class="filter-box">

<input
  type="search"
  id="searchInput"
  placeholder="🔎 Cari materi..."
>

<select id="categoryFilter">

<option value="">
Semua Kategori
</option>

<option value="Al-Qur'an & Tahsin">
Al-Qur'an & Tahsin
</option>

<option value="Fiqih">
Fiqih
</option>

<option value="Aqidah">
Aqidah
</option>

<option value="Akhlak & Adab">
Akhlak & Adab
</option>

<option value="Bahasa Arab">
Bahasa Arab
</option>

<option value="Hadits">
Hadits
</option>

<option value="Tafsir">
Tafsir
</option>

<option value="Sejarah Islam">
Sejarah Islam
</option>

</select>

</div>


<div id="materialsContainer">

<div class="loading">
⏳ Memuat materi...
</div>

</div>


</main>


<script>


// ======================================================
// VARIABEL
// ======================================================

let allMaterials = [];

let availableMaterials = [];

let currentSession = null;

let isMember = false;


// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


// ======================================================
// CEK LOGIN
// ======================================================

async function checkLogin(){

  try{

    const result =
      await supabaseClient.auth.getSession();

    if(result.error){

      console.error(
        "SESSION ERROR:",
        result.error
      );

      return null;

    }

    return result.data.session || null;

  }

  catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );

    return null;

  }

}


// ======================================================
// CEK MEMBER
// ======================================================

async function checkMembership(session){

  if(!session){

    return false;

  }


  try{

    const result =
      await supabaseClient

        .from("profiles")

        .select(
          "status, berlaku_sampai, paket"
        )

        .eq(
          "id",
          session.user.id
        )

        .maybeSingle();


    if(result.error){

      console.error(
        "PROFILE ERROR:",
        result.error
      );

      return false;

    }


    const profile =
      result.data;


    if(!profile){

      return false;

    }


    const status =
      String(
        profile.status || ""
      )
      .toLowerCase()
      .trim();


    if(status !== "aktif"){

      return false;

    }


    // Jika tanggal berlaku_sampai ada,
    // pastikan belum expired.

    if(profile.berlaku_sampai){

      const expired =
        new Date(
          profile.berlaku_sampai
        ) <= new Date();


      if(expired){

        return false;

      }

    }


    return true;

  }

  catch(error){

    console.error(
      "MEMBERSHIP ERROR:",
      error
    );

    return false;

  }

}


// ======================================================
// AMBIL KATALOG SEMUA MATERI
// ======================================================

async function loadCatalog(){

  console.log(
    "Mengambil katalog materi..."
  );


  const result =
    await supabaseClient.rpc(
      "get_material_catalog"
    );


  if(result.error){

    console.error(
      "CATALOG ERROR:",
      result.error
    );

    throw result.error;

  }


  console.log(
    "CATALOG:",
    result.data
  );


  return result.data || [];

}


// ======================================================
// AMBIL MATERI YANG BOLEH DIAKSES MEMBER
// ======================================================

async function loadAvailableMaterials(){

  try{

    const result =
      await supabaseClient.rpc(
        "get_available_materials"
      );


    if(result.error){

      console.error(
        "AVAILABLE ERROR:",
        result.error
      );

      return [];

    }


    console.log(
      "AVAILABLE:",
      result.data
    );


    return result.data || [];

  }

  catch(error){

    console.error(
      "AVAILABLE ERROR:",
      error
    );

    return [];

  }

}


// ======================================================
// AMBIL URL MATERI
// ======================================================

function getMaterialUrl(material){

  // MATERI GRATIS

  if(
    material.premium !== true
  ){

    return material.url || "";

  }


  // PREMIUM TAPI BUKAN MEMBER

  if(!isMember){

    return "";

  }


  // CARI DATA YANG BOLEH DIAKSES

  const found =
    availableMaterials.find(
      item =>
        String(item.id) ===
        String(material.id)
    );


  if(!found){

    return "";

  }


  return found.url || "";

}


// ======================================================
// CEK BOLEH AKSES
// ======================================================

function canAccess(material){

  // GRATIS

  if(
    material.premium !== true
  ){

    return true;

  }


  // PREMIUM

  if(!isMember){

    return false;

  }


  return availableMaterials.some(
    item =>
      String(item.id) ===
      String(material.id)
  );

}


// ======================================================
// TAMPILKAN MATERI
// ======================================================

function displayMaterials(materials){

  const container =
    document.getElementById(
      "materialsContainer"
    );


  if(!materials.length){

    container.innerHTML = `

      <div class="empty">

        📚 Belum ada materi.

      </div>

    `;

    return;

  }


  container.innerHTML =

    materials.map(
      material => {


        const premium =
          material.premium === true;


        const accessible =
          canAccess(
            material
          );


        const url =
          getMaterialUrl(
            material
          );


        // ==========================================
        // THUMBNAIL
        // ==========================================

        let thumbnail;


        if(material.thumbnail){

          thumbnail = `

            <img
              src="${escapeHtml(
                material.thumbnail
              )}"
              alt="${escapeHtml(
                material.judul
              )}"
              loading="lazy"
            >

          `;

        }

        else{

          thumbnail =
            premium
            ? "🔒"
            : "🎥";

        }


        // ==========================================
        // LABEL
        // ==========================================

        const label =

          premium

          ?

          `

            <div class="premium-label">

              🔐 Materi Premium

            </div>

          `

          :

          `

            <div class="free-label">

              🟢 Materi Gratis

            </div>

          `;


        // ==========================================
        // BUTTON
        // ==========================================

        let button;


        // PREMIUM BELUM BISA DIAKSES

        if(
          premium &&
          !accessible
        ){

          button = `

            <a
              href="login.html"
              class="material-button premium-button"
            >

              🔐 Login / Upgrade

            </a>

          `;

        }


        // SUDAH BISA DIAKSES

        else if(
          accessible &&
          url
        ){

          button = `

            <a
              href="${escapeHtml(url)}"
              target="_blank"
              rel="noopener noreferrer"
              class="material-button"
            >

              ▶️ Mulai Belajar

            </a>

          `;

        }


        // LINK TIDAK ADA

        else{

          button = `

            <div
              class="material-button"
              style="
                background:#ddd;
                color:#555;
                cursor:not-allowed;
              "
            >

              ⚠️ Link belum tersedia

            </div>

          `;

        }


        // ==========================================
        // CARD
        // ==========================================

        return `

          <article
            class="
              material-card
              ${premium ? "premium" : ""}
            "
          >

            <div class="thumbnail">

              ${thumbnail}

            </div>


            <div class="material-body">

              <span class="material-type">

                ${escapeHtml(
                  material.kategori ||
                  "Pembelajaran"
                )}

              </span>


              <h3>

                ${escapeHtml(
                  material.judul ||
                  "Tanpa Judul"
                )}

              </h3>


              <p class="material-description">

                ${escapeHtml(
                  material.deskripsi ||
                  "Materi pembelajaran NgajiPlus."
                )}

              </p>


              ${label}


              ${button}

            </div>

          </article>

        `;

      }
    )

    .join("");

}


// ======================================================
// FILTER
// ======================================================

function filterMaterials(){

  const keyword =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  const category =
    document
      .getElementById(
        "categoryFilter"
      )
      .value
      .toLowerCase()
      .trim();


  const filtered =
    allMaterials.filter(
      material => {


        const judul =
          String(
            material.judul || ""
          )
          .toLowerCase();


        const deskripsi =
          String(
            material.deskripsi || ""
          )
          .toLowerCase();


        const kategori =
          String(
            material.kategori || ""
          )
          .toLowerCase();


        const matchKeyword =

          !keyword ||

          judul.includes(
            keyword
          ) ||

          deskripsi.includes(
            keyword
          );


        const matchCategory =

          !category ||

          kategori.includes(
            category
          );


        return (
          matchKeyword &&
          matchCategory
        );

      }
    );


  displayMaterials(
    filtered
  );

}


// ======================================================
// EVENT SEARCH
// ======================================================

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    filterMaterials
  );


document
  .getElementById(
    "categoryFilter"
  )
  .addEventListener(
    "change",
    filterMaterials
  );


// ======================================================
// LOAD UTAMA
// ======================================================

async function init(){

  const statusBox =
    document.getElementById(
      "statusBox"
    );


  const container =
    document.getElementById(
      "materialsContainer"
    );


  try{

    // -----------------------------------------------
    // 1. CEK SESSION
    // -----------------------------------------------

    currentSession =
      await checkLogin();


    console.log(
      "SESSION:",
      currentSession
    );


    // -----------------------------------------------
    // 2. CEK MEMBER
    // -----------------------------------------------

    if(currentSession){

      isMember =
        await checkMembership(
          currentSession
        );

    }

    else{

      isMember = false;

    }


    console.log(
      "IS MEMBER:",
      isMember
    );


    // -----------------------------------------------
    // 3. AMBIL SEMUA KATALOG
    // -----------------------------------------------

    allMaterials =
      await loadCatalog();


    console.log(
      "TOTAL MATERI:",
      allMaterials.length
    );


    // -----------------------------------------------
    // 4. JIKA MEMBER, AMBIL URL PREMIUM
    // -----------------------------------------------

    if(isMember){

      availableMaterials =
        await loadAvailableMaterials();

    }

    else{

      availableMaterials = [];

    }


    console.log(
      "TOTAL YANG BISA DIAKSES:",
      availableMaterials.length
    );


    // -----------------------------------------------
    // 5. STATUS
    // -----------------------------------------------

    if(isMember){

      statusBox.className =
        "status-member";

      statusBox.innerHTML = `

        👑 <strong>Membership Aktif</strong>

        — Anda dapat mengakses
        materi premium.

      `;

    }

    else if(currentSession){

      statusBox.className =
        "status-free";

      statusBox.innerHTML = `

        👤 <strong>Login</strong>

        — Materi gratis dapat dipelajari.
        Materi premium memerlukan membership aktif.

      `;

    }

    else{

      statusBox.className =
        "status-free";

      statusBox.innerHTML = `

        🔐 <strong>Belum Login</strong>

        — Materi gratis dapat dipelajari.
        Login untuk akses materi premium.

      `;

    }


    // -----------------------------------------------
    // 6. TAMPILKAN SEMUA
    // -----------------------------------------------

    displayMaterials(
      allMaterials
    );


    // -----------------------------------------------
    // 7. JUMLAH MATERI
    // -----------------------------------------------

    if(allMaterials.length > 0){

      statusBox.innerHTML += `

        <br>

        📚 ${allMaterials.length}
        materi tersedia.

      `;

    }

  }

  catch(error){

    console.error(
      "INIT ERROR:",
      error
    );


    statusBox.className =
      "status-free";


    statusBox.innerHTML = `

      ❌ Terjadi kesalahan saat
      memuat materi.

    `;


    container.innerHTML = `

      <div class="error">

        ❌ Gagal mengambil materi.

        <br><br>

        ${escapeHtml(
          error.message ||
          "Terjadi kesalahan."
        )}

      </div>

    `;

  }

}


// ======================================================
// MULAI
// ======================================================

init();


</script>


</body>

  </html>
