<head>

  <style>

    * {

    }

      margin: 0;

      font-family:
        Arial,

        sans-serif;

      color:

    a {

    /* ==============================

      background: white;

        1px solid #e5e9e6;

      position:
        sticky;

      top: 0;

      z-index: 100;

    }


    .header-inner {

      max-width:

      margin:
        auto;

      align-items:

      color:

      border-radius:

        14px;

        #eef7f1;

        #238b57;

    }


    /* ==============================
       MAIN
    ============================== */

    main {

      max-width:
        1100px;

      margin:
        auto;

        45px 20px;

    .page-title {

      text-align:

    }


    .page-title h1 {

      margin:

    }

        center;

    }


    .status-free {

    .status-member {

        bold;

    /* ==============================
       FILTER
    ============================== */

    .filter-box {

      background:
        white;

      padding:
        18px;

      border-radius:
        15px;

      border:
        1px solid #e5e9e6;

      margin-bottom:
        25px;

        flex;

      gap:
        10px;

      flex-wrap:
        wrap;

    }


    .filter-box input,
    .filter-box select {

      padding:
        12px;

      border:
        1px solid #ddd;

        9px;

      outline:
        none;

      background:
        white;

      font-size:
        14px;

    }


    .filter-box input {

      flex:
        1;

      min-width:
        200px;

    }


    /* ==============================
       GRID
    ============================== */

    #materialsContainer {

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        20px;

    }


    /* ==============================
       CARD
    ============================== */

    .material-card {

      background:
        white;

      border:
        1px solid #e3e8e5;

      border-radius:
        18px;

      overflow:
        hidden;

      transition:
        .2s;

    }


    .material-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 12px 30px
        rgba(0,0,0,.07);

    }

    .material-card.premium {

      background:
        #202a24;

      color:
        white;

    }


    /* ==============================
       THUMBNAIL
    ============================== */

    .thumbnail {

      height:
        170px;

      background:
        #e5f2e9;

      display:

      align-items:

        center;

      overflow:
        hidden;

      background:
        #35463c;

    }


    .thumbnail img {

      width:
        100%;

      height:
        100%;

        cover;

    }


    /* ==============================
       BODY
    ============================== */

    .material-body {

      padding:
        20px;

    }


    .material-type {

      display:
        inline-block;

      padding:
        5px 9px;

      border-radius:
        50px;

      background:
        #eef7f1;

      color:
        #238b57;

      font-size:
        11px;

      font-weight:
        bold;

      margin-bottom:
        10px;

    }


    .premium .material-type {

      background:
        #35463c;

      color:
        #b9e4c8;

    }


    .material-body h3 {

      margin:
        0 0 8px;

      font-size:
        18px;

    }


    .material-description {

      color:
        #737b76;

      font-size:
        14px;

      line-height:
        1.6;

      min-height:
        45px;

    }


    .premium .material-description {

      color:
        #c6cec9;

    }


    /* ==============================
       LABEL
    ============================== */

    .free-label {

      margin-top:
        10px;

      color:
        #238b57;

      font-size:
        12px;

      font-weight:
        bold;

    }


    .premium-label {

      margin-top:
        10px;

      color:
        #b9e4c8;

      font-size:
        12px;

      font-weight:
        bold;

    }


    /* ==============================
       BUTTON
    ============================== */

    .material-button {

      display:
        block;

      text-align:
        center;

      margin-top:
        15px;

      padding:
        11px;

      border-radius:
        9px;

      background:

      color:
        white;

      font-weight:
        bold;

    .premium-button {

    /* ==============================
       LOADING
    ============================== */

    /* ==============================
       EMPTY
    ============================== */

    .empty {

      grid-column:
        1 / -1;

      background:
        white;

      padding:
        50px;

      text-align:
        center;

        15px;

      color:
        #777;

    }


    /* ==============================
       ERROR
    ============================== */

    .error {

      grid-column:

      background:
        #fff1f1;

      color:

      padding:

    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 800px) {

    @media (max-width: 550px) {

      .header-inner {

      }


      main {

  </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

  <div class="header-inner">


    <a
      href="index.html"

    >

    </a>


    <nav>

      <a href="index.html">

      <a href="materi.html">

<!-- =========================================
     MAIN
========================================= -->

<main>


  <div class="page-title">

    <h1>
      🎥 Video Pembelajaran
    </h1>

    <p>
      Temukan berbagai materi pembelajaran
      yang tersedia di NgajiPlus.
    </p>

  </div>



  <!-- STATUS USER -->

  <div
    id="statusBox"
    class="status-box"
  >

    ⏳ Memeriksa akses...

  </div>



  <!-- FILTER -->

  <div class="filter-box">


    <input
      type="search"
      id="searchInput"
      placeholder="🔎 Cari materi..."
    >


    <select id="categoryFilter">

      <option value="">
        Semua Kategori
      </option>

      <option value="Al-Qur'an & Tahsin">
        Al-Qur'an & Tahsin

        Fiqih
      </option>

        Aqidah

        Akhlak & Adab
      </option>

        Bahasa Arab
      </option>

      <option value="Hadits">
        Hadits
      </option>

      <option value="Tafsir">
        Tafsir
      </option>

  <!-- MATERIAL -->

</main>



<script>


// =====================================================
// VARIABEL
// =====================================================

let allMaterials = [];

let currentSession = null;

let isMember = false;


// =====================================================
// SESSION
// =====================================================

async function getCurrentSession() {

  const result =
    await supabaseClient.auth.getSession();


  if (result.error) {

    console.error(
      "Session error:",
      result.error
    );

    return null;

  }


  return result.data.session;

}


// =====================================================
// CEK MEMBER
// =====================================================

async function checkMember(session) {

  if (!session) {

    return false;

  }


  const result =
    await supabaseClient
      .from("profiles")
      .select(
        "status, berlaku_sampai"
      )
      .eq(
        "id",
        session.user.id
      )
      .single();


  if (result.error) {

    console.log(
      "Profile tidak ditemukan."
    );

    return false;

  }


  const profile =
    result.data;


  const status =
    String(
      profile.status || ""
    )
    .toLowerCase()
    .trim();


  if (
    status !== "aktif"
  ) {

    return false;

  }


  if (
    profile.berlaku_sampai
  ) {

    const tanggalBerakhir =
      new Date(
        profile.berlaku_sampai
      );


    if (
      tanggalBerakhir <= new Date()
    ) {

      return false;

    }

  }


  return true;

}


// =====================================================
// LOAD MATERIAL
// =====================================================

async function loadMaterials() {

  const container =
    document.getElementById(
      "materialsContainer"
    );


  try {


    // SESSION

    currentSession =
      await getCurrentSession();


    // MEMBER

    isMember =
      await checkMember(
        currentSession
      );


    // STATUS

    updateStatus();


    // ============================================
    // AMBIL KATALOG
    // ============================================

    const result =
      await supabaseClient.rpc(
        "get_material_catalog"
      );


    console.log(
      "HASIL KATALOG:",
      result.data
    );


    console.log(
      "ERROR KATALOG:",
      result.error
    );


    if (result.error) {

      container.innerHTML = `

        <div class="error">

          ❌ Gagal mengambil materi.

          <br><br>

          ${escapeHtml(
            result.error.message
          )}

        </div>

      `;

      return;

    }


    allMaterials =
      result.data || [];


    console.log(
      "JUMLAH MATERIAL:",
      allMaterials.length
    );


    // ============================================
    // TAMPILKAN
    // ============================================

    displayMaterials(
      allMaterials
    );


  }
  catch (error) {


    console.error(error);


    container.innerHTML = `

      <div class="error">

        ❌ Terjadi kesalahan.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


// =====================================================
// STATUS
// =====================================================

function updateStatus() {

  const box =
    document.getElementById(
      "statusBox"
    );


  if (!currentSession) {

    box.className =
      "status-box status-free";


    box.innerHTML = `

      🔓 Anda sedang melihat
      <strong>materi gratis</strong>.
      Materi premium tersedia tetapi terkunci.

    `;


    return;

  }


  if (isMember) {

    box.className =
      "status-box status-member";


    box.innerHTML = `

      ✅ Membership Anda aktif.
      Anda dapat mengakses materi premium.

    `;


    return;

  }


  box.className =
    "status-box status-free";


  box.innerHTML = `

    🔓 Anda belum menjadi member aktif.
    Materi premium tersedia tetapi terkunci.

  `;

}


// =====================================================
// TAMPILKAN MATERIAL
// =====================================================

function displayMaterials(
  materials
) {

  const container =
    document.getElementById(
      "materialsContainer"
    );


  if (!materials.length) {

    container.innerHTML = `

      <div class="empty">

        📚 Belum ada materi.

      </div>

    `;

    return;

  }


  container.innerHTML =
    materials
      .map(
        material =>
          createMaterialCard(
            material
          )
      )
      .join("");

}


// =====================================================
// BUAT CARD
// =====================================================

function createMaterialCard(
  material
) {


  const premium =
    material.premium === true;


  // ==========================================
  // URL
  // ==========================================

  const url =
    material.url || "";


  // ==========================================
  // PREMIUM TERKUNCI
  // ==========================================

  const locked =
    premium &&
    !isMember;


  // ==========================================
  // THUMBNAIL
  // ==========================================

  let thumbnail;


  if (
    material.thumbnail
  ) {

    thumbnail = `

      <img
        src="${escapeHtml(
          material.thumbnail
        )}"
        alt="${escapeHtml(
          material.judul ||
          "Materi"
        )}"
      >

    `;

  }
  else {

    thumbnail =
      premium
      ? "🔒"
      : "🎥";

  }


  // ==========================================
  // BUTTON
  // ==========================================

  let button;


  // PREMIUM DAN BELUM MEMBER

  if (locked) {

    button = `

      <a
        href="dashboard.html"
        class="
          material-button
          premium-button
        "
      >

        🔒 Upgrade Member

      </a>

    `;

  }


  // SUDAH BOLEH AKSES DAN ADA URL

  else if (url) {

    button = `

      <a
        href="${escapeHtml(url)}"
        target="_blank"
        rel="noopener noreferrer"
        class="material-button"
      >

        ▶️ Mulai Belajar

      </a>

    `;

  }


  // TIDAK ADA URL

  else {

    button = `

      <div
        class="material-button"
        style="
          background:#ddd;
          color:#555;
        "
      >

        Materi belum tersedia

      </div>

    `;

  }


  // ==========================================
  // LABEL
  // ==========================================

  let label;


  if (premium) {

    label = `

      <div class="premium-label">

        🔐 Materi Premium

      </div>

    `;

  }
  else {

    label = `

      <div class="free-label">

        🟢 Materi Gratis

      </div>

    `;

  }


  // ==========================================
  // CARD
  // ==========================================

  return `

    <article
      class="
        material-card
        ${premium ? "premium" : ""}
      "
    >


      <div class="thumbnail">

        ${thumbnail}

      </div>


      <div class="material-body">


        <span class="material-type">

          ${escapeHtml(
            material.kategori ||
            "Pembelajaran"
          )}

        </span>


        <h3>

          ${escapeHtml(
            material.judul ||
            "Tanpa Judul"
          )}

        </h3>


        <p
          class="material-description"
        >

          ${escapeHtml(
            material.deskripsi ||
            "Materi pembelajaran NgajiPlus."
          )}

        </p>


        ${label}


        ${button}


      </div>


    </article>

  `;

}


// =====================================================
// FILTER
// =====================================================

function filterMaterials() {


  const keyword =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  const category =
    document
      .getElementById(
        "categoryFilter"
      )
      .value
      .toLowerCase()
      .trim();


  const filtered =
    allMaterials.filter(
      material => {


        const judul =
          String(
            material.judul || ""
          )
          .toLowerCase();


        const deskripsi =
          String(
            material.deskripsi || ""
          )
          .toLowerCase();


        const kategori =
          String(
            material.kategori || ""
          )
          .toLowerCase();


        const cocokKeyword =
          !keyword ||
          judul.includes(keyword) ||
          deskripsi.includes(keyword);


        const cocokKategori =
          !category ||
          kategori.includes(category);


        return (
          cocokKeyword &&
          cocokKategori
        );

      }
    );


  displayMaterials(
    filtered
  );

}


// =====================================================
// EVENT FILTER
// =====================================================

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    filterMaterials
  );


document
  .getElementById(
    "categoryFilter"
  )
  .addEventListener(
    "change",
    filterMaterials
  );


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
