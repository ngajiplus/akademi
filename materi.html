<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Materi - NgajiPlus Akademi</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f9f7;
      color: #263238;
    }

    a {
      text-decoration: none;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: white;
      border-bottom: 1px solid #e5e5e5;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      color: #008f5a;
      font-weight: bold;
      font-size: 18px;
    }

    .header-btn {
      background: #009b61;
      color: white;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: bold;
    }

    /* =========================
       CONTAINER
    ========================= */

    .container {
      width: 94%;
      max-width: 900px;
      margin: 30px auto;
    }

    /* =========================
       BACK
    ========================= */

    .back {
      display: inline-block;
      margin-bottom: 18px;
      color: #008f5a;
      font-weight: bold;
      font-size: 14px;
    }

    /* =========================
       CARD
    ========================= */

    .materi-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .kategori {
      display: inline-block;
      background: #e7f7ef;
      color: #008f5a;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .deskripsi {
      color: #6b7280;
      line-height: 1.7;
      font-size: 14px;
      margin-bottom: 22px;
    }

    /* =========================
       PLAYER
    ========================= */

    .player {
      width: 100%;
      background: #111;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .player iframe {
      width: 100%;
      height: 500px;
      border: none;
      display: block;
    }

    .player video {
      width: 100%;
      max-height: 500px;
      display: block;
      background: black;
    }

    .player audio {
      width: 100%;
      display: block;
      padding: 20px;
    }

    /* =========================
       PDF
    ========================= */

    .pdf-box {
      margin-top: 20px;
    }

    .pdf-box iframe {
      width: 100%;
      height: 650px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    /* =========================
       BUTTON
    ========================= */

    .button {
      display: inline-block;
      background: #009b61;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      margin-top: 15px;
    }

    .button:hover {
      background: #007d4e;
    }

    .button-secondary {
      background: #eef2f1;
      color: #333;
    }

    /* =========================
       PREMIUM
    ========================= */

    .premium-box {
      background: #fff8d9;
      border: 1px solid #f0d76a;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-top: 20px;
    }

    .premium-box h3 {
      margin-top: 0;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      background: white;
      border-radius: 14px;
      padding: 50px 20px;
      text-align: center;
      color: #777;
    }

    .error {
      background: #fff0f0;
      border: 1px solid #ffcccc;
      border-radius: 12px;
      padding: 20px;
      color: #a00000;
      text-align: center;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      margin-top: 60px;
      background: #07150f;
      color: white;
      padding: 30px 20px;
    }

    footer strong {
      color: #00a968;
    }

    footer p {
      font-size: 12px;
      color: #aaa;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 12px 15px;
      }

      .logo {
        font-size: 15px;
      }

      .container {
        width: 94%;
        margin: 20px auto;
      }

      .materi-card {
        padding: 16px;
      }

      h1 {
        font-size: 22px;
      }

      .player iframe {
        height: 230px;
      }

      .player video {
        max-height: 300px;
      }

      .pdf-box iframe {
        height: 500px;
      }

    }

  </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <div class="logo">
    📖 NgajiPlus Akademi
  </div>

  <a
    href="dashboard.htm"
    class="header-btn"
  >
    📊 Dashboard
  </a>

</header>



<!-- =========================
     CONTENT
========================= -->

<main class="container">

  <a
    href="akademi.html"
    class="back"
  >
    ← Kembali ke Akademi
  </a>


  <div id="loading" class="loading">
    ⏳ Mengambil materi...
  </div>


  <div
    id="error"
    class="error"
    style="display:none;"
  >
  </div>


  <div
    id="materiContainer"
    style="display:none;"
  >

    <div class="materi-card">

      <div
        id="kategori"
        class="kategori"
      >
        📚 Kategori
      </div>


      <h1 id="judul">
        Judul Materi
      </h1>


      <div
        id="deskripsi"
        class="deskripsi"
      >
        Deskripsi materi.
      </div>


      <!-- PLAYER -->

      <div
        id="player"
        class="player"
      >
      </div>


      <!-- PDF -->

      <div
        id="pdfBox"
        class="pdf-box"
        style="display:none;"
      >

        <h3>
          📄 Materi PDF
        </h3>

        <iframe
          id="pdfFrame"
          src=""
        >
        </iframe>

        <a
          id="pdfDownload"
          href="#"
          target="_blank"
          class="button"
        >
          📥 Download PDF
        </a>

      </div>


      <!-- URL BUTTON -->

      <div id="linkBox">

        <a
          id="openLink"
          href="#"
          target="_blank"
          class="button"
        >
          🔗 Buka Materi
        </a>

      </div>

    </div>

  </div>


</main>



<!-- =========================
     FOOTER
========================= -->

<footer>

  <strong>
    📖 NgajiPlus Akademi
  </strong>

  <p>
    Platform pembelajaran Islam berupa Video,
    Audio dan PDF.
  </p>

</footer>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>


/* =====================================================
   SUPABASE CONFIG
=====================================================

   PENTING:

   ISI DENGAN CONFIG YANG SAMA
   DENGAN akademi.html

===================================================== */


const SUPABASE_URL =
  "https://ksgywgdrfskqsufchbcm.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_HmFKwHMCISfN_YOoiLx3-A_MWnG9yG7";


const {
  createClient
} = supabase;


const db = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);



/* =====================================================
   ELEMENT
===================================================== */

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const container =
  document.getElementById("materiContainer");

const judul =
  document.getElementById("judul");

const kategori =
  document.getElementById("kategori");

const deskripsi =
  document.getElementById("deskripsi");

const player =
  document.getElementById("player");

const pdfBox =
  document.getElementById("pdfBox");

const pdfFrame =
  document.getElementById("pdfFrame");

const pdfDownload =
  document.getElementById("pdfDownload");

const openLink =
  document.getElementById("openLink");



/* =====================================================
   ERROR
===================================================== */

function tampilError(pesan) {

  loading.style.display = "none";

  container.style.display = "none";

  errorBox.style.display = "block";

  errorBox.innerHTML = pesan;

}



/* =====================================================
   GET ID
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const materialId =
  params.get("id");



/* =====================================================
   YOUTUBE ID
===================================================== */

function getYoutubeId(url) {

  if (!url) {
    return null;
  }

  try {

    const parsed =
      new URL(url);

    /* youtube.com/watch?v= */

    if (
      parsed.hostname.includes("youtube.com")
      &&
      parsed.searchParams.get("v")
    ) {

      return parsed.searchParams.get("v");

    }


    /* youtu.be/xxxxx */

    if (
      parsed.hostname.includes("youtu.be")
    ) {

      return parsed.pathname
        .replace("/", "");

    }


    /* youtube.com/embed/xxxxx */

    if (
      parsed.pathname.includes("/embed/")
    ) {

      return parsed.pathname
        .split("/embed/")[1];

    }

  } catch (e) {

    return null;

  }

  return null;

}



/* =====================================================
   YOUTUBE EMBED
===================================================== */

function youtubePlayer(url) {

  const id =
    getYoutubeId(url);

  if (!id) {

    return false;

  }


  player.innerHTML = `

    <iframe

      src="https://www.youtube.com/embed/${id}"

      title="Video Pembelajaran"

      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share
      "

      allowfullscreen>

    </iframe>

  `;

  return true;

}



/* =====================================================
   LOAD MATERIAL
===================================================== */

async function loadMaterial() {


  if (!materialId) {

    tampilError(
      "❌ ID materi tidak ditemukan."
    );

    return;

  }


  /* ================================================
     CEK SESSION
  ================================================ */

  const {
    data: sessionData
  } = await db.auth.getSession();


  const session =
    sessionData.session;


  let profile = null;


  /* ================================================
     CEK PROFILE
  ================================================ */

  if (session) {

    const {
      data,
      error
    } = await db

      .from("profiles")

      .select(`
        id,
        nama,
        status,
        paket,
        berlaku_sampai
      `)

      .eq(
        "id",
        session.user.id
      )

      .maybeSingle();


    if (!error) {

      profile = data;

    }

  }



  /* ================================================
     AMBIL MATERIAL
  ================================================ */

  const {
    data: material,
    error: materialError
  } = await db

    .from("materials")

    .select(`
      id,
      judul,
      kategori,
      tipe,
      url,
      thumbnail,
      premium
    `)

    .eq(
      "id",
      materialId
    )

    .single();


  if (materialError) {

    console.error(
      materialError
    );

    tampilError(
      "❌ Materi tidak ditemukan."
    );

    return;

  }



  /* ================================================
     CEK MEMBERSHIP
  ================================================ */

  let membershipAktif =
    false;


  if (profile) {

    const status =
      String(
        profile.status || ""
      ).toLowerCase();


    if (
      status === "aktif"
      &&
      profile.berlaku_sampai
    ) {

      const hariIni =
        new Date();


      const berlaku =
        new Date(
          profile.berlaku_sampai
        );


      if (
        berlaku >= hariIni
      ) {

        membershipAktif =
          true;

      }

    }

  }



  /* ================================================
     MATERI PREMIUM
  ================================================ */

  if (
    material.premium
    &&
    !membershipAktif
  ) {

    loading.style.display =
      "none";


    container.style.display =
      "block";


    judul.textContent =
      material.judul;


    kategori.textContent =
      "🔒 Premium";


    deskripsi.innerHTML = `

      <div class="premium-box">

        <h3>
          🔐 Membership Diperlukan
        </h3>

        <p>
          Materi ini khusus untuk
          member NgajiPlus yang
          memiliki membership aktif.
        </p>

        <a
          href="login.html"
          class="button"
        >
          🔑 Login
        </a>

        <br>

        <a
          href="daftar.html"
          class="button button-secondary"
        >
          📝 Daftar Member
        </a>

      </div>

    `;


    player.innerHTML = "";

    pdfBox.style.display =
      "none";

    openLink.style.display =
      "none";


    return;

  }



  /* ================================================
     TAMPILKAN DATA
  ================================================ */

  loading.style.display =
    "none";


  container.style.display =
    "block";


  judul.textContent =
    material.judul;


  kategori.textContent =
    "📚 " +
    (
      material.kategori
      || "Pembelajaran"
    );


  deskripsi.textContent =
    material.deskripsi
    ||
    (
      "Materi pembelajaran "
      +
      material.judul
    );



  /* ================================================
     URL
  ================================================ */

  const url =
    material.url
    || "";



  /* ================================================
     PLAYER BERDASARKAN TIPE
  ================================================ */

  const tipe =
    String(
      material.tipe || ""
    ).toLowerCase();



  /* =========================
     VIDEO
  ========================= */

  if (
    tipe === "video"
  ) {

    const youtube =
      youtubePlayer(url);


    if (!youtube) {

      player.innerHTML = `

        <video
          controls
          playsinline
          preload="metadata"
        >

          <source
            src="${url}"
          >

          Browser Anda
          tidak mendukung video.

        </video>

      `;

    }

  }



  /* =========================
     AUDIO
  ========================= */

  else if (
    tipe === "audio"
  ) {

    player.innerHTML = `

      <div
        style="
          padding:30px;
          background:#eef8f4;
        "
      >

        <div
          style="
            font-size:45px;
            text-align:center;
            margin-bottom:20px;
          "
        >
          🎧
        </div>

        <audio
          controls
          preload="metadata"
        >

          <source
            src="${url}"
          >

          Browser Anda
          tidak mendukung audio.

        </audio>

      </div>

    `;

  }



  /* =========================
     PDF
  ========================= */

  else if (
    tipe === "pdf"
  ) {

    player.innerHTML = `

      <div
        style="
          background:#eef8f4;
          padding:40px;
          text-align:center;
        "
      >

        <div
          style="font-size:60px;"
        >
          📄
        </div>

        <h3>
          Materi PDF
        </h3>

        <p>
          Silakan buka atau
          download materi.
        </p>

      </div>

    `;


    pdfBox.style.display =
      "block";


    pdfFrame.src =
      url;


    pdfDownload.href =
      url;

  }



  /* =========================
     TIPE TIDAK DIKENAL
  ========================= */

  else {

    player.innerHTML = `

      <div
        style="
          padding:40px;
          text-align:center;
          background:#eef8f4;
        "
      >

        📚

        <p>
          Materi tersedia melalui
          tombol di bawah.
        </p>

      </div>

    `;

  }



  /* ================================================
     TOMBOL URL
  ================================================ */

  if (url) {

    openLink.href =
      url;

  } else {

    openLink.style.display =
      "none";

  }


}



/* =====================================================
   JALANKAN
===================================================== */

loadMaterial();


</script>


</body>
</html>
