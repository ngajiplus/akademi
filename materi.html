<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ksgywgdrfskqsufchbcm.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_HmFKwHMCISfN_YOoiLx3-A_MWnG9yG7";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =====================================================
   ELEMENT
===================================================== */

const content =
document.getElementById("content");

const themeBtn =
document.getElementById("themeBtn");


/* =====================================================
   DARK MODE
===================================================== */

function applyTheme(){

    const savedTheme =
        localStorage.getItem(
            "ngajiplus-theme"
        );


    if(
        savedTheme === "dark"
    ){

        document.body.classList.add(
            "dark"
        );

        themeBtn.innerHTML =
            "☀️";

    }

    else{

        document.body.classList.remove(
            "dark"
        );

        themeBtn.innerHTML =
            "🌙";

    }

}


themeBtn.addEventListener(
    "click",
    function(){

        document.body.classList.toggle(
            "dark"
        );


        const isDark =
            document.body.classList.contains(
                "dark"
            );


        localStorage.setItem(
            "ngajiplus-theme",
            isDark
                ? "dark"
                : "light"
        );


        themeBtn.innerHTML =
            isDark
                ? "☀️"
                : "🌙";

    }
);


applyTheme();


/* =====================================================
   GET ID MATERIAL
===================================================== */

/*
   Mendukung:

   materi.html?id=123

   materi.html?material_id=123

   materi.html?materi_id=123
*/

function getMaterialId(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    return (

        params.get("id") ||

        params.get("material_id") ||

        params.get("materi_id")

    );

}


const materialId =
    getMaterialId();


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeAttribute(value){

    return escapeHTML(value);

}


/* =====================================================
   YOUTUBE ID
===================================================== */

function getYouTubeId(url){

    if(!url){

        return null;

    }


    try{

        const parsed =
            new URL(url);


        const host =
            parsed.hostname.toLowerCase();


        /* youtube.com/watch?v= */

        if(
            host.includes("youtube.com") &&
            parsed.searchParams.get("v")
        ){

            return parsed.searchParams.get("v");

        }


        /* youtube.com/live/ID */

        const liveMatch =
            parsed.pathname.match(
                /\/live\/([^/?]+)/
            );


        if(liveMatch){

            return liveMatch[1];

        }


        /* youtube.com/shorts/ID */

        const shortsMatch =
            parsed.pathname.match(
                /\/shorts\/([^/?]+)/
            );


        if(shortsMatch){

            return shortsMatch[1];

        }


        /* youtube.com/embed/ID */

        const embedMatch =
            parsed.pathname.match(
                /\/embed\/([^/?]+)/
            );


        if(embedMatch){

            return embedMatch[1];

        }


        /* youtu.be/ID */

        if(
            host === "youtu.be"
        ){

            return parsed.pathname
                .replace(
                    "/",
                    ""
                )
                .split("?")[0];

        }

    }

    catch(error){

        console.error(
            "URL ERROR:",
            error
        );

    }


    return null;

}


/* =====================================================
   YOUTUBE PLAYER
===================================================== */

function youtubePlayer(url){

    const youtubeId =
        getYouTubeId(url);


    if(!youtubeId){

        return `

            <div class="error">

                ❌ URL YouTube tidak valid.

            </div>

        `;

    }


    return `

        <div class="player-wrapper">

            <iframe
                class="video-frame"
                src="https://www.youtube.com/embed/${encodeURIComponent(youtubeId)}"
                title="Video Pembelajaran"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>

        </div>

    `;

}


/* =====================================================
   AUDIO
===================================================== */

function audioPlayer(url){

    return `

        <div class="player-wrapper">

            <div class="audio-player">

                <audio
                    controls
                    preload="metadata"
                >

                    <source
                        src="${escapeAttribute(url)}"
                    >

                    Browser Anda tidak mendukung audio.

                </audio>

            </div>

        </div>

    `;

}


/* =====================================================
   PDF
===================================================== */

function pdfPlayer(url){

    return `

        <div class="player-wrapper">

            <iframe
                class="pdf-frame"
                src="${escapeAttribute(url)}"
                title="PDF Pembelajaran">
            </iframe>

        </div>

    `;

}


/* =====================================================
   PLAYER
===================================================== */

function renderPlayer(item){

    const type =
        String(
            item.tipe || ""
        )
        .toLowerCase()
        .trim();


    if(type === "video"){

        return youtubePlayer(
            item.url
        );

    }


    if(type === "audio"){

        return audioPlayer(
            item.url
        );

    }


    if(type === "pdf"){

        return pdfPlayer(
            item.url
        );

    }


    return `

        <div class="error">

            ⚠️ Tipe materi tidak dikenali.

            <br><br>

            <a
                href="${escapeAttribute(item.url)}"
                target="_blank"
                rel="noopener noreferrer"
                class="open-source"
            >
                🔗 Buka Materi
            </a>

        </div>

    `;

}


/* =====================================================
   GET USER
===================================================== */

async function getCurrentUser(){

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getUser();


    if(error){

        console.error(
            "GET USER ERROR:",
            error
        );

        return null;

    }


    return data?.user || null;

}


/* =====================================================
   CHECK ACCESS
===================================================== */

async function checkAccess(user){

    const result = {

        loggedIn:false,

        premium:false,

        admin:false,

        profile:null

    };


    if(!user){

        return result;

    }


    result.loggedIn =
        true;


    const {
        data: profile,
        error
    } =
        await supabaseClient

            .from("profiles")

            .select(
                "id,nama,status,paket,berlaku_sampai,is_admin"
            )

            .eq(
                "id",
                user.id
            )

            .maybeSingle();


    if(error){

        console.error(
            "PROFILE ERROR:",
            error
        );

        return result;

    }


    result.profile =
        profile;


    if(!profile){

        return result;

    }


    /* =================================================
       ADMIN
    ================================================= */

    const isAdmin =
        profile.is_admin === true ||
        profile.is_admin === "true" ||
        profile.is_admin === 1 ||
        profile.is_admin === "1";


    result.admin =
        isAdmin;


    if(isAdmin){

        result.premium =
            true;

        return result;

    }


    /* =================================================
       PREMIUM
    ================================================= */

    const status =
        String(
            profile.status || ""
        )
        .toLowerCase()
        .trim();


    const paket =
        String(
            profile.paket || ""
        )
        .toLowerCase()
        .trim();


    const statusAktif =
        status === "aktif";


    const paketPremium =
        paket === "premium";


    let tanggalAktif =
        false;


    if(
        profile.berlaku_sampai
    ){

        const tanggal =
            new Date(
                profile.berlaku_sampai
            );


        const sekarang =
            new Date();


        tanggalAktif =
            !isNaN(
                tanggal.getTime()
            ) &&
            tanggal >=
                sekarang;

    }


    result.premium =
        statusAktif &&
        paketPremium &&
        tanggalAktif;


    return result;

}


/* =====================================================
   LOAD MATERIAL
===================================================== */

async function loadMaterial(){

    content.innerHTML = `

        <div class="loading">

            ⏳ Memuat materi...

        </div>

    `;


    /* =================================================
       ID TIDAK ADA
    ================================================= */

    if(!materialId){

        content.innerHTML = `

            <div class="error">

                ❌ ID materi tidak ditemukan.

                <br><br>

                <span style="color:#777;font-size:11px">

                    Halaman materi harus dibuka melalui
                    tombol materi yang membawa ID.

                    <br>

                    Contoh:
                    <br>

                    <strong>
                    materi.html?id=123
                    </strong>

                </span>

                <br><br>

                <a
                    href="akademi.html"
                    class="open-source"
                >
                    ← Kembali ke Akademi
                </a>

            </div>

        `;

        return;

    }


    /* =================================================
       USER
    ================================================= */

    const user =
        await getCurrentUser();


    /* =================================================
       ACCESS
    ================================================= */

    const access =
        await checkAccess(user);


    /* =================================================
       MATERIAL
    ================================================= */

    const {
        data: item,
        error
    } =
        await supabaseClient

            .from("materials")

            .select(`
                id,
                judul,
                deskripsi,
                kategori,
                tipe,
                url,
                thumbnail,
                premium
            `)

            .eq(
                "id",
                materialId
            )

            .maybeSingle();


    if(error){

        console.error(
            "MATERIAL ERROR:",
            error
        );


        content.innerHTML = `

            <div class="error">

                ❌ Gagal mengambil materi.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

                <br><br>

                <a
                    href="akademi.html"
                    class="open-source"
                >
                    ← Kembali ke Akademi
                </a>

            </div>

        `;

        return;

    }


    /* =================================================
       MATERIAL TIDAK ADA
    ================================================= */

    if(!item){

        content.innerHTML = `

            <div class="error">

                ❌ Materi tidak ditemukan.

                <br><br>

                ID:
                <strong>
                    ${escapeHTML(materialId)}
                </strong>

                <br><br>

                <a
                    href="akademi.html"
                    class="open-source"
                >
                    ← Kembali ke Akademi
                </a>

            </div>

        `;

        return;

    }


    /* =================================================
       PREMIUM
    ================================================= */

    const premium =
        item.premium === true ||
        item.premium === "true" ||
        item.premium === 1 ||
        item.premium === "1";


    /* =================================================
       LOCK PREMIUM
    ================================================= */

    if(
        premium &&
        !access.premium
    ){

        content.innerHTML = `

            <div class="material-box">

                <span class="category">

                    📚
                    ${escapeHTML(
                        item.kategori || "Materi"
                    )}

                </span>


                <h1 class="title">

                    ${escapeHTML(
                        item.judul || "Materi"
                    )}

                </h1>


                <p class="description">

                    Materi ini khusus untuk
                    member Premium.

                </p>


                <div class="info">

                    <span class="info-badge info-premium">

                        🔐 Premium

                    </span>

                </div>


                <div class="lock-box">

                    <div class="lock-icon">
                        🔐
                    </div>


                    <div class="lock-title">

                        Membership Diperlukan

                    </div>


                    <div class="lock-text">

                        ${
                            user
                            ?
                            "Akun Anda sudah login, tetapi belum memiliki membership Premium yang aktif."
                            :
                            "Silakan login terlebih dahulu dan pastikan membership Anda masih aktif."
                        }

                    </div>


                    ${
                        user

                        ?

                        `

                        <a
                            href="membership.html"
                            class="login-link"
                        >

                            👑 Aktifkan Membership

                        </a>

                        `

                        :

                        `

                        <a
                            href="login.html"
                            class="login-link"
                        >

                            🔐 Login

                        </a>

                        `

                    }

                </div>


                <a
                    href="akademi.html"
                    class="open-source"
                >

                    ← Kembali ke Akademi

                </a>

            </div>

        `;

        return;

    }


    /* =================================================
       MATERI BOLEH DIAKSES
    ================================================= */

    const playerHTML =
        renderPlayer(item);


    /* =================================================
       THUMBNAIL
    ================================================= */

    let thumbnailHTML = "";


    if(
        item.thumbnail &&
        String(
            item.tipe || ""
        )
        .toLowerCase()
        !== "video"
    ){

        thumbnailHTML = `

            <img
                class="thumbnail"
                src="${escapeAttribute(
                    item.thumbnail
                )}"
                alt="${escapeAttribute(
                    item.judul || "Materi"
                )}"
                onerror="
                    this.style.display='none'
                "
            >

        `;

    }


    /* =================================================
       ADMIN BADGE
    ================================================= */

    let adminHTML = "";


    if(
        access.admin &&
        premium
    ){

        adminHTML = `

            <div class="admin-box">

                👑
                <strong>Akses Admin</strong>

                —
                Anda dapat membuka
                materi Premium.

            </div>

        `;

    }


    /* =================================================
       PROFILE NAME
    ================================================= */

    let accountName =
        "";


    if(
        access.profile &&
        access.profile.nama
    ){

        accountName =
            String(
                access.profile.nama
            );

    }


    /* =================================================
       TAMPILKAN
    ================================================= */

    content.innerHTML = `

        <div class="material-box">


            <span class="category">

                📚
                ${escapeHTML(
                    item.kategori || "Materi"
                )}

            </span>


            <h1 class="title">

                ${escapeHTML(
                    item.judul ||
                    "Tanpa Judul"
                )}

            </h1>


            <p class="description">

                ${
                    item.deskripsi
                    ?
                    escapeHTML(
                        item.deskripsi
                    )
                    :
                    "Materi pembelajaran " +
                    escapeHTML(
                        item.judul || ""
                    )
                }

            </p>


            <div class="info">

                <span class="info-badge">

                    ${
                        String(
                            item.tipe || ""
                        )
                        .toLowerCase()
                        === "video"

                        ? "🎥 Video"

                        :

                        String(
                            item.tipe || ""
                        )
                        .toLowerCase()
                        === "audio"

                        ? "🎧 Audio"

                        :

                        String(
                            item.tipe || ""
                        )
                        .toLowerCase()
                        === "pdf"

                        ? "📄 PDF"

                        :

                        "📚 Materi"

                    }

                </span>


                ${
                    premium

                    ?

                    `

                    <span
                        class="info-badge info-premium"
                    >

                        🔐 Premium

                    </span>

                    `

                    :

                    `

                    <span
                        class="info-badge info-free"
                    >

                        ✓ Gratis

                    </span>

                    `

                }


                ${
                    access.admin

                    ?

                    `

                    <span
                        class="info-badge info-admin"
                    >

                        👑 Admin

                    </span>

                    `

                    :

                    ""

                }

            </div>


            ${adminHTML}


            ${
                accountName

                ?

                `

                <div
                    style="
                        font-size:11px;
                        color:#718078;
                        margin-bottom:15px;
                    "
                >

                    👤
                    ${escapeHTML(
                        accountName
                    )}

                </div>

                `

                :

                ""

            }


            ${thumbnailHTML}


            ${playerHTML}


            <a
                href="akademi.html"
                class="open-source"
            >

                ← Kembali ke Akademi

            </a>


        </div>

    `;


    document.title =
        (
            item.judul ||
            "Materi"
        ) +
        " - NgajiPlus Akademi";

}


/* =====================================================
   JALANKAN
===================================================== */

loadMaterial();


/* =====================================================
   AUTH CHANGE
===================================================== */

supabaseClient
    .auth
    .onAuthStateChange(
        function(
            event
        ){

            if(

                event ===
                    "SIGNED_IN" ||

                event ===
                    "SIGNED_OUT" ||

                event ===
                    "TOKEN_REFRESHED"

            ){

                setTimeout(
                    function(){

                        loadMaterial();

                    },
                    100
                );

            }

        }
    );

</script>


</body>

</html>
