<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Video Pembelajaran - NgajiPlus</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f6f8f7;
  color: #202a24;
}

a {
  text-decoration: none;
}

header {
  background: white;
  border-bottom: 1px solid #e5e9e6;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  padding: 15px 20px;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: #238b57;
  font-weight: bold;
  font-size: 21px;
}

nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

nav a {
  color: #555;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 14px;
}

nav a:hover {
  background: #eef7f1;
  color: #238b57;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 40px 20px;
}

.page-title {
  text-align: center;
  margin-bottom: 30px;
}

.page-title h1 {
  margin: 0 0 8px;
  font-size: 34px;
}

.page-title p {
  margin: 0;
  color: #737b76;
}

.filter-box {
  background: white;
  padding: 18px;
  border-radius: 15px;
  border: 1px solid #e5e9e6;

  margin-bottom: 25px;

  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.filter-box input,
.filter-box select {
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 9px;
  background: white;
}

.filter-box input {
  flex: 1;
  min-width: 200px;
}

#materialsContainer {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.material-card {
  background: white;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid #e3e8e5;
}

.material-card.premium {
  background: #202a24;
  color: white;
}

.thumbnail {
  height: 170px;
  background: #e5f2e9;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 55px;
  overflow: hidden;
}

.premium .thumbnail {
  background: #35463c;
}

.thumbnail img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.material-body {
  padding: 20px;
}

.material-type {
  display: inline-block;

  padding: 5px 9px;

  border-radius: 50px;

  background: #eef7f1;
  color: #238b57;

  font-size: 11px;
  font-weight: bold;

  margin-bottom: 10px;
}

.premium .material-type {
  background: #35463c;
  color: #b9e4c8;
}

.material-body h3 {
  margin: 0 0 8px;
  font-size: 18px;
}

.material-description {
  color: #737b76;

  font-size: 14px;

  line-height: 1.6;

  min-height: 45px;
}

.premium .material-description {
  color: #c6cec9;
}

.material-button {
  display: block;

  text-align: center;

  margin-top: 15px;

  padding: 11px;

  border-radius: 9px;

  background: #238b57;

  color: white;

  font-weight: bold;

  font-size: 14px;
}

.lock-button {
  background: white;
  color: #202a24;
}

.info {
  grid-column: 1 / -1;

  background: #eef7f1;

  color: #238b57;

  padding: 15px;

  border-radius: 12px;

  text-align: center;

  margin-bottom: 5px;
}

.loading {
  grid-column: 1 / -1;

  background: white;

  padding: 50px;

  text-align: center;

  border-radius: 15px;

  color: #777;
}

.error {
  grid-column: 1 / -1;

  background: #fff1f1;

  color: #b42318;

  padding: 20px;

  border-radius: 12px;

  text-align: center;
}

.free-label {
  margin-top: 8px;
  font-size: 12px;
  color: #238b57;
}

.premium-label {
  margin-top: 8px;
  font-size: 12px;
  color: #b9e4c8;
}

@media(max-width:800px) {

  #materialsContainer {
    grid-template-columns: repeat(2,1fr);
  }

}

@media(max-width:550px) {

  .header-inner {
    flex-direction: column;
    gap: 10px;
  }

  nav {
    justify-content: center;
  }

  main {
    padding: 30px 15px;
  }

  #materialsContainer {
    grid-template-columns: 1fr;
  }

  .page-title h1 {
    font-size: 28px;
  }

}

</style>

</head>


<body>


<header>

<div class="header-inner">

<a
  href="index.html"
  class="logo"
>
📖 NgajiPlus
</a>

<nav>

<a href="index.html">Beranda</a>

<a href="materi.html">Video</a>

<a href="audio.html">Audio</a>

<a href="pdf.html">PDF</a>

<a href="dashboard.html">Dashboard</a>

</nav>

</div>

</header>


<main>


<div class="page-title">

<h1>
🎥 Video Pembelajaran
</h1>

<p>
Temukan berbagai materi pembelajaran yang tersedia di NgajiPlus.
</p>

</div>


<div class="filter-box">

<input
  type="search"
  id="searchInput"
  placeholder="🔎 Cari materi..."
>

<select id="categoryFilter">

<option value="">
Semua Kategori
</option>

<option value="Al-Qur'an & Tahsin">
Al-Qur'an & Tahsin
</option>

<option value="Fiqih">
Fiqih
</option>

<option value="Aqidah">
Aqidah
</option>

<option value="Akhlak & Adab">
Akhlak & Adab
</option>

<option value="Bahasa Arab">
Bahasa Arab
</option>

<option value="Hadits">
Hadits
</option>

<option value="Tafsir">
Tafsir
</option>

<option value="Sejarah Islam">
Sejarah Islam
</option>

</select>

</div>


<div id="materialsContainer">

<div class="loading">
⏳ Memuat materi...
</div>

</div>


</main>


<script>


let allMaterials = [];

let isMember = false;

let currentSession = null;


// =================================================
// ESCAPE HTML
// =================================================

function escapeHtml(value) {

if (
  value === null ||
  value === undefined
) {
  return "";
}

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


// =================================================
// CEK SESSION
// =================================================

async function checkSession() {

const {
  data
} =
await supabaseClient.auth.getSession();

currentSession = data.session;

return currentSession;

}


// =================================================
// CEK STATUS MEMBER
// =================================================

async function checkMember() {

isMember = false;

if (!currentSession) {

return false;

}


const {
  data: profile,
  error
} =
await supabaseClient

.from("profiles")

.select(
  "status, berlaku_sampai"
)

.eq(
  "id",
  currentSession.user.id
)

.single();


if (error) {

console.error(
  "PROFILE ERROR:",
  error
);

return false;

}


const status =
String(
  profile.status || ""
).toLowerCase();


if (status !== "aktif") {

return false;

}


if (profile.berlaku_sampai) {

const expiry =
new Date(
  profile.berlaku_sampai
);

if (
  expiry <= new Date()
) {

return false;

}

}


isMember = true;

return true;

}


// =================================================
// AMBIL SEMUA KATALOG
// =================================================

async function loadMaterials() {

const container =
document.getElementById(
  "materialsContainer"
);


container.innerHTML = `

<div class="loading">

⏳ Memeriksa akses...

</div>

`;


await checkSession();

await checkMember();


container.innerHTML = `

<div class="loading">

⏳ Mengambil materi...

</div>

`;


const {
  data,
  error
} =
await supabaseClient.rpc(
  "get_material_catalog"
);


if (error) {

console.error(error);

container.innerHTML = `

<div class="error">

❌ Gagal mengambil materi.

<br><br>

${escapeHtml(
  error.message
)}

</div>

`;

return;

}


allMaterials =
data || [];


displayMaterials(
  allMaterials
);

}


// =================================================
// TAMPILKAN
// =================================================

function displayMaterials(
  materials
) {

const container =
document.getElementById(
  "materialsContainer"
);


if (!materials.length) {

container.innerHTML = `

<div class="loading">

📚 Belum ada materi.

</div>

`;

return;

}


let info = "";


if (isMember) {

info = `

<div class="info">

👑 <strong>Membership Aktif</strong>
— Anda dapat mengakses materi premium.

</div>

`;

}
else {

info = `

<div class="info">

🔒 Anda menggunakan akses GRATIS.
Upgrade untuk membuka materi premium.

</div>

`;

}


const cards =
materials.map(
material => {


const premium =
material.premium === true;


// ===========================================
// JIKA MEMBER AKTIF
// ===========================================

if (
  premium &&
  isMember
) {

return `

<article class="material-card premium">

<div class="thumbnail">

${
material.thumbnail

?

`<img
src="${escapeHtml(
material.thumbnail
)}"
alt="${escapeHtml(
material.judul
)}"
>`

:

"🎥"

}

</div>


<div class="material-body">

<span class="material-type">

${escapeHtml(
material.kategori ||
"Pembelajaran"
)}

</span>


<h3>

${escapeHtml(
material.judul ||
"Tanpa Judul"
)}

</h3>


<p class="material-description">

${escapeHtml(
material.deskripsi ||
"Materi pembelajaran NgajiPlus."
)}

</p>


<div class="premium-label">

👑 Materi Premium — Member Aktif

</div>


<a

href="${escapeHtml(
material.url || ""
)}"

target="_blank"

rel="noopener noreferrer"

class="material-button"

>

▶️ Mulai Belajar

</a>


</div>

</article>

`;

}


// ===========================================
// PREMIUM TAPI BUKAN MEMBER
// ===========================================

if (
  premium &&
  !isMember
) {

return `

<article class="material-card premium">

<div class="thumbnail">

🔒

</div>


<div class="material-body">

<span class="material-type">

${escapeHtml(
material.kategori ||
"Pembelajaran"
)}

</span>


<h3>

${escapeHtml(
material.judul ||
"Tanpa Judul"
)}

</h3>


<p class="material-description">

${escapeHtml(
material.deskripsi ||
"Materi pembelajaran NgajiPlus."
)}

</p>


<div class="premium-label">

🔐 Materi Premium

</div>


<a

href="dashboard.html"

class="material-button lock-button"

>

🔒 Login / Upgrade

</a>


</div>

</article>

`;

}


// ===========================================
// GRATIS
// ===========================================

return `

<article class="material-card">

<div class="thumbnail">

${
material.thumbnail

?

`<img
src="${escapeHtml(
material.thumbnail
)}"
alt="${escapeHtml(
material.judul
)}"
>`

:

"🎥"

}

</div>


<div class="material-body">

<span class="material-type">

${escapeHtml(
material.kategori ||
"Pembelajaran"
)}

</span>


<h3>

${escapeHtml(
material.judul ||
"Tanpa Judul"
)}

</h3>


<p class="material-description">

${escapeHtml(
material.deskripsi ||
"Materi pembelajaran NgajiPlus."
)}

</p>


<div class="free-label">

🟢 Materi Gratis

</div>


<a

href="${escapeHtml(
material.url || ""
)}"

target="_blank"

rel="noopener noreferrer"

class="material-button"

>

▶️ Mulai Belajar

</a>


</div>

</article>

`;

}
)
.join("");


container.innerHTML =
info + cards;

}


// =================================================
// FILTER
// =================================================

function filterMaterials() {

const keyword =
document
.getElementById(
  "searchInput"
)
.value
.toLowerCase()
.trim();


const category =
document
.getElementById(
  "categoryFilter"
)
.value
.toLowerCase();


const filtered =
allMaterials.filter(
material => {


const judul =
String(
  material.judul || ""
)
.toLowerCase();


const deskripsi =
String(
  material.deskripsi || ""
)
.toLowerCase();


const kategori =
String(
  material.kategori || ""
)
.toLowerCase();


const matchKeyword =

!keyword ||

judul.includes(keyword) ||

deskripsi.includes(keyword);


const matchCategory =

!category ||

kategori.includes(category);


return (
  matchKeyword &&
  matchCategory
);

}
);


displayMaterials(
filtered
);

}


// =================================================
// EVENT SEARCH
// =================================================

document
.getElementById(
  "searchInput"
)
.addEventListener(
  "input",
  filterMaterials
);


// =================================================
// EVENT CATEGORY
// =================================================

document
.getElementById(
  "categoryFilter"
)
.addEventListener(
  "change",
  filterMaterials
);


// =================================================
// MULAI
// =================================================

loadMaterials();


</script>


</body>

  </html>
