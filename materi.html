<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Materi NgajiPlus</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f8f7;
  color: #202a24;
}

header {
  background: white;
  padding: 18px 20px;
  border-bottom: 1px solid #ddd;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: #238b57;
  font-size: 21px;
  font-weight: bold;
  text-decoration: none;
}

nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

nav a {
  text-decoration: none;
  color: #555;
  padding: 8px 12px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 40px 20px;
}

h1 {
  text-align: center;
}

.subtitle {
  text-align: center;
  color: #777;
}

.status {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin: 25px 0;
  text-align: center;
}

#materials {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.card {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid #ddd;
}

.card.premium {
  background: #202a24;
  color: white;
}

.thumbnail {
  height: 160px;
  background: #e5f2e9;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 50px;
}

.premium .thumbnail {
  background: #35463c;
}

.thumbnail img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.content {
  padding: 20px;
}

.category {
  display: inline-block;
  background: #eef7f1;
  color: #238b57;
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 11px;
}

.premium .category {
  background: #35463c;
  color: #b9e4c8;
}

.description {
  color: #777;
  line-height: 1.6;
}

.premium .description {
  color: #ccc;
}

.button {
  display: block;
  margin-top: 15px;
  padding: 12px;
  text-align: center;
  background: #238b57;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-weight: bold;
}

.locked {
  background: white;
  color: #202a24;
}

.error {
  background: #fff1f1;
  color: #b42318;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
}

@media(max-width:800px) {

  #materials {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media(max-width:550px) {

  .header-inner {
    flex-direction: column;
    gap: 10px;
  }

  nav {
    justify-content: center;
  }

  #materials {
    grid-template-columns: 1fr;
  }

}

</style>

</head>

<body>

<header>

<div class="header-inner">

<a href="index.html" class="logo">
📖 NgajiPlus
</a>

<nav>

<a href="index.html">Beranda</a>

<a href="materi.html">Video</a>

<a href="audio.html">Audio</a>

<a href="pdf.html">PDF</a>

<a href="dashboard.html">Dashboard</a>

</nav>

</div>

</header>

<main>

<h1>🎥 Video Pembelajaran</h1>

<p class="subtitle">
Materi pembelajaran NgajiPlus
</p>

<div id="status" class="status">
⏳ Memuat materi...
</div>

<div id="materials">

<div class="status">
⏳ Mengambil data dari Supabase...
</div>

</div>

</main>

<script>

async function mulai() {

  const status =
    document.getElementById("status");

  const container =
    document.getElementById("materials");


  try {

    console.log("1. Supabase mulai");


    // =========================================
    // CEK SESSION
    // =========================================

    const sessionResult =
      await supabaseClient.auth.getSession();


    console.log(
      "2. Session:",
      sessionResult
    );


    if (sessionResult.error) {

      throw sessionResult.error;

    }


    const session =
      sessionResult.data.session;


    // =========================================
    // CEK MEMBER
    // =========================================

    let memberAktif = false;


    if (session) {

      status.innerHTML =
        "🔐 Login terdeteksi. Memeriksa membership...";


      const profileResult =
        await supabaseClient

          .from("profiles")

          .select(
            "status, berlaku_sampai"
          )

          .eq(
            "id",
            session.user.id
          )

          .maybeSingle();


      console.log(
        "3. Profile:",
        profileResult
      );


      if (
        profileResult.data
      ) {

        const profile =
          profileResult.data;


        const statusMember =
          String(
            profile.status || ""
          )
          .toLowerCase()
          .trim();


        if (
          statusMember === "aktif"
        ) {

          if (
            !profile.berlaku_sampai
          ) {

            memberAktif = true;

          }
          else {

            const tanggal =
              new Date(
                profile.berlaku_sampai
              );


            if (
              tanggal > new Date()
            ) {

              memberAktif = true;

            }

          }

        }

      }

    }


    // =========================================
    // STATUS
    // =========================================

    if (memberAktif) {

      status.innerHTML =
        "✅ Membership aktif — semua materi dapat diakses.";

    }
    else {

      status.innerHTML =
        "🔒 Akses GRATIS — materi premium terkunci.";

    }


    // =========================================
    // AMBIL MATERIAL
    // =========================================

    const materialResult =
      await supabaseClient

        .from("materials")

        .select("*")

        .order(
          "created_at",
          {
            ascending: false
          }
        );


    console.log(
      "4. Materials:",
      materialResult
    );


    if (
      materialResult.error
    ) {

      throw materialResult.error;

    }


    const materials =
      materialResult.data || [];


    console.log(
      "5. Jumlah:",
      materials.length
    );


    if (
      materials.length === 0
    ) {

      container.innerHTML = `

        <div class="status">

          📚 Belum ada materi.

        </div>

      `;

      return;

    }


    // =========================================
    // TAMPILKAN
    // =========================================

    container.innerHTML =
      materials
        .map(
          material => {

            const premium =
              material.premium === true;


            const locked =
              premium &&
              !memberAktif;


            let thumbnail =
              "🎥";


            if (
              material.thumbnail
            ) {

              thumbnail = `

                <img
                  src="${escapeHtml(
                    material.thumbnail
                  )}"
                  alt="${escapeHtml(
                    material.judul
                  )}"
                >

              `;

            }
            else if (
              premium
            ) {

              thumbnail = "🔒";

            }


            let button;


            if (locked) {

              button = `

                <a
                  href="dashboard.html"
                  class="button locked"
                >

                  🔒 Upgrade Member

                </a>

              `;

            }
            else if (
              material.url
            ) {

              button = `

                <a
                  href="${escapeHtml(
                    material.url
                  )}"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="button"
                >

                  ▶️ Mulai Belajar

                </a>

              `;

            }
            else {

              button = `

                <div class="button">

                  Materi belum tersedia

                </div>

              `;

            }


            return `

              <article
