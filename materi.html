<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Video Pembelajaran - NgajiPlus</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f8f7;
      color: #202a24;
    }

    a {
      text-decoration: none;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e9e6;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #238b57;
      font-weight: bold;
      font-size: 21px;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    nav a {
      color: #555;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    nav a:hover {
      background: #eef7f1;
      color: #238b57;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    .page-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .page-title h1 {
      margin: 0 0 8px;
      font-size: 35px;
    }

    .page-title p {
      margin: 0;
      color: #737b76;
    }

    .filter-box {
      background: white;
      padding: 18px;
      border-radius: 15px;
      border: 1px solid #e5e9e6;
      margin-bottom: 25px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-box input,
    .filter-box select {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      background: white;
      font-size: 14px;
    }

    .filter-box input {
      flex: 1;
      min-width: 200px;
    }

    #materialsContainer {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .material-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #e3e8e5;
      transition: .2s;
    }

    .material-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0,0,0,.07);
    }

    .thumbnail {
      height: 170px;
      background: #e5f2e9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      overflow: hidden;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .material-body {
      padding: 20px;
    }

    .material-type {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 50px;
      background: #eef7f1;
      color: #238b57;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .material-body h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .material-description {
      color: #737b76;
      font-size: 14px;
      line-height: 1.6;
      min-height: 45px;
    }

    .material-button {
      display: block;
      text-align: center;
      margin-top: 15px;
      padding: 11px;
      border-radius: 9px;
      background: #238b57;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }

    .premium {
      border: 2px solid #238b57;
    }

    .premium-label {
      margin-top: 10px;
      font-size: 12px;
      color: #b7791f;
      font-weight: bold;
    }

    .free-label {
      margin-top: 10px;
      font-size: 12px;
      color: #238b57;
      font-weight: bold;
    }

    .loading,
    .empty,
    .error {
      grid-column: 1 / -1;
      background: white;
      padding: 50px;
      text-align: center;
      border-radius: 15px;
    }

    .loading {
      color: #777;
    }

    .empty {
      color: #777;
    }

    .error {
      background: #fff1f1;
      color: #b42318;
    }

    @media (max-width: 800px) {

      #materialsContainer {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 550px) {

      .header-inner {
        flex-direction: column;
        gap: 10px;
      }

      nav {
        justify-content: center;
      }

      main {
        padding: 30px 15px;
      }

      #materialsContainer {
        grid-template-columns: 1fr;
      }

      .page-title h1 {
        font-size: 28px;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="header-inner">

    <a href="index.html" class="logo">
      📖 NgajiPlus
    </a>

    <nav>

      <a href="index.html">Beranda</a>

      <a href="materi.html">Video</a>

      <a href="audio.html">Audio</a>

      <a href="pdf.html">PDF</a>

      <a href="dashboard.html">Dashboard</a>

    </nav>

  </div>

</header>



<main>


  <div class="page-title">

    <h1>🎥 Video Pembelajaran</h1>

    <p>
      Temukan berbagai materi pembelajaran
      yang tersedia di NgajiPlus.
    </p>

  </div>



  <div class="filter-box">

    <input
      type="search"
      id="searchInput"
      placeholder="🔎 Cari materi..."
    >

    <select id="categoryFilter">

      <option value="">
        Semua Kategori
      </option>

      <option value="Al-Qur'an & Tahsin">
        Al-Qur'an & Tahsin
      </option>

      <option value="Fiqih">
        Fiqih
      </option>

      <option value="Aqidah">
        Aqidah
      </option>

      <option value="Akhlak & Adab">
        Akhlak & Adab
      </option>

      <option value="Bahasa Arab">
        Bahasa Arab
      </option>

      <option value="Hadits">
        Hadits
      </option>

      <option value="Tafsir">
        Tafsir
      </option>

      <option value="Sejarah Islam">
        Sejarah Islam
      </option>

    </select>

  </div>



  <div id="materialsContainer">

    <div class="loading">
      ⏳ Memuat materi...
    </div>

  </div>


</main>



<script>


let allMaterials = [];


// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}



// ==================================================
// CEK MEMBER
// ==================================================

async function checkMember() {

  const {
    data: {
      session
    }
  } = await supabaseClient.auth.getSession();


  if (!session) {

    return false;

  }


  const {
    data: profile
  } =
  await supabaseClient
    .from("profiles")
    .select("status, berlaku_sampai")
    .eq("id", session.user.id)
    .single();


  if (!profile) {

    return false;

  }


  const status =
    String(profile.status || "")
      .toLowerCase();


  if (status !== "aktif") {

    return false;

  }


  if (profile.berlaku_sampai) {

    const tanggal =
      new Date(profile.berlaku_sampai);


    if (tanggal <= new Date()) {

      return false;

    }

  }


  return true;

}



// ==================================================
// AMBIL MATERIAL
// ==================================================

async function loadMaterials() {


  const container =
    document.getElementById(
      "materialsContainer"
    );


  container.innerHTML = `

    <div class="loading">
      ⏳ Memuat materi...
    </div>

  `;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("materials")
    .select("*")
    .order(
      "id",
      {
        ascending: false
      }
    );


  if (error) {

    console.error(error);


    container.innerHTML = `

      <div class="error">

        ❌ Gagal mengambil materi.

        <br><br>

        ${escapeHtml(error.message)}

      </div>

    `;

    return;

  }


  allMaterials =
    data || [];


  displayMaterials(
    allMaterials
  );

}



// ==================================================
// TAMPILKAN MATERIAL
// ==================================================

async function displayMaterials(
  materials
) {


  const container =
    document.getElementById(
      "materialsContainer"
    );


  if (!materials.length) {

    container.innerHTML = `

      <div class="empty">

        📚 Belum ada materi di database.

        <br><br>

        Silakan tambahkan materi
        melalui Supabase.

      </div>

    `;

    return;

  }


  const member =
    await checkMember();


  container.innerHTML =
    materials.map(
      material => {


        const premium =
          material.premium === true;


        const locked =
          premium && !member;


        let button;


        // =====================================
        // PREMIUM TERKUNCI
        // =====================================

        if (locked) {

          button = `

            <a
              href="dashboard.html"
              class="material-button"
            >

              🔒 Upgrade Member

            </a>

          `;

        }


        // =====================================
        // MATERI TERBUKA
        // =====================================

        else if (material.url) {

          button = `

            <a
              href="${escapeHtml(material.url)}"
              target="_blank"
              rel="noopener noreferrer"
              class="material-button"
            >

              ▶️ Mulai Belajar

            </a>

          `;

        }


        // =====================================
        // URL BELUM ADA
        // =====================================

        else {

          button = `

            <div
              class="material-button"
              style="
                background:#ddd;
                color:#555;
              "
            >

              Materi belum tersedia

            </div>

          `;

        }


        // =====================================
        // THUMBNAIL
        // =====================================

        let thumbnail = "🎥";


        if (material.thumbnail) {

          thumbnail = `

            <img
              src="${escapeHtml(
                material.thumbnail
              )}"
              alt="${escapeHtml(
                material.judul
              )}"
            >

          `;

        }


        return `

          <article
            class="
              material-card
              ${premium ? "premium" : ""}
            "
          >


            <div class="thumbnail">

              ${thumbnail}

            </div>


            <div class="material-body">


              <span class="material-type">

                ${escapeHtml(
                  material.kategori ||
                  "Pembelajaran"
                )}

              </span>


              <h3>

                ${escapeHtml(
                  material.judul ||
                  "Tanpa Judul"
                )}

              </h3>


              <p class="material-description">

                ${escapeHtml(
                  material.deskripsi ||
                  "Materi pembelajaran NgajiPlus."
                )}

              </p>


              ${
                premium

                ?

                `

                  <div class="premium-label">

                    🔐 Materi Premium

                  </div>

                `

                :

                `

                  <div class="free-label">

                    🟢 Materi Gratis

                  </div>

                `

              }


              ${button}


            </div>


          </article>

        `;

      }
    )
    .join("");

}



// ==================================================
// FILTER
// ==================================================

function filterMaterials() {


  const keyword =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  const category =
    document
      .getElementById(
        "categoryFilter"
      )
      .value
      .toLowerCase();


  const filtered =
    allMaterials.filter(
      material => {


        const judul =
          String(
            material.judul || ""
          ).toLowerCase();


        const deskripsi =
          String(
            material.deskripsi || ""
          ).toLowerCase();


        const kategori =
          String(
            material.kategori || ""
          ).toLowerCase();


        const cocokKata =
          !keyword ||
          judul.includes(keyword) ||
          deskripsi.includes(keyword);


        const cocokKategori =
          !category ||
          kategori.includes(category);


        return (
          cocokKata &&
          cocokKategori
        );

      }
    );


  displayMaterials(
    filtered
  );

}



// ==================================================
// EVENT FILTER
// ==================================================

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    filterMaterials
  );


document
  .getElementById("categoryFilter")
  .addEventListener(
    "change",
    filterMaterials
  );



// ==================================================
// JALANKAN
// ==================================================

loadMaterials();


</script>


</body>

    </html>
