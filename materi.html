<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Materi video pembelajaran NgajiPlus"
  >

  <title>Video Pembelajaran - NgajiPlus</title>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #f6f8f7;

      color:
        #202a24;

    }


    a {
      text-decoration: none;
    }


    /* ==============================
       HEADER
    ============================== */

    header {

      background: white;

      border-bottom:
        1px solid #e5e9e6;

      position:
        sticky;

      top: 0;

      z-index: 100;

    }


    .header-inner {

      max-width:
        1100px;

      margin:
        auto;

      padding:
        15px 20px;

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

    }


    .logo {

      color:
        #238b57;

      font-weight:
        bold;

      font-size:
        21px;

    }


    nav {

      display:
        flex;

      gap:
        8px;

      flex-wrap:
        wrap;

    }


    nav a {

      color:
        #555;

      padding:
        8px 12px;

      border-radius:
        8px;

      font-size:
        14px;

    }


    nav a:hover {

      background:
        #eef7f1;

      color:
        #238b57;

    }


    /* ==============================
       MAIN
    ============================== */

    main {

      max-width:
        1100px;

      margin:
        auto;

      padding:
        45px 20px;

    }


    .page-title {

      text-align:
        center;

      margin-bottom:
        35px;

    }


    .page-title h1 {

      margin:
        0 0 8px;

      font-size:
        35px;

    }


    .page-title p {

      margin:
        0;

      color:
        #737b76;

    }


    /* ==============================
       FILTER
    ============================== */

    .filter-box {

      background:
        white;

      padding:
        18px;

      border-radius:
        15px;

      border:
        1px solid #e5e9e6;

      margin-bottom:
        25px;

      display:
        flex;

      gap:
        10px;

      flex-wrap:
        wrap;

    }


    .filter-box input,
    .filter-box select {

      padding:
        12px;

      border:
        1px solid #ddd;

      border-radius:
        9px;

      outline:
        none;

      background:
        white;

    }


    .filter-box input {

      flex:
        1;

      min-width:
        200px;

    }


    /* ==============================
       MATERIAL GRID
    ============================== */

    #materialsContainer {

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        20px;

    }


    /* ==============================
       CARD
    ============================== */

    .material-card {

      background:
        white;

      border-radius:
        18px;

      overflow:
        hidden;

      border:
        1px solid #e3e8e5;

      transition:
        .2s;

    }


    .material-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 12px 30px
        rgba(0,0,0,.07);

    }


    /* PREMIUM */

    .material-card.premium {

      background:
        #202a24;

      color:
        white;

    }


    /* ==============================
       THUMBNAIL
    ============================== */

    .thumbnail {

      height:
        170px;

      background:
        #e5f2e9;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      font-size:
        50px;

      overflow:
        hidden;

    }


    .premium .thumbnail {

      background:
        #35463c;

    }


    .thumbnail img {

      width:
        100%;

      height:
        100%;

      object-fit:
        cover;

    }


    /* ==============================
       BODY
    ============================== */

    .material-body {

      padding:
        20px;

    }


    .material-type {

      display:
        inline-block;

      padding:
        5px 9px;

      border-radius:
        50px;

      background:
        #eef7f1;

      color:
        #238b57;

      font-size:
        11px;

      font-weight:
        bold;

      margin-bottom:
        10px;

    }


    .premium .material-type {

      background:
        #35463c;

      color:
        #b9e4c8;

    }


    .material-body h3 {

      margin:
        0 0 8px;

      font-size:
        18px;

    }


    .material-description {

      color:
        #737b76;

      font-size:
        14px;

      line-height:
        1.6;

      min-height:
        45px;

    }


    .premium .material-description {

      color:
        #c6cec9;

    }


    /* ==============================
       BUTTON
    ============================== */

    .material-button {

      display:
        block;

      text-align:
        center;

      margin-top:
        15px;

      padding:
        11px;

      border-radius:
        9px;

      background:
        #238b57;

      color:
        white;

      font-weight:
        bold;

      font-size:
        14px;

    }


    .material-button:hover {

      opacity:
        .9;

    }


    .premium-button {

      background:
        white;

      color:
        #202a24;

    }


    /* ==============================
       LABEL
    ============================== */

    .premium-label {

      margin-top:
        8px;

      font-size:
        12px;

      color:
        #b9e4c8;

    }


    .free-label {

      margin-top:
        8px;

      font-size:
        12px;

      color:
        #238b57;

    }


    /* ==============================
       INFO
    ============================== */

    .info {

      grid-column:
        1 / -1;

      background:
        #eef7f1;

      color:
        #238b57;

      padding:
        15px;

      border-radius:
        12px;

      text-align:
        center;

      font-size:
        14px;

    }


    /* ==============================
       LOADING
    ============================== */

    .loading {

      grid-column:
        1 / -1;

      text-align:
        center;

      padding:
        50px;

      color:
        #777;

    }


    /* ==============================
       EMPTY
    ============================== */

    .empty {

      grid-column:
        1 / -1;

      background:
        white;

      padding:
        50px;

      text-align:
        center;

      border-radius:
        15px;

      color:
        #777;

    }


    /* ==============================
       ERROR
    ============================== */

    .error {

      grid-column:
        1 / -1;

      background:
        #fff1f1;

      color:
        #b42318;

      padding:
        20px;

      border-radius:
        12px;

      text-align:
        center;

    }


    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 800px) {

      #materialsContainer {

        grid-template-columns:
          repeat(2, 1fr);

      }

    }


    @media (max-width: 550px) {

      .header-inner {

        flex-direction:
          column;

        gap:
          10px;

      }


      nav {

        width:
          100%;

        justify-content:
          center;

      }


      main {

        padding:
          30px 15px;

      }


      #materialsContainer {

        grid-template-columns:
          1fr;

      }


      .page-title h1 {

        font-size:
          28px;

      }

    }

  </style>

</head>

     HEADER
========================================== -->

<header>

  <div class="header-inner">


    <a
      href="index.html"
      class="logo"
    >

      📖 NgajiPlus

    </a>


    <nav>

      <a href="index.html">

      </a>

      <a href="materi.html">

      </a>

      <a href="audio.html">

      </a>

      <a href="pdf.html">
        PDF
      </a>

      <a href="dashboard.html">
        Dashboard
      </a>

    </nav>


  </div>

</header>



<!-- ==========================================
     MAIN
========================================== -->

<main>


  <div class="page-title">

    <h1>
      🎥 Video Pembelajaran
    </h1>

    <p>
      Temukan berbagai materi pembelajaran
      yang tersedia di NgajiPlus.
    </p>

  </div>



  <!-- FILTER -->

  <div class="filter-box">


    <input
      type="search"
      id="searchInput"
      placeholder="🔎 Cari materi..."
    >


    <select id="categoryFilter">

      <option value="">
        Semua Kategori
      </option>

      <option value="Al-Qur'an & Tahsin">
        Al-Qur'an & Tahsin
      </option>

      <option value="Fiqih">
        Fiqih
      </option>

      <option value="Aqidah">
        Aqidah
      </option>

      <option value="Akhlak & Adab">
        Akhlak & Adab
      </option>

      <option value="Bahasa Arab">
        Bahasa Arab
      </option>

      <option value="Hadits">
        Hadits
      </option>

      <option value="Tafsir">
        Tafsir
      </option>

      <option value="Sejarah Islam">
        Sejarah Islam
      </option>

    </select>


  </div>



  <!-- MATERIAL -->

  <div id="materialsContainer">

    <div class="loading">

      ⏳ Memuat materi...

    </div>

  </div>


</main>



<script>


// =====================================================
// DATA
// =====================================================

let catalogMaterials = [];

let availableMaterials = [];

let currentSession = null;



// =====================================================
// CEK LOGIN
// =====================================================

async function getSession() {

  const {
    data: {
      session
    }
  } =
  await supabaseClient.auth.getSession();


  return session;

}



// =====================================================
// AMBIL KATALOG
// =====================================================

async function loadCatalog() {


  const container =
    document.getElementById(
      "materialsContainer"
    );


  container.innerHTML = `

    <div class="loading">

      ⏳ Memuat materi...

    </div>

  `;


  // CEK SESSION

  currentSession =
    await getSession();



  // =================================================
  // KATALOG PUBLIK
  // =================================================

  const {
    data,
    error
  } =
  await supabaseClient.rpc(
    "get_material_catalog"
  );


  if (error) {

    console.error(error);


    container.innerHTML = `

      <div class="error">

        ❌ Gagal mengambil materi.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

    return;

  }


  catalogMaterials =
    data || [];



  // =================================================
  // MATERI YANG BOLEH DIAKSES
  // =================================================

  availableMaterials = [];


  if (currentSession) {


    const {
      data: available,
      error: accessError
    } =
    await supabaseClient.rpc(
      "get_available_materials"
    );


    if (!accessError) {

      availableMaterials =
        available || [];

    }

  }



  // TAMPILKAN

  displayMaterials(
    catalogMaterials
  );

}



// =====================================================
// CEK AKSES MATERI
// =====================================================

function canAccessMaterial(
  material
) {


  // ==========================================
  // MATERI GRATIS
  // ==========================================

  if (
    material.premium !== true
  ) {

    return true;

  }



  // ==========================================
  // MATERI PREMIUM
  // ==========================================

  return availableMaterials.some(

    item =>

      String(item.id) ===
      String(material.id)

  );

}



// =====================================================
// AMBIL URL MATERI
// =====================================================

function getMaterialUrl(
  material
) {


  // ==========================================
  // GRATIS
  // ==========================================

  if (
    material.premium !== true
  ) {

    return material.url || "";

  }



  // ==========================================
  // PREMIUM
  // ==========================================

  const found =
    availableMaterials.find(

      item =>

        String(item.id) ===
        String(material.id)

    );


  if (!found) {

    return "";

  }


  return found.url || "";

}



// =====================================================
// TAMPILKAN MATERI
// =====================================================

function displayMaterials(
  materials
) {


  const container =
    document.getElementById(
      "materialsContainer"
    );


  if (!materials.length) {

    container.innerHTML = `

      <div class="empty">

        📚 Belum ada materi.

      </div>

    `;

    return;

  }



  // =================================================
  // STATUS USER
  // =================================================

  const isLoggedIn =
    !!currentSession;


  const hasPremiumAccess =
    availableMaterials.some(

      material =>

        material.premium === true

    );



  let info = "";



  if (!isLoggedIn) {

    info = `

      <div class="info">

        🔐 Silakan login untuk
        mengakses materi premium.

      </div>

    `;

  }

  else if (!hasPremiumAccess) {

    info = `

      <div class="info">

        🔒 Akun Anda masih GRATIS.
        Upgrade member untuk membuka
        materi premium.

      </div>

    `;

  }

  else {

    info = `

      <div class="info">

        ✅ Membership aktif.
        Materi premium dapat diakses.

      </div>

    `;

  }



  // =================================================
  // BUAT CARD
  // =================================================

  const cards =

    materials

      .map(

        material => {


          const premium =
            material.premium === true;


          const accessible =
            canAccessMaterial(
              material
            );


          const url =
            getMaterialUrl(
              material
            );



          // ========================================
          // BUTTON
          // ========================================

          let button;



          // PREMIUM TIDAK BOLEH DIAKSES

          if (
            premium &&
            !accessible
          ) {

            button = `

              <a

                href="dashboard.html"

                class="
                  material-button
                  premium-button
                "

              >

                🔒 Upgrade Member

              </a>

            `;

          }



          // MATERI BOLEH DIAKSES

          else if (url) {

            button = `

              <a

                href="${escapeHtml(
                  url
                )}"

                target="_blank"

                rel="
                  noopener
                  noreferrer
                "

                class="material-button"

              >

                ▶️ Mulai Belajar

              </a>

            `;

          }



          // URL KOSONG

          else {

            button = `

              <div

                class="material-button"

                style="
                  background:#ddd;
                  color:#555;
                "

              >

                Materi belum tersedia

              </div>

            `;

          }



          // ========================================
          // THUMBNAIL
          // ========================================

          let thumbnail;



          if (
            material.thumbnail
          ) {

            thumbnail = `

              <img

                src="${escapeHtml(
                  material.thumbnail
                )}"

                alt="${escapeHtml(
                  material.judul
                )}"

              >

            `;

          }

          else {

            thumbnail =
              premium
              ? "🔒"
              : "🎥";

          }



          // ========================================
          // CARD
          // ========================================

          return `

            <article

              class="
                material-card
                ${
                  premium
                  ? "premium"
                  : ""
                }
              "

            >


              <div class="thumbnail">

                ${thumbnail}

              </div>



              <div class="material-body">


                <span class="material-type">

                  ${escapeHtml(
                    material.kategori ||
                    "Pembelajaran"
                  )}

                </span>



                <h3>

                  ${escapeHtml(
                    material.judul ||
                    "Tanpa Judul"
                  )}

                </h3>



                <p
                  class="material-description"
                >

                  ${escapeHtml(
                    material.deskripsi ||
                    "Materi pembelajaran NgajiPlus."
                  )}

                </p>



                ${
                  premium

                  ?

                  `

                    <div
                      class="premium-label"
                    >

                      🔐 Materi Premium

                    </div>

                  `

                  :

                  `

                    <div
                      class="free-label"
                    >

                      🟢 Materi Gratis

                    </div>

                  `

                }



                ${button}


              </div>


            </article>

          `;

        }

      )

      .join("");



  container.innerHTML =
    info + cards;

}



// =====================================================
// FILTER
// =====================================================

function filterMaterials() {


  const keyword =

    document

      .getElementById(
        "searchInput"
      )

      .value

      .toLowerCase()

      .trim();



  const category =

    document

      .getElementById(
        "categoryFilter"
      )

      .value

      .toLowerCase();



  const filtered =

    catalogMaterials.filter(

      material => {


        const judul =

          String(
            material.judul || ""
          )
          .toLowerCase();



        const deskripsi =

          String(
            material.deskripsi || ""
          )
          .toLowerCase();



        const kategori =

          String(
            material.kategori || ""
          )
          .toLowerCase();



        const matchKeyword =

          !keyword ||

          judul.includes(
            keyword
          ) ||

          deskripsi.includes(
            keyword
          );



        const matchCategory =

          !category ||

          kategori.includes(
            category
          );



        return (

          matchKeyword &&

          matchCategory

        );

      }

    );



  displayMaterials(
    filtered
  );

}



// =====================================================
// SEARCH
// =====================================================

document

  .getElementById(
    "searchInput"
  )

  .addEve
