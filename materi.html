<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Pembelajaran - NgajiPlus</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f6f8f7;
  color: #202a24;
}

header {
  background: white;
  border-bottom: 1px solid #e5e9e6;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: #238b57;
  font-weight: bold;
  font-size: 21px;
  text-decoration: none;
}

nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

nav a {
  color: #555;
  padding: 8px 12px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 14px;
}

nav a:hover {
  background: #eef7f1;
  color: #238b57;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 40px 20px;
}

.page-title {
  text-align: center;
  margin-bottom: 30px;
}

.page-title h1 {
  margin: 0 0 8px;
  font-size: 35px;
}

.page-title p {
  margin: 0;
  color: #737b76;
}

.filter-box {
  background: white;
  padding: 18px;
  border-radius: 15px;
  border: 1px solid #e5e9e6;
  margin-bottom: 25px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.filter-box input,
.filter-box select {
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 9px;
  outline: none;
  background: white;
  font-size: 14px;
}

.filter-box input {
  flex: 1;
  min-width: 200px;
}

#materialsContainer {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.material-card {
  background: white;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid #e3e8e5;
}

.material-card.premium {
  background: #202a24;
  color: white;
}

.thumbnail {
  height: 170px;
  background: #e5f2e9;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 55px;
  overflow: hidden;
}

.premium .thumbnail {
  background: #35463c;
}

.thumbnail img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.material-body {
  padding: 20px;
}

.material-type {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 50px;
  background: #eef7f1;
  color: #238b57;
  font-size: 11px;
  font-weight: bold;
  margin-bottom: 10px;
}

.premium .material-type {
  background: #35463c;
  color: #b9e4c8;
}

.material-body h3 {
  margin: 0 0 8px;
  font-size: 18px;
}

.material-description {
  color: #737b76;
  font-size: 14px;
  line-height: 1.6;
  min-height: 45px;
}

.premium .material-description {
  color: #c6cec9;
}

.label-free {
  color: #238b57;
  font-size: 12px;
  font-weight: bold;
  margin-top: 10px;
}

.label-premium {
  color: #b9e4c8;
  font-size: 12px;
  font-weight: bold;
  margin-top: 10px;
}

.material-button {
  display: block;
  text-align: center;
  margin-top: 15px;
  padding: 11px;
  border-radius: 9px;
  background: #238b57;
  color: white;
  font-weight: bold;
  font-size: 14px;
  text-decoration: none;
}

.locked-button {
  background: white;
  color: #202a24;
}

.loading {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px;
  color: #777;
}

.error {
  grid-column: 1 / -1;
  background: #fff1f1;
  color: #b42318;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
}

.empty {
  grid-column: 1 / -1;
  background: white;
  padding: 50px;
  border-radius: 15px;
  text-align: center;
  color: #777;
}

@media (max-width: 800px) {

  #materialsContainer {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media (max-width: 550px) {

  .header-inner {
    flex-direction: column;
    gap: 10px;
  }

  nav {
    justify-content: center;
  }

  main {
    padding: 30px 15px;
  }

  #materialsContainer {
    grid-template-columns: 1fr;
  }

  .page-title h1 {
    font-size: 28px;
  }

}

</style>

</head>

<body>


<header>

<div class="header-inner">

<a href="index.html" class="logo">
📖 NgajiPlus
</a>

<nav>

<a href="index.html">Beranda</a>

<a href="materi.html">Video</a>

<a href="audio.html">Audio</a>

<a href="pdf.html">PDF</a>

<a href="dashboard.html">Dashboard</a>

</nav>

</div>

</header>


<main>


<div class="page-title">

<h1>
🎥 Video Pembelajaran
</h1>

<p>
Temukan berbagai materi pembelajaran yang tersedia di NgajiPlus.
</p>

</div>


<div class="filter-box">

<input
type="search"
id="searchInput"
placeholder="🔎 Cari materi..."
>

<select id="categoryFilter">

<option value="">
Semua Kategori
</option>

<option value="Al-Qur'an & Tahsin">
Al-Qur'an & Tahsin
</option>

<option value="Fiqih">
Fiqih
</option>

<option value="Aqidah">
Aqidah
</option>

<option value="Akhlak & Adab">
Akhlak & Adab
</option>

<option value="Bahasa Arab">
Bahasa Arab
</option>

<option value="Hadits">
Hadits
</option>

<option value="Tafsir">
Tafsir
</option>

<option value="Sejarah Islam">
Sejarah Islam
</option>

</select>

</div>


<div id="materialsContainer">

<div class="loading">
⏳ Mengambil data dari Supabase...
</div>

</div>


</main>


<script>

let allMaterials = [];


// ==========================================
// AMBIL DATA MATERIAL
// ==========================================

async function loadMaterials() {

  const container =
    document.getElementById(
      "materialsContainer"
    );


  try {

    container.innerHTML = `

      <div class="loading">

        ⏳ Mengambil data dari Supabase...

      </div>

    `;


    console.log(
      "Mulai mengambil materials..."
    );


    // LANGSUNG KE TABEL MATERIALS
    // TIDAK MENGGUNAKAN RPC
    // TIDAK MENGGUNAKAN getSession

    const result =
      await supabaseClient

        .from("materials")

        .select("*")

        .order(
          "created_at",
          {
            ascending: false
          }
        );


    console.log(
      "Hasil Supabase:",
      result
    );


    if (result.error) {

      throw result.error;

    }


    allMaterials =
      result.data || [];


    console.log(
      "Jumlah materi:",
      allMaterials.length
    );


    if (
      allMaterials.length === 0
    ) {

      container.innerHTML = `

        <div class="empty">

          📚 Belum ada materi.

        </div>

      `;

      return;

    }


    displayMaterials(
      allMaterials
    );


  }
  catch (error) {

    console.error(
      "ERROR SUPABASE:",
      error
    );


    container.innerHTML = `

      <div class="error">

        ❌ Gagal mengambil materi.

        <br><br>

        <strong>
          ${escapeHtml(
            error.message
          )}
        </strong>

      </div>

    `;

  }

}


// ==========================================
// TAMPILKAN MATERIAL
// ==========================================

function displayMaterials(
  materials
) {

  const container =
    document.getElementById(
      "materialsContainer"
    );


  if (
    materials.length === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        📚 Materi tidak ditemukan.

      </div>

    `;

    return;

  }


  container.innerHTML =
    materials
      .map(
        material => {


          const premium =
            material.premium === true;


          let thumbnail =
            premium
            ? "🔒"
            : "🎥";


          if (
            material.thumbnail
          ) {

            thumbnail = `

              <img
                src="${escapeHtml(
                  material.thumbnail
                )}"
                alt="${escapeHtml(
                  material.judul
                )}"
              >

            `;

          }


          let button;


          if (premium) {

            button = `

              <a
                href="login.html"
                class="
                  material-button
                  locked-button
                "
              >

                🔒 Login / Upgrade

              </a>

            `;

          }

          else if (
            material.url
          ) {

            button = `

              <a
                href="${escapeHtml(
                  material.url
                )}"
                target="_blank"
                rel="noopener noreferrer"
                class="material-button"
              >

                ▶️ Mulai Belajar

              </a>

            `;

          }

          else {

            button = `

              <div
                class="material-button"
                style="
                  background:#ddd;
                  color:#555;
                "
              >

                Materi belum tersedia

              </div>

            `;

          }


          return `

            <article
              class="
                material-card
                ${premium ? "premium" : ""}
              "
            >


              <div class="thumbnail">

                ${thumbnail}

              </div>


              <div class="material-body">


                <span class="material-type">

                  ${escapeHtml(
                    material.kategori ||
                    "Pembelajaran"
                  )}

                </span>


                <h3>

                  ${escapeHtml(
                    material.judul ||
                    "Tanpa Judul"
                  )}

                </h3>


                <p class="material-description">

                  ${escapeHtml(
                    material.deskripsi ||
                    "Materi pembelajaran NgajiPlus."
                  )}

                </p>


                ${
                  premium

                  ?

                  `

                    <div class="label-premium">

                      🔐 Materi Premium

                    </div>

                  `

                  :

                  `

                    <div class="label-free">

                      🟢 Materi Gratis

                    </div>

                  `

                }


                ${button}


              </div>


            </article>

          `;

        }
      )
      .join("");

}


// ==========================================
// FILTER
// ==========================================

function filterMaterials() {

  const keyword =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  const category =
    document
      .getElementById(
        "categoryFilter"
      )
      .value
      .toLowerCase()
      .trim();


  const filtered =
    allMaterials.filter(
      material => {


        const judul =
          String(
            material.judul || ""
          )
          .toLowerCase();


        const deskripsi =
          String(
            material.deskripsi || ""
          )
          .toLowerCase();


        const kategori =
          String(
            material.kategori || ""
          )
          .toLowerCase();


        const cocokKeyword =
          !keyword ||
          judul.includes(keyword) ||
          deskripsi.includes(keyword);


        const cocokKategori =
          !category ||
          kategori.includes(category);


        return (
          cocokKeyword &&
          cocokKategori
        );

      }
    );


  displayMaterials(
    filtered
  );

}


document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    filterMaterials
  );


document
  .getElementById(
    "categoryFilter"
  )
  .addEventListener(
    "change",
    filterMaterials
  );


// ==========================================
// KEAMANAN HTML
// ==========================================

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// ==========================================
// MULAI
// ==========================================

loadMaterials();

</script>


</body>

  </html>
