<meta charset="UTF-8">

    content="width=device-width, initial-scale=1.0"
>

<style>

/* =====================================================
RESET
===================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5faf7;
    color:#1f2933;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input,
select{
    font-family:inherit;
}


/* =====================================================
HEADER
===================================================== */

header{
    background:white;
    border-bottom:1px solid #e5ebe7;
    position:sticky;
    top:0;
    z-index:1000;
}

.nav{
    max-width:1200px;
    margin:auto;
    padding:10px 18px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#008f55;
    font-weight:bold;
    font-size:15px;
}

.nav-buttons{
    display:flex;
    gap:7px;
}

.nav-btn{
    border:0;
    border-radius:8px;
    padding:8px 12px;
    font-size:11px;
    font-weight:bold;
}

.login-btn{
    background:#009b59;
    color:white;
}

.dashboard-btn{
    background:#009b59;
    color:white;
}

.logout-btn{
    background:#eeeeee;
    color:#555;
    cursor:pointer;
}


/* =====================================================
HERO
===================================================== */

.hero{
    max-width:1200px;
    margin:auto;
    padding:35px 20px 20px;
}

.hero h1{
    margin:0 0 6px;
    font-size:28px;
}

.hero h1 span{
    color:#009b59;
}

.hero p{
    margin:0;
    color:#718078;
    font-size:12px;
}


/* =====================================================
NOTICE
===================================================== */

.notice{
    max-width:1200px;
    margin:0 auto 15px;
    padding:10px 14px;

    background:#fff8d9;
    border:1px solid #f0df91;
    border-radius:8px;

    color:#75621c;
    font-size:11px;
}

.notice.success{
    background:#e5f9ed;
    border-color:#bde8cf;
    color:#087a47;
}

.notice.warning{
    background:#fff8d9;
    border-color:#f0df91;
    color:#75621c;
}

.notice.error{
    background:#ffe9e9;
    border-color:#f3c2c2;
    color:#b42318;
}


/* =====================================================
TOOLS
===================================================== */

.tools{
    max-width:1200px;
    margin:auto;
    padding:0 20px 20px;

    display:grid;
    grid-template-columns:1fr 180px;
    gap:10px;
}

.search,
.filter{
    width:100%;
    padding:11px 13px;

    border:1px solid #dce5df;
    border-radius:8px;

    background:white;
    outline:none;

    font-size:11px;
}

.search:focus,
.filter:focus{
    border-color:#009b59;
}


/* =====================================================
MATERIAL AREA
===================================================== */

.material-area{
    background:#eef9f3;
    padding:25px 20px 55px;
}

.material-grid{
    max-width:1200px;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}


/* =====================================================
CARD
===================================================== */

.card{
    background:white;
    border:1px solid #e1e9e4;
    border-radius:13px;
    overflow:hidden;

    box-shadow:0 1px 3px rgba(0,0,0,.04);
}

.thumb{
    height:175px;
    background:#d9f5e6;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.default-thumb{
    font-size:45px;
}

.lock{
    position:absolute;
    inset:0;

    background:rgba(25,60,45,.58);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:48px;
}


/* =====================================================
CONTENT
===================================================== */

.content{
    padding:13px;
}

.type{
    display:inline-block;

    padding:3px 6px;

    border-radius:20px;

    background:#edf8f2;
    color:#008f55;

    font-size:9px;
    font-weight:bold;

    margin-bottom:6px;
}

.title{
    margin:0 0 5px;

    font-size:13px;
    font-weight:bold;
}

.description{
    color:#7a8580;

    font-size:10px;

    min-height:30px;

    margin-bottom:8px;
}

.meta{
    display:flex;

    justify-content:space-between;
    align-items:center;

    margin-bottom:10px;

    font-size:9px;

    color:#718078;
}

.badge{
    padding:3px 6px;

    border-radius:20px;

    font-weight:bold;
}

.free{
    background:#dcf8e7;
    color:#087b45;
}

.premium{
    background:#fff0b7;
    color:#8b6900;
}


/* =====================================================
BUTTON
===================================================== */

.open-btn,
.locked-btn{
    width:100%;

    display:block;

    text-align:center;

    border:0;

    border-radius:7px;

    padding:9px;

    font-size:10px;
    font-weight:bold;
}

.open-btn{
    background:#009b59;
    color:white;

    cursor:pointer;
}

.open-btn:hover{
    background:#00874e;
}

.locked-btn{
    background:#eeeeee;
    color:#777;

    cursor:not-allowed;
}


/* =====================================================
LOADING / EMPTY / ERROR
===================================================== */

.loading,
.empty,
.error{
    max-width:1200px;

    margin:auto;

    background:white;

    padding:30px;

    text-align:center;

    border-radius:12px;

    color:#777;

    font-size:12px;
}

.error{
    color:#b42318;
}


/* =====================================================
FOOTER
===================================================== */

footer{
    background:#0c1711;

    color:white;

    padding:30px 20px;
}

.footer-inner{
    max-width:1200px;
    margin:auto;
}

.footer-logo{
    color:#55c990;

    font-weight:bold;

    font-size:13px;
}

.footer-text{
    color:#91a098;

    font-size:10px;
}


/* =====================================================
TABLET
===================================================== */

@media(max-width:800px){

    .material-grid{
        grid-template-columns:repeat(2,1fr);
    }

}


/* =====================================================
MOBILE
===================================================== */

@media(max-width:550px){

    .hero{
        padding:30px 15px 15px;
    }

    .hero h1{
        font-size:24px;
    }

    .tools{
        padding-left:15px;
        padding-right:15px;

        grid-template-columns:1fr 140px;
    }

    .material-area{
        padding-left:15px;
        padding-right:15px;
    }

    .material-grid{
        grid-template-columns:1fr;
    }

    .thumb{
        height:185px;
    }

    .nav{
        padding:9px 12px;
    }

    .logo{
        font-size:12px;
    }

    .nav-btn{
        padding:7px 9px;
        font-size:10px;
    }

}

</style>

</head>


<body>

<!-- =====================================================

<script>

/* =====================================================
VARIABLE
===================================================== */

let materials = [];

let currentUser = null;

let membershipActive = false;

let currentProfile = null;


/* =====================================================
ELEMENT
===================================================== */

const materialContainer =
    document.getElementById(
        "materialContainer"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const categoryFilter =
    document.getElementById(
        "categoryFilter"
    );

const notice =
    document.getElementById(
        "notice"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );

const dashboardBtn =
    document.getElementById(
        "dashboardBtn"
    );

const logoutBtn =
    document.getElementById(
        "logoutBtn"
    );


/* =====================================================
CHECK USER
===================================================== */

async function checkUser(){

    try{

        const result =
            await supabaseClient.auth.getUser();


        if(result.error){

            throw result.error;

        }


        currentUser =
            result.data.user;


        /* =========================================
        BELUM LOGIN
        ========================================= */

        if(!currentUser){

            membershipActive =
                false;

            currentProfile =
                null;


            loginBtn.style.display =
                "inline-block";

            dashboardBtn.style.display =
                "none";

            logoutBtn.style.display =
                "none";


            notice.className =
                "notice warning";


            notice.innerHTML =
                "🔐 Anda belum login. " +
                "Materi gratis dapat dipelajari. " +
                "Materi premium memerlukan membership aktif.";


            return;

        }


        /* =========================================
        SUDAH LOGIN
        ========================================= */

        loginBtn.style.display =
            "none";

        dashboardBtn.style.display =
            "inline-block";

        logoutBtn.style.display =
            "inline-block";


        /* =========================================
        AMBIL PROFILE
        ========================================= */

        const profileResult =
            await supabaseClient
                .from("profiles")
                .select(
                    "id,nama,status,paket,berlaku_sampai"
                )
                .eq(
                    "id",
                    currentUser.id
                )
                .maybeSingle();


        if(profileResult.error){

            console.error(
                "PROFILE ERROR:",
                profileResult.error
            );


            membershipActive =
                false;


            notice.className =
                "notice error";


            notice.innerHTML =
                "⚠️ Profil akun belum dapat dibaca.";


            return;

        }


        currentProfile =
            profileResult.data;


        /* =========================================
        PROFILE TIDAK ADA
        ========================================= */

        if(!currentProfile){

            membershipActive =
                false;


            notice.className =
                "notice warning";


            notice.innerHTML =
                "👤 Anda sudah login, tetapi " +
                "profil membership belum tersedia.";


            return;

        }


        /* =========================================
        STATUS
        ========================================= */

        const status =
            String(
                currentProfile.status || ""
            )
            .toLowerCase()
            .trim();


        const statusAktif =
            status === "aktif";


        /* =========================================
        TANGGAL
        ========================================= */

        let tanggalAktif =
            false;


        if(
            currentProfile.berlaku_sampai
        ){

            const tanggal =
                new Date(
                    currentProfile.berlaku_sampai
                );


            const sekarang =
                new Date();


            tanggalAktif =
                !isNaN(
                    tanggal.getTime()
                ) &&
                tanggal >= sekarang;

        }


        /* =========================================
        MEMBERSHIP FINAL
        ========================================= */

        membershipActive =
            statusAktif &&
            tanggalAktif;


        /* =========================================
        NOTICE
        ========================================= */

        if(membershipActive){

            notice.className =
                "notice success";


            notice.innerHTML =
                "✅ Anda sudah login. Membership " +
                "<strong>" +
                escapeHTML(
                    currentProfile.paket ||
                    "Premium"
                ) +
                "</strong> aktif sampai " +
                "<strong>" +
                formatTanggal(
                    currentProfile.berlaku_sampai
                ) +
                "</strong>. Semua materi premium dapat diakses.";

        }

        else{

            notice.className =
                "notice warning";


            notice.innerHTML =
                "👤 Anda sudah login, tetapi " +
                "membership premium belum aktif. " +
                "Materi gratis tetap dapat dipelajari.";

        }

    }

    catch(error){

        console.error(
            "CHECK USER ERROR:",
            error
        );


        currentUser =
            null;

        membershipActive =
            false;


        loginBtn.style.display =
            "inline-block";

        dashboardBtn.style.display =
            "none";

        logoutBtn.style.display =
            "none";


        notice.className =
            "notice error";


        notice.innerHTML =
            "⚠️ Gagal memeriksa status akun.";

    }

}


/* =====================================================
FORMAT TANGGAL
===================================================== */

function formatTanggal(value){

    if(!value){

        return "-";

    }


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return String(value);

    }


    return date.toLocaleDateString(
        "id-ID",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

}


/* =====================================================
LOAD MATERIALS
===================================================== */

async function loadMaterials(){

    materialContainer.innerHTML = `
        <div class="loading">
            ⏳ Mengambil materi...
        </div>
    `;


    try{

        const result =
            await supabaseClient
                .from("materials")
                .select(
                    "id,judul,deskripsi,kategori,tipe,url,thumbnail,premium"
                )
                .order(
                    "id",
                    {
                        ascending:false
                    }
                );


        if(result.error){

            throw result.error;

        }


        materials =
            result.data || [];


        renderMaterials();

    }

    catch(error){

        console.error(
            "LOAD MATERIAL ERROR:",
            error
        );


        materialContainer.innerHTML = `
            <div class="error">

                ❌ Gagal mengambil materi.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>
        `;

    }

}


/* =====================================================
RENDER MATERIALS
===================================================== */

function renderMaterials(){

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();


    const category =
        categoryFilter.value;


    const filtered =
        materials.filter(
            function(item){

                const title =
                    String(
                        item.judul || ""
                    )
                    .toLowerCase();


                const description =
                    String(
                        item.deskripsi || ""
                    )
                    .toLowerCase();


                const kategori =
                    String(
                        item.kategori || ""
                    );


                const cocokSearch =
                    !keyword ||
                    title.includes(keyword) ||
                    description.includes(keyword);


                const cocokKategori =
                    !category ||
                    kategori === category;


                return (
                    cocokSearch &&
                    cocokKategori
                );

            }
        );


    if(
        filtered.length === 0
    ){

        materialContainer.innerHTML = `
            <div class="empty">
                📚 Materi tidak ditemukan.
            </div>
        `;

        return;

    }


    const grid =
        document.createElement(
            "div"
        );


    grid.className =
        "material-grid";


    filtered.forEach(
        function(item){

            grid.appendChild(
                createMaterialCard(item)
            );

        }
    );


    materialContainer.innerHTML =
        "";


    materialContainer.appendChild(
        grid
    );

}


/* =====================================================
CREATE MATERIAL CARD
===================================================== */

function createMaterialCard(item){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "card";


    const isPremium =
        item.premium === true;


    const canOpen =
        !isPremium ||
        membershipActive;


    /* =========================================
    TYPE
    ========================================= */

    const type =
        String(
            item.tipe || "materi"
        )
        .toLowerCase();


    let typeIcon =
        "📚";


    if(type === "video"){

        typeIcon =
            "🎥";

    }

    else if(type === "audio"){

        typeIcon =
            "🎧";

    }

    else if(type === "pdf"){

        typeIcon =
            "📄";

    }


    /* =========================================
    THUMBNAIL
    ========================================= */

    let thumbnailHTML = `
        <div class="default-thumb">
            ${typeIcon}
        </div>
    `;


    if(item.thumbnail){

        thumbnailHTML = `
            <img
                src="${escapeAttribute(
                    item.thumbnail
                )}"
                alt="${escapeAttribute(
                    item.judul ||
                    "Materi"
                )}"
                onerror="
                    this.style.display='none';
                    this.parentElement
                        .querySelector('.fallback')
                        .style.display='flex';
                "
            >

            <div
                class="default-thumb fallback"
                style="display:none"
            >
                ${typeIcon}
            </div>
        `;

    }


    /* =========================================
    PREMIUM LOCK
    ========================================= */

    if(
        isPremium &&
        !canOpen
    ){

        thumbnailHTML += `
            <div class="lock">
                🔐
            </div>
        `;

    }


    /* =========================================
    BUTTON
    ========================================= */

    let buttonHTML;


    if(canOpen){

        buttonHTML = `
            <button
                class="open-btn"
                onclick="openMaterial(${Number(
                    item.id
                )})"
            >
                📖 Buka Materi
            </button>
        `;

    }

    else{

        buttonHTML = `
            <button
                class="locked-btn"
                disabled
            >
                🔐 Membership Diperlukan
            </button>
        `;

    }


    /* =========================================
    CARD HTML
    ========================================= */

    card.innerHTML = `

        <div class="thumb">

            ${thumbnailHTML}

        </div>


        <div class="content">

            <span class="type">

                ${typeIcon}

                ${escapeHTML(type)}

            </span>


            <h3 class="title">

                ${escapeHTML(
                    item.judul ||
                    "Tanpa Judul"
                )}

            </h3>


            <div class="description">

                ${escapeHTML(
                    item.deskripsi ||
                    item.kategori ||
                    "Materi pembelajaran"
                )}

            </div>


            <div class="meta">

                <span>

                    📚

                    ${escapeHTML(
                        item.kategori ||
                        "-"
                    )}

                </span>


                ${
                    isPremium

                    ?

                    `
                    <span class="badge premium">
                        🔐 Premium
                    </span>
                    `

                    :

                    `
                    <span class="badge free">
                        ✓ Gratis
                    </span>
                    `
                }

            </div>


            ${buttonHTML}

        </div>

    `;


    return card;

}


/* =====================================================
OPEN MATERIAL
===================================================== */

/*
    PENTING:

    Tombol Buka Materi TIDAK lagi langsung
    menuju YouTube.

    Sekarang alurnya:

    akademi.html
          ↓
    player.html?id=ID
          ↓
    player membaca data materials
          ↓
    Video / Audio / PDF
*/

function openMaterial(id){

    const item =
        materials.find(
            function(material){

                return Number(
                    material.id
                ) === Number(id);

            }
        );


    if(!item){

        alert(
            "Materi tidak ditemukan."
        );

        return;

    }


    /* =========================================
    PREMIUM CHECK
    ========================================= */

    if(
        item.premium === true &&
        !membershipActive
    ){

        alert(
            "🔐 Materi ini khusus member premium.\n\n" +
            "Silakan aktifkan membership terlebih dahulu."
        );

        return;

    }


    /* =========================================
    CEK URL
    ========================================= */

    if(!item.url){

        alert(
            "Materi ini belum memiliki URL."
        );

        return;

    }


    /* =========================================
    MASUK KE PLAYER
    ========================================= */

    window.location.href =
        "player.html?id=" +
        encodeURIComponent(
            item.id
        );

}


/* =====================================================
LOGOUT
===================================================== */

async function logout(){

    try{

        const result =
            await supabaseClient.auth.signOut();


        if(result.error){

            throw result.error;

        }


        location.reload();

    }

    catch(error){

        alert(
            "❌ Gagal keluar:\n\n" +
            error.message
        );

    }

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


function escapeAttribute(value){

    return escapeHTML(value);

}


/* =====================================================
SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    renderMaterials
);


categoryFilter.addEventListener(
    "change",
    renderMaterials
);


/* =====================================================
AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
    function(event){

        console.log(
            "AUTH EVENT:",
            event
        );


        if(
            event === "SIGNED_IN" ||
            event === "SIGNED_OUT" ||
            event === "TOKEN_REFRESHED"
        ){

            setTimeout(
                async function(){

                    await checkUser();

                    renderMaterials();

                },
                0
            );

        }

    }
);

START

async function init(){

    await checkUser();

    await loadMaterials();

}


init();

</script>
