<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="NgajiPlus Akademi - Perpustakaan Pembelajaran Islam">

<meta name="theme-color"
      content="#009b59">

<title>NgajiPlus Akademi</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f6faf8;
    color:#1f2933;
    line-height:1.5;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input,
select{
    font-family:inherit;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    background:white;
    border-bottom:1px solid #e5ebe7;
    position:sticky;
    top:0;
    z-index:1000;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    padding:13px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    display:flex;
    align-items:center;
    gap:7px;

    color:#168b57;
    font-size:18px;
    font-weight:bold;
}

.logo-icon{
    font-size:21px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.login-button{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    background:#009b59;
    color:white;

    padding:8px 14px;

    border-radius:8px;

    font-size:12px;
    font-weight:bold;
}


/* =====================================================
   MAIN
===================================================== */

main{
    min-height:600px;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    max-width:1200px;
    margin:auto;

    padding:38px 20px 22px;
}

.hero h1{
    margin:0 0 5px;

    font-size:32px;
    line-height:1.2;
}

.hero h1 span{
    color:#009b59;
}

.hero p{
    margin:0;

    color:#6b7280;
    font-size:13px;
}


/* =====================================================
   STATUS INFO
===================================================== */

.status-info{
    max-width:1200px;
    margin:0 auto 18px;

    padding:0 20px;
}

.status-box{
    background:#fff7d6;

    border:1px solid #f1df9a;

    border-radius:10px;

    padding:10px 14px;

    font-size:11px;

    color:#806c18;
}

.status-box.active{
    background:#e7f8ed;
    border-color:#bce7cb;
    color:#176c3e;
}


/* =====================================================
   TOOLS
===================================================== */

.tools{
    max-width:1200px;
    margin:auto;

    padding:0 20px 20px;

    display:grid;

    grid-template-columns:1fr 190px;

    gap:10px;
}

.search{
    width:100%;

    border:1px solid #dfe7e2;

    background:white;

    border-radius:8px;

    padding:11px 13px;

    font-size:12px;

    outline:none;
}

.search:focus{
    border-color:#009b59;
}

.category{
    width:100%;

    border:1px solid #dfe7e2;

    background:white;

    border-radius:8px;

    padding:11px 13px;

    font-size:12px;

    outline:none;
}


/* =====================================================
   MATERIAL AREA
===================================================== */

.material-area{
    background:#edf8f2;

    padding:25px 20px 50px;
}

.material-container{
    max-width:1200px;
    margin:auto;
}


/* =====================================================
   LOADING
===================================================== */

.loading,
.empty,
.error{
    background:white;

    border-radius:12px;

    padding:35px 20px;

    text-align:center;

    font-size:13px;

    color:#7b8580;
}

.error{
    color:#b42318;

    border:1px solid #f2c6c2;
}


/* =====================================================
   GRID
===================================================== */

.material-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;
}


/* =====================================================
   CARD
===================================================== */

.material-card{
    background:white;

    border:1px solid #e0e8e3;

    border-radius:14px;

    overflow:hidden;

    box-shadow:
        0 2px 5px
        rgba(0,0,0,.025);

    transition:.2s;
}

.material-card:hover{
    transform:translateY(-2px);

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.07);
}


/* =====================================================
   IMAGE
===================================================== */

.material-image{
    height:175px;

    position:relative;

    background:#d9f1e4;

    overflow:hidden;
}

.material-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

.thumbnail-fallback{
    width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:55px;

    background:
        linear-gradient(
            135deg,
            #dff5e8,
            #bfe9d1
        );
}


/* =====================================================
   PREMIUM LOCK
===================================================== */

.premium .material-image{
    background:#517c68;
}

.premium .material-image img{
    filter:brightness(.35);
}

.lock{
    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:48px;
}


/* =====================================================
   CONTENT
===================================================== */

.material-content{
    padding:14px;
}

.type{
    display:inline-block;

    background:#eef8f2;

    color:#168b57;

    border-radius:20px;

    padding:3px 7px;

    font-size:9px;

    font-weight:bold;

    margin-bottom:6px;
}

.material-content h3{
    margin:0 0 5px;

    font-size:14px;

    line-height:1.4;

    min-height:40px;
}

.description{
    margin:0 0 10px;

    color:#7a8580;

    font-size:10px;

    min-height:32px;
}

.info-row{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:5px;

    margin-bottom:10px;
}

.category-name{
    color:#777;

    font-size:9px;
}

.status{
    padding:3px 7px;

    border-radius:20px;

    font-size:9px;

    font-weight:bold;
}

.status-free{
    background:#dff7e7;

    color:#168447;
}

.status-premium{
    background:#fff0bd;

    color:#8a6500;
}


/* =====================================================
   BUTTON
===================================================== */

.material-button{
    width:100%;

    border:none;

    border-radius:8px;

    padding:9px;

    cursor:pointer;

    font-size:11px;

    font-weight:bold;

    background:#009b59;

    color:white;
}

.material-button:hover{
    background:#00864d;
}

.material-button.locked{
    background:#eeeeee;

    color:#777;

    cursor:pointer;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{
    background:#101b15;

    color:white;

    padding:35px 20px;
}

.footer-inner{
    max-width:1200px;
    margin:auto;
}

.footer-logo{
    color:#5fc894;

    font-weight:bold;

    font-size:14px;

    margin-bottom:7px;
}

.footer-text{
    color:#9aa8a0;

    font-size:10px;

    margin:0;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:850px){

    .material-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

}


@media(max-width:600px){

    .header-inner{
        padding:10px 14px;
    }

    .logo{
        font-size:15px;
    }

    .login-button{
        font-size:10px;

        padding:7px 10px;
    }

    .hero{
        padding:
            30px 15px 20px;
    }

    .hero h1{
        font-size:25px;
    }

    .hero p{
        font-size:11px;
    }

    .status-info{
        padding:0 15px;
    }

    .tools{
        padding:
            0 15px 15px;

        grid-template-columns:1fr;
    }

    .material-area{
        padding:
            20px 15px 40px;
    }

    .material-grid{
        grid-template-columns:1fr;
    }

    .material-image{
        height:190px;
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:380px){

    .hero h1{
        font-size:23px;
    }

    .material-image{
        height:170px;
    }

}

</style>

</head>

<!-- =====================================================
     JAVASCRIPT

<script>

/* =====================================================
   1. SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://ksgywgdrfskqsufchbcm.supabase.co";


/*
   MASUKKAN PUBLISHABLE / ANON KEY ANDA DI SINI.

   JANGAN gunakan service_role key.
*/

const SUPABASE_ANON_KEY =
    "sb_publishable_HmFKwHMCISfN_YOoiLx3-A_MWnG9yG7";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );



/* =====================================================
   2. ELEMENT
===================================================== */

const materialContainer =
    document.getElementById(
        "materialContainer"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const categoryFilter =
    document.getElementById(
        "categoryFilter"
    );


const statusBox =
    document.getElementById(
        "statusBox"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );



/* =====================================================
   3. VARIABLE
===================================================== */

let allMaterials = [];

let currentUser = null;

let currentProfile = null;

let isPremiumMember = false;



/* =====================================================
   4. CEK USER LOGIN
===================================================== */

async function checkUser(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getSession();


        if(error){

            console.error(
                "Session error:",
                error
            );

            return;

        }


        currentUser =
            data.session?.user || null;


        /*
           BELUM LOGIN
        */

        if(!currentUser){

            isPremiumMember = false;

            loginButton.textContent =
                "🔐 Login";

            loginButton.href =
                "login.html";


            statusBox.className =
                "status-box";


            statusBox.innerHTML =
                "🔐 Silakan login. " +
                "Materi gratis dapat dipelajari, " +
                "materi premium memerlukan membership aktif.";


            return;

        }


        /*
           SUDAH LOGIN
        */

        loginButton.textContent =
            "📊 Dashboard";

        loginButton.href =
            "dashboard.html";


        /*
           AMBIL PROFILE
        */

        const {
            data: profile,
            error: profileError
        } =
        await supabaseClient
            .from("profiles")
            .select(
                "id,nama,status,paket,berlaku_sampai"
            )
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


        if(profileError){

            console.error(
                "Profile error:",
                profileError
            );


            statusBox.innerHTML =
                "⚠️ Login berhasil, " +
                "tetapi profile belum dapat dibaca.";

            return;

        }


        currentProfile =
            profile;


        /*
           PROFILE TIDAK ADA
        */

        if(!profile){

            isPremiumMember = false;


            statusBox.innerHTML =
                "👤 Anda sudah login, " +
                "tetapi data profile belum tersedia.";


            return;

        }


        /*
           STATUS
        */

        const status =
            String(
                profile.status || ""
            )
            .trim()
            .toLowerCase();


        /*
           CEK TANGGAL
        */

        let dateValid = true;


        if(profile.berlaku_sampai){

            const endDate =
                new Date(
                    profile.berlaku_sampai
                    + "T00:00:00"
                );


            const today =
                new Date();


            today.setHours(
                0,
                0,
                0,
                0
            );


            dateValid =
                endDate >= today;

        }


        /*
           PREMIUM AKTIF
        */

        isPremiumMember =
            status === "aktif"
            &&
            dateValid;


        console.log(
            "Nama:",
            profile.nama
        );

        console.log(
            "Status:",
            profile.status
        );

        console.log(
            "Berlaku:",
            profile.berlaku_sampai
        );

        console.log(
            "Premium:",
            isPremiumMember
        );


        /*
           TAMPILKAN STATUS
        */

        if(isPremiumMember){

            statusBox.className =
                "status-box active";


            statusBox.innerHTML =
                "✅ Anda login sebagai " +
                "<strong>" +
                escapeHtml(
                    profile.nama ||
                    "Member"
                ) +
                "</strong>. " +
                "Membership aktif. " +
                "Materi premium dapat diakses.";

        }

        else{

            statusBox.className =
                "status-box";


            statusBox.innerHTML =
                "👤 Anda sudah login, " +
                "tetapi membership premium " +
                "belum aktif.";

        }


    }
    catch(error){

        console.error(
            "Check user error:",
            error
        );

    }

}



/* =====================================================
   5. AMBIL MATERIAL
===================================================== */

async function loadMaterials(){

    materialContainer.innerHTML = `
        <div class="loading">
            ⏳ Mengambil materi...
        </div>
    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("materials")
        .select(`
            id,
            judul,
            deskripsi,
            kategori,
            tipe,
            url,
            thumbnail,
            premium
        `)
        .order(
            "id",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Materials error:",
            error
        );


        materialContainer.innerHTML = `
            <div class="error">

                ❌ Gagal mengambil materi.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>
        `;

        return;

    }


    allMaterials =
        data || [];


    renderMaterials();

}



/* =====================================================
   6. RENDER MATERIAL
===================================================== */

function renderMaterials(){

    const keyword =
        String(
            searchInput.value || ""
        )
        .trim()
        .toLowerCase();


    const selectedCategory =
        categoryFilter.value || "";


    const filtered =
        allMaterials.filter(
            material => {


                const title =
                    String(
                        material.judul || ""
                    )
                    .toLowerCase();


                const description =
                    String(
                        material.deskripsi || ""
                    )
                    .toLowerCase();


                const category =
                    String(
                        material.kategori || ""
                    );


                const matchSearch =
                    !keyword
                    ||
                    title.includes(
                        keyword
                    )
                    ||
                    description.includes(
                        keyword
                    );


                const matchCategory =
                    !selectedCategory
                    ||
                    category ===
                    selectedCategory;


                return (
                    matchSearch
                    &&
                    matchCategory
                );

            }
        );


    if(filtered.length === 0){

        materialContainer.innerHTML = `
            <div class="empty">

                📚 Materi tidak ditemukan.

            </div>
        `;

        return;

    }


    materialContainer.innerHTML = `

        <div class="material-grid">

            ${filtered
                .map(
                    material =>
                        createMaterialCard(
                            material
                        )
                )
                .join("")
            }

        </div>

    `;

}



/* =====================================================
   7. CREATE CARD
===================================================== */

function createMaterialCard(
    material
){

    const premium =
        material.premium === true;


    /*
       THUMBNAIL
    */

    let imageHTML = "";


    if(material.thumbnail){

        imageHTML = `

            <img
                src="${escapeAttribute(
                    material.thumbnail
                )}"
                alt="${escapeAttribute(
                    material.judul ||
                    "Materi"
                )}"
                loading="lazy"
                onerror="
                    this.style.display='none';
                    this.nextElementSibling.style.display='flex';
                "
            >

            <div
                class="thumbnail-fallback"
                style="display:none;"
            >
                ${getTypeIcon(
                    material.tipe
                )}
            </div>

        `;

    }
    else{

        imageHTML = `

            <div class="thumbnail-fallback">

                ${getTypeIcon(
                    material.tipe
                )}

            </div>

        `;

    }



    /*
       PREMIUM TAPI BELUM AKTIF
    */

    if(
        premium
        &&
        !isPremiumMember
    ){

        return `

        <article
            class="material-card premium"
        >


            <div class="material-image">

                ${imageHTML}


                <div class="lock">

                    🔐

                </div>

            </div>



            <div class="material-content">


                <span class="type">

                    ${getTypeIcon(
                        material.tipe
                    )}

                    ${escapeHtml(
                        material.tipe ||
                        "Materi"
                    )}

                </span>


                <h3>

                    ${escapeHtml(
                        material.judul ||
                        "Tanpa judul"
                    )}

                </h3>


                <p class="description">

                    ${escapeHtml(
                        material.deskripsi ||
                        ""
                    )}

                </p>


                <div class="info-row">


                    <span
                        class="category-name"
                    >

                        📚
                        ${escapeHtml(
                            material.kategori ||
                            "-"
                        )}

                    </span>


                    <span
                        class="status status-premium"
                    >

                        🔐 Premium

                    </span>


                </div>


                <button
                    class="material-button locked"
                    onclick="openPremium()"
                >

                    🔐
                    ${
                        currentUser
                        ?
                        "Membership Diperlukan"
                        :
                        "Login untuk Membuka"
                    }

                </button>


            </div>


        </article>

        `;

    }



    /*
       GRATIS
       ATAU PREMIUM UNTUK MEMBER AKTIF
    */

    return `

    <article
        class="material-card"
    >


        <div class="material-image">

            ${imageHTML}

        </div>



        <div class="material-content">


            <span class="type">

                ${getTypeIcon(
                    material.tipe
                )}

                ${escapeHtml(
                    material.tipe ||
                    "Materi"
                )}

            </span>


            <h3>

                ${escapeHtml(
                    material.judul ||
                    "Tanpa judul"
                )}

            </h3>


            <p class="description">

                ${escapeHtml(
                    material.deskripsi ||
                    ""
                )}

            </p>


            <div class="info-row">


                <span
                    class="category-name"
                >

                    📚
                    ${escapeHtml(
                        material.kategori ||
                        "-"
                    )}

                </span>


                ${
                    premium

                    ?

                    `
                    <span
                        class="status status-premium"
                    >
                        🔓 Premium
                    </span>
                    `

                    :

                    `
                    <span
                        class="status status-free"
                    >
                        ✓ Gratis
                    </span>
                    `
                }


            </div>


            <button
                class="material-button"
                onclick="openMaterial(
                    '${escapeAttribute(
                        material.url || ""
                    )}'
                )"
            >

                📖 Buka Materi

            </button>


        </div>


    </article>

    `;

}



/* =====================================================
   8. OPEN MATERIAL
===================================================== */

function openMaterial(url){

    if(!url){

        alert(
            "Link materi belum tersedia."
        );

        return;

    }


    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

}



/* =====================================================
   9. OPEN PREMIUM
===================================================== */

function openPremium(){

    if(!currentUser){

        window.location.href =
            "login.html";

        return;

    }


    window.location.href =
        "dashboard.html";

}



/* =====================================================
   10. TYPE ICON
===================================================== */

function getTypeIcon(type){

    const value =
        String(
            type || ""
        )
        .trim()
        .toLowerCase();


    if(value === "audio"){

        return "🎧";

    }


    if(value === "pdf"){

        return "📄";

    }


    return "🎥";

}



/* =====================================================
   11. ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(value){

    return escapeHtml(value);

}



/* =====================================================
   12. SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    renderMaterials
);


categoryFilter.addEventListener(
    "change",
    renderMaterials
);

===================================================== */

supabaseClient
    .auth
    .onAuthStateChange(
        async function(
            event,
            session
        ){

            currentUser =
                session?.user || null;


            await checkUser();

            renderMaterials();

        }
    );

    await loadMaterials();
