<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Materi - NgajiPlus</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><header class="header"><a class="logo" href="index.html"><div class="logo-icon"><i class="fa-solid fa-book-quran"></i></div><div><h2>NgajiPlus</h2><small>Belajar Islam, Lebih Mudah</small></div></a><nav class="nav"><a href="index.html">Beranda</a><a href="kategori.html">Materi</a><a href="audio.html">Audio</a><a href="pdf.html">PDF</a></nav><div class="search"><input id="globalSearch" placeholder="Cari materi..."><i class="fa-solid fa-magnifying-glass"></i></div></header><main class="section"><div class="section-head"><div><span class="eyebrow">MATERI</span><h1 id="title">Semua Materi</h1><p>Video, audio, dan PDF pembelajaran.</p></div><span id="count"></span></div><div class="filter"><button class="active" data-f="all">Semua</button><button data-f="video">Video</button><button data-f="audio">Audio</button><button data-f="pdf">PDF</button></div><div id="grid" class="grid"></div></main><footer><div class="footer-logo"><i class="fa-solid fa-book-quran"></i><div><h2>NgajiPlus</h2><p>Belajar Islam, Lebih Mudah</p></div></div><div class="copy">© 2026 NgajiPlus. Semua hak dilindungi.</div></footer><script src="data.js"></script><script>
const params=new URLSearchParams(location.search),tema=params.get('tema'),q=params.get('q')||'';if(tema)title.textContent=tema;
function card(x){return `<article class="card"><div class="thumb"><img src="${x.thumbnail}"><a class="play" href="materi.html?id=${x.id}"><i class="fa-solid fa-arrow-right"></i></a></div><div class="body"><div class="badges">${x.video.tersedia?'<span class="badge"><i class="fa-solid fa-video"></i></span>':''}${x.audio.tersedia?'<span class="badge"><i class="fa-solid fa-headphones"></i></span>':''}${x.pdf.tersedia?'<span class="badge pdf"><i class="fa-solid fa-file-pdf"></i></span>':''}</div><h3>${x.judul}</h3><div class="teacher">${x.pengajar}</div><small>${x.kategori}</small><a class="learn" href="materi.html?id=${x.id}">Buka Materi →</a></div></article>`}
let base=materi.filter(x=>!tema||x.kategori.toLowerCase()===tema.toLowerCase()).filter(x=>(x.judul+' '+x.kategori+' '+x.pengajar).toLowerCase().includes(q.toLowerCase())),filtered=base;
function render(){grid.innerHTML=filtered.length?filtered.map(card).join(''):'<div class="empty" style="grid-column:1/-1">Materi tidak ditemukan.</div>';count.textContent=filtered.length+' materi'}
document.querySelectorAll('.filter button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.filter button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');let f=btn.dataset.f;filtered=base.filter(x=>f==='all'||(f==='video'&&x.video.tersedia)||(f==='audio'&&x.audio.tersedia)||(f==='pdf'&&x.pdf.tersedia));render()});
globalSearch.value=q;globalSearch.onkeydown=e=>{if(e.key==='Enter')location.href='kategori.html?q='+encodeURIComponent(e.target.value)};render();
</script></body></html>
