<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Ujian - NgajiPlus Akademi</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#001f16;--p:#003426;--b:#08785a;--t:#ecfff7;--m:#9bcbbd;--g:#00d96f;--d:#8b2029}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px Arial,sans-serif}.nav{padding:12px 16px;background:#00271c;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:10}.brand{color:var(--g);font-weight:bold}.nav a,.btn{padding:8px 11px;border:1px solid var(--b);border-radius:9px;background:#063d30;color:var(--t);cursor:pointer;text-decoration:none}.btn.primary{background:#00a957;color:#001c12}.btn.danger{background:var(--d)}.wrap{max-width:1100px;margin:auto;padding:16px}.hero{padding:20px;border-radius:17px;background:linear-gradient(135deg,#087f4b,#00a94f);border:1px solid #13d878}.hero h1{margin:0 0 6px}.notice,.card,.modalbox{background:var(--p);border:1px solid var(--b);border-radius:15px;padding:14px;margin:10px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}input,select,textarea{width:100%;padding:10px;background:#002d21;color:var(--t);border:1px solid var(--b);border-radius:9px}input,select{flex:1;min-width:180px}textarea{min-height:80px}label{display:block;color:var(--m);margin:9px 0 4px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meta{color:var(--m);font-size:12px;line-height:1.6}.badges{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.badge{border:1px solid var(--b);border-radius:999px;padding:4px 7px;font-size:11px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;padding:25px;color:var(--m);border:1px dashed var(--b);border-radius:12px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:30;padding:15px;align-items:center;justify-content:center}.modal.show{display:flex}.modalbox{width:min(760px,100%);max-height:92vh;overflow:auto}.head{display:flex;justify-content:space-between;align-items:center}.close{background:none;border:0;color:var(--t);font-size:24px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.qitem{background:#003c2e;border:1px solid var(--b);border-radius:11px;padding:11px;margin:7px 0}.qtext{font-weight:bold;margin:7px 0}.options{color:var(--m);font-size:12px;line-height:1.6}.footer{text-align:center;color:var(--m);padding:25px;font-size:12px}@media(max-width:700px){.grid,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.nav{align-items:flex-start}.hero h1{font-size:22px}}
</style></head><body><nav class="nav"><div class="brand">📖 NgajiPlus Akademi</div><div><a href="akademi.html">📚 Akademi</a> <a href="admin.html">🧰 Materi</a> <button class="btn" onclick="toggleTheme()">☀️</button></div></nav><main class="wrap"><section class="hero"><h1>📝 Admin Ujian</h1><p>Kelola ujian setiap level, KKM, percobaan, dan bank soal.</p></section><div id="msg" class="notice">Memuat...</div><div class="toolbar"><input id="search" placeholder="🔎 Cari course atau level..." oninput="render()"><select id="cf" onchange="render()"><option value="">Semua Course</option></select><button class="btn primary" onclick="newExam()">＋ Buat Ujian</button><button class="btn" onclick="loadAll()">↻ Refresh</button></div><section id="list" class="grid"></section></main><footer class="footer">📖 NgajiPlus Akademi — Admin Ujian</footer>
<div id="em" class="modal"><div class="modalbox"><div class="head"><h2 id="et">Buat Ujian</h2><button class="close" onclick="cm('em')">×</button></div><input type="hidden" id="eid"><label>Level *</label><select id="lid"></select><div class="formgrid"><div><label>Judul Ujian *</label><input id="judul" value="Ujian Level"></div><div><label>KKM *</label><input id="kkm" type="number" value="80" min="0" max="100"></div><div><label>Nilai Maksimal</label><input id="max" type="number" value="100" min="1" max="100"></div><div><label>Waktu (menit), kosong = tanpa batas</label><input id="time" type="number" min="1"></div><div class="full"><label>Deskripsi</label><textarea id="desc"></textarea></div><div class="full"><label>Instruksi Peserta</label><textarea id="ins" placeholder="Pilih satu jawaban yang paling tepat."></textarea></div></div><p><label><input id="ulang" type="checkbox" checked style="width:auto"> Boleh mengulang</label> <label><input id="aktif" type="checkbox" checked style="width:auto"> Ujian aktif</label></p><div class="actions"><button class="btn" onclick="cm('em')">Batal</button><button class="btn primary" onclick="saveExam()">💾 Simpan</button></div></div></div>
<div id="qm" class="modal"><div class="modalbox"><div class="head"><h2 id="qt">📝 Bank Soal</h2><button class="close" onclick="cm('qm')">×</button></div><div id="qi" class="notice"></div><div id="qs"></div><hr style="border-color:var(--b)"><h3>＋ Tambah/Edit Soal</h3><input type="hidden" id="qid"><div class="formgrid"><div><label>Nomor *</label><input id="ord" type="number" min="1" value="1"></div><div><label>Poin *</label><input id="point" type="number" min="1" value="1"></div><div class="full"><label>Pertanyaan *</label><textarea id="question"></textarea></div><div><label>Opsi A *</label><input id="a"></div><div><label>Opsi B *</label><input id="b"></div><div><label>Opsi C *</label><input id="c"></div><div><label>Opsi D *</label><input id="d"></div><div><label>Jawaban Benar *</label><select id="correct"><option>A</option><option>B</option><option>C</option><option>D</option></select></div></div><div class="actions"><button class="btn" onclick="clearQ()">Kosongkan</button><button class="btn primary" onclick="saveQ()">💾 Simpan Soal</button></div></div></div>
<script>
const URL='https://ksgywgdrfskqsufchbcm.supabase.co',KEY='sb_publishable_HmFKwHMCISfN_YOoiLx3-A_MWnG9yG7',db=supabase.createClient(URL,KEY);let courses=[],levels=[],exams=[],cur=null;
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function msg(x,ok=true){$('msg').textContent=x;$('msg').style.borderColor=ok?'var(--b)':'#a8323b'}function cm(x){$(x).classList.remove('show')}function toggleTheme(){document.body.classList.toggle('light');localStorage.setItem('np_theme',document.body.classList.contains('light')?'light':'dark')}
async function admin(){
      let {data:{user},error:ue}=await db.auth.getUser();
      if(ue) throw ue;
      if(!user) throw Error('Anda harus login sebagai admin.');
      let {data:a,error:ae}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();
      if(!ae && a) return;
      let {data:p,error:pe}=await db.from('profiles').select('is_admin').eq('id',user.id).maybeSingle();
      if(pe) throw pe;
      if(p?.is_admin) return;
      if(ae) throw ae;
      throw Error('Akses admin ditolak.');
    }
async function loadAll(){
      try{
        msg('⏳ Memuat data...');
        const timeout=new Promise((_,rej)=>setTimeout(()=>rej(Error('Koneksi ke Supabase terlalu lama. Tekan Refresh lalu coba lagi.')),15000));
        const job=(async()=>{
          await admin();
          const [c,l,e]=await Promise.all([
            db.from('courses').select('id,nama,deskripsi,urutan,aktif').order('urutan'),
            db.from('levels').select('id,course_id,nama,deskripsi,urutan,aktif').order('course_id').order('urutan'),
            db.from('exams').select('*').order('id')
          ]);
          if(c.error)throw Error('Courses: '+c.error.message);
          if(l.error)throw Error('Levels: '+l.error.message);
          if(e.error)throw Error('Exams: '+e.error.message);
          courses=c.data||[]; levels=l.data||[]; exams=e.data||[];
          $('cf').innerHTML='<option value="">Semua Course</option>'+courses.map(c=>`<option value="${c.id}">${esc(c.nama)}</option>`).join('');
          $('lid').innerHTML=levels.map(l=>{let c=courses.find(x=>x.id===l.course_id);return `<option value="${l.id}">${esc(c?.nama||'Course')} — ${esc(l.nama)}</option>`}).join('');
          render();
          msg(`✅ Berhasil: ${courses.length} course, ${levels.length} level, ${exams.length} ujian.`);
        })();
        await Promise.race([job,timeout]);
      }catch(e){
        console.error('ADMIN UJIAN:',e);
        msg('❌ '+(e.message||e),false);
        $('list').innerHTML='<div class="empty">Gagal memuat data. Lihat pesan merah di atas.</div>';
      }
    }
function render(){let s=$('search').value.toLowerCase(),f=$('cf').value;$('list').innerHTML=levels.filter(l=>{let c=courses.find(x=>x.id===l.course_id);return(!f||String(l.course_id)===f)&&(!s||`${c?.nama} ${l.nama}`.toLowerCase().includes(s))}).map(l=>{let c=courses.find(x=>x.id===l.course_id),e=exams.find(x=>x.level_id===l.id);return `<article class="card"><h3>📚 ${esc(c?.nama)}</h3><b>${esc(l.nama)}</b><div class="meta">${esc(l.deskripsi||'Tidak ada deskripsi')}</div><div class="badges"><span class="badge">${e?'📝 Ujian tersedia':'⚪ Belum ada ujian'}</span>${e?`<span class="badge">🎯 KKM ${e.passing_score}</span><span class="badge">${e.boleh_mengulang?'🔄 Bisa ulang':'🚫 Tidak bisa ulang'}</span><span class="badge">${e.aktif?'🟢 Aktif':'⚫ Nonaktif'}</span>`:''}</div><div class="actions">${e?`<button class="btn primary" onclick="questions(${e.id})">📝 Kelola Soal</button><button class="btn" onclick="editExam(${e.id})">✏️ Edit</button><button class="btn danger" onclick="delExam(${e.id})">🗑️ Hapus</button>`:`<button class="btn primary" onclick="newExam(${l.id})">＋ Buat Ujian</button>`}</div></article>`}).join('')||'<div class="empty">Tidak ada level.</div>'}
function newExam(level=null){$('eid').value='';$('et').textContent='Buat Ujian';if(level)$('lid').value=level;$('judul').value='Ujian Level';$('kkm').value=80;$('max').value=100;$('time').value='';$('desc').value='';$('ins').value='';$('ulang').checked=true;$('aktif').checked=true;$('em').classList.add('show')}
function editExam(id){let e=exams.find(x=>x.id===id);$('eid').value=e.id;$('et').textContent='Edit Ujian';$('lid').value=e.level_id;$('judul').value=e.judul;$('kkm').value=e.passing_score;$('max').value=e.nilai_maksimal;$('time').value=e.waktu_menit??'';$('desc').value=e.deskripsi||'';$('ins').value=e.instruksi||'';$('ulang').checked=e.boleh_mengulang;$('aktif').checked=e.aktif;$('em').classList.add('show')}
async function saveExam(){try{let p={level_id:+$('lid').value,judul:$('judul').value.trim(),passing_score:+$('kkm').value,nilai_maksimal:+$('max').value,waktu_menit:$('time').value?+$('time').value:null,deskripsi:$('desc').value.trim()||null,instruksi:$('ins').value.trim()||null,boleh_mengulang:$('ulang').checked,aktif:$('aktif').checked,updated_at:new Date().toISOString()};if(!p.judul)throw Error('Judul wajib diisi.');let id=$('eid').value,r=id?await db.from('exams').update(p).eq('id',id):await db.from('exams').insert(p);if(r.error)throw r.error;cm('em');await loadAll()}catch(e){alert(e.message)}}
async function delExam(id){if(!confirm('Hapus ujian dan semua soal di dalamnya?'))return;let r=await db.from('exams').delete().eq('id',id);if(r.error)alert(r.error.message);else loadAll()}
async function questions(id){cur=exams.find(x=>x.id===id);$('qt').textContent='📝 Bank Soal — '+cur.judul;$('qi').textContent=`KKM ${cur.passing_score} • ${cur.boleh_mengulang?'Boleh mengulang':'Tidak boleh mengulang'} • Nilai maksimal ${cur.nilai_maksimal}`;clearQ();await loadQ();$('qm').classList.add('show')}
async function loadQ(){let r=await db.from('exam_questions').select('*').eq('exam_id',cur.id).order('urutan');if(r.error){$('qs').innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}$('qs').innerHTML=r.data?.length?r.data.map(q=>`<div class="qitem"><b>Soal ${q.urutan} • ${q.poin} poin</b><div class="qtext">${esc(q.pertanyaan)}</div><div class="options">A. ${esc(q.opsi_a)}<br>B. ${esc(q.opsi_b)}<br>C. ${esc(q.opsi_c)}<br>D. ${esc(q.opsi_d)}<br>✅ Kunci: ${q.jawaban_benar}</div><div class="actions"><button class="btn" onclick='editQ(${JSON.stringify(q)})'>✏️ Edit</button><button class="btn danger" onclick="delQ(${q.id})">🗑️ Hapus</button></div></div>`).join(''):'<div class="empty">Belum ada soal.</div>'}
function clearQ(){$('qid').value='';$('ord').value=Math.max(1,document.querySelectorAll('.qitem').length+1);$('point').value=1;$('question').value='';$('a').value='';$('b').value='';$('c').value='';$('d').value='';$('correct').value='A'}function editQ(q){$('qid').value=q.id;$('ord').value=q.urutan;$('point').value=q.poin;$('question').value=q.pertanyaan;$('a').value=q.opsi_a;$('b').value=q.opsi_b;$('c').value=q.opsi_c;$('d').value=q.opsi_d;$('correct').value=q.jawaban_benar;window.scrollTo(0,document.body.scrollHeight)}
async function saveQ(){try{let p={exam_id:cur.id,urutan:+$('ord').value,poin:+$('point').value,pertanyaan:$('question').value.trim(),opsi_a:$('a').value.trim(),opsi_b:$('b').value.trim(),opsi_c:$('c').value.trim(),opsi_d:$('d').value.trim(),jawaban_benar:$('correct').value,updated_at:new Date().toISOString()};if(!p.pertanyaan||!p.opsi_a||!p.opsi_b||!p.opsi_c||!p.opsi_d)throw Error('Pertanyaan dan semua opsi wajib diisi.');let id=$('qid').value,r=id?await db.from('exam_questions').update(p).eq('id',id):await db.from('exam_questions').insert(p);if(r.error)throw r.error;clearQ();await loadQ()}catch(e){alert(e.message)}}async function delQ(id){if(!confirm('Hapus soal ini?'))return;let r=await db.from('exam_questions').delete().eq('id',id);if(r.error)alert(r.error.message);else loadQ()}
window.addEventListener('DOMContentLoaded',()=>{
      try{ loadAll(); }
      catch(e){ msg('❌ '+(e.message||e),false); console.error(e); }
    });
</script></body></html>
