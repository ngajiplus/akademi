/* =====================================================

/* =====================================================

===================================================== */

.tools{
    max-width:1200px;

    display:grid;

    grid-template-columns:
        1fr 180px;

    gap:10px;
}

.search,

    width:100%;

/* =====================================================

===================================================== */

.material-area{

}

.material-grid{

   CARD
===================================================== */

.card{

/* =====================================================
   THUMB
===================================================== */

.thumb{

    background:#d9f5e6;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;
}

.thumb img{
    width:100%;

    height:100%;

    object-fit:cover;
}

.default-thumb{
    font-size:45px;
}

.lock{
    position:absolute;

    inset:0;

    background:
        rgba(25,60,45,.58);

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:48px;

/* =====================================================

}

}

.description{

.meta{

}

/* =====================================================

===================================================== */

.open-btn{

}

.open-btn:hover{

}

.locked-btn{
    background:#eeeeee;

}


/* =====================================================
   LOADING / EMPTY / ERROR
===================================================== */

.loading,

/* =====================================================

footer{

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://ksgywgdrfskqsufchbcm.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_HmFKwHMCISfN_YOoiLx3-A_MWnG9yG7";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================================
   VARIABLES
===================================================== */

let materials = [];

let currentUser = null;

let currentProfile = null;

let membershipActive = false;


/* =====================================================
   ELEMENTS
===================================================== */

const materialContainer =
    document.getElementById(
        "materialContainer"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const categoryFilter =
    document.getElementById(
        "categoryFilter"
    );


const notice =
    document.getElementById(
        "notice"
    );


const loginBtn =
    document.getElementById(
        "loginBtn"
    );


const registerBtn =
    document.getElementById(
        "registerBtn"
    );


const profileBtn =
    document.getElementById(
        "profileBtn"
    );


const profileNameNav =
    document.getElementById(
        "profileNameNav"
    );


const dashboardBtn =
    document.getElementById(
        "dashboardBtn"
    );


const logoutBtn =
    document.getElementById(
        "logoutBtn"
    );


/* =====================================================
   SHOW LOGGED OUT
===================================================== */

function showLoggedOut(){

    loginBtn.style.display =
        "inline-block";


    registerBtn.style.display =
        "inline-block";


    profileBtn.style.display =
        "none";


    dashboardBtn.style.display =
        "none";


    logoutBtn.style.display =
        "none";


    profileNameNav.textContent =
        "Akun";


    currentUser =
        null;


    currentProfile =
        null;


    membershipActive =
        false;


    notice.className =
        "notice warning";


    notice.innerHTML =

        "🔐 Anda belum login. " +

        "Materi gratis dapat dipelajari. " +

        "Materi premium memerlukan membership aktif.";

}


/* =====================================================
   SHOW LOGGED IN
===================================================== */

function showLoggedIn(){

    loginBtn.style.display =
        "none";


    registerBtn.style.display =
        "none";


    profileBtn.style.display =
        "inline-block";


    dashboardBtn.style.display =
        "inline-block";


    logoutBtn.style.display =
        "inline-block";

}


/* =====================================================
   CHECK USER
===================================================== */

async function checkUser(){

    try{

        const result =
            await supabaseClient
                .auth
                .getSession();


        if(result.error){

            throw result.error;

        }


        currentUser =
            result.data.session
                ? result.data.session.user
                : null;


        /* =========================================
           BELUM LOGIN
        ========================================= */

        if(!currentUser){

            showLoggedOut();

            return;

        }


        /* =========================================
           SUDAH LOGIN
        ========================================= */

        showLoggedIn();


        const metadata =
            currentUser.user_metadata || {};


        const namaAuth =
            metadata.full_name ||
            metadata.name ||
            metadata.nama ||
            currentUser.email ||
            "Akun";


        profileNameNav.textContent =
            namaAuth;


        /* =========================================
           PROFILE
        ========================================= */

        const profileResult =
            await supabaseClient

                .from("profiles")

                .select(
                    "id,nama,status,paket,berlaku_sampai,avatar_url"
                )

                .eq(
                    "id",
                    currentUser.id
                )

                .maybeSingle();


        if(profileResult.error){

            console.error(
                "PROFILE ERROR:",
                profileResult.error
            );


            currentProfile =
                null;


            membershipActive =
                false;


            notice.className =
                "notice warning";


            notice.innerHTML =

                "👤 Anda sudah login sebagai " +

                "<strong>" +

                escapeHTML(
                    namaAuth
                ) +

                "</strong>, " +

                "tetapi profil membership belum dapat dibaca. " +

                "Materi gratis tetap dapat dipelajari.";


            return;

        }


        currentProfile =
            profileResult.data;


        /* =========================================
           PROFILE TIDAK ADA
        ========================================= */

        if(!currentProfile){

            membershipActive =
                false;


            notice.className =
                "notice warning";


            notice.innerHTML =

                "👤 Anda sudah login sebagai " +

                "<strong>" +

                escapeHTML(
                    namaAuth
                ) +

                "</strong>. " +

                "Profil membership belum tersedia.";


            return;

        }


        /* =========================================
           NAMA DARI PROFILE
        ========================================= */

        const namaProfile =
            currentProfile.nama;


        if(
            namaProfile &&
            String(
                namaProfile
            ).trim()
        ){

            profileNameNav.textContent =
                namaProfile;

        }


        /* =========================================
           STATUS
        ========================================= */

        const status =
            String(
                currentProfile.status ||
                ""
            )
            .toLowerCase()
            .trim();


        const statusAktif =
            status === "aktif";


        /* =========================================
           TANGGAL
        ========================================= */

        let tanggalAktif =
            false;


        if(
            currentProfile.berlaku_sampai
        ){

            const tanggal =
                new Date(
                    currentProfile.berlaku_sampai
                );


            const sekarang =
                new Date();


            tanggalAktif =
                !isNaN(
                    tanggal.getTime()
                ) &&
                tanggal >= sekarang;

        }


        /*
           Jika status aktif dan tanggal masih berlaku,
           membership dianggap aktif.
        */

        membershipActive =
            statusAktif &&
            tanggalAktif;


        /* =========================================
           NOTICE
        ========================================= */

        if(membershipActive){

            notice.className =
                "notice success";


            notice.innerHTML =

                "✅ Anda sudah login. " +

                "Membership " +

                "<strong>" +

                escapeHTML(
                    currentProfile.paket ||
                    "Premium"
                ) +

                "</strong> aktif sampai " +

                "<strong>" +

                formatTanggal(
                    currentProfile.berlaku_sampai
                ) +

                "</strong>. Semua materi premium dapat diakses.";

        }

        else{

            notice.className =
                "notice warning";


            notice.innerHTML =

                "👤 Anda sudah login sebagai " +

                "<strong>" +

                escapeHTML(
                    currentProfile.nama ||
                    namaAuth
                ) +

                "</strong>, " +

                "tetapi membership premium belum aktif. " +

                "Materi gratis tetap dapat dipelajari.";

        }

    }

    catch(error){

        console.error(
            "CHECK USER ERROR:",
            error
        );


        showLoggedOut();


        notice.className =
            "notice error";


        notice.innerHTML =

            "⚠️ Gagal memeriksa status akun.<br><br>" +

            escapeHTML(
                error.message ||
                "Terjadi kesalahan."
            );

    }

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(value){

    if(!value){

        return "-";

    }


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return String(value);

    }


    return date.toLocaleDateString(
        "id-ID",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

}


/* =====================================================
   LOAD MATERIALS
===================================================== */

async function loadMaterials(){

    materialContainer.innerHTML = `

        <div class="loading">

            ⏳ Mengambil materi...

        </div>

    `;


    try{

        const result =
            await supabaseClient

                .from("materials")

                .select(
                    "id,judul,deskripsi,kategori,tipe,type,url,thumbnail,premium"
                )

                .order(
                    "id",
                    {
                        ascending:false
                    }
                );


        if(result.error){

            throw result.error;

        }


        materials =
            result.data || [];


        renderMaterials();

    }

    catch(error){

        console.error(
            "LOAD MATERIAL ERROR:",
            error
        );


        materialContainer.innerHTML = `

            <div class="error">

                ❌ Gagal mengambil materi.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


/* =====================================================
   RENDER MATERIALS
===================================================== */

function renderMaterials(){

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();


    const category =
        categoryFilter.value;


    const filtered =
        materials.filter(
            function(item){

                const title =
                    String(
                        item.judul ||
                        ""
                    )
                    .toLowerCase();


                const description =
                    String(
                        item.deskripsi ||
                        ""
                    )
                    .toLowerCase();


                const kategori =
                    String(
                        item.kategori ||
                        ""
                    );


                const cocokSearch =
                    !keyword ||
                    title.includes(
                        keyword
                    ) ||
                    description.includes(
                        keyword
                    );


                const cocokKategori =
                    !category ||
                    kategori ===
                        category;


                return (
                    cocokSearch &&
                    cocokKategori
                );

            }
        );


    if(
        filtered.length === 0
    ){

        materialContainer.innerHTML = `

            <div class="empty">

                📚 Materi tidak ditemukan.

            </div>

        `;

        return;

    }


    const grid =
        document.createElement(
            "div"
        );


    grid.className =
        "material-grid";


    filtered.forEach(
        function(item){

            grid.appendChild(
                createMaterialCard(
                    item
                )
            );

        }
    );


    materialContainer.innerHTML =
        "";


    materialContainer.appendChild(
        grid
    );

}


/* =====================================================
   CREATE MATERIAL CARD
===================================================== */

function createMaterialCard(item){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "card";


    const isPremium =
        item.premium === true ||
        item.premium === "true";


    const canOpen =
        !isPremium ||
        membershipActive;


    /* =========================================
       TYPE
    ========================================= */

    const type =
        String(
            item.tipe ||
            item.type ||
            "video"
        )
        .toLowerCase();


    let typeIcon =
        "📚";


    if(type === "video"){

        typeIcon =
            "🎥";

    }

    else if(type === "audio"){

        typeIcon =
            "🎧";

    }

    else if(type === "pdf"){

        typeIcon =
            "📄";

    }


    /* =========================================
       THUMBNAIL
    ========================================= */

    let thumbnailHTML = `

        <div class="default-thumb">

            ${typeIcon}

        </div>

    `;


    if(item.thumbnail){

        thumbnailHTML = `

            <img
                src="${escapeAttribute(
                    item.thumbnail
                )}"
                alt="${escapeAttribute(
                    item.judul ||
                    "Materi"
                )}"
                loading="lazy"
                onerror="
                    this.style.display='none';
                    const fallback =
                    this.parentElement.querySelector('.fallback');
                    if(fallback){
                        fallback.style.display='flex';
                    }
                "
            >

            <div
                class="default-thumb fallback"
                style="display:none"
            >

                ${typeIcon}

            </div>

        `;

    }


    /* =========================================
       LOCK
    ========================================= */

    if(
        isPremium &&
        !canOpen
    ){

        thumbnailHTML += `

            <div class="lock">

                🔐

            </div>

        `;

    }


    /* =========================================
       BUTTON
    ========================================= */

    let buttonHTML;


    if(canOpen){

        buttonHTML = `

            <button
                class="open-btn"
                onclick="openMaterial(${Number(
                    item.id
                )})"
            >

                📖 Buka Materi

            </button>

        `;

    }

    else{

        buttonHTML = `

            <button
                class="locked-btn"
                disabled
            >

                🔐 Membership Diperlukan

            </button>

        `;

    }


    /* =========================================
       CARD
    ========================================= */

    card.innerHTML = `

        <div class="thumb">

            ${thumbnailHTML}

        </div>


        <div class="content">


            <span class="type">

                ${typeIcon}

                ${escapeHTML(type)}

            </span>


            <h3 class="title">

                ${escapeHTML(
                    item.judul ||
                    "Tanpa Judul"
                )}

            </h3>


            <div class="description">

                ${escapeHTML(
                    item.deskripsi ||
                    item.kategori ||
                    "Materi pembelajaran"
                )}

            </div>


            <div class="meta">


                <span>

                    📚

                    ${escapeHTML(
                        item.kategori ||
                        "-"
                    )}

                </span>


                ${
                    isPremium

                    ?

                    `
                    <span class="badge premium">

                        🔐 Premium

                    </span>
                    `

                    :

                    `
                    <span class="badge free">

                        ✓ Gratis

                    </span>
                    `
                }


            </div>


            ${buttonHTML}


        </div>

    `;


    return card;

}


/* =====================================================
   OPEN MATERIAL
===================================================== */

function openMaterial(id){

    const item =
        materials.find(
            function(material){

                return Number(
                    material.id
                ) === Number(id);

            }
        );


    if(!item){

        alert(
            "Materi tidak ditemukan."
        );

        return;

    }


    /* =========================================
       PREMIUM CHECK
    ========================================= */

    const isPremium =
        item.premium === true ||
        item.premium === "true";


    if(
        isPremium &&
        !membershipActive
    ){

        alert(

            "🔐 Materi ini membutuhkan membership aktif.\n\n" +

            "Silakan aktifkan membership terlebih dahulu."

        );

        return;

    }


    /* =========================================
       URL CHECK
    ========================================= */

    if(!item.url){

        alert(
            "Materi ini belum memiliki URL."
        );

        return;

    }


    /* =========================================
       MASUK PLAYER
    ========================================= */

    window.location.href =
        "player.html?id=" +
        encodeURIComponent(
            item.id
        );

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    try{

        logoutBtn.disabled =
            true;


        logoutBtn.textContent =
            "Keluar...";


        const result =
            await supabaseClient
                .auth
                .signOut();


        if(result.error){

            throw result.error;

        }


        window.location.reload();

    }

    catch(error){

        console.error(
            "LOGOUT ERROR:",
            error
        );


        alert(

            "❌ Gagal keluar:\n\n" +

            (
                error.message ||
                "Terjadi kesalahan."
            )

        );


        logoutBtn.disabled =
            false;


        logoutBtn.textContent =
            "Keluar";

    }

}

/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient
    .auth
    .onAuthStateChange(
        function(
            event
        ){

            console.log(
                "AUTH EVENT:",
                event
            );


            if(
                event ===
                "SIGNED_OUT"
            ){

                showLoggedOut();

                renderMaterials();

            }


            if(
                event ===
                "SIGNED_IN"
            ){

                setTimeout(
                    async function(){

                        await checkUser();

                        renderMaterials();

                    },
                    0
                );

            }


            if(
                event ===
                "TOKEN_REFRESHED"
            ){

                setTimeout(
                    async function(){

                        await checkUser();

                        renderMaterials();

                    },
                    0
                );

            }

        }
    );


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(value){

    return escapeHTML(
        value
    );

}

    await checkUser();

    await loadMaterials();

}
