<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sertifikat — NgajiPlus Akademi</title>

<style>
:root{
  --bg:#001c15;--p:#032a20;--p2:#05352a;--line:#0a5b45;
  --text:#effff8;--muted:#9cc4b8;--g:#00d96b;--gold:#e8bd55
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
nav{height:54px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:#00251b;border-bottom:1px solid var(--line)}
.brand{color:var(--g);font-weight:bold;font-size:12px}
.nav{display:flex;gap:6px}
.nav a,.nav button{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--p);color:var(--text);font-size:10px;text-decoration:none}
main{max-width:1100px;margin:auto;padding:14px}
.hero{padding:20px;border-radius:16px;background:linear-gradient(135deg,#075f3e,#009447);border:1px solid #00a85c}
.hero h1{margin:0 0 6px;font-size:23px}.hero p{margin:0;font-size:11px}
.notice,.section{background:var(--p);border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:12px}
.section h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.card{background:var(--p2);border:1px solid var(--line);border-radius:11px;padding:12px}
.course{font-size:13px;font-weight:bold}.level{font-size:11px;color:var(--muted);margin-top:3px}
.meta{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:8px}
.bar{height:6px;background:#062018;border-radius:99px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.actions{margin-top:9px}.btn{border:0;border-radius:8px;padding:7px 10px;background:var(--g);color:#002315;font-size:10px;font-weight:bold;cursor:pointer}
.gold{background:var(--gold)}.secondary{background:#084b39;color:var(--text);border:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);font-size:11px;padding:16px}
footer{text-align:center;color:var(--muted);font-size:9px;padding:24px;border-top:1px solid var(--line);margin-top:20px}

/* ===== SERTIFIKAT WEB ===== */
.certgrid{display:grid;grid-template-columns:1fr;gap:18px}
.cert-shell{width:100%;background:transparent;border:0;padding:0}
.certificate{
  position:relative;width:100%;aspect-ratio:330/215;overflow:hidden;
  color:#173f30;text-align:center;
  background:#eef8ed url("assets/img/background-sertifikat.png") center/100% 100% no-repeat;
  border-radius:2px;
}
.cert-overlay{position:absolute;inset:0;pointer-events:none}
.cert-logo{position:absolute;left:7.5%;top:8.5%;width:12%;height:auto;object-fit:contain}
.cert-bismillah{position:absolute;right:7%;top:8.5%;width:18%;font-family:Georgia,serif;font-size:clamp(13px,2.1vw,27px);direction:rtl;color:#075b3d}
.cert-title{position:absolute;left:20%;right:20%;top:15%;font-family:Georgia,"Times New Roman",serif;font-size:clamp(25px,4.3vw,54px);letter-spacing:6px;font-weight:700;color:#075238;margin:0}
.cert-subtitle{position:absolute;left:20%;right:20%;top:22%;font-size:clamp(6px,1vw,12px);letter-spacing:2px;color:#668276}
.cert-given{position:absolute;left:20%;right:20%;top:26%;font-size:clamp(7px,1.1vw,13px)}
.cert-name{position:absolute;left:18%;right:18%;top:28.5%;font-family:Georgia,serif;font-size:clamp(20px,3.3vw,43px);font-weight:bold;color:#075238}
.cert-desc{position:absolute;left:18%;right:18%;top:36%;font-size:clamp(6px,.9vw,11px)}
.cert-course-box{
  position:absolute;left:21%;right:21%;top:41%;height:13%;
  border:2px solid #c9a744;border-radius:15px;background:rgba(255,252,225,.82);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 7%;
  box-shadow:0 2px 5px rgba(105,80,15,.10)
}
.cert-course{font-family:Georgia,serif;font-size:clamp(13px,1.8vw,25px);font-weight:700;color:#174d39;line-height:1.05}
.cert-level{margin-top:3px;padding:2px 15px;border-radius:12px;background:#edc965;color:#654d11;font-size:clamp(5px,.75vw,9px);font-weight:bold}
.cert-motto{font-size:clamp(4px,.6vw,7px);margin-top:2px;color:#5e6656}
.cert-meta{
  position:absolute;left:25%;right:25%;top:57%;
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:4%;
  font-size:clamp(5px,.72vw,9px);color:#63756c
}
.cert-meta>div{padding-top:2px;border-top:1px solid rgba(72,113,94,.35)}
.cert-meta b{display:block;color:#1b4032;font-size:clamp(6px,.82vw,10px);margin-top:3px}
.status-ok{display:inline-block;border:1px solid #2c9a70;border-radius:12px;padding:2px 9px;color:#1d7656;font-weight:bold}
.cert-footer{
  position:absolute;left:22%;right:22%;top:68%;
  display:grid;grid-template-columns:1fr 120px 1fr;align-items:end;gap:5%;
}
.cert-sign{font-size:clamp(5px,.75vw,9px);color:#65766e}
.cert-sign .sig{display:block;margin-top:20px;font-family:"Brush Script MT","Segoe Script",cursive;font-size:clamp(12px,1.7vw,22px);font-style:italic;color:#253f35;white-space:nowrap}
.cert-sign strong{display:block;color:#1c4032;font-size:clamp(6px,.8vw,10px);margin-top:2px}
.cert-stamp{
  width:78px;height:78px;margin:auto;border-radius:50%;
  background:radial-gradient(circle,#f8d56e 0 55%,#d49b1e 56% 63%,#f3c84f 64% 75%,#b8790d 76% 100%);
  display:flex;align-items:center;justify-content:center;
  color:#6c4b08;font-size:9px;font-weight:bold;text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,.15)
}
.cert-number{position:absolute;left:8%;bottom:5%;font-size:clamp(4px,.55vw,7px);color:#61756c}
.qr-area{position:absolute;right:5.2%;bottom:5.1%;width:13%;text-align:center}
.cert-qr-box{
  width:100%;aspect-ratio:1;background:#fff;border:2px solid #24764f;
  padding:4px;display:flex;align-items:center;justify-content:center
}
.cert-qr-box img,.cert-qr-box canvas{width:100%!important;height:100%!important;display:block!important}
.cert-qr-label{font-size:clamp(4px,.55vw,7px);color:#38614f;margin-top:2px}
.cert-actions{text-align:center;margin-top:8px}
.cert-actions .btn{margin:2px}

/* print F4 landscape: 330 x 215 mm */
@media print{
  @page{size:330mm 215mm landscape;margin:0}
  html,body{width:330mm!important;height:215mm!important;margin:0!important;padding:0!important;background:#fff!important}
  nav,.hero,.notice,#levelsSection,footer,#certsSection>h2,.print-hide{display:none!important}
  main{max-width:none!important;margin:0!important;padding:0!important}
  #certsSection{display:block!important;background:transparent!important;border:0!important;padding:0!important;margin:0!important}
  .certgrid{display:block!important}
  .cert-shell{display:none!important;width:330mm!important;height:215mm!important}
  .cert-shell.printing{display:block!important}
  .certificate{width:330mm!important;height:215mm!important;aspect-ratio:auto!important;border-radius:0!important}
  .cert-actions{display:none!important}
}

/* mobile preview */
@media(max-width:700px){
  .grid{grid-template-columns:1fr}
  main{padding:9px}.nav a:first-child{display:none}
  .certgrid{gap:12px}
  .cert-title{letter-spacing:3px}
  .cert-footer{grid-template-columns:1fr 75px 1fr}
  .cert-stamp{width:55px;height:55px;font-size:6px}
}
body[data-light="1"]{--bg:#f3faf7;--p:#fff;--p2:#f1faf6;--line:#b8dfd0;--text:#173329;--muted:#58766c}
body[data-light="1"] nav{background:#fff}
</style>
</head>

<body>
<nav>
  <div class="brand">📖 NgajiPlus Akademi</div>
  <div class="nav">
    <a href="akademi.html">📚 Akademi</a>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="profile.html">👤 Profil</a>
    <button id="theme" onclick="toggleTheme()">☀️</button>
  </div>
</nav>

<main>
  <section class="hero">
    <h1>🎓 Sertifikat NgajiPlus</h1>
    <p>Sertifikat diterbitkan setelah seluruh materi dalam satu level selesai dipelajari.</p>
  </section>

  <div id="notice" class="notice">⏳ Memuat data sertifikat...</div>

  <section id="levelsSection" class="section">
    <h2>📚 Progress Level</h2>
    <div id="levels" class="grid"></div>
  </section>

  <section id="certsSection" class="section">
    <h2>🏆 Sertifikat Saya</h2>
    <div id="certs" class="certgrid"></div>
  </section>
</main>

<footer>📖 NgajiPlus Akademi — Belajar Islam secara bertahap</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const URL="https://ksgywgdrfskqsufchbcm.supabase.co";
const KEY="sb_publishable_HmFKwHMCISf_NYOOiLx3-A_MWnG9yG7";
const db=supabase.createClient(URL,KEY);

const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[m]));

function toggleTheme(){
  let l=document.body.dataset.light==="1";
  document.body.dataset.light=l?"":"1";
  localStorage.setItem("ngaji-theme",l?"dark":"light");
  document.getElementById("theme").textContent=l?"☀️":"🌙";
}
if(localStorage.getItem("ngaji-theme")==="light"){
  document.body.dataset.light="1";
  document.getElementById("theme").textContent="🌙";
}

/* Supaya halaman tidak berhenti selamanya pada "Memuat..." */
function withTimeout(promise,ms,label){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+" terlalu lama. Periksa koneksi internet/Supabase.")),ms))
  ]);
}

function certificateHTML(c){
  const nomor=esc(c.nomor_sertifikat);
  const url="https://akademi.ngajiplus.id/verifikasi.html?nomor="+encodeURIComponent(c.nomor_sertifikat||"");
  return `
  <article class="cert-shell" data-number="${nomor}">
    <div class="certificate">
      <img class="cert-logo" src="assets/img/logo.png" alt="ngajiplus.id">
      <div class="cert-bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
      <h3 class="cert-title">SERTIFIKAT</h3>
      <div class="cert-subtitle">PENGHARGAAN PENYELESAIAN PEMBELAJARAN</div>
      <div class="cert-given">Dengan ini diberikan kepada</div>
      <div class="cert-name">${esc(c.nama_peserta)}</div>
      <div class="cert-desc">atas keberhasilan menyelesaikan seluruh rangkaian pembelajaran NgajiPlus Akademi dengan baik.</div>

      <div class="cert-course-box">
        <div class="cert-course">${esc(c.course_nama||"")}</div>
        <div class="cert-level">${esc(c.level_nama||"")}</div>
        <div class="cert-motto">Semoga ilmu yang diperoleh menjadi amal shalih dan diberkahi oleh Allah ﷻ.</div>
      </div>

      <div class="cert-meta">
        <div>Nomor Sertifikat<b>${nomor}</b></div>
        <div>Tanggal Terbit<b>${esc(c.tanggal_terbit||"")}</b></div>
        <div>Status<b><span class="status-ok">✓ TERVERIFIKASI</span></b></div>
      </div>

      <div class="cert-footer">
        <div class="cert-sign">
          Direktur NgajiPlus Akademi
          <span class="sig">Achmad Luthfi Fauzan</span>
          <strong>Founder &amp; Direktur</strong>
        </div>
        <div class="cert-stamp">ngajiplus.id<br><small>AKADEMI</small></div>
        <div class="cert-sign">
          Manajer Akademik
          <span class="sig">Tim NgajiPlus</span>
          <strong>Manajer Program</strong>
        </div>
      </div>

      <div class="cert-number">Dokumen elektronik — verifikasi melalui QR Code</div>
      <div class="qr-area" data-url="${esc(url)}">
        <div class="cert-qr-box"></div>
        <div class="cert-qr-label">Scan untuk verifikasi sertifikat</div>
      </div>
    </div>
    <div class="cert-actions print-hide">
      <button class="btn gold" onclick="printCertificate(this)">🖨️ Cetak Sertifikat</button>
    </div>
  </article>`;
}

async function load(){
  const notice=document.getElementById("notice");
  try{
    notice.textContent="⏳ Memuat data sertifikat...";
    const auth=await withTimeout(db.auth.getUser(),12000,"Login");

    if(auth.error) throw auth.error;
    if(!auth.data.user){
      location.href="login.html?redirect=sertifikat.html";
      return;
    }
    const uid=auth.data.user.id;

    const [lr,cmr,pr,cr]=await Promise.all([
      withTimeout(db.from("levels").select("id,course_id,nama,urutan").eq("aktif",true).order("course_id").order("urutan"),12000,"Data levels"),
      withTimeout(db.from("course_materials").select("level_id,material_id,urutan").order("level_id").order("urutan"),12000,"Data course_materials"),
      withTimeout(db.from("learning_progress").select("material_id,status,progress").eq("user_id",uid),12000,"Progress belajar"),
      withTimeout(db.from("certificates").select("*").eq("user_id",uid).order("tanggal_terbit",{ascending:false}),12000,"Data certificates")
    ]);

    if(lr.error) throw new Error("Tabel levels: "+lr.error.message);
    if(cmr.error) throw new Error("Tabel course_materials: "+cmr.error.message);
    if(pr.error) throw new Error("Progress belajar: "+pr.error.message);
    if(cr.error) throw new Error("Tabel certificates: "+cr.error.message);

    const levels=lr.data||[];
    const links=cmr.data||[];
    const prog=pr.data||[];
    const certs=cr.data||[];

    const courseIds=[...new Set(levels.map(x=>x.course_id))];
    let courses=[];
    if(courseIds.length){
      const rr=await withTimeout(
        db.from("courses").select("id,nama").in("id",courseIds),
        12000,"Data courses"
      );
      if(rr.error) throw new Error("Tabel courses: "+rr.error.message);
      courses=rr.data||[];
    }

    const cmap=new Map(courses.map(x=>[x.id,x.nama]));
    const pmap=new Map(prog.map(x=>[String(x.material_id),x]));
    const stats=new Map();

    for(const lv of levels){
      const mats=links.filter(x=>x.level_id===lv.id);
      const total=mats.length;
      let done=0;
      for(const m of mats){
        const pp=pmap.get(String(m.material_id));
        if(pp && (pp.status==="completed" || Number(pp.progress)>=100)) done++;
      }
      stats.set(lv.id,{total,done,pct:total?Math.round(done/total*100):0});
    }

    document.getElementById("levels").innerHTML=levels.length
      ? levels.map(lv=>{
          const st=stats.get(lv.id)||{total:0,done:0,pct:0};
          const cert=certs.find(c=>c.level_id===lv.id);
          let action="";
          if(cert){
            action='<a class="btn gold" href="#certsSection">🏆 Lihat Sertifikat</a>';
          }else if(st.total>0 && st.pct===100){
            action='<button class="btn" onclick="issueCertificate('+lv.id+')">🎓 Terbitkan Sertifikat</button>';
          }else if(st.total===0){
            action='<span class="empty">Belum ada materi</span>';
          }else{
            action='<a class="btn secondary" href="akademi.html">📖 Lanjut Belajar</a>';
          }
          return '<div class="card">'+
            '<div class="course">'+esc(cmap.get(lv.course_id)||"Course")+'</div>'+
            '<div class="level">'+esc(lv.nama)+'</div>'+
            '<div class="meta"><span>'+st.done+'/'+st.total+' materi selesai</span><b>'+st.pct+'%</b></div>'+
            '<div class="bar"><i style="width:'+st.pct+'%"></i></div>'+
            '<div class="actions">'+action+'</div>'+
          '</div>';
        }).join("")
      : '<div class="empty">Belum ada level.</div>';

    document.getElementById("certs").innerHTML=certs.length
      ? certs.map(c=>certificateHTML(c)).join("")
      : '<div class="empty">Belum ada sertifikat. Selesaikan Level 100% terlebih dahulu.</div>';

    document.querySelectorAll(".qr-area").forEach(el=>{
      const box=el.querySelector(".cert-qr-box");
      if(box && typeof QRCode!=="undefined"){
        box.innerHTML="";
        new QRCode(box,{
          text:el.dataset.url,
          width:160,height:160,
          correctLevel:QRCode.CorrectLevel.H
        });
      }
    });

    notice.textContent=certs.length
      ? "🎉 Anda memiliki "+certs.length+" sertifikat."
      : "📚 Selesaikan seluruh materi dalam satu level. Setelah 100%, tombol penerbitan sertifikat akan muncul.";

  }catch(err){
    console.error(err);
    notice.innerHTML="❌ <b>Gagal memuat sertifikat.</b><br><small>"+esc(err.message||err)+"</small>";
    document.getElementById("levels").innerHTML='<div class="empty">Data progress belum dapat dimuat.</div>';
    document.getElementById("certs").innerHTML='<div class="empty">Data sertifikat belum dapat dimuat.</div>';
  }
}

function printCertificate(btn){
  const shell=btn.closest(".cert-shell");
  if(!shell)return;
  document.querySelectorAll(".cert-shell").forEach(x=>x.classList.remove("printing"));
  shell.classList.add("printing");
  window.print();
  setTimeout(()=>shell.classList.remove("printing"),700);
}

async function issueCertificate(levelId){
  try{
    const btns=[...document.querySelectorAll("button")];
    btns.forEach(b=>{
      if(b.textContent.includes("Terbitkan Sertifikat")){
        b.disabled=true;b.textContent="⏳ Menerbitkan...";
      }
    });
    const r=await withTimeout(
      db.rpc("issue_certificate",{p_level_id:levelId}),
      15000,"Penerbitan sertifikat"
    );
    if(r.error) throw r.error;
    if(!r.data || !r.data.success) throw new Error("Sertifikat belum dapat diterbitkan.");
    alert(r.data.already_exists?"Sertifikat sudah tersedia.":"🎉 Sertifikat berhasil diterbitkan!");
    await load();
  }catch(err){
    console.error(err);
    alert("Gagal menerbitkan sertifikat:\n"+(err.message||err));
    await load();
  }
}

load();
</script>
</body>
</html>
