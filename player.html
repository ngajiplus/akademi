<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
:root{
    --bg:#f5faf7;
    --surface:#fff;
    --surface2:#eef9f3;
    --text:#17221d;
    --muted:#718078;

}
html[data-theme="dark"]{

}
body{

a{text-decoration:none;color:inherit}
button,input{font-family:inherit}

header{

.lock-box{

.action-row{

<script>
/* =========================================================
   SUPABASE
========================================================= */
const SUPABASE_URL = "https://ksgywgdrfskqsufchbcm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HmFKwHMCISfN_YOoiLx3-A_MWnG9yG7";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

/* =========================================================
   STATE
========================================================= */
const content = document.getElementById("content");
const themeBtn = document.getElementById("themeBtn");

let currentUser = null;
let currentAccess = {
    loggedIn:false,
    premium:false,
    admin:false,
    profile:null
};
let currentMaterial = null;
let progressTimer = null;
let youtubePlayerInstance = null;
let audioElement = null;

/* =========================================================
   THEME
========================================================= */
function applyTheme(theme){
    if(theme !== "dark") theme = "light";
    document.documentElement.setAttribute("data-theme",theme);
    localStorage.setItem("ngajiplus-theme",theme);
    themeBtn.textContent = theme === "dark" ? "☀️" : "🌙";

    const meta = document.getElementById("themeColor");
    if(meta){
        meta.content = theme === "dark" ? "#07120d" : "#009b59";
    }
}

function toggleTheme(){
    const current = document.documentElement.getAttribute("data-theme") || "light";
    applyTheme(current === "dark" ? "light" : "dark");
}

(function initTheme(){
    const saved = localStorage.getItem("ngajiplus-theme");
    if(saved === "dark" || saved === "light"){
        applyTheme(saved);
    }else{
        const dark = window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
        applyTheme(dark ? "dark" : "light");
    }
})();

/* =========================================================
   HELPERS
========================================================= */
function escapeHTML(value){
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function escapeAttribute(value){
    return escapeHTML(value);
}

function formatTanggal(value){
    if(!value) return "-";
    const d = new Date(value);
    if(isNaN(d.getTime())) return String(value);
    return d.toLocaleDateString("id-ID",{
        day:"numeric",
        month:"long",
        year:"numeric"
    });
}

function getMaterialId(){
    const params = new URLSearchParams(window.location.search);
    return (
        params.get("id") ||
        params.get("material_id") ||
        params.get("materi_id")
    );
}

function getType(item){
    return String(item.tipe || item.type || "materi")
        .toLowerCase()
        .trim();
}

function isPremium(item){
    return item.premium === true ||
           item.premium === "true" ||
           item.premium === 1 ||
           item.premium === "1";
}

function getYouTubeId(url){
    if(!url) return null;

    try{
        const value = String(url).trim();

        if(/^[a-zA-Z0-9_-]{11}$/.test(value)){
            return value;
        }

        const u = new URL(value);
        const host = u.hostname.toLowerCase();

        if(host.includes("youtube.com")){
            const v = u.searchParams.get("v");
            if(v) return v;

            const patterns = [
                /\/embed\/([^/?]+)/,
                /\/shorts\/([^/?]+)/,
                /\/live\/([^/?]+)/
            ];

            for(const pattern of patterns){
                const match = u.pathname.match(pattern);
                if(match) return match[1];
            }
        }

        if(host.includes("youtu.be")){
            return u.pathname.replace("/","").split("?")[0];
        }
    }catch(e){
        console.error("YOUTUBE URL ERROR:",e);
    }

    return null;
}

function youtubeThumbnail(id){
    return `https://img.youtube.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`;
}

function youtubeEmbed(id){
    return `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?enablejsapi=1&rel=0`;
}

function getPdfUrl(url){
    if(!url) return "";

    const value = String(url).trim();

    if(value.includes("drive.google.com")){
        const fileMatch = value.match(/\/file\/d\/([^/]+)/);
        if(fileMatch){
            return `https://drive.google.com/file/d/${fileMatch[1]}/preview`;
        }

        const openMatch = value.match(/[?&]id=([^&]+)/);
        if(openMatch){
            return `https://drive.google.com/file/d/${openMatch[1]}/preview`;
        }
    }

    return value;
}

function clearProgressTimer(){
    if(progressTimer){
        clearInterval(progressTimer);
        progressTimer = null;
    }
}

/* =========================================================
   ACCESS CHECK
   Admin:
   - profiles.is_admin
   - admin_users.user_id

   Member aktif:
   - status = aktif
   - berlaku_sampai >= sekarang

   Tidak mensyaratkan nama paket tertentu agar akun aktif
   yang memang sudah disetujui admin tetap bisa mengakses.
========================================================= */
async function checkAccess(){
    currentUser = null;

    const result = {
        loggedIn:false,
        premium:false,
        admin:false,
        profile:null
    };

    try{
        const {data:{user},error:userError} =
            await supabaseClient.auth.getUser();

        if(userError) throw userError;

        currentUser = user || null;

        if(!currentUser){
            currentAccess = result;
            return result;
        }

        result.loggedIn = true;

        const {data:profile,error:profileError} =
            await supabaseClient
                .from("profiles")
                .select("id,nama,status,paket,berlaku_sampai,is_admin")
                .eq("id",currentUser.id)
                .maybeSingle();

        if(profileError){
            console.error("PROFILE ERROR:",profileError);
            currentAccess = result;
            return result;
        }

        result.profile = profile;

        if(profile){
            const adminFlag =
                profile.is_admin === true ||
                profile.is_admin === "true" ||
                profile.is_admin === 1 ||
                profile.is_admin === "1";

            if(adminFlag){
                result.admin = true;
            }
        }

        /* Cek admin_users */
        if(!result.admin){
            try{
                const {data:adminRow,error:adminError} =
                    await supabaseClient
                        .from("admin_users")
                        .select("user_id")
                        .eq("user_id",currentUser.id)
                        .maybeSingle();

                if(!adminError && adminRow){
                    result.admin = true;
                }
            }catch(e){
                console.log("admin_users check dilewati:",e);
            }
        }

        if(result.admin){
            result.premium = true;
            currentAccess = result;
            return result;
        }

        if(profile){
            const status =
                String(profile.status || "")
                    .toLowerCase()
                    .trim();

            const expiry =
                profile.berlaku_sampai
                    ? new Date(profile.berlaku_sampai)
                    : null;

            const activeDate =
                expiry &&
                !isNaN(expiry.getTime()) &&
                expiry >= new Date();

            result.premium =
                status === "aktif" &&
                activeDate;
        }

    }catch(error){
        console.error("ACCESS ERROR:",error);
    }

    currentAccess = result;
    return result;
}

/* =========================================================
   LOAD MATERIAL
========================================================= */
async function loadMaterial(){
    clearProgressTimer();

    content.innerHTML =
        `<div class="loading">⏳ Memuat materi...</div>`;

    const materialId = getMaterialId();

    if(!materialId){
        window.location.replace("akademi.html");
        return;
    }

    const access = await checkAccess();

    const {data:item,error} =
        await supabaseClient
            .from("materials")
            .select(`
                id,
                judul,
                deskripsi,
                kategori,
                tipe,
                type,
                url,
                thumbnail,
                premium
            `)
            .eq("id",materialId)
            .maybeSingle();

    if(error){
        console.error("MATERIAL ERROR:",error);

        content.innerHTML = `
            <div class="material-box">
                <div class="error">
                    ❌ Gagal mengambil materi.
                    <br><br>
                    ${escapeHTML(error.message)}
                    <br>
                    <a href="akademi.html" class="open-source">← Kembali ke Akademi</a>
                </div>
            </div>
        `;
        return;
    }

    if(!item){
        content.innerHTML = `
            <div class="material-box">
                <div class="error">
                    ❌ Materi tidak ditemukan.
                    <br><br>
                    ID: <strong>${escapeHTML(materialId)}</strong>
                    <br>
                    <a href="akademi.html" class="open-source">← Kembali ke Akademi</a>
                </div>
            </div>
        `;
        return;
    }

    currentMaterial = item;

    /* =====================================================
       SECURITY GATE
       PENTING: JANGAN RENDER PLAYER sebelum lolos.
    ===================================================== */
    if(isPremium(item) && !access.premium){
        renderLocked(item,access);
        return;
    }

    renderAccessible(item,access);
}

/* =========================================================
   LOCKED
========================================================= */
function renderLocked(item,access){
    const title = escapeHTML(item.judul || "Materi Premium");
    const category = escapeHTML(item.kategori || "Materi");

    const message = access.loggedIn
        ? "Akun Anda sudah login, tetapi membership Premium belum aktif atau masa aktifnya sudah berakhir."
        : "Silakan login terlebih dahulu. Setelah itu aktifkan membership Premium untuk membuka materi ini.";

    const firstButton = access.loggedIn
        ? `<a href="membership.html" class="action-btn primary">💎 Aktifkan Membership</a>`
        : `<a href="login.html" class="action-btn primary">🔐 Login</a>`;

    content.innerHTML = `
        <div class="material-box">
            <span class="category">📚 ${category}</span>

            <h1 class="title">${title}</h1>

            <p class="description">
                Materi ini merupakan materi Premium NgajiPlus Akademi.
            </p>

            <div class="info">
                <span class="info-badge info-premium">🔐 Premium</span>
            </div>

            <div class="lock-box">
                <div class="lock-icon">🔐</div>
                <div class="lock-title">Materi Premium Terkunci</div>

                <div class="lock-text">
                    ${escapeHTML(message)}
                    <br><br>
                    <strong>Player tidak dimuat sebelum akses Anda dinyatakan aktif.</strong>
                </div>

                <div class="action-row">
                    ${firstButton}
                    <a href="akademi.html" class="action-btn secondary">← Kembali ke Akademi</a>
                </div>
            </div>
        </div>
    `;

    document.title = `${item.judul || "Materi"} - Terkunci`;
}

/* =========================================================
   ACCESSIBLE MATERIAL
========================================================= */
async function renderAccessible(item,access){
    const type = getType(item);
    const premium = isPremium(item);

    let thumbnailHTML = "";

    /* Thumbnail hanya sebagai preview.
       Untuk video, player YouTube yang ditampilkan. */
    if(item.thumbnail && type !== "video"){
        thumbnailHTML = `
            <img
                class="thumbnail"
                src="${escapeAttribute(item.thumbnail)}"
                alt="${escapeAttribute(item.judul || "Materi")}"
                onerror="this.style.display='none'"
            >
        `;
    }

    let adminHTML = "";

    if(access.admin && premium){
        adminHTML = `
            <div class="admin-box">
                👑 <strong>Akses Admin</strong> — Anda dapat membuka materi Premium.
            </div>
        `;
    }

    let accountHTML = "";

    if(access.profile?.nama){
        accountHTML = `
            <div class="account-line">
                👤 ${escapeHTML(access.profile.nama)}
            </div>
        `;
    }

    let typeLabel = "📚 Materi";
    if(type === "video") typeLabel = "🎥 Video";
    if(type === "audio") typeLabel = "🎧 Audio";
    if(type === "pdf") typeLabel = "📄 PDF";

    content.innerHTML = `
        <div class="material-box">
            <span class="category">
                📚 ${escapeHTML(item.kategori || "Materi")}
            </span>

            <h1 class="title">
                ${escapeHTML(item.judul || "Tanpa Judul")}
            </h1>

            <p class="description">
                ${escapeHTML(
                    item.deskripsi ||
                    "Materi pembelajaran " + (item.judul || "")
                )}
            </p>

            <div class="info">
                <span class="info-badge">${typeLabel}</span>
                ${
                    premium
                    ? `<span class="info-badge info-premium">🔐 Premium</span>`
                    : `<span class="info-badge info-free">✓ Gratis</span>`
                }
                ${
                    access.admin
                    ? `<span class="info-badge info-admin">👑 Admin</span>`
                    : ""
                }
            </div>

            ${adminHTML}
            ${accountHTML}
            ${thumbnailHTML}

            <div id="playerArea"></div>

            <div id="progressArea"></div>

            <a href="akademi.html" class="open-source">
                ← Kembali ke Akademi
            </a>
        </div>
    `;

    document.title =
        `${item.judul || "Materi"} - NgajiPlus Akademi`;

    /* Player baru dibuat setelah security gate lolos */
    renderPlayer(item);

    /* Progress hanya untuk user login */
    if(currentUser){
        await loadProgress();
    }
}

/* =========================================================
   PLAYER
========================================================= */
function renderPlayer(item){
    const area = document.getElementById("playerArea");
    if(!area) return;

    const type = getType(item);

    if(!item.url){
        area.innerHTML = `
            <div class="player-card">
                <div class="error">⚠️ Materi ini belum memiliki URL.</div>
            </div>
        `;
        return;
    }

    if(type === "video"){
        const id = getYouTubeId(item.url);

        if(!id){
            area.innerHTML = `
                <div class="player-card">
                    <div class="error">❌ URL YouTube tidak valid.</div>
                </div>
            `;
            return;
        }

        area.innerHTML = `
            <div class="player-card">
                <div class="player-label">🎥 Video Pembelajaran</div>
                <div id="youtubePlayer"></div>
            </div>
        `;

        loadYouTubePlayer(id);
        return;
    }

    if(type === "audio"){
        area.innerHTML = `
            <div class="player-card">
                <div class="player-label">🎧 Audio Pembelajaran</div>

                <div class="audio-wrap">
                    <audio id="audioPlayer" controls preload="metadata">
                        <source src="${escapeAttribute(item.url)}">
                        Browser Anda tidak mendukung pemutar audio.
                    </audio>
                </div>
            </div>
        `;

        initAudioPlayer();
        return;
    }

    if(type === "pdf"){
        const pdfUrl = getPdfUrl(item.url);

        area.innerHTML = `
            <div class="player-card">
                <div class="player-label">📄 PDF Pembelajaran</div>

                <iframe
                    class="pdf-frame"
                    src="${escapeAttribute(pdfUrl)}"
                    title="PDF Pembelajaran"
                ></iframe>

                <button
                    id="pdfCompleteBtn"
                    class="complete-btn"
                    type="button"
                    onclick="completeMaterial()"
                >
                    ✓ Tandai Selesai
                </button>
            </div>
        `;
        return;
    }

    area.innerHTML = `
        <div class="player-card">
            <div class="error">
                ⚠️ Tipe materi "${escapeHTML(type)}" tidak dikenali.
            </div>
        </div>
    `;
}

/* =========================================================
   YOUTUBE IFRAME API
========================================================= */
function loadYouTubePlayer(videoId){
    window.__ngajiYouTubeVideoId = videoId;

    if(window.YT && window.YT.Player){
        createYouTubePlayer(videoId);
        return;
    }

    if(!document.getElementById("youtube-api-script")){
        const script = document.createElement("script");
        script.id = "youtube-api-script";
        script.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(script);
    }
}

window.onYouTubeIframeAPIReady = function(){
    if(window.__ngajiYouTubeVideoId){
        createYouTubePlayer(window.__ngajiYouTubeVideoId);
    }
};

function createYouTubePlayer(videoId){
    const target = document.getElementById("youtubePlayer");
    if(!target) return;

    target.innerHTML = "";

    youtubePlayerInstance = new YT.Player("youtubePlayer",{
        videoId:videoId,
        width:"100%",
        height:"480",
        playerVars:{
            autoplay:0,
            controls:1,
            rel:0,
            modestbranding:1,
            playsinline:1
        },
        events:{
            onReady:function(){
                applySavedProgressToYouTube();
            },
            onStateChange:function(event){
                if(event.data === YT.PlayerState.PLAYING){
                    startYouTubeTracking();
                }

                if(event.data === YT.PlayerState.PAUSED){
                    saveYouTubeProgress();
                    clearProgressTimer();
                }

                if(event.data === YT.PlayerState.ENDED){
                    clearProgressTimer();
                    saveProgress(100,true);
                    setProgressUI(100);
                }
            }
        }
    });
}

async function applySavedProgressToYouTube(){
    const saved = await getSavedProgress();
    if(!saved || !youtubePlayerInstance) return;

    const percent = Math.max(0,Math.min(99,Number(saved.progress || 0)));

    if(percent > 2){
        try{
            const duration = youtubePlayerInstance.getDuration();
            if(duration && duration > 0){
                youtubePlayerInstance.seekTo(
                    duration * (percent / 100),
                    true
                );
            }
        }catch(e){}
    }

    setProgressUI(Number(saved.progress || 0));
}

function startYouTubeTracking(){
    clearProgressTimer();

    progressTimer = setInterval(()=>{
        saveYouTubeProgress();
    },5000);
}

async function saveYouTubeProgress(){
    if(!youtubePlayerInstance || !currentUser) return;

    try{
        const duration = youtubePlayerInstance.getDuration();
        const current = youtubePlayerInstance.getCurrentTime();

        if(!duration || duration <= 0) return;

        const percent = Math.round((current / duration) * 100);
        const safePercent = Math.max(0,Math.min(99,percent));

        setProgressUI(safePercent);

        await saveProgress(safePercent,false);
    }catch(e){
        console.log("YouTube progress belum tersimpan:",e);
    }
}

/* =========================================================
   AUDIO
========================================================= */
function initAudioPlayer(){
    audioElement = document.getElementById("audioPlayer");
    if(!audioElement) return;

    audioElement.addEventListener("loadedmetadata",async()=>{
        const saved = await getSavedProgress();
        if(saved && saved.progress > 2 && audioElement.duration){
            audioElement.currentTime =
                audioElement.duration * (Number(saved.progress) / 100);
            setProgressUI(Number(saved.progress));
        }
    });

    audioElement.addEventListener("timeupdate",()=>{
        if(!currentUser || !audioElement.duration) return;

        const percent =
            Math.round(
                (audioElement.currentTime / audioElement.duration) * 100
            );

        setProgressUI(percent);

        if(Math.round(audioElement.currentTime) % 5 === 0){
            saveProgress(Math.min(99,percent),false);
        }
    });

    audioElement.addEventListener("play",()=>{
        clearProgressTimer();

        progressTimer = setInterval(()=>{
            if(audioElement.duration){
                const percent =
                    Math.round(
                        (audioElement.currentTime / audioElement.duration) * 100
                    );
                saveProgress(Math.min(99,percent),false);
            }
        },5000);
    });

    audioElement.addEventListener("pause",()=>{
        if(audioElement.duration){
            const percent =
                Math.round(
                    (audioElement.currentTime / audioElement.duration) * 100
                );
            saveProgress(Math.min(99,percent),false);
        }
        clearProgressTimer();
    });

    audioElement.addEventListener("ended",async()=>{
        clearProgressTimer();
        setProgressUI(100);
        await saveProgress(100,true);
    });
}

/* =========================================================
   PROGRESS UI
========================================================= */
function renderProgressUI(saved){
    const area = document.getElementById("progressArea");
    if(!area) return;

    const percent =
        Math.max(
            0,
            Math.min(
                100,
                Number(saved?.progress || 0)
            )
        );

    const completed =
        percent >= 100 ||
        saved?.status === "completed";

    area.innerHTML = `
        <div class="progress-card">
            <div class="progress-top">
                <div class="progress-title">📈 Progress Belajar</div>
                <div id="progressPercent" class="progress-percent">${percent}%</div>
            </div>

            <div class="progress-track">
                <div id="progressBar" class="progress-bar" style="width:${percent}%"></div>
            </div>

            <div id="progressNote" class="progress-note">
                ${
                    completed
                    ? "✓ Materi sudah selesai."
                    : percent > 0
                        ? "Terakhir belajar pada " + formatTanggal(saved?.last_watched_at)
                        : "Belum mulai. Progress akan tersimpan otomatis."
                }
            </div>

            <button
                id="completeMaterialBtn"
                class="complete-btn ${completed ? "done" : ""}"
                type="button"
                onclick="completeMaterial()"
            >
                ${completed ? "✓ Materi Sudah Selesai" : "✓ Tandai Selesai"}
            </button>
        </div>
    `;
}

function setProgressUI(percent){
    const value = Math.max(0,Math.min(100,Math.round(Number(percent) || 0)));

    const bar = document.getElementById("progressBar");
    const text = document.getElementById("progressPercent");

    if(bar) bar.style.width = value + "%";
    if(text) text.textContent = value + "%";
}

/* =========================================================
   LEARNING PROGRESS
========================================================= */
async function getSavedProgress(){
    if(!currentUser || !currentMaterial) return null;

    try{
        const {data,error} =
            await supabaseClient
                .from("learning_progress")
                .select(`
                    id,
                    material_id,
                    status,
                    progress,
                    last_watched_at,
                    completed_at,
                    updated_at
                `)
                .eq("user_id",currentUser.id)
                .eq("material_id",String(currentMaterial.id))
                .maybeSingle();

        if(error){
            console.error("GET PROGRESS ERROR:",error);
            return null;
        }

        renderProgressUI(data);
        return data;
    }catch(e){
        console.error(e);
        return null;
    }
}

async function loadProgress(){
    const saved = await getSavedProgress();

    if(!saved){
        renderProgressUI(null);
    }
}

async function saveProgress(percent,completed){
    if(!currentUser || !currentMaterial) return;

    const safePercent =
        Math.max(
            0,
            Math.min(
                100,
                Math.round(Number(percent) || 0)
            )
        );

    const now = new Date().toISOString();

    const payload = {
        user_id:currentUser.id,
        material_id:String(currentMaterial.id),
        status:completed ? "completed" : "started",
        progress:safePercent,
        last_watched_at:now,
        completed_at:completed ? now : null,
        updated_at:now
    };

    try{
        const {error} =
            await supabaseClient
                .from("learning_progress")
                .upsert(
                    payload,
                    {
                        onConflict:"user_id,material_id"
                    }
                );

        if(error){
            console.error("SAVE PROGRESS ERROR:",error);
            return;
        }

        if(completed){
            updateCompleteButton();
        }
    }catch(e){
        console.error("SAVE PROGRESS EXCEPTION:",e);
    }
}

async function completeMaterial(){
    if(!currentUser){
        alert("Silakan login terlebih dahulu untuk menyimpan progress belajar.");
        return;
    }

    setProgressUI(100);
    await saveProgress(100,true);

    const note = document.getElementById("progressNote");
    if(note){
        note.textContent = "✓ MasyaAllah, materi ini sudah ditandai selesai.";
    }

    updateCompleteButton();

    alert("✅ Materi berhasil ditandai selesai.");
}

function updateCompleteButton(){
    const buttons = [
        document.getElementById("completeMaterialBtn"),
        document.getElementById("pdfCompleteBtn")
    ].filter(Boolean);

    buttons.forEach(btn=>{
        btn.textContent = "✓ Materi Sudah Selesai";
        btn.classList.add("done");
    });
}

/* =========================================================
   AUTH CHANGE
========================================================= */
supabaseClient.auth.onAuthStateChange(function(event){
    if(
        event === "SIGNED_IN" ||
        event === "SIGNED_OUT" ||
        event === "TOKEN_REFRESHED"
    ){
        setTimeout(()=>{
            loadMaterial();
        },150);
    }
});

/* =========================================================
   CLEANUP
========================================================= */
window.addEventListener("beforeunload",()=>{
    clearProgressTimer();

    if(
        youtubePlayerInstance &&
        currentUser &&
        currentMaterial
    ){
        try{
            saveYouTubeProgress();
        }catch(e){}
    }
});

/* =========================================================
   START
========================================================= */
loadMaterial();
</script>
