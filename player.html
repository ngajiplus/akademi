/* =====================================================

const SUPABASE_URL =
    "https://ksgywgdrfskqsufchbcm.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_HmFKwHMCISfN_YOoiLx3-A_MWnG9yG7";


const supabaseClient =
    window.supabase.createClient(

/* =====================================================
   VARIABLES
===================================================== */

let currentUser =

let currentMaterial =
    null;

let currentProfile =
    null;

let membershipActive =
    false;

let isAdmin =
    false;

/* =====================================================

/* =====================================================
   GET MATERIAL ID
===================================================== */

function getMaterialId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("id");

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value ?? "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =====================================================
   GET MATERIAL TYPE
===================================================== */

function getMaterialType(item){

    /*
       Prioritaskan "tipe".

       Ini penting karena sebelumnya
       Al-Fatihah mempunyai:

       tipe = audio
       type = video
    */

    return String(
        item?.tipe ||
        item?.type ||
        "video"
    )
    .toLowerCase()
    .trim();

}


/* =====================================================
   CHECK PREMIUM VALUE
===================================================== */

function isPremiumMaterial(item){

    return (
        item?.premium === true ||
        String(
            item?.premium || ""
        )
        .toLowerCase()
        .trim() === "true"
    );

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(value){

    if(!value){

        return "-";

    }


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return "-";

    }


    return date.toLocaleDateString(
        "id-ID",
        {
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    );

}


/* =====================================================
   CHECK MEMBERSHIP
===================================================== */

async function checkMembership(){

    /*
       Belum login
    */

    if(!currentUser){

        currentProfile =
            null;

        membershipActive =
            false;

        isAdmin =
            false;

        return false;

    }


    try{

        const result =
            await supabaseClient
                .from("profiles")
                .select(
                    "id,nama,status,paket,berlaku_sampai,is_admin"
                )
                .eq(
                    "id",
                    currentUser.id
                )
                .maybeSingle();


        if(result.error){

            console.error(
                "PROFILE ERROR:",
                result.error
            );

            currentProfile =
                null;

            membershipActive =
                false;

            isAdmin =
                false;

            return false;

        }


        currentProfile =
            result.data;


        if(!currentProfile){

            membershipActive =
                false;

            isAdmin =
                false;

            return false;

        }


        /*
           ADMIN

           Admin tetap boleh membuka
           materi Premium.
        */

        isAdmin =
            currentProfile.is_admin === true ||
            String(
                currentProfile.is_admin || ""
            )
            .toLowerCase()
            .trim() === "true";


        if(isAdmin){

            membershipActive =
                true;

            return true;

        }


        /*
           STATUS
        */

        const status =
            String(
                currentProfile.status || ""
            )
            .toLowerCase()
            .trim();


        const statusAktif =
            status === "aktif";


        /*
           TANGGAL BERLAKU
        */

        let tanggalAktif =
            false;


        if(
            currentProfile.berlaku_sampai
        ){

            const tanggal =
                new Date(
                    currentProfile.berlaku_sampai
                );


            const sekarang =
                new Date();


            tanggalAktif =
                !isNaN(
                    tanggal.getTime()
                ) &&
                tanggal >= sekarang;

        }


        /*
           MEMBERSHIP FINAL
        */

        membershipActive =
            statusAktif &&
            tanggalAktif;


        return membershipActive;

    }

    catch(error){

        console.error(
            "CHECK MEMBERSHIP ERROR:",
            error
        );


        currentProfile =
            null;

        membershipActive =
            false;

        isAdmin =
            false;


        return false;

    }

}


/* =====================================================
   CHECK MATERIAL ACCESS
===================================================== */

async function checkMaterialAccess(){

    if(!currentMaterial){

        return false;

    }


    /*
       Materi GRATIS
       selalu boleh dibuka.
    */

    if(
        !isPremiumMaterial(
            currentMaterial
        )
    ){

        return true;

    }


    /*
       Materi PREMIUM
       harus login.
    */

    if(!currentUser){

        showPremiumLocked(
            "Silakan login terlebih dahulu untuk mengakses materi Premium."
        );

        return false;

    }


    /*
       Cek membership
    */

    const active =
        await checkMembership();


    if(active){

        return true;

    }


    /*
       Membership tidak aktif
    */

    let message =
        "Membership Premium Anda belum aktif.";


    if(
        currentProfile &&
        currentProfile.berlaku_sampai
    ){

        const tanggal =
            new Date(
                currentProfile.berlaku_sampai
            );


        const sekarang =
            new Date();


        if(
            !isNaN(
                tanggal.getTime()
            ) &&
            tanggal < sekarang
        ){

            message =
                "Masa berlaku membership Anda telah berakhir pada " +
                formatTanggal(
                    currentProfile.berlaku_sampai
                ) +
                ".";

        }

        else if(
            String(
                currentProfile.status || ""
            )
            .toLowerCase()
            .trim() !== "aktif"
        ){

            message =
                "Status membership Anda saat ini tidak aktif.";

        }

    }


    showPremiumLocked(
        message
    );


    return false;

}

/* =====================================================
   YOUTUBE ID
===================================================== */

function getYouTubeId(value){

    if(!value){

        return null;

    }


    let text =
        String(value)
            .trim();


    /*
       Direct ID
    */

    if(
        /^[a-zA-Z0-9_-]{11}$/.test(
            text
        )
    ){

        return text;

    }


    if(
        !text.startsWith("http://") &&
        !text.startsWith("https://")
    ){

        text =
            "https://" +
            text;

    }


    try{

        const url =
            new URL(text);


        const hostname =
            url.hostname
                .toLowerCase();


        /*
           youtube.com
        */

        if(
            hostname === "youtube.com" ||
            hostname === "www.youtube.com" ||
            hostname.endsWith(".youtube.com")
        ){

            const v =
                url.searchParams.get("v");


            if(
                v &&
                /^[a-zA-Z0-9_-]{11}$/.test(v)
            ){

                return v;

            }


            const parts =
                url.pathname
                    .split("/")
                    .filter(Boolean);


            const types = [
                "embed",
                "shorts",
                "live"
            ];


            for(
                const type of types
            ){

                const index =
                    parts.indexOf(type);


                if(
                    index !== -1 &&
                    parts[index + 1]
                ){

                    const id =
                        parts[index + 1];


                    if(
                        /^[a-zA-Z0-9_-]{11}$/.test(
                            id
                        )
                    ){

                        return id;

                    }

                }

            }

        }


        /*
           youtu.be
        */

        if(
            hostname === "youtu.be" ||
            hostname.endsWith(".youtu.be")
        ){

            const id =
                url.pathname
                    .replace(/^\/+/,"")
                    .split("/")[0];


            if(
                id &&
                /^[a-zA-Z0-9_-]{11}$/.test(id)
            ){

                return id;

            }

        }

    }

    catch(error){

        console.error(
            "YouTube URL error:",
            error
        );

    }


    return null;

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(seconds){

    seconds =
        Math.max(
            0,
            Math.floor(
                Number(seconds) || 0
            )
        );


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );


    const secs =
        seconds % 60;


    if(hours > 0){

        return (
            String(hours).padStart(2,"0") +
            ":" +
            String(minutes).padStart(2,"0") +
            ":" +
            String(secs).padStart(2,"0")
        );

    }


    return (
        String(minutes).padStart(2,"0") +
        ":" +
        String(secs).padStart(2,"0")
    );

}


/* =====================================================
   UPDATE PROGRESS UI
===================================================== */

function updateProgressUI(value){

    value =
        Math.max(
            0,
            Math.min(
                100,
                Math.round(
                    Number(value) || 0
                )
            )
        );


    currentProgress =
        value;


    progressBar.style.width =
        value + "%";


    progressPercent.textContent =
        value + "%";


    if(value >= 100){

        progressStatus.textContent =
            "✓ Materi selesai";

        completeBtn.textContent =
            "✓ Sudah Selesai";

        completeBtn.classList.add(
            "completed"
        );

    }

    else if(value > 0){

        progressStatus.textContent =
            "Sedang dipelajari • " +
            value +
            "%";

        completeBtn.textContent =
            "✓ Tandai Selesai";

        completeBtn.classList.remove(
            "completed"
        );

    }

    else{

        progressStatus.textContent =
            "Belum dimulai";

        completeBtn.textContent =
            "✓ Tandai Selesai";

        completeBtn.classList.remove(
            "completed"
        );

    }

}


/* =====================================================
   LOAD CURRENT USER
===================================================== */

async function loadCurrentUser(){

    try{

        const result =
            await supabaseClient
                .auth
                .getUser();


        if(result.error){

            console.error(
                "GET USER ERROR:",
                result.error
            );

            currentUser =
                null;

            return null;

        }


        currentUser =
            result.data.user || null;


        if(currentUser){

            profileBtn.classList.remove(
                "hidden"
            );

            logoutBtn.classList.remove(
                "hidden"
            );

        }


        return currentUser;

    }

    catch(error){

        console.error(
            "LOAD USER ERROR:",
            error
        );

        currentUser =
            null;


        return null;

    }

}


/* =====================================================
   LOAD MATERIAL
===================================================== */

async function loadMaterial(){

    const materialId =
        getMaterialId();


    if(!materialId){

        showError(
            "ID materi tidak ditemukan."
        );

        return;

    }


    try{

        const result =
            await supabaseClient
                .from("materials")
                .select(
                    "id,judul,deskripsi,kategori,tipe,type,url,thumbnail,premium"
                )
                .eq(
                    "id",
                    materialId
                )
                .maybeSingle();


        if(result.error){

            throw result.error;

        }


        if(!result.data){

            showLockedOrNotFound();

            return;

        }


        currentMaterial =
            result.data;


        /*
           =================================================
           PENTING
           =================================================

           JANGAN tampilkan player dahulu.

           Pertama-tama cek apakah user
           memiliki hak akses.
        */

        const allowed =
            await checkMaterialAccess();


        if(!allowed){

            return;

        }


        /*
           Kalau lolos pemeriksaan,
           baru tampilkan informasi materi.
        */

        renderMaterialHeader();


        /*
           Load progress
        */

        await loadProgress();


        /*
           Baru render player
        */

        renderPlayer();

    }

    catch(error){

        console.error(
            "LOAD MATERIAL ERROR:",
            error
        );


        showError(
            error.message ||
            "Gagal mengambil materi."
        );

    }

}

/* =====================================================
   LOAD PROGRESS
===================================================== */

async function loadProgress(){

    if(!currentUser){

        updateProgressUI(0);

        progressStatus.textContent =
            "Login untuk menyimpan progress belajar.";

        progressArea.classList.remove(
            "hidden"
        );

        return;

    }


    try{

        const result =
            await supabaseClient
                .from("learning_progress")
                .select(
                    "progress,status,completed_at"
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .eq(
                    "material_id",
                    String(
                        currentMaterial.id
                    )
                )
                .maybeSingle();


        if(result.error){

            console.error(
                "LOAD PROGRESS ERROR:",
                result.error
            );


            updateProgressUI(0);

        }

        else if(result.data){

            updateProgressUI(
                result.data.progress || 0
            );

        }

        else{

            updateProgressUI(0);

        }

    }

    catch(error){

        console.error(
            "PROGRESS ERROR:",
            error
        );

        updateProgressUI(0);

    }


    progressArea.classList.remove(
        "hidden"
    );

}


/* =====================================================
   SAVE PROGRESS
===================================================== */

async function saveProgress(
    value,
    completed = false
){

    if(!currentUser){

        return false;

    }


    if(!currentMaterial){

        return false;

    }


    value =
        Math.max(
            0,
            Math.min(
                100,
                Math.round(
                    Number(value) || 0
                )
            )
        );


    if(
        !completed &&
        value === lastSavedProgress
    ){

        return true;

    }


    if(savingProgress){

        return false;

    }


    savingProgress =
        true;


    try{

        const now =
            new Date()
                .toISOString();


        const payload = {

            user_id:
                currentUser.id,

            material_id:
                String(
                    currentMaterial.id
                ),

            status:
                completed ||
                value >= 100

                    ?

                "completed"

                    :

                "started",

            progress:
                completed
                    ?
                100
                    :
                value,

            last_watched_at:
                now,

            completed_at:
                completed ||
                value >= 100
                    ?
                now
                    :
                null,

            updated_at:
                now

        };


        const result =
            await supabaseClient
                .from("learning_progress")
                .upsert(
                    payload,
                    {
                        onConflict:
                            "user_id,material_id"
                    }
                );


        if(result.error){

            throw result.error;

        }


        lastSavedProgress =
            payload.progress;


        updateProgressUI(
            payload.progress
        );


        return true;

    }

    catch(error){

        console.error(
            "SAVE PROGRESS ERROR:",
            error
        );


        return false;

    }

    finally{

        savingProgress =
            false;

    }

}


/* =====================================================
   MARK STARTED
===================================================== */

async function markStarted(){

    if(!currentUser){

        return;

    }


    if(
        currentProgress === 0
    ){

        await saveProgress(
            1,
            false
        );

    }

}


/* =====================================================
   MARK COMPLETE
===================================================== */

completeBtn.addEventListener(
    "click",
    async function(){

        if(!currentUser){

            alert(
                "🔐 Silakan login terlebih dahulu agar progress belajar dapat disimpan."
            );

            return;

        }


        completeBtn.disabled =
            true;


        completeBtn.textContent =
            "⏳ Menyimpan...";


        const success =
            await saveProgress(
                100,
                true
            );


        if(success){

            updateProgressUI(
                100
            );

        }

        else{

            alert(
                "❌ Progress belum berhasil disimpan."
            );

        }


        completeBtn.disabled =
            false;

    }
);


/* =====================================================
   RENDER PLAYER
===================================================== */

function renderPlayer(){

    /*
       Pengaman kedua.

       Jangan pernah render player Premium
       jika membership tidak aktif.
    */

    if(
        isPremiumMaterial(
            currentMaterial
        ) &&
        !membershipActive &&
        !isAdmin
    ){

        showPremiumLocked(
            "Membership Premium Anda tidak aktif."
        );

        return;

    }


    const item =
        currentMaterial;


    const type =
        getMaterialType(item);


    if(type.includes("audio")){

        renderAudio();

        return;

    }


    if(type.includes("pdf")){

        renderPDF();

        return;

    }


    renderYouTube();

}


/* =====================================================
   YOUTUBE PLAYER
===================================================== */

function renderYouTube(){

    const item =
        currentMaterial;


    const youtubeId =
        getYouTubeId(
            item.url
        );


    if(!youtubeId){

        materialArea.insertAdjacentHTML(
            "beforeend",
            `
                <div class="notice error">
                    ⚠️ Link YouTube tidak valid.
                </div>
            `
        );

        return;

    }


    playerType =
        "video";


    materialArea.insertAdjacentHTML(
        "beforeend",
        `

        <div class="player-card">

            <div
                id="youtubePlayerContainer"
                class="player-container"
            >

                <div class="loading-player">

                    <div class="loading-icon">
                        ⏳
                    </div>

                    Memuat video...

                </div>

            </div>

        </div>

        `
    );


    loadYouTubeAPI();

}


/* =====================================================
   LOAD YOUTUBE API
===================================================== */

function loadYouTubeAPI(){

    if(
        window.YT &&
        window.YT.Player
    ){

        createYouTubePlayer();

        return;

    }


    window.onYouTubeIframeAPIReady =
        function(){

            createYouTubePlayer();

        };


    const script =
        document.createElement(
            "script"
        );


    script.src =
        "https://www.youtube.com/iframe_api";


    document.head.appendChild(
        script
    );

}


/* =====================================================
   CREATE YOUTUBE PLAYER
===================================================== */

function createYouTubePlayer(){

    /*
       Pengaman terakhir sebelum
       YouTube benar-benar dibuat.
    */

    if(
        isPremiumMaterial(
            currentMaterial
        ) &&
        !membershipActive &&
        !isAdmin
    ){

        showPremiumLocked(
            "Membership Premium Anda tidak aktif."
        );

        return;

    }


    const container =
        document.getElementById(
            "youtubePlayerContainer"
        );


    if(!container){

        return;

    }


    container.innerHTML = "";


    const playerElement =
        document.createElement(
            "div"
        );


    playerElement.id =
        "youtubePlayer";


    container.appendChild(
        playerElement
    );


    youtubePlayer =
        new YT.Player(
            "youtubePlayer",
            {

                videoId:
                    getYouTubeId(
                        currentMaterial.url
                    ),

                width:"100%",

                height:"100%",

                playerVars:{

                    rel:0,

                    modestbranding:1,

                    playsinline:1

                },

                events:{

                    onReady:
                        onYouTubeReady,

                    onStateChange:
                        onYouTubeStateChange,

                    onError:
                        onYouTubeError

                }

            }
        );

}


/* =====================================================
   YOUTUBE READY
===================================================== */

function onYouTubeReady(event){

    if(
        currentProgress > 0 &&
        currentProgress < 100
    ){

        const duration =
            event.target.getDuration();


        if(
            duration &&
            duration > 0
        ){

            const startSeconds =
                duration *
                (
                    currentProgress /
                    100
                );


            event.target.seekTo(
                startSeconds,
                true
            );

        }

    }


    markStarted();


    startYouTubeProgressTracking();

}


/* =====================================================
   YOUTUBE STATE
===================================================== */

function onYouTubeStateChange(event){

    if(
        event.data ===
        YT.PlayerState.PLAYING
    ){

        markStarted();

    }


    if(
        event.data ===
        YT.PlayerState.ENDED
    ){

        stopYouTubeProgressTracking();


        saveProgress(
            100,
            true
        );

    }

}


/* =====================================================
   YOUTUBE ERROR
===================================================== */

function onYouTubeError(event){

    console.error(
        "YOUTUBE ERROR:",
        event.data
    );


    const notice =
        document.createElement(
            "div"
        );


    notice.className =
        "notice error";


    notice.textContent =
        "⚠️ Video YouTube tidak dapat diputar. " +
        "Kemungkinan pemilik video menonaktifkan embedding.";


    materialArea.appendChild(
        notice
    );

}


/* =====================================================
   YOUTUBE PROGRESS TRACKING
===================================================== */

function startYouTubeProgressTracking(){

    stopYouTubeProgressTracking();


    progressTimer =
        setInterval(
            async function(){

                if(
                    !youtubePlayer ||
                    !youtubePlayer.getCurrentTime
                ){

                    return;

                }


                /*
                   Cek membership lagi setiap
                   kali progress berjalan.

                   Jika Premium dicabut ketika
                   video sedang terbuka,
                   player langsung dihentikan.
                */

                if(
                    isPremiumMaterial(
                        currentMaterial
                    ) &&
                    !membershipActive &&
                    !isAdmin
                ){

                    stopYouTubeProgressTracking();


                    try{

                        youtubePlayer.stopVideo();

                    }

                    catch(error){

                        console.error(
                            error
                        );

                    }


                    showPremiumLocked(
                        "Membership Premium Anda tidak lagi aktif."
                    );


                    return;

                }


                const currentTime =
                    youtubePlayer
                        .getCurrentTime();


                const duration =
                    youtubePlayer
                        .getDuration();


                if(
                    !duration ||
                    duration <= 0
                ){

                    return;

                }


                let percent =
                    (
                        currentTime /
                        duration
                    ) *
                    100;


                if(
                    percent >= 98
                ){

                    percent =
                        99;

                }


                percent =
                    Math.round(
                        percent
                    );


                updateProgressUI(
                    percent
                );


                if(
                    percent > 0 &&
                    percent !== lastSavedProgress
                ){

                    await saveProgress(
                        percent,
                        false
                    );

                }

            },
            5000
        );

}


/* =====================================================
   STOP YOUTUBE TRACKING
===================================================== */

function stopYouTubeProgressTracking(){

    if(progressTimer){

        clearInterval(
            progressTimer
        );

        progressTimer =
            null;

    }

}


/* =====================================================
   AUDIO PLAYER
===================================================== */

function renderAudio(){

    playerType =
        "audio";


    materialArea.insertAdjacentHTML(
        "beforeend",
        `

        <div class="player-card">

            <div class="audio-player">

                <div class="audio-icon">
                    🎧
                </div>


                <div class="audio-title">

                    ${escapeHtml(
                        currentMaterial.judul ||
                        "Audio Pembelajaran"
                    )}

                </div>


                <audio
                    id="audioPlayer"
                    controls
                    preload="metadata"
                >

                    Browser Anda tidak mendukung
                    pemutar audio.

                </audio>

            </div>

        </div>

        `
    );


    const audio =
        document.getElementById(
            "audioPlayer"
        );


    audio.src =
        currentMaterial.url;


    audio.addEventListener(
        "loadedmetadata",
        function(){

            if(
                currentProgress > 0 &&
                currentProgress < 100 &&
                audio.duration &&
                isFinite(audio.duration)
            ){

                audio.currentTime =
                    audio.duration *
                    (
                        currentProgress /
                        100
                    );

            }

        }
    );


    audio.addEventListener(
        "play",
        function(){

            markStarted();

        }
    );


    audio.addEventListener(
        "timeupdate",
        function(){

            if(
                !audio.duration ||
                !isFinite(audio.duration)
            ){

                return;

            }


            /*
               Jika Premium dicabut,
               hentikan audio.
            */

            if(
                isPremiumMaterial(
                    currentMaterial
                ) &&
                !membershipActive &&
                !isAdmin
            ){

                audio.pause();


                showPremiumLocked(
                    "Membership Premium Anda tidak lagi aktif."
                );


                return;

            }


            let percent =
                (
                    audio.currentTime /
                    audio.duration
                ) *
                100;


            if(
                percent >= 98 &&
                !audio.ended
            ){

                percent =
                    99;

            }


            percent =
                Math.round(
                    percent
                );


            updateProgressUI(
                percent
            );


            if(
                percent > 0 &&
                percent !== lastSavedProgress
            ){

                saveProgress(
                    percent,
                    false
                );

            }

        }
    );


    audio.addEventListener(
        "ended",
        function(){

            saveProgress(
                100,
                true
            );

        }
    );

}


/* =====================================================
   PDF PLAYER
===================================================== */

function renderPDF(){

    playerType =
        "pdf";


    const pdfUrl =
        currentMaterial.url;


    let viewerUrl =
        pdfUrl;


    const match =
        String(pdfUrl || "")
            .match(
                /drive\.google\.com\/file\/d\/([^/]+)/
            );


    if(match){

        viewerUrl =
            "https://drive.google.com/file/d/" +
            match[1] +
            "/preview";

    }


    materialArea.insertAdjacentHTML(
        "beforeend",
        `

        <div class="player-card">

            <iframe
                class="pdf-player"
                src="${escapeHtml(
                    viewerUrl
                )}"
                title="PDF ${escapeHtml(
                    currentMaterial.judul ||
                    "Materi"
                )}"
                loading="lazy"
            ></iframe>

        </div>

        <div class="notice warning">

            📄 Untuk PDF, progress halaman
            belum dapat dibaca otomatis oleh
            browser. Gunakan tombol
            <strong>Tandai Selesai</strong>
            setelah selesai membaca.

        </div>

        `
    );


    markStarted();

}

                duration > 0

                        (
                            currentTime /
                            duration
                        ) *
                        100
                    );


                console.log(
                    "Last video progress:",
                    percent
                );

            }

        }

    }
);

===================================================== */

start();
