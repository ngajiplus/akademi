<script>

/* =====================================================
   SUPABASE CONFIG
====================================================== */

const SUPABASE_URL =
  "https://ksgywgdrfskqsufchbcm.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_HmFKwHMCISfN_YOoiLx3-A_MWnG9yG7";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   GLOBAL VARIABLES
====================================================== */

let currentMaterial =
  null;

let currentUser =
  null;

let membershipActive =
  false;

let currentProgress =
  0;

let audioElement =
  null;


/* =====================================================
   GET MATERIAL ID
====================================================== */

function getMaterialId() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id");


  if (!id) {

    return null;

  }


  const numericId =
    Number(id);


  if (
    !Number.isInteger(
      numericId
    ) ||
    numericId <= 0
  ) {

    return null;

  }


  return numericId;

}


/* =====================================================
   YOUTUBE ID
====================================================== */

function getYouTubeId(url) {

  if (!url) {

    return null;

  }


  try {

    const parsed =
      new URL(url);


    const hostname =
      parsed.hostname
        .toLowerCase();


    /*
      youtube.com/watch?v=ID
    */

    if (
      hostname.includes("youtube.com") &&
      parsed.searchParams.get("v")
    ) {

      return parsed.searchParams.get("v");

    }


    /*
      youtube.com/embed/ID
    */

    if (
      hostname.includes("youtube.com") &&
      parsed.pathname.startsWith("/embed/")
    ) {

      return parsed.pathname
        .split("/embed/")[1]
        .split("/")[0];

    }


    /*
      youtube.com/shorts/ID
    */

    if (
      hostname.includes("youtube.com") &&
      parsed.pathname.startsWith("/shorts/")
    ) {

      return parsed.pathname
        .split("/shorts/")[1]
        .split("/")[0];

    }


    /*
      youtu.be/ID
    */

    if (
      hostname === "youtu.be"
    ) {

      return parsed.pathname
        .replace("/", "")
        .split("/")[0];

    }

  } catch (error) {

    console.warn(
      "URL YouTube tidak valid:",
      url
    );

  }


  return null;

}


/* =====================================================
   YOUTUBE THUMBNAIL
====================================================== */

function getYouTubeThumbnail(url) {

  const videoId =
    getYouTubeId(url);


  if (!videoId) {

    return null;

  }


  return (
    "https://img.youtube.com/vi/" +
    videoId +
    "/hqdefault.jpg"
  );

}


/* =====================================================
   AUDIO URL
====================================================== */

function isAudioUrl(url) {

  if (!url) {

    return false;

  }


  const cleanUrl =
    url
      .split("?")[0]
      .toLowerCase();


  return (

    cleanUrl.endsWith(".mp3") ||

    cleanUrl.endsWith(".m4a") ||

    cleanUrl.endsWith(".wav") ||

    cleanUrl.endsWith(".ogg") ||

    cleanUrl.endsWith(".aac") ||

    cleanUrl.endsWith(".flac")

  );

}


/* =====================================================
   PDF URL
====================================================== */

function isPdfUrl(url) {

  if (!url) {

    return false;

  }


  const cleanUrl =
    url
      .split("?")[0]
      .toLowerCase();


  return cleanUrl.endsWith(".pdf");

}


/* =====================================================
   GOOGLE DRIVE FILE ID
====================================================== */

function getGoogleDriveFileId(url) {

  if (!url) {

    return null;

  }


  try {

    const parsed =
      new URL(url);


    /*
      FORMAT:

      https://drive.google.com/file/d/FILE_ID/view
    */

    const pathMatch =
      parsed.pathname.match(
        /\/file\/d\/([^/]+)/
      );


    if (
      pathMatch &&
      pathMatch[1]
    ) {

      return pathMatch[1];

    }


    /*
      FORMAT:

      https://drive.google.com/open?id=FILE_ID
    */

    const id =
      parsed.searchParams.get("id");


    if (id) {

      return id;

    }


    /*
      FORMAT:

      https://drive.google.com/uc?id=FILE_ID
    */

    const ucId =
      parsed.searchParams.get("id");


    if (ucId) {

      return ucId;

    }

  } catch (error) {

    console.warn(
      "URL Google Drive tidak valid:",
      url
    );

  }


  return null;

}


/* =====================================================
   MATERIAL TYPE
====================================================== */

function getMaterialType(material) {

  const tipe =
    String(
      material.tipe ||
      ""
    )
      .toLowerCase()
      .trim();


  const type =
    String(
      material.type ||
      ""
    )
      .toLowerCase()
      .trim();


  /*
    Prioritas tipe.
  */

  if (
    tipe === "video" ||
    type === "video"
  ) {

    if (
      getYouTubeId(
        material.url
      )
    ) {

      return "video";

    }

  }


  if (
    tipe === "audio" ||
    tipe === "mp3" ||
    tipe === "murottal" ||

    type === "audio" ||
    type === "mp3" ||
    type === "murottal"
  ) {

    return "audio";

  }


  if (
    tipe === "pdf" ||
    tipe === "ebook" ||
    tipe === "dokumen" ||

    type === "pdf" ||
    type === "ebook" ||
    type === "dokumen"
  ) {

    return "pdf";

  }


  /*
    Fallback URL.
  */

  if (
    getYouTubeId(
      material.url
    )
  ) {

    return "video";

  }


  if (
    isAudioUrl(
      material.url
    )
  ) {

    return "audio";

  }


  if (
    isPdfUrl(
      material.url
    ) ||
    getGoogleDriveFileId(
      material.url
    )
  ) {

    return "pdf";

  }


  return "unknown";

}


/* =====================================================
   CHECK USER
====================================================== */

async function checkUser() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getUser();


  if (error) {

    console.error(
      "Auth error:",
      error
    );

    return null;

  }


  const user =
    data?.user;


  if (!user) {

    return null;

  }


  currentUser =
    user;


  /*
    Ambil profile.
  */

  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select(`
        id,
        nama,
        status,
        paket,
        berlaku_sampai,
        avatar_url
      `)
      .eq(
        "id",
        user.id
      )
      .maybeSingle();


  if (profileError) {

    console.warn(
      "Profile error:",
      profileError
    );

  }


  if (!profile) {

    document.getElementById(
      "profileName"
    ).textContent =
      user.email ||
      "Akun";

    return user;

  }


  /*
    Nama.
  */

  const nama =
    profile.nama ||
    user.email ||
    "User";


  document.getElementById(
    "profileName"
  ).textContent =
    nama;


  /*
    Avatar.
  */

  const avatar =
    document.getElementById(
      "avatar"
    );


  if (
    profile.avatar_url
  ) {

    avatar.innerHTML = `

      <img
        src="${escapeHtml(
          profile.avatar_url
        )}"
        alt="Avatar"
      >

    `;

  } else {

    avatar.textContent =
      nama
        .charAt(0)
        .toUpperCase();

  }


  /*
    Membership.
  */

  const status =
    String(
      profile.status ||
      ""
    )
      .toLowerCase()
      .trim();


  let activeDate =
    false;


  if (
    profile.berlaku_sampai
  ) {

    const expiry =
      new Date(
        profile.berlaku_sampai
      );


    activeDate =
      expiry >= new Date();

  }


  membershipActive =
    status === "aktif" &&
    activeDate;


  return user;

}

      "Material error:",
      error
    );


    showError(
      "Gagal mengambil materi: " +
      error.message
    );


    return;

  }


  if (!material) {

    showError(
      "Materi tidak ditemukan."
    );


    return;

  }


  currentMaterial =
    material;


  renderMaterial();

}


/* =====================================================
   RENDER MATERIAL
====================================================== */

function renderMaterial() {

  const material =
    currentMaterial;


  document.title =
    (
      material.judul ||
      "Materi"
    ) +
    " - NgajiPlus Akademi";


  /*
    Judul.
  */

  document.getElementById(
    "title"
  ).textContent =
    material.judul ||
    "Materi";


  /*
    Deskripsi.
  */

  document.getElementById(
    "description"
  ).textContent =
    material.deskripsi ||
    "Materi pembelajaran NgajiPlus Akademi.";


  /*
    Kategori.
  */

  document.getElementById(
    "category"
  ).textContent =
    material.kategori ||
    "Materi";


  /*
    Premium.
  */

  const isPremium =
    material.premium === true ||
    material.premium === "true" ||
    material.premium === 1;


  if (isPremium) {

    document.getElementById(
      "premiumBadge"
    ).style.display =
      "inline-block";

  }


  /*
    Premium lock.
  */

  if (
    isPremium &&
    !membershipActive
  ) {

    document.getElementById(
      "premiumLock"
    ).style.display =
      "block";


    document.getElementById(
      "playerCard"
    ).innerHTML = `

      <div
        style="
          background:#111111;
          color:#ffffff;
          padding:70px 20px;
          text-align:center;
        "
      >

        <div style="font-size:55px;">
          🔒
        </div>

        <h2 style="margin:15px 0;">
          Materi Premium
        </h2>

        <p style="
          color:#cccccc;
          line-height:1.6;
        ">
          Silakan aktifkan membership
          untuk membuka materi ini.
        </p>

      </div>

    `;


    document.getElementById(
      "completeBtn"
    ).style.display =
      "none";


    return;

  }


  renderPlayer();

}


/* =====================================================
   RENDER PLAYER
====================================================== */

function renderPlayer() {

  const material =
    currentMaterial;


  const type =
    getMaterialType(
      material
    );


  const container =
    document.getElementById(
      "playerContainer"
    );


  /* ===================================================
     VIDEO YOUTUBE
  =================================================== */

  if (
    type === "video"
  ) {

    const videoId =
      getYouTubeId(
        material.url
      );


    if (!videoId) {

      showPlayerError(
        "Link YouTube tidak valid."
      );


      return;

    }


    /*
      YouTube Privacy Enhanced Mode.
    */

    const embedUrl =
      "https://www.youtube-nocookie.com/embed/" +
      encodeURIComponent(
        videoId
      ) +
      "?rel=0&modestbranding=1";


    container.className =
      "video-wrapper";


    container.innerHTML = `

      <iframe
        id="youtubePlayer"
        src="${embedUrl}"
        title="${escapeHtml(
          material.judul ||
          "Video Pembelajaran"
        )}"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>

    `;


    /*
      Catatan:
      Progress YouTube belum dibaca
      berdasarkan durasi video pada versi ini.
    */

    return;

  }


  /* ===================================================
     AUDIO
  =================================================== */

  if (
    type === "audio"
  ) {

    container.className =
      "audio-player";


    container.innerHTML = `

      <div class="audio-icon">
        🎧
      </div>


      <h2>
        ${escapeHtml(
          material.judul ||
          "Audio"
        )}
      </h2>


      <p>
        Murottal / Audio Pembelajaran
      </p>


      <audio
        id="audioPlayer"
        controls
        preload="metadata"
      >

        <source
          src="${escapeHtml(
            material.url ||
            ""
          )}"
        >

        Browser Anda tidak mendukung
        pemutar audio.

      </audio>

    `;


    audioElement =
      document.getElementById(
        "audioPlayer"
      );


    /*
      Progress audio.
    */

    audioElement.addEventListener(
      "timeupdate",
      handleAudioProgress
    );


    /*
      Audio selesai.
    */

    audioElement.addEventListener(
      "ended",
      () => {

        setProgress(
          100
        );

      }
    );


    /*
      Jika audio error.
    */

    audioElement.addEventListener(
      "error",
      () => {

        console.error(
          "Audio gagal diputar:",
          material.url
        );


        document.getElementById(
          "progressStatus"
        ).textContent =
          "Audio tidak dapat diputar dari alamat tersebut.";

      }
    );


    return;

  }


  /* ===================================================
     PDF GOOGLE DRIVE
  =================================================== */

  if (
    type === "pdf"
  ) {

    const driveFileId =
      getGoogleDriveFileId(
        material.url
      );


    if (!driveFileId) {

      container.className =
        "unsupported";


      container.innerHTML = `

        <div class="unsupported-icon">
          ⚠️
        </div>


        <h3>
          Link PDF tidak valid
        </h3>


        <p>
          File PDF Google Drive
          tidak dapat ditemukan
          dari URL materi.
        </p>

      `;


      return;

    }


    /*
      Google Drive Preview.
    */

    const previewUrl =
      "https://drive.google.com/file/d/" +
      encodeURIComponent(
        driveFileId
      ) +
      "/preview";


    container.className =
      "pdf-wrapper";


    container.innerHTML = `

      <iframe
        src="${previewUrl}"
        title="${escapeHtml(
          material.judul ||
          "Dokumen PDF"
        )}"
        allow="autoplay"
      ></iframe>

    `;


    /*
      PDF berhasil dibuka.
      Untuk sementara kita beri
      progress awal 10%.
    */

    setProgress(
      10
    );


    return;

  }


  /* ===================================================
     UNKNOWN
  =================================================== */

  container.className =
    "unsupported";


  container.innerHTML = `

    <div class="unsupported-icon">
      ⚠️
    </div>


    <h3>
      Format materi belum dikenali
    </h3>


    <p>
      Periksa kolom
      <b>tipe</b>,
      <b>type</b>,
      dan
      <b>url</b>
      di Supabase.
    </p>

  `;

}


/* =====================================================
   PLAYER ERROR
====================================================== */

function showPlayerError(message) {

  const container =
    document.getElementById(
      "playerContainer"
    );


  container.className =
    "unsupported";


  container.innerHTML = `

    <div class="unsupported-icon">
      ⚠️
    </div>


    <h3>
      ${escapeHtml(
        message
      )}
    </h3>


    <p>
      Silakan periksa URL materi
      di Supabase.
    </p>

  `;

}


/* =====================================================
   AUDIO PROGRESS
====================================================== */

function handleAudioProgress() {

  if (!audioElement) {

    return;

  }


  const duration =
    audioElement.duration;


  const currentTime =
    audioElement.currentTime;


  if (
    !Number.isFinite(
      duration
    ) ||
    duration <= 0
  ) {

    return;

  }


  const percent =
    (
      currentTime /
      duration
    ) * 100;


  setProgress(
    Math.min(
      Math.round(
        percent
      ),
      100
    )
  );

}


/* =====================================================
   PROGRESS KEY
====================================================== */

function getProgressKey() {

  if (
    !currentUser ||
    !currentMaterial
  ) {

    return null;

  }


  return (
    "ngajiplus_progress_" +
    currentUser.id +
    "_" +
    currentMaterial.id
  );

}


/* =====================================================
   LOAD SAVED PROGRESS
====================================================== */

function loadSavedProgress() {

  const key =
    getProgressKey();


  if (!key) {

    return;

  }


  const saved =
    localStorage.getItem(
      key
    );


  if (
    saved === null
  ) {

    return;

  }


  const percent =
    Number(
      saved
    );


  if (
    Number.isFinite(
      percent
    )
  ) {

    setProgress(
      Math.max(
        0,
        Math.min(
          percent,
          100
        )
      ),
      false
    );

  }

}


/* =====================================================
   SET PROGRESS
====================================================== */

function setProgress(
  percent,
  save = true
) {

  currentProgress =
    Math.max(
      0,
      Math.min(
        100,
        Math.round(
          percent
        )
      )
    );


  /*
    Persentase.
  */

  document.getElementById(
    "progressPercent"
  ).textContent =
    currentProgress +
    "%";


  /*
    Bar.
  */

  document.getElementById(
    "progressFill"
  ).style.width =
    currentProgress +
    "%";


  /*
    Status.
  */

  const status =
    document.getElementById(
      "progressStatus"
    );


  if (
    currentProgress >= 100
  ) {

    status.textContent =
      "✓ Materi selesai";


    document.getElementById(
      "completeBtn"
    ).textContent =
      "✓ Sudah Selesai";

  }

  else if (
    currentProgress > 0
  ) {

    status.textContent =
      "Sedang dipelajari";

  }

  else {

    status.textContent =
      "Belum dimulai";

  }


  /*
    Simpan ke browser.
  */

  if (save) {

    const key =
      getProgressKey();


    if (key) {

      localStorage.setItem(
        key,
        String(
          currentProgress
        )
      );

    }

  }

}


/* =====================================================
   COMPLETE
====================================================== */

function completeMaterial() {

  setProgress(
    100
  );


  const button =
    document.getElementById(
      "completeBtn"
    );


  button.textContent =
    "✓ Sudah Selesai";


  button.disabled =
    true;

}


/* =====================================================
   ERROR PAGE
====================================================== */

function showError(message) {

  document.getElementById(
    "loading"
  ).style.display =
    "none";


  document.getElementById(
    "content"
  ).style.display =
    "none";


  const errorBox =
    document.getElementById(
      "error"
    );


  errorBox.style.display =
    "block";


  errorBox.textContent =
    message;

}


/* =====================================================
   ESCAPE HTML
====================================================== */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   BACK BUTTON
====================================================== */

function goBack() {

  if (
    document.referrer &&
    document.referrer.includes(
      "ngajiplus.id"
    )
  ) {

    history.back();

  }

  else {

    window.location.href =
      "index.html";

  }

}


/* =====================================================
   INITIALIZE
====================================================== */

async function init() {

  try {

    /*
      1. Check login
    */

    await checkUser();


    /*
      2. Load material
    */

    await loadMaterial();


    /*
      3. Load progress
    */

    loadSavedProgress();


    /*
      4. Hide loading
    */

    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "content"
    ).style.display =
      "block";


  }

  catch (error) {

    console.error(
      "INIT ERROR:",
      error
    );


    showError(
      "Terjadi kesalahan: " +
      error.message
    );

  }

}


/* =====================================================
   START
====================================================== */

init();

</script>
