<script>

/* =====================================================

const SUPABASE_URL =

const supabaseClient =

/* =====================================================

/* =====================================================
   ELEMENT
===================================================== */

    );


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(value){

    return escapeHtml(
        value
    );

}


/* =====================================================
   GET ID URL
===================================================== */

function getMaterialId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("id");

}


/* =====================================================
   PREMIUM
===================================================== */

function isPremium(item){

    return (
        item?.premium === true ||
        item?.premium === "true" ||
        item?.is_premium === true ||
        item?.is_premium === "true"
    );

}


/* =====================================================
   TYPE
===================================================== */

function getType(item){

    return String(
        item?.tipe ||
        item?.type ||
        item?.jenis ||
        "video"
    )
    .toLowerCase()
    .trim();

}


/* =====================================================
   TITLE
===================================================== */

function getTitle(item){

    return (
        item?.judul ||
        item?.title ||
        "Tanpa Judul"
    );

}


/* =====================================================
   DESCRIPTION
===================================================== */

function getDescription(item){

    return (
        item?.deskripsi ||
        item?.description ||
        "Materi pembelajaran Islam."
    );

}


/* =====================================================
   CATEGORY
===================================================== */

function getCategory(item){

    return (
        item?.kategori ||
        item?.category ||
        "Umum"
    );

}


/* =====================================================
   URL
===================================================== */

function getUrl(item){

    return (
        item?.url_materi ||
        item?.url ||
        item?.video_url ||
        item?.audio_url ||
        item?.pdf_url ||
        item?.link ||
        ""
    );

}


/* =====================================================
   YOUTUBE ID
===================================================== */

function getYoutubeId(url){

    if(!url){

        return null;

    }


    try{

        const parsed =
            new URL(url);

        const host =
            parsed.hostname
                .toLowerCase();


        /* youtube.com */

        if(
            host.includes(
                "youtube.com"
            )
        ){

            const videoId =
                parsed.searchParams.get(
                    "v"
                );


            if(videoId){

                return videoId;

            }


            const parts =
                parsed.pathname
                    .split("/")
                    .filter(Boolean);


            const embedIndex =
                parts.indexOf(
                    "embed"
                );


            if(
                embedIndex !== -1 &&
                parts[embedIndex + 1]
            ){

                return parts[
                    embedIndex + 1
                ];

            }


            const shortsIndex =
                parts.indexOf(
                    "shorts"
                );


            if(
                shortsIndex !== -1 &&
                parts[shortsIndex + 1]
            ){

                return parts[
                    shortsIndex + 1
                ];

            }

        }


        /* youtu.be */

        if(
            host.includes(
                "youtu.be"
            )
        ){

            return parsed
                .pathname
                .replace(
                    "/",
                    ""
                )
                .split(
                    "?"
                )[0];

        }

    }

    catch(error){

        console.warn(
            "YouTube URL tidak valid:",
            error
        );

    }


    return null;

}


/* =====================================================
   GOOGLE DRIVE FILE ID
===================================================== */

function getGoogleDriveId(url){

    if(!url){

        return null;

    }


    let match;


    /*

       Format:

       https://drive.google.com/file/d/FILE_ID/view

    */

    match =
        url.match(
            /drive\.google\.com\/file\/d\/([^/]+)/i
        );


    if(match){

        return match[1];

    }


    /*

       Format:

       https://drive.google.com/open?id=FILE_ID

    */

    match =
        url.match(
            /[?&]id=([^&]+)/i
        );


    if(match){

        return match[1];

    }


    /*

       Format:

       https://drive.google.com/uc?id=FILE_ID

    */

    match =
        url.match(
            /drive\.google\.com\/uc\?[^#]*id=([^&]+)/i
        );


    if(match){

        return match[1];

    }


    return null;

}


/* =====================================================
   GOOGLE DRIVE AUDIO URL
===================================================== */

function getGoogleDriveAudioUrl(
    url,
    mode = 1
){

    const fileId =
        getGoogleDriveId(
            url
        );


    if(!fileId){

        return url;

    }


    /* =========================================
       URL 1
       ========================================= */

    if(mode === 1){

        return (
            "https://drive.usercontent.google.com/download" +
            "?id=" +
            encodeURIComponent(
                fileId
            ) +
            "&export=download" +
            "&confirm=t"
        );

    }


    /* =========================================
       URL 2
       ========================================= */

    return (
        "https://drive.google.com/uc" +
        "?export=download" +
        "&id=" +
        encodeURIComponent(
            fileId
        )
    );

}


/* =====================================================
   GOOGLE DRIVE PDF URL
===================================================== */

function getGoogleDrivePdfUrl(url){

    const fileId =
        getGoogleDriveId(
            url
        );


    if(!fileId){

        return url;

    }


    return (
        "https://drive.google.com/file/d/" +
        encodeURIComponent(
            fileId
        ) +
        "/preview"
    );

}


/* =====================================================
   GOOGLE DRIVE DIRECT OPEN
===================================================== */

function getGoogleDriveOpenUrl(url){

    const fileId =
        getGoogleDriveId(
            url
        );


    if(!fileId){

        return url;

    }


    return (
        "https://drive.google.com/file/d/" +
        encodeURIComponent(
            fileId
        ) +
        "/view"
    );

}


/* =====================================================
   DATE
===================================================== */

function formatTanggal(value){

    if(!value){

        return "-";

    }


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return String(value);

    }


    return date.toLocaleDateString(
        "id-ID",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

}


/* =====================================================
   GET CURRENT USER
===================================================== */

async function checkUser(){

    currentUser =
        null;

    currentProfile =
        null;

    membershipActive =
        false;


    try{

        const result =
            await supabaseClient
                .auth
                .getUser();


        if(result.error){

            throw result.error;

        }


        currentUser =
            result.data.user;


        /* =========================================
           BELUM LOGIN
        ========================================= */

        if(!currentUser){

            return;

        }


        /* =========================================
           PROFILE
        ========================================= */

        const profileResult =
            await supabaseClient
                .from("profiles")
                .select(
                    "id,nama,status,paket,berlaku_sampai,avatar_url"
                )
                .eq(
                    "id",
                    currentUser.id
                )
                .maybeSingle();


        if(
            profileResult.error
        ){

            console.warn(
                "PROFILE ERROR:",
                profileResult.error
            );

            return;

        }


        currentProfile =
            profileResult.data;


        if(!currentProfile){

            return;

        }


        /* =========================================
           STATUS
        ========================================= */

        const status =
            String(
                currentProfile.status ||
                ""
            )
            .toLowerCase()
            .trim();


        const statusAktif =
            status === "aktif";


        let tanggalAktif =
            false;


        if(
            currentProfile.berlaku_sampai
        ){

            const tanggal =
                new Date(
                    currentProfile.berlaku_sampai
                );


            const sekarang =
                new Date();


            tanggalAktif =
                !isNaN(
                    tanggal.getTime()
                ) &&
                tanggal >= sekarang;

        }


        membershipActive =
            statusAktif &&
            tanggalAktif;

    }

    catch(error){

        console.error(
            "CHECK USER ERROR:",
            error
        );

    }

}


/* =====================================================
   LOAD MATERIAL
===================================================== */

async function loadMaterial(){

    const id =
        getMaterialId();


    if(!id){

        showError(
            "ID materi tidak ditemukan."
        );

        return;

    }


    try{

        /*
           Kita mengambil satu materi berdasarkan ID.
        */

        const result =
            await supabaseClient
                .from("materials")
                .select(
                    "id,judul,deskripsi,kategori,tipe,url,thumbnail,premium"
                )
                .eq(
                    "id",
                    id
                )
                .maybeSingle();


        if(result.error){

            throw result.error;

        }


        if(!result.data){

            showError(
                "Materi tidak ditemukan di database."
            );

            return;

        }


        currentMaterial =
            result.data;


        /* =========================================
           PREMIUM CHECK
        ========================================= */

        if(
            isPremium(
                currentMaterial
            ) &&
            !membershipActive
        ){

            renderLocked();

            return;

        }


        /* =========================================
           LOAD PLAYER
        ========================================= */

        renderPlayer();

    }

    catch(error){

        console.error(
            "LOAD MATERIAL ERROR:",
            error
        );


        showError(
            error.message
        );

    }

}

}

/* =====================================================
   CREATE PLAYER
===================================================== */

function createPlayer(item){

    const playerArea =
        document.getElementById(
            "playerArea"
        );


    const type =
        getType(item);


    const url =
        getUrl(item);


    if(!url){

        playerArea.innerHTML = `

            <div class="player-error">

                <div class="player-error-icon">

                    ⚠️

                </div>


                <div class="player-error-title">

                    Materi belum memiliki URL

                </div>


                <div class="player-error-text">

                    Silakan isi kolom URL materi
                    di database Supabase.

                </div>

            </div>

        `;

        return;

    }


    /* =========================================
       VIDEO YOUTUBE
    ========================================= */

    if(
        type.includes("video")
    ){

        const youtubeId =
            getYoutubeId(
                url
            );


        if(youtubeId){

            playerArea.innerHTML = `

                <div class="video-wrapper">

                    <iframe
                        src="https://www.youtube.com/embed/${escapeAttribute(youtubeId)}?rel=0&modestbranding=1"
                        title="${escapeAttribute(
                            getTitle(item)
                        )}"
                        allow="
                            accelerometer;
                            autoplay;
                            clipboard-write;
                            encrypted-media;
                            gyroscope;
                            picture-in-picture;
                            web-share
                        "
                        allowfullscreen
                    ></iframe>

                </div>

            `;

            return;

        }


        /* Video non-YouTube */

        playerArea.innerHTML = `

            <video
                id="videoPlayer"
                controls
                playsinline
                preload="metadata"
                style="
                    width:100%;
                    max-height:650px;
                    background:#000;
                "
            >

                <source
                    src="${escapeAttribute(url)}"
                >

                Browser Anda tidak mendukung video.

            </video>

        `;


        setupVideoProgress();

        return;

    }


    /* =========================================
       AUDIO
    ========================================= */

    if(
        type.includes("audio")
    ){

        createAudioPlayer(
            playerArea,
            url
        );

        return;

    }


    /* =========================================
       PDF
    ========================================= */

    if(
        type.includes("pdf")
    ){

        const pdfUrl =
            getGoogleDrivePdfUrl(
                url
            );


        playerArea.innerHTML = `

            <div class="pdf-wrapper">

                <iframe
                    src="${escapeAttribute(pdfUrl)}"
                    title="${escapeAttribute(
                        getTitle(item)
                    )}"
                ></iframe>

            </div>

        `;


        return;

    }


    /* =========================================
       UNKNOWN
    ========================================= */

    playerArea.innerHTML = `

        <div class="default-player">

            <div class="default-icon">

                📚

            </div>


            <div class="default-title">

                ${escapeHtml(
                    getTitle(item)
                )}

            </div>


            <div class="default-text">

                Format materi belum dikenali.

            </div>


            <br>


            <a
                href="${escapeAttribute(url)}"
                target="_blank"
                rel="noopener noreferrer"
                class="external-button"
            >

                🔗 Buka Materi

            </a>

        </div>

    `;

}


/* =====================================================
   AUDIO PLAYER
===================================================== */

function createAudioPlayer(
    playerArea,
    originalUrl
){

    const audioUrl1 =
        getGoogleDriveAudioUrl(
            originalUrl,
            1
        );


    const audioUrl2 =
        getGoogleDriveAudioUrl(
            originalUrl,
            2
        );


    playerArea.innerHTML = `

        <div class="audio-wrapper">

            <div class="audio-icon">

                🎧

            </div>


            <div class="audio-label">

                Materi Audio

            </div>


            <div class="audio-player">

                <audio
                    id="audioPlayer"
                    controls
                    preload="metadata"
                    playsinline
                >

                    <source
                        id="audioSource"
                        src="${escapeAttribute(
                            audioUrl1
                        )}"
                    >

                    Browser Anda tidak mendukung audio.

                </audio>

            </div>


            <div
                id="audioStatus"
                style="
                    margin-top:10px;
                    color:#7a8580;
                    font-size:8px;
                "
            >

                ⏳ Menyiapkan audio...

            </div>

        </div>

    `;


    const audio =
        document.getElementById(
            "audioPlayer"
        );


    const source =
        document.getElementById(
            "audioSource"
        );


    const status =
        document.getElementById(
            "audioStatus"
        );


    let triedSecondUrl =
        false;


    /* =========================================
       METADATA BERHASIL
    ========================================= */

    audio.addEventListener(
        "loadedmetadata",
        function(){

            status.textContent =
                "✓ Audio siap diputar.";

        }
    );


    /* =========================================
       PLAY
    ========================================= */

    audio.addEventListener(
        "play",
        function(){

            status.textContent =
                "▶ Audio sedang diputar.";

        }
    );


    /* =========================================
       PAUSE
    ========================================= */

    audio.addEventListener(
        "pause",
        function(){

            if(
                !audio.ended
            ){

                status.textContent =
                    "⏸ Audio dijeda.";

            }

        }
    );


    /* =========================================
       SELESAI
    ========================================= */

    audio.addEventListener(
        "ended",
        function(){

            status.textContent =
                "✓ Audio selesai.";

            setProgress(
                100
            );

        }
    );


    /* =========================================
       ERROR
    ========================================= */

    audio.addEventListener(
        "error",
        function(){

            console.error(
                "AUDIO ERROR:",
                audio.error
            );


            /*
               Coba URL Google Drive kedua.
            */

            if(
                !triedSecondUrl &&
                getGoogleDriveId(
                    originalUrl
                )
            ){

                triedSecondUrl =
                    true;


                status.textContent =
                    "⏳ Mencoba koneksi audio alternatif...";


                source.src =
                    audioUrl2;


                audio.load();

                return;

            }


            /*
               Kalau tetap gagal.
            */

            playerArea.innerHTML = `

                <div class="player-error">

                    <div class="player-error-icon">

                        ⚠️

                    </div>


                    <div class="player-error-title">

                        Audio tidak dapat diputar

                    </div>


                    <div class="player-error-text">

                        Google Drive mungkin belum
                        mengizinkan file untuk diakses
                        secara publik atau file tidak
                        dapat diputar langsung oleh browser.

                        <br><br>

                        Pastikan pengaturan file Google Drive:

                        <br>

                        <strong>
                        Siapa saja yang memiliki link
                        → Pelihat
                        </strong>

                    </div>


                    <a
                        href="${escapeAttribute(
                            getGoogleDriveOpenUrl(
                                originalUrl
                            )
                        )}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="external-button"
                    >

                        🔗 Buka Audio di Google Drive

                    </a>

                </div>

            `;

        }
    );


    /* =========================================
       PROGRESS AUDIO
    ========================================= */

    audio.addEventListener(
        "timeupdate",
        function(){

            if(
                audio.duration &&
                isFinite(
                    audio.duration
                )
            ){

                const percent =
                    (
                        audio.currentTime /
                        audio.duration
                    ) * 100;


                setProgress(
                    percent
                );

            }

        }
    );


    audio.load();

}


/* =====================================================
   VIDEO PROGRESS
===================================================== */

function setupVideoProgress(){

    const video =
        document.getElementById(
            "videoPlayer"
        );


    if(!video){

        return;

    }


    video.addEventListener(
        "timeupdate",
        function(){

            if(
                video.duration &&
                isFinite(
                    video.duration
                )
            ){

                const percent =
                    (
                        video.currentTime /
                        video.duration
                    ) * 100;


                setProgress(
                    percent
                );

            }

        }
    );


    video.addEventListener(
        "ended",
        function(){

            setProgress(
                100
            );

        }
    );

}


/* =====================================================
   PROGRESS STORAGE
===================================================== */

function getProgressKey(){

    if(
        !currentMaterial
    ){

        return null;

    }


    return (
        "ngajiplus_progress_" +
        String(
            currentMaterial.id
        )
    );

}


/* =====================================================
   LOAD PROGRESS
===================================================== */

function loadProgress(){

    const key =
        getProgressKey();


    if(!key){

        return;

    }


    const saved =
        localStorage.getItem(
            key
        );


    if(!saved){

        setProgress(
            0
        );

        return;

    }


    const percent =
        Number(
            saved
        );


    if(
        isNaN(percent)
    ){

        setProgress(
            0
        );

        return;

    }


    setProgress(
        percent
    );

}


/* =====================================================
   SET PROGRESS
===================================================== */

function setProgress(
    percent
){

    percent =
        Math.max(
            0,
            Math.min(
                100,
                Number(
                    percent
                ) || 0
            )
        );


    progressPercent =
        percent;


    const percentElement =
        document.getElementById(
            "progressPercent"
        );


    const fillElement =
        document.getElementById(
            "progressFill"
        );


    const infoElement =
        document.getElementById(
            "progressInfo"
        );


    if(percentElement){

        percentElement.textContent =
            Math.round(
                percent
            ) +
            "%";

    }


    if(fillElement){

        fillElement.style.width =
            percent +
            "%";

    }


    if(infoElement){

        if(percent >= 100){

            infoElement.textContent =
                "✓ Materi telah selesai dipelajari.";

        }

        else if(percent > 0){

            infoElement.textContent =
                "Sedang dipelajari... " +
                Math.round(
                    percent
                ) +
                "%";

        }

        else{

            infoElement.textContent =
                "Belum mulai belajar.";

        }

    }


    const key =
        getProgressKey();


    if(key){

        localStorage.setItem(
            key,
            String(
                Math.round(
                    percent
                )
            )
        );

    }

}
