<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="NgajiPlus Akademi - Pemutar materi pembelajaran"
  >

  <title>Materi - NgajiPlus Akademi</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f8f6;
      color: #1f2937;
      min-height: 100vh;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;

      height: 58px;

      background: rgba(255,255,255,.96);

      border-bottom:
        1px solid #e5e7eb;

      display: flex;

      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;

      align-items: center;

      gap: 8px;

      color: #087f5b;

      font-weight: 700;

      font-size: 14px;

      text-decoration: none;

      white-space: nowrap;
    }

    .brand-icon {
      width: 27px;
      height: 27px;

      border-radius: 7px;

      background: #087f5b;

      color: white;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 15px;
    }

    .header-right {
      display: flex;

      align-items: center;

      gap: 8px;
    }

    .back-btn {
      border: 0;

      background: #ecfdf5;

      color: #087f5b;

      padding: 8px 12px;

      border-radius: 8px;

      font-size: 12px;

      font-weight: 600;

      cursor: pointer;
    }

    .back-btn:hover {
      background: #d1fae5;
    }

    .account-btn {
      border: 0;

      background: transparent;

      display: flex;

      align-items: center;

      gap: 7px;

      cursor: pointer;

      font-size: 12px;

      color: #374151;
    }

    .account-avatar {
      width: 29px;
      height: 29px;

      border-radius: 50%;

      object-fit: cover;

      background: #d1fae5;

      border:
        1px solid #d1d5db;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: min(100%, 900px);

      margin: 20px auto 50px;

      padding: 0 20px;
    }

    /* =========================
       INFO
    ========================= */

    .material-info {
      background: white;

      border-radius: 14px;

      padding: 20px;

      box-shadow:
        0 4px 15px rgba(0,0,0,.05);

      margin-bottom: 14px;
    }

    .category {
      display: inline-block;

      background: #ecfdf5;

      color: #087f5b;

      padding: 5px 9px;

      border-radius: 999px;

      font-size: 10px;

      font-weight: 700;

      margin-bottom: 10px;
    }

    .material-info h1 {
      font-size: 25px;

      line-height: 1.25;

      color: #1f2937;

      margin-bottom: 8px;
    }

    .description {
      color: #6b7280;

      font-size: 13px;

      line-height: 1.6;
    }

    /* =========================
       PREMIUM
    ========================= */

    .premium-box {
      background: #fff7ed;

      border:
        1px solid #fed7aa;

      color: #9a3412;

      padding: 14px;

      border-radius: 12px;

      margin-bottom: 14px;

      font-size: 13px;

      line-height: 1.6;
    }

    .premium-box strong {
      display: block;

      margin-bottom: 4px;
    }

    /* =========================
       PLAYER
    ========================= */

    .player-box {
      background: #111827;

      border-radius: 14px;

      overflow: hidden;

      box-shadow:
        0 5px 20px rgba(0,0,0,.10);

      margin-bottom: 14px;

      min-height: 100px;
    }

    .youtube-wrapper {
      position: relative;

      width: 100%;

      aspect-ratio: 16 / 9;

      background: #000;
    }

    .youtube-wrapper iframe {
      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      border: 0;
    }

    /* =========================
       PLAYER LOADING
    ========================= */

    .player-loading {
      min-height: 180px;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      gap: 10px;

      color: white;

      font-size: 13px;

      background: #111827;
    }

    .loading-icon {
      font-size: 30px;
    }

    /* =========================
       AUDIO
    ========================= */

    .audio-player {
      min-height: 205px;

      padding: 30px 20px;

      background:
        linear-gradient(
          135deg,
          #087f5b,
          #059669
        );

      color: white;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;
    }

    .audio-icon {
      font-size: 48px;

      margin-bottom: 12px;
    }

    .audio-player h2 {
      font-size: 19px;

      margin-bottom: 4px;
    }

    .audio-player p {
      font-size: 12px;

      opacity: .9;

      margin-bottom: 18px;
    }

    .audio-player audio {
      width: min(100%, 520px);
    }

    /* =========================
       PDF
    ========================= */

    .pdf-wrapper {
      background: #111827;

      width: 100%;

      min-height: 600px;

      position: relative;
    }

    .pdf-wrapper iframe {
      width: 100%;

      height: 700px;

      border: 0;

      background: white;
    }

    .pdf-open {
      display: block;

      background: #087f5b;

      color: white;

      text-align: center;

      text-decoration: none;

      padding: 11px;

      font-size: 13px;

      font-weight: 600;
    }

    /* =========================
       ERROR
    ========================= */

    .error-box {
      background: #fff1f2;

      border:
        1px solid #fecdd3;

      color: #be123c;

      padding: 14px;

      border-radius: 10px;

      font-size: 13px;

      margin-bottom: 14px;

      line-height: 1.6;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       PROGRESS
    ========================= */

    .progress-card {
      background: white;

      border-radius: 14px;

      padding: 15px;

      box-shadow:
        0 4px 15px rgba(0,0,0,.05);

      margin-bottom: 12px;
    }

    .progress-top {
      display: flex;

      justify-content: space-between;

      align-items: center;

      font-size: 12px;

      margin-bottom: 8px;
    }

    .progress-percent {
      color: #087f5b;

      font-weight: 700;
    }

    .progress-track {
      height: 7px;

      background: #e5e7eb;

      border-radius: 999px;

      overflow: hidden;
    }

    .progress-fill {
      height: 100%;

      width: 0%;

      background: #087f5b;

      border-radius: 999px;

      transition: width .3s ease;
    }

    .progress-status {
      font-size: 11px;

      color: #6b7280;

      margin-top: 8px;
    }

    /* =========================
       ACTIONS
    ========================= */

    .actions {
      display: flex;

      gap: 8px;

      flex-wrap: wrap;

      margin-bottom: 30px;
    }

    .action-btn {
      border: 0;

      padding: 9px 13px;

      border-radius: 8px;

      font-size: 12px;

      font-weight: 600;

      cursor: pointer;

      text-decoration: none;
    }

    .btn-all {
      background: #ecfdf5;

      color: #087f5b;
    }

    .btn-complete {
      background: #087f5b;

      color: white;
    }

    .btn-complete:hover {
      background: #066b4d;
    }

    .btn-complete:disabled {
      opacity: .6;

      cursor: not-allowed;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;

      left: 50%;

      bottom: 30px;

      transform:
        translateX(-50%);

      background: #1f2937;

      color: white;

      padding: 12px 18px;

      border-radius: 9px;

      font-size: 12px;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity .25s ease,
        transform .25s ease;

      z-index: 9999;
    }

    .toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(-5px);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 0 20px;
      }

      .brand {
        font-size: 11px;
      }

      .brand-icon {
        width: 24px;
        height: 24px;

        font-size: 13px;
      }

      .back-btn {
        font-size: 10px;

        padding: 7px 9px;
      }

      .account-btn {
        font-size: 10px;
      }

      .account-avatar {
        width: 27px;
        height: 27px;
      }

      main {
        padding: 0 20px;

        margin-top: 20px;
      }

      .material-info {
        padding: 17px;
      }

      .material-info h1 {
        font-size: 23px;
      }

      .description {
        font-size: 12px;
      }

      .pdf-wrapper iframe {
        height: 650px;
      }

    }

    @media (max-width: 420px) {

      .account-btn span {
        max-width: 115px;

        overflow: hidden;

        white-space: nowrap;

        text-overflow: ellipsis;
      }

      .material-info h1 {
        font-size: 22px;
      }

    }

  </style>

</head>

  <script>


    /* =========================================================
       SUPABASE
    ========================================================= */

    const SUPABASE_URL =
      "https://ksgywgdrfskqsufchbcm.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_HmFKwHMCISfN_YOoiLx3-A_MWnG9yG7";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================================
       GLOBAL
    ========================================================= */

    let currentUser = null;

    let currentProfile = null;

    let currentMaterial = null;

    let youtubePlayer = null;

    let progressInterval = null;

    let lastSavedProgress = -1;

    let savedProgress = 0;


    const params =
      new URLSearchParams(
        window.location.search
      );


    const materialId =
      Number(
        params.get("id")
      );


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const titleEl =
      document.getElementById(
        "title"
      );


    const descriptionEl =
      document.getElementById(
        "description"
      );


    const categoryEl =
      document.getElementById(
        "category"
      );


    const playerBox =
      document.getElementById(
        "playerBox"
      );


    const errorBox =
      document.getElementById(
        "errorBox"
      );


    const premiumBox =
      document.getElementById(
        "premiumBox"
      );


    const progressFill =
      document.getElementById(
        "progressFill"
      );


    const progressPercent =
      document.getElementById(
        "progressPercent"
      );


    const progressStatus =
      document.getElementById(
        "progressStatus"
      );


    const completeBtn =
      document.getElementById(
        "completeBtn"
      );


    const accountName =
      document.getElementById(
        "accountName"
      );


    const accountAvatar =
      document.getElementById(
        "accountAvatar"
      );


    /* =========================================================
       START
    ========================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      init
    );


    async function init() {

      if (
        !materialId ||
        Number.isNaN(materialId)
      ) {

        showError(
          "ID materi tidak valid."
        );

        return;

      }


      try {

        await checkUser();

        if (!currentUser) {
          return;
        }


        await loadMaterial();

        await loadProgress();

      } catch (error) {

        console.error(
          error
        );


        showError(
          "Terjadi kesalahan saat memuat materi."
        );

      }

    }


    /* =========================================================
       CHECK USER
    ========================================================= */

    async function checkUser() {

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .getUser();


      if (error) {
        throw error;
      }


      if (!data.user) {

        window.location.href =
          "login.html";

        return;

      }


      currentUser =
        data.user;


      /* =========================
         PROFILE
      ========================= */

      const {
        data: profile,
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .select(`
            id,
            nama,
            status,
            paket,
            berlaku_sampai,
            avatar_url,
            no_hp,
            alamat,
            bio
          `)
          .eq(
            "id",
            currentUser.id
          )
          .maybeSingle();


      if (
        profileError &&
        profileError.code !== "PGRST116"
      ) {

        console.warn(
          "Profile error:",
          profileError
        );

      }


      currentProfile =
        profile || null;


      const nama =
        currentProfile?.nama ||
        currentUser.email ||
        "Pengguna";


      accountName.textContent =
        nama;


      if (
        currentProfile?.avatar_url
      ) {

        accountAvatar.src =
          currentProfile.avatar_url;

      } else {

        accountAvatar.src =
          createAvatar(
            nama
          );

      }

    }


    /* =========================================================
       LOAD MATERIAL
    ========================================================= */

    async function loadMaterial() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("materials")
          .select(`
            id,
            judul,
            deskripsi,
            kategori,
            tipe,
            type,
            url,
            thumbnail,
            premium,
            created_at
          `)
          .eq(
            "id",
            materialId
          )
          .maybeSingle();


      if (error) {

        console.error(
          "Material error:",
          error
        );

        throw error;

      }


      if (!data) {

        showError(
          "Materi tidak ditemukan."
        );

        return;

      }


      currentMaterial =
        data;


      /* =========================
         INFO
      ========================= */

      titleEl.textContent =
        data.judul ||
        "Tanpa Judul";


      descriptionEl.textContent =
        data.deskripsi ||
        "Materi pembelajaran NgajiPlus Akademi.";


      categoryEl.textContent =
        data.kategori ||
        "Materi";


      /* =========================
         PREMIUM
      ========================= */

      const isPremium =
        data.premium === true ||
        data.premium === "true" ||
        data.premium === 1;


      if (isPremium) {

        const active =
          isMembershipActive();


        if (!active) {

          premiumBox.classList.remove(
            "hidden"
          );


          playerBox.innerHTML = "";


          showError(
            "Materi ini membutuhkan membership aktif."
          );


          return;

        }

      }


      createPlayer(
        data
      );

    }


    /* =========================================================
       MEMBERSHIP
    ========================================================= */

    function isMembershipActive() {

      if (!currentProfile) {
        return false;
      }


      const status =
        String(
          currentProfile.status || ""
        )
        .toLowerCase()
        .trim();


      if (status !== "aktif") {
        return false;
      }


      if (
        !currentProfile.berlaku_sampai
      ) {
        return true;
      }


      const expiry =
        new Date(
          currentProfile.berlaku_sampai
        );


      return expiry >= new Date();

    }


    /* =========================================================
       DETECT MATERIAL TYPE
    ========================================================= */

    function detectMaterialType(
      material
    ) {

      const tipe =
        String(
          material.tipe || ""
        )
        .toLowerCase()
        .trim();


      const type =
        String(
          material.type || ""
        )
        .toLowerCase()
        .trim();


      /* tipe menjadi prioritas */

      if (
        tipe === "audio" ||
        tipe === "mp3" ||
        tipe === "murottal"
      ) {

        return "audio";

      }


      if (
        tipe === "video" ||
        tipe === "youtube"
      ) {

        return "video";

      }


      if (
        tipe === "pdf" ||
        tipe === "ebook" ||
        tipe === "dokumen"
      ) {

        return "pdf";

      }


      /* fallback type */

      if (
        type === "audio" ||
        type === "mp3"
      ) {

        return "audio";

      }


      if (
        type === "video" ||
        type === "youtube"
      ) {

        return "video";

      }


      if (
        type === "pdf" ||
        type === "ebook" ||
        type === "dokumen"
      ) {

        return "pdf";

      }


      /* fallback URL */

      const url =
        String(
          material.url || ""
        )
        .toLowerCase();


      if (
        url.includes(
          "youtube.com"
        ) ||
        url.includes(
          "youtu.be"
        )
      ) {

        return "video";

      }


      if (
        url.includes(".mp3") ||
        url.includes(".wav") ||
        url.includes(".m4a") ||
        url.includes("/audio/")
      ) {

        return "audio";

      }


      if (
        url.includes(".pdf") ||
        url.includes(
          "drive.google.com"
        )
      ) {

        return "pdf";

      }


      return "unknown";

    }


    /* =========================================================
       CREATE PLAYER
    ========================================================= */

    function createPlayer(
      material
    ) {

      playerBox.innerHTML = "";


      const type =
        detectMaterialType(
          material
        );


      console.log(
        "Material:",
        material.judul
      );


      console.log(
        "tipe:",
        material.tipe
      );


      console.log(
        "type:",
        material.type
      );


      console.log(
        "Detected:",
        type
      );


      if (type === "audio") {

        createAudioPlayer(
          material
        );

        return;

      }


      if (type === "video") {

        createVideoPlayer(
          material
        );

        return;

      }


      if (type === "pdf") {

        createPdfPlayer(
          material
        );

        return;

      }


      showError(
        "Jenis materi tidak dikenali."
      );

    }


    /* =========================================================
       AUDIO PLAYER
    ========================================================= */

    function createAudioPlayer(
      material
    ) {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "audio-player";


      wrapper.innerHTML = `

        <div class="audio-icon">
          🎧
        </div>

        <h2>
          ${escapeHtml(
            material.judul
          )}
        </h2>

        <p>
          Murottal / Audio Pembelajaran
        </p>

        <audio
          id="audioElement"
          controls
          preload="metadata"
        >

          <source
            src="${escapeAttribute(
              material.url
            )}"
          >

          Browser Anda tidak mendukung
          pemutar audio.

        </audio>

      `;


      playerBox.appendChild(
        wrapper
      );


      const audio =
        document.getElementById(
          "audioElement"
        );


      audio.addEventListener(
        "timeupdate",
        () => {

          if (
            !audio.duration ||
            !isFinite(audio.duration)
          ) {

            return;

          }


          const percent =
            Math.round(
              (
                audio.currentTime /
                audio.duration
              ) * 100
            );


          updateProgress(
            percent
          );


          if (
            percent > 0 &&
            percent < 100
          ) {

            saveProgress(
              percent,
              false
            );

          }

        }
      );


      audio.addEventListener(
        "ended",
        async () => {

          await saveProgress(
            100,
            true
          );

        }
      );


      audio.addEventListener(
        "error",
        () => {

          showError(
            "Audio tidak dapat diputar. Pastikan file audio di Supabase Storage dapat diakses."
          );

        }
      );

    }


    /* =========================================================
       YOUTUBE PLAYER
    ========================================================= */

    function createVideoPlayer(
      material
    ) {

      const videoId =
        extractYouTubeId(
          material.url
        );


      if (!videoId) {

        showError(
          "Link YouTube tidak valid."
        );

        return;

      }


      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "youtube-wrapper";


      const iframe =
        document.createElement(
          "iframe"
        );


      iframe.id =
        "youtubePlayer";


      /*
       * Tetap menggunakan iframe.
       *
       * Jadi video berada
       * di dalam website.
       */

      iframe.src =
        "https://www.youtube-nocookie.com/embed/" +
        videoId +
        "?enablejsapi=1" +
        "&rel=0" +
        "&modestbranding=1";


      iframe.title =
        material.judul ||
        "Video Pembelajaran";


      iframe.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";


      iframe.allowFullscreen =
        true;


      wrapper.appendChild(
        iframe
      );


      playerBox.appendChild(
        wrapper
      );


      /*
       * Aktifkan YouTube IFrame API.
       */

      loadYouTubeAPI();

    }


    /* =========================================================
       LOAD YOUTUBE API
    ========================================================= */

    function loadYouTubeAPI() {

      if (
        window.YT &&
        window.YT.Player
      ) {

        initializeYouTubePlayer();

        return;

      }


      if (
        document.getElementById(
          "youtube-api"
        )
      ) {

        return;

      }


      window.onYouTubeIframeAPIReady =
        initializeYouTubePlayer;


      const script =
        document.createElement(
          "script"
        );


      script.id =
        "youtube-api";


      script.src =
        "https://www.youtube.com/iframe_api";


      document.head.appendChild(
        script
      );

    }


    /* =========================================================
       INITIALIZE YOUTUBE
    ========================================================= */

    function initializeYouTubePlayer() {

      const iframe =
        document.getElementById(
          "youtubePlayer"
        );


      if (!iframe) {
        return;
      }


      if (
        youtubePlayer &&
        typeof youtubePlayer.destroy ===
          "function"
      ) {

        try {
          youtubePlayer.destroy();
        } catch (e) {}

      }


      youtubePlayer =
        new YT.Player(
          "youtubePlayer",
          {

            events: {

              onReady:
                onYouTubeReady,

              onStateChange:
                onYouTubeStateChange,

              onError:
                onYouTubeError

            }

          }
        );

    }


    /* =========================================================
       YOUTUBE READY
    ========================================================= */

    function onYouTubeReady() {

      /*
       * Jika progress sebelumnya ada,
       * kita coba lompat ke posisi
       * sebelumnya.
       */

      if (
        savedProgress > 0 &&
        savedProgress < 100
      ) {

        setTimeout(
          () => {

            if (
              youtubePlayer &&
              youtubePlayer.getDuration
            ) {

              const duration =
                youtubePlayer.getDuration();


              if (
                duration &&
                duration > 0
              ) {

                const seconds =
                  (
                    savedProgress /
                    100
                  ) * duration;


                youtubePlayer.seekTo(
                  seconds,
                  true
                );

              }

            }

          },
          1200
        );

      }

    }


    /* =========================================================
       YOUTUBE STATE
    ========================================================= */

    function onYouTubeStateChange(
      event
    ) {

      /*
       * PLAYING
       */

      if (
        event.data ===
        YT.PlayerState.PLAYING
      ) {

        startVideoProgress();

        return;

      }


      /*
       * PAUSED
       */

      if (
        event.data ===
        YT.PlayerState.PAUSED
      ) {

        stopVideoProgress();

        saveCurrentYouTubeProgress();

        return;

      }


      /*
       * ENDED
       */

      if (
        event.data ===
        YT.PlayerState.ENDED
      ) {

        stopVideoProgress();

        saveProgress(
          100,
          true
        );

        return;

      }

    }


    /* =========================================================
       START VIDEO PROGRESS
    ========================================================= */

    function startVideoProgress() {

      stopVideoProgress();


      progressInterval =
        setInterval(
          () => {

            saveCurrentYouTubeProgress();

          },
          5000
        );


      saveCurrentYouTubeProgress();

    }


    /* =========================================================
       STOP VIDEO PROGRESS
    ========================================================= */

    function stopVideoProgress() {

      if (
        progressInterval
      ) {

        clearInterval(
          progressInterval
        );

        progressInterval =
          null;

      }

    }


    /* =========================================================
       GET CURRENT YOUTUBE PROGRESS
    ========================================================= */

    function saveCurrentYouTubeProgress() {

      if (
        !youtubePlayer ||
        typeof youtubePlayer.getCurrentTime !==
          "function"
      ) {

        return;

      }


      const duration =
        youtubePlayer.getDuration();


      const current =
        youtubePlayer.getCurrentTime();


      if (
        !duration ||
        !isFinite(duration) ||
        !isFinite(current)
      ) {

        return;

      }


      const percent =
        Math.round(
          (
            current /
            duration
          ) * 100
        );


      updateProgress(
        percent
      );


      /*
       * Simpan ke Supabase.
       */

      if (
        percent > 0 &&
        percent < 100
      ) {

        saveProgress(
          percent,
          false
        );

      }

    }


    /* =========================================================
       YOUTUBE ERROR
    ========================================================= */

    function onYouTubeError(
      event
    ) {

      console.error(
        "YouTube error:",
        event.data
      );


      let message =
        "Video YouTube tidak dapat diputar.";


      if (
        event.data === 101 ||
        event.data === 150
      ) {

        message =
          "Video ini tidak mengizinkan pemutaran di website. Silakan pilih video YouTube lain yang mengizinkan embedding.";

      }


      if (
        event.data === 100
      ) {

        message =
          "Video YouTube tidak ditemukan atau sudah dihapus.";

      }


      showError(
        message
      );

    }


    /* =========================================================
       PDF PLAYER
    ========================================================= */

    function createPdfPlayer(
      material
    ) {

      let pdfUrl =
        material.url;


      const driveId =
        extractGoogleDriveId(
          pdfUrl
        );


      if (driveId) {

        pdfUrl =
          "https://drive.google.com/file/d/" +
          driveId +
          "/preview";

      }


      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "pdf-wrapper";


      const iframe =
        document.createElement(
          "iframe"
        );


      iframe.src =
        pdfUrl;


      iframe.title =
        material.judul ||
        "Dokumen PDF";


      wrapper.appendChild(
        iframe
      );


      const openLink =
        document.createElement(
          "a"
        );


      openLink.href =
        material.url;


      openLink.target =
        "_blank";


      openLink.rel =
        "noopener noreferrer";


      openLink.className =
        "pdf-open";


      openLink.textContent =
        "↗ Buka PDF di tab baru";


      wrapper.appendChild(
        openLink
      );


      playerBox.appendChild(
        wrapper
      );

    }


    /* =========================================================
       EXTRACT YOUTUBE ID
    ========================================================= */

    function extractYouTubeId(
      url
    ) {

      if (!url) {
        return null;
      }


      const text =
        String(url).trim();


      let match =
        text.match(
          /youtu\.be\/([a-zA-Z0-9_-]{11})/
        );


      if (
        match &&
        match[1]
      ) {

        return match[1];

      }


      match =
        text.match(
          /youtube\.com\/watch\?[^#]*v=([a-zA-Z0-9_-]{11})/
        );


      if (
        match &&
        match[1]
      ) {

        return match[1];

      }


      match =
        text.match(
          /youtube(?:-nocookie)?\.com\/embed\/([a-zA-Z0-9_-]{11})/
        );


      if (
        match &&
        match[1]
      ) {

        return match[1];

      }


      match =
        text.match(
          /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
        );


      if (
        match &&
        match[1]
      ) {

        return match[1];

      }


      return null;

    }


    /* =========================================================
       GOOGLE DRIVE ID
    ========================================================= */

    function extractGoogleDriveId(
      url
    ) {

      if (!url) {
        return null;
      }


      const text =
        String(url);


      let match =
        text.match(
          /\/file\/d\/([a-zA-Z0-9_-]+)/
        );


      if (
        match &&
        match[1]
      ) {

        return match[1];

      }


      match =
        text.match(
          /[?&]id=([a-zA-Z0-9_-]+)/
        );


      if (
        match &&
        match[1]
      ) {

        return match[1];

      }


      return null;

    }


    /* =========================================================
       LOAD PROGRESS
    ========================================================= */

    async function loadProgress() {

      if (!currentUser) {
        return;
      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from("learning_progress")
          .select(`
            id,
            user_id,
            material_id,
            status,
            progress,
            last_watched_at,
            completed_at
          `)
          .eq(
            "user_id",
            currentUser.id
          )
          .eq(
            "material_id",
            String(materialId)
          )
          .maybeSingle();


      if (error) {

        console.error(
          "Progress error:",
          error
        );

        return;

      }


      if (!data) {

        savedProgress = 0;

        updateProgress(
          0
        );

        return;

      }


      savedProgress =
        Number(
          data.progress || 0
        );


      updateProgress(
        savedProgress
      );


      if (
        savedProgress >= 100 ||
        data.status === "completed"
      ) {

        setCompletedUI();

      }

    }


    /* =========================================================
       UPDATE PROGRESS UI
    ========================================================= */

    function updateProgress(
      percent
    ) {

      percent =
        Math.max(
          0,
          Math.min(
            100,
            Math.round(
              Number(percent) || 0
            )
          )
        );


      progressFill.style.width =
        percent + "%";


      progressPercent.textContent =
        percent + "%";


      if (percent >= 100) {

        progressStatus.textContent =
          "✓ Materi selesai";


        completeBtn.textContent =
          "✓ Sudah Selesai";

      } else if (percent > 0) {

        progressStatus.textContent =
          "Sedang dipelajari";


        completeBtn.textContent =
          "✓ Tandai Selesai";

      } else {

        progressStatus.textContent =
          "Belum dimulai";


        completeBtn.textContent =
          "✓ Tandai Selesai";

      }

    }


    /* =========================================================
       SAVE PROGRESS
    ========================================================= */

    async function saveProgress(
      percent,
      completed = false
    ) {

      if (!currentUser) {
        return;
      }


      percent =
        Math.max(
          0,
          Math.min(
            100,
            Math.round(
              Number(percent) || 0
            )
          )
        );


      /*
       * Hindari penyimpanan
       * angka yang sama berulang.
       */

      if (
        !completed &&
        percent === lastSavedProgress
      ) {

        return;

      }


      lastSavedProgress =
        percent;


      const isCompleted =
        completed ||
        percent >= 100;


      const payload = {

        user_id:
          currentUser.id,

        material_id:
          String(materialId),

        status:
          isCompleted
            ? "completed"
            : "started",

        progress:
          percent,

        last_watched_at:
          new Date().toISOString(),

        completed_at:
          isCompleted
            ? new Date().toISOString()
            : null

      };


      const {
        error
      } =
        await supabaseClient
          .from("learning_progress")
          .upsert(
            payload,
            {
              onConflict:
                "user_id,material_id"
            }
          );


      if (error) {

        console.error(
          "Gagal menyimpan progress:",
          error
        );

        return;

      }


      savedProgress =
        percent;


      updateProgress(
        percent
      );


      if (isCompleted) {

        setCompletedUI();

        showToast(
          "Materi selesai 🎉"
        );

      }

    }


    /* =========================================================
       TANDAI SELESAI
    ========================================================= */

    completeBtn.addEventListener(
      "click",
      async () => {

        completeBtn.disabled =
          true;


        await saveProgress(
          100,
          true
        );


        completeBtn.disabled =
          false;

      }
    );


    /* =========================================================
       COMPLETED UI
    ========================================================= */

    function setCompletedUI() {

      updateProgress(
        100
      );


      completeBtn.textContent =
        "✓ Sudah Selesai";

    }


    /* =========================================================
       ERROR
    ========================================================= */

    function showError(
      message
    ) {

      errorBox.textContent =
        "⚠️ " + message;


      errorBox.classList.remove(
        "hidden"
      );

    }


    /* =========================================================
       TOAST
    ========================================================= */

    function showToast(
      message
    ) {

      const toast =
        document.getElementById(
          "toast"
        );


      toast.textContent =
        message;


      toast.classList.add(
        "show"
      );


      setTimeout(
        () => {

          toast.classList.remove(
            "show"
          );

        },
        2200
      );

    }


    /* =========================================================
       BACK
    ========================================================= */

    function goBack() {

      if (
        document.referrer &&
        document.referrer.includes(
          window.location.hostname
        )
      ) {

        history.back();

      } else {

        window.location.href =
          "index.html";

      }

    }


    /* =========================================================
       AVATAR
    ========================================================= */

    function createAvatar(
      name
    ) {

      const initial =
        String(name || "U")
          .trim()
          .charAt(0)
          .toUpperCase();


      return (
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="80"
            height="80"
            viewBox="0 0 80 80"
          >

            <rect
              width="80"
              height="80"
              rx="40"
              fill="#d1fae5"
            />

            <text
              x="40"
              y="48"
              text-anchor="middle"
              font-family="Arial"
              font-size="32"
              font-weight="700"
              fill="#087f5b"
            >
              ${initial}
            </text>

          </svg>

        `)
      );

    }


    /* =========================================================
       ESCAPE HTML
    ========================================================= */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

    }


    function escapeAttribute(
      value
    ) {

      return escapeHtml(
        value
      );

    }


    /* =========================================================
       CLEANUP
    ========================================================= */

    window.addEventListener(
      "beforeunload",
      () => {

        stopVideoProgress();

        if (
          youtubePlayer &&
          typeof youtubePlayer.getPlayerState ===
            "function"
        ) {

          try {

            saveCurrentYouTubeProgress();

          } catch (e) {}

        }

      }
    );

  </script>
