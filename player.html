<script>
/* =========================================================
   KONFIGURASI SUPABASE
   Tidak membutuhkan supabase-config.js
========================================================= */

const SUPABASE_URL =
 "https://ksgywgdrfskqsufchbcm.supabase.co";

const SUPABASE_KEY =
 "sb_publishable_HmFKwHMCISfN_YOoiLx3-A_MWnG9yG7";

const sb =
 window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
 );

const content = document.getElementById("content");
const themeBtn = document.getElementById("themeBtn");

let user = null;
let material = null;
let access = {
 loggedIn:false,
 premium:false,
 admin:false,
 profile:null
};

let ytPlayer = null;
let audioPlayer = null;
let timer = null;


/* =========================================================
   THEME
========================================================= */

function applyTheme(theme){
 if(theme !== "dark") theme = "light";

 document.documentElement.setAttribute(
  "data-theme",
  theme
 );

 localStorage.setItem(
  "ngajiplus-theme",
  theme
 );

 themeBtn.textContent =
  theme === "dark" ? "☀️" : "🌙";
}

function toggleTheme(){
 const current =
  document.documentElement.getAttribute("data-theme")
  || "light";

 applyTheme(
  current === "dark"
   ? "light"
   : "dark"
 );
}

(function(){
 const saved =
  localStorage.getItem("ngajiplus-theme");

 if(saved === "dark" || saved === "light"){
  applyTheme(saved);
 }else{
  applyTheme("light");
 }
})();


/* =========================================================
   HELPERS
========================================================= */

function esc(value){
 return String(value ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function attr(value){
 return esc(value);
}

function typeOf(item){
 return String(
  item.tipe ||
  item.type ||
  ""
 ).toLowerCase().trim();
}

function premiumOf(item){
 return (
  item.premium === true ||
  item.premium === "true" ||
  item.premium === 1 ||
  item.premium === "1"
 );
}

function materialId(){
 const q = new URLSearchParams(
  location.search
 );

 return (
  q.get("id") ||
  q.get("material_id") ||
  q.get("materi_id")
 );
}

function stopTimer(){
 if(timer){
  clearInterval(timer);
  timer = null;
 }
}

function ytId(url){
 if(!url) return null;

 const s = String(url).trim();

 if(/^[A-Za-z0-9_-]{11}$/.test(s)){
  return s;
 }

 try{
  const u = new URL(s);
  const host = u.hostname.toLowerCase();

  if(host === "youtu.be"){
   return u.pathname
    .replace("/","")
    .split("?")[0];
  }

  if(host.includes("youtube.com")){
   const v = u.searchParams.get("v");
   if(v) return v;

   const m = u.pathname.match(
    /\/(embed|shorts|live)\/([^/?]+)/
   );

   if(m) return m[2];
  }
 }catch(e){
  console.log(e);
 }

 return null;
}

function pdfUrl(url){
 if(!url) return "";

 const s = String(url).trim();

 if(s.includes("drive.google.com")){
  const file =
   s.match(/\/file\/d\/([^/]+)/);

  if(file){
   return `https://drive.google.com/file/d/${file[1]}/preview`;
  }

  const q =
   s.match(/[?&]id=([^&]+)/);

  if(q){
   return `https://drive.google.com/file/d/${q[1]}/preview`;
  }
 }

 return s;
}


/* =========================================================
   CEK LOGIN + PROFILE + ADMIN + MEMBERSHIP
========================================================= */

async function checkAccess(){

 access = {
  loggedIn:false,
  premium:false,
  admin:false,
  profile:null
 };

 try{

  const auth =
   await sb.auth.getUser();

  user = auth.data?.user || null;

  if(!user){
   return access;
  }

  access.loggedIn = true;

  const profileResult =
   await sb
    .from("profiles")
    .select(
     "id,nama,status,paket,berlaku_sampai,is_admin"
    )
    .eq("id",user.id)
    .maybeSingle();

  if(profileResult.error){
   console.error(
    "PROFILE ERROR:",
    profileResult.error
   );
  }

  const profile =
   profileResult.data || null;

  access.profile = profile;

  /* Admin melalui profiles */
  if(profile){

   access.admin =
    profile.is_admin === true ||
    profile.is_admin === "true" ||
    profile.is_admin === 1 ||
    profile.is_admin === "1";

  }

  /* Admin melalui admin_users */
  if(!access.admin){

   const adminResult =
    await sb
     .from("admin_users")
     .select("user_id")
     .eq("user_id",user.id)
     .maybeSingle();

   if(
    !adminResult.error &&
    adminResult.data
   ){
    access.admin = true;
   }
  }

  /* Admin selalu boleh membuka Premium */
  if(access.admin){
   access.premium = true;
   return access;
  }

  /* Membership aktif */
  if(profile){

   const status =
    String(
     profile.status || ""
    ).toLowerCase().trim();

   const paket =
    String(
     profile.paket || ""
    ).toLowerCase().trim();

   /*
      LIFETIME:
      status aktif + paket Lifetime =
      Premium selamanya.
      berlaku_sampai memang NULL.
   */
   const lifetime =
    status === "aktif" &&
    paket === "lifetime";

   /*
      PAKET BIASA:
      status aktif + tanggal belum lewat.
   */
   let aktifTanggal = false;

   if(
    status === "aktif" &&
    profile.berlaku_sampai
   ){

    const expiry =
     new Date(
      profile.berlaku_sampai
     );

    aktifTanggal =
     !isNaN(expiry.getTime()) &&
     expiry.getTime() >= Date.now();
   }

   access.premium =
    lifetime || aktifTanggal;
  }

 }catch(error){

  console.error(
   "CHECK ACCESS ERROR:",
   error
  );
 }

 return access;
}


/* =========================================================
   AMBIL MATERIAL
========================================================= */

async function loadMaterial(){

 stopTimer();

 const id = materialId();

 if(!id){
  content.innerHTML = `
   <div class="box">
    <div class="error">
     ❌ ID materi tidak ditemukan.
     <br><br>
     Contoh:
     <strong>player.html?id=15</strong>
     <br>
     <a class="backacademy" href="akademi.html">
      ← Kembali ke Akademi
     </a>
    </div>
   </div>
  `;
  return;
 }

 content.innerHTML =
  `<div class="loading">⏳ Memuat materi...</div>`;

 /*
   PENTING:
   Ambil material dulu.
   Karena RLS sekarang public SELECT,
   Premium juga boleh terlihat.
 */
 const result =
  await sb
   .from("materials")
   .select(`
    id,
    judul,
    deskripsi,
    kategori,
    tipe,
    type,
    url,
    thumbnail,
    premium
   `)
   .eq("id",id)
   .maybeSingle();

 if(result.error){

  console.error(
   "MATERIAL ERROR:",
   result.error
  );

  content.innerHTML = `
   <div class="box">
    <div class="error">
     ❌ Gagal memuat materi.
     <br><br>
     ${esc(result.error.message)}
     <br>
     <a class="backacademy" href="akademi.html">
      ← Kembali ke Akademi
     </a>
    </div>
   </div>
  `;

  return;
 }

 if(!result.data){

  content.innerHTML = `
   <div class="box">
    <div class="error">
     ❌ Materi tidak ditemukan.
     <br><br>
     ID: ${esc(id)}
     <br>
     <a class="backacademy" href="akademi.html">
      ← Kembali ke Akademi
     </a>
    </div>
   </div>
  `;

  return;
 }

 material = result.data;

 /*
   SECURITY GATE
   Jangan panggil renderPlayer sebelum
   Premium lolos.
 */
 await checkAccess();

 if(
  premiumOf(material) &&
  !access.premium
 ){
  renderLocked();
  return;
 }

 renderPage();

}


/* =========================================================
   LOCK PREMIUM
========================================================= */

function renderLocked(){

 const title =
  esc(material.judul || "Materi Premium");

 const category =
  esc(material.kategori || "Materi");

 let text = "";

 if(!access.loggedIn){

  text =
   "Silakan login terlebih dahulu. " +
   "Setelah login, aktifkan membership Premium " +
   "untuk membuka materi ini.";

 }else{

  text =
   "Membership Premium Anda belum aktif " +
   "atau masa aktifnya sudah berakhir. " +
   "Silakan aktifkan atau perpanjang membership.";

 }

 content.innerHTML = `
  <div class="box">

   <span class="category">
    📚 ${category}
   </span>

   <h1>${title}</h1>

   <p class="desc">
    Materi Premium NgajiPlus Akademi.
   </p>

   <div class="badges">
    <span class="badge premium">
     🔐 Premium
    </span>
   </div>

   <div class="lock">

    <div class="lockicon">🔐</div>

    <div class="locktitle">
     Materi Premium Terkunci
    </div>

    <div class="locktext">
     ${esc(text)}
     <br><br>
     <strong>
      Player tidak dimuat sebelum akses Premium aktif.
     </strong>
    </div>

    <div class="actions">

     ${
      access.loggedIn
       ? `
        <a
         class="action primary"
         href="membership.html"
        >
         💎 Membership
        </a>
       `
       : `
        <a
         class="action primary"
         href="login.html"
        >
         🔐 Login
        </a>
       `
     }

     <a
      class="action secondary"
      href="akademi.html"
     >
      ← Kembali
     </a>

    </div>

   </div>

  </div>
 `;

 document.title =
  `${material.judul || "Materi"} - Terkunci`;
}


/* =========================================================
   RENDER HALAMAN YANG SUDAH LOLOS
========================================================= */

async function renderPage(){

 const type = typeOf(material);
 const premium = premiumOf(material);

 let typeText = "📚 Materi";

 if(type === "video") typeText = "🎥 Video";
 if(type === "audio") typeText = "🎧 Audio";
 if(type === "pdf") typeText = "📄 PDF";

 content.innerHTML = `
  <div class="box">

   <span class="category">
    📚 ${esc(material.kategori || "Materi")}
   </span>

   <h1>
    ${esc(material.judul || "Tanpa Judul")}
   </h1>

   <p class="desc">
    ${esc(
     material.deskripsi ||
     "Materi pembelajaran NgajiPlus Akademi."
    )}
   </p>

   <div class="badges">

    <span class="badge">
     ${typeText}
    </span>

    ${
     premium
      ? `
       <span class="badge premium">
        🔐 Premium
       </span>
      `
      : `
       <span class="badge free">
        ✓ Gratis
       </span>
      `
    }

    ${
     access.admin
      ? `
       <span class="badge admin">
        👑 Admin
       </span>
      `
      : ""
    }

   </div>

   ${
    access.profile?.nama
     ? `
      <div class="account">
       👤 ${esc(access.profile.nama)}
      </div>
     `
     : ""
   }

   ${
    access.admin && premium
     ? `
      <div class="adminnote">
       👑 <strong>Akses Admin</strong> —
       Anda dapat membuka materi Premium.
      </div>
     `
     : ""
   }

   <div id="playerArea"></div>

   <div id="progressArea"></div>

   <a
    class="backacademy"
    href="akademi.html"
   >
    ← Kembali ke Akademi
   </a>

  </div>
 `;

 document.title =
  `${material.judul || "Materi"} - NgajiPlus Akademi`;

 /* Player BARU dibuat setelah gate lolos */
 renderPlayer();

 /* Progress hanya untuk user login */
 if(user){
  await loadProgress();
 }else{
  renderProgress(null);
 }

}


/* =========================================================
   PLAYER
========================================================= */

function renderPlayer(){

 const area =
  document.getElementById("playerArea");

 if(!area) return;

 const type = typeOf(material);

 if(!material.url){

  area.innerHTML = `
   <div class="playercard">
    <div class="error">
     ⚠️ URL materi belum tersedia.
    </div>
   </div>
  `;

  return;
 }

 /* VIDEO */
 if(type === "video"){

  const id = ytId(material.url);

  if(!id){

   area.innerHTML = `
    <div class="playercard">
     <div class="error">
      ❌ URL YouTube tidak valid.
     </div>
    </div>
   `;

   return;
  }

  area.innerHTML = `
   <div class="playercard">

    <div class="label">
     🎥 Video Pembelajaran
    </div>

    <div id="youtubeContainer">
     <iframe
      id="youtubeFrame"
      class="video"
      src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?enablejsapi=1&rel=0&playsinline=1"
      title="${esc(material.judul || "Video Pembelajaran")}"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
     </iframe>
    </div>

   </div>
  `;

  initYouTubeTracking(id);

  return;
 }

 /* AUDIO */
 if(type === "audio"){

  area.innerHTML = `
   <div class="playercard">

    <div class="label">
     🎧 Audio Pembelajaran
    </div>

    <div class="audio">
     <audio
      id="audioPlayer"
      controls
      preload="metadata"
     >
      <source
       src="${attr(material.url)}"
      >
      Browser Anda tidak mendukung audio.
     </audio>
    </div>

   </div>
  `;

  initAudio();

  return;
 }

 /* PDF */
 if(type === "pdf"){

  area.innerHTML = `
   <div class="playercard">

    <div class="label">
     📄 PDF Pembelajaran
    </div>

    <iframe
     class="pdf"
     src="${attr(pdfUrl(material.url))}"
     title="PDF Pembelajaran"
    ></iframe>

    <button
     class="complete"
     id="pdfComplete"
     onclick="completeMaterial()"
    >
     ✓ Tandai Selesai
    </button>

   </div>
  `;

  return;
 }

 area.innerHTML = `
  <div class="playercard">
   <div class="error">
    ⚠️ Tipe materi tidak dikenali:
    ${esc(type)}
   </div>
  </div>
 `;

}

/* =========================================================
   AUDIO
========================================================= */

function initAudio(){

 audioPlayer =
  document.getElementById("audioPlayer");

 if(!audioPlayer) return;

 audioPlayer.addEventListener(
  "loadedmetadata",
  async function(){

   const saved =
    await getProgress();

   if(
    saved &&
    Number(saved.progress) > 2 &&
    audioPlayer.duration
   ){

    audioPlayer.currentTime =
     audioPlayer.duration *
     Number(saved.progress) / 100;

    setProgress(
     Number(saved.progress)
    );
   }
  }
 );

 audioPlayer.addEventListener(
  "play",
  function(){

   stopTimer();

   timer =
    setInterval(
     saveAudioProgress,
     5000
    );
  }
 );

 audioPlayer.addEventListener(
  "pause",
  async function(){

   await saveAudioProgress();
   stopTimer();

  }
 );

 audioPlayer.addEventListener(
  "ended",
  async function(){

   stopTimer();

   setProgress(100);

   await saveProgress(
    100,
    true
   );
  }
 );

 audioPlayer.addEventListener(
  "timeupdate",
  function(){

   if(!audioPlayer.duration) return;

   const pct =
    Math.round(
     audioPlayer.currentTime /
     audioPlayer.duration * 100
    );

   setProgress(pct);
  }
 );

}

async function saveAudioProgress(){

 if(
  !user ||
  !audioPlayer ||
  !audioPlayer.duration
 ) return;

 const pct =
  Math.round(
   audioPlayer.currentTime /
   audioPlayer.duration * 100
  );

 await saveProgress(
  Math.min(99,pct),
  false
 );
}


/* =========================================================
   PROGRESS UI
========================================================= */

function renderProgress(data){

 const area =
  document.getElementById("progressArea");

 if(!area) return;

 const pct =
  Math.max(
   0,
   Math.min(
    100,
    Number(data?.progress || 0)
   )
  );

 const done =
  pct >= 100 ||
  data?.status === "completed";

 area.innerHTML = `
  <div class="progress">

   <div class="ptop">
    <span>📈 Progress Belajar</span>
    <span
     id="progressPercent"
     class="pct"
    >${pct}%</span>
   </div>

   <div class="track">
    <div
     id="progressBar"
     class="bar"
     style="width:${pct}%"
    ></div>
   </div>

   <div
    id="progressNote"
    class="note"
   >
    ${
     done
      ? "✓ Materi sudah selesai."
      : pct > 0
       ? "Progress terakhir tersimpan."
       : "Progress akan tersimpan otomatis."
    }
   </div>

   <button
    class="complete ${done ? "done" : ""}"
    id="completeBtn"
    onclick="completeMaterial()"
   >
    ${
     done
      ? "✓ Materi Sudah Selesai"
      : "✓ Tandai Selesai"
    }
   </button>

  </div>
 `;

}

function setProgress(pct){

 const p =
  Math.max(
   0,
   Math.min(
    100,
    Math.round(Number(pct) || 0)
   )
  );

 const bar =
  document.getElementById(
   "progressBar"
  );

 const text =
  document.getElementById(
   "progressPercent"
  );

 if(bar){
  bar.style.width = p + "%";
 }

 if(text){
  text.textContent = p + "%";
 }

}


/* =========================================================
   DATABASE PROGRESS
========================================================= */

async function getProgress(){

 if(!user || !material) return null;

 const result =
  await sb
   .from("learning_progress")
   .select(`
    id,
    status,
    progress,
    last_watched_at,
    completed_at,
    updated_at
   `)
   .eq("user_id",user.id)
   .eq(
    "material_id",
    String(material.id)
   )
   .maybeSingle();

 if(result.error){

  console.error(
   "GET PROGRESS ERROR:",
   result.error
  );

  return null;
 }

 return result.data || null;
}

async function loadProgress(){

 const data =
  await getProgress();

 renderProgress(data);

}

async function saveProgress(
 percent,
 completed
){

 if(!user || !material) return;

 const now =
  new Date().toISOString();

 const p =
  Math.max(
   0,
   Math.min(
    100,
    Math.round(Number(percent) || 0)
   )
  );

 const payload = {
  user_id:user.id,
  material_id:String(material.id),
  status:
   completed
    ? "completed"
    : "started",
  progress:p,
  last_watched_at:now,
  completed_at:
   completed
    ? now
    : null,
  updated_at:now
 };

 const result =
  await sb
   .from("learning_progress")
   .upsert(
    payload,
    {
     onConflict:
      "user_id,material_id"
    }
   );

 if(result.error){

  console.error(
   "SAVE PROGRESS ERROR:",
   result.error
  );

  return;
 }

 if(completed){
  setProgress(100);

  const note =
   document.getElementById(
    "progressNote"
   );

  if(note){
   note.textContent =
    "✓ MasyaAllah, materi sudah selesai.";
  }

  const btn =
   document.getElementById(
    "completeBtn"
   );

  if(btn){
   btn.textContent =
    "✓ Materi Sudah Selesai";
   btn.classList.add("done");
  }

  const pdfBtn =
   document.getElementById(
    "pdfComplete"
   );

  if(pdfBtn){
   pdfBtn.textContent =
    "✓ Materi Sudah Selesai";
   pdfBtn.classList.add("done");
  }
 }
}

async function completeMaterial(){

 if(!user){

  alert(
   "Silakan login terlebih dahulu " +
   "untuk menyimpan progress."
  );

  return;
 }

 await saveProgress(
  100,
  true
 );

 alert(
  "✅ Materi berhasil ditandai selesai."
 );
}
