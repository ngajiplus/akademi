<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://ksgywgdrfskqsufchbcm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_HmFKwHMCISfN_YOoiLx3-A_MWnG9yG7";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   GLOBAL
===================================================== */

let currentMaterial = null;

let currentUser = null;

let membershipActive = false;

let currentProgress = 0;

let audioElement = null;

let videoElement = null;


/* =====================================================
   GET MATERIAL ID
===================================================== */

function getMaterialId() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");

  if (!id) {
    return null;
  }

  const numericId =
    Number(id);

  if (
    !Number.isInteger(numericId) ||
    numericId <= 0
  ) {
    return null;
  }

  return numericId;
}


/* =====================================================
   YOUTUBE VIDEO ID
===================================================== */

function getYouTubeId(url) {

  if (!url) {
    return null;
  }

  try {

    const parsed =
      new URL(url);

    /* youtube.com/watch?v= */

    if (
      parsed.hostname.includes("youtube.com") &&
      parsed.searchParams.get("v")
    ) {

      return parsed.searchParams.get("v");

    }


    /* youtube.com/embed/ */

    if (
      parsed.hostname.includes("youtube.com") &&
      parsed.pathname.startsWith("/embed/")
    ) {

      return parsed.pathname
        .split("/embed/")[1]
        .split("/")[0];

    }


    /* youtube.com/shorts/ */

    if (
      parsed.hostname.includes("youtube.com") &&
      parsed.pathname.startsWith("/shorts/")
    ) {

      return parsed.pathname
        .split("/shorts/")[1]
        .split("/")[0];

    }


    /* youtu.be/ */

    if (
      parsed.hostname === "youtu.be"
    ) {

      return parsed.pathname
        .replace("/", "")
        .split("/")[0];

    }

  } catch (error) {

    console.warn(
      "URL YouTube tidak valid:",
      url
    );

  }

  return null;
}


/* =====================================================
   YOUTUBE THUMBNAIL
===================================================== */

function getYouTubeThumbnail(url) {

  const videoId =
    getYouTubeId(url);

  if (!videoId) {
    return null;
  }

  return `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
}


/* =====================================================
   CHECK URL AUDIO
===================================================== */

function isAudioUrl(url) {

  if (!url) {
    return false;
  }

  const cleanUrl =
    url.split("?")[0].toLowerCase();

  return (
    cleanUrl.endsWith(".mp3") ||
    cleanUrl.endsWith(".m4a") ||
    cleanUrl.endsWith(".wav") ||
    cleanUrl.endsWith(".ogg") ||
    cleanUrl.endsWith(".aac") ||
    cleanUrl.endsWith(".flac")
  );
}


/* =====================================================
   CHECK PDF
===================================================== */

function isPdfUrl(url) {

  if (!url) {
    return false;
  }

  const cleanUrl =
    url.split("?")[0].toLowerCase();

  return cleanUrl.endsWith(".pdf");

}


/* =====================================================
   CHECK TYPE
===================================================== */

function getMaterialType(material) {

  const tipe =
    String(
      material.tipe ||
      material.type ||
      ""
    )
    .toLowerCase()
    .trim();


  if (
    tipe === "video"
  ) {
    return "video";
  }


  if (
    tipe === "audio" ||
    tipe === "mp3" ||
    tipe === "murottal"
  ) {
    return "audio";
  }


  if (
    tipe === "pdf" ||
    tipe === "ebook" ||
    tipe === "dokumen"
  ) {
    return "pdf";
  }


  /* fallback berdasarkan URL */

  if (
    getYouTubeId(material.url)
  ) {
    return "video";
  }


  if (
    isAudioUrl(material.url)
  ) {
    return "audio";
  }


  if (
    isPdfUrl(material.url)
  ) {
    return "pdf";
  }


  return "unknown";
}


/* =====================================================
   CHECK MEMBERSHIP
===================================================== */

async function checkUser() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getUser();


  if (error) {

    console.error(error);

    return null;

  }


  const user =
    data?.user;


  if (!user) {

    return null;

  }


  currentUser =
    user;


  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select(`
        id,
        nama,
        status,
        paket,
        berlaku_sampai,
        avatar_url
      `)
      .eq("id", user.id)
      .maybeSingle();


  if (profileError) {

    console.warn(
      "Profile error:",
      profileError
    );

  }


  if (profile) {

    const nama =
      profile.nama ||
      user.email ||
      "User";


    document.getElementById(
      "profileName"
    ).textContent =
      nama;


    const avatar =
      document.getElementById(
        "avatar"
      );


    if (profile.avatar_url) {

      avatar.innerHTML =
        `<img
          src="${escapeHtml(profile.avatar_url)}"
          style="
            width:100%;
            height:100%;
            object-fit:cover;
            border-radius:50%;
          "
        >`;

    } else {

      avatar.textContent =
        nama
          .charAt(0)
          .toUpperCase();

    }


    const status =
      String(
        profile.status || ""
      )
      .toLowerCase()
      .trim();


    let activeDate =
      false;


    if (
      profile.berlaku_sampai
    ) {

      const expiry =
        new Date(
          profile.berlaku_sampai
        );

      activeDate =
        expiry >= new Date();

    }


    membershipActive =
      status === "aktif" &&
      activeDate;

  }


  return user;

}


/* =====================================================
   LOAD MATERIAL
===================================================== */

async function loadMaterial() {

  const materialId =
    getMaterialId();


  if (!materialId) {

    showError(
      "ID materi tidak valid."
    );

    return;

  }


  /*
    Kita ambil data berdasarkan ID.
  */

  const {
    data: material,
    error
  } =
    await supabaseClient
      .from("materials")
      .select(`
        id,
        judul,
        deskripsi,
        kategori,
        tipe,
        type,
        url,
        thumbnail,
        premium
      `)
      .eq("id", materialId)
      .maybeSingle();


  if (error) {

    console.error(error);

    showError(
      "Gagal mengambil data materi: " +
      error.message
    );

    return;

  }


  if (!material) {

    showError(
      "Materi tidak ditemukan."
    );

    return;

  }


  currentMaterial =
    material;


  renderMaterial();

}


/* =====================================================
   RENDER MATERIAL
===================================================== */

function renderMaterial() {

  const material =
    currentMaterial;


  document.title =
    `${material.judul || "Materi"} - NgajiPlus Akademi`;


  document.getElementById(
    "title"
  ).textContent =
    material.judul ||
    "Materi";


  document.getElementById(
    "description"
  ).textContent =
    material.deskripsi ||
    "Materi pembelajaran NgajiPlus Akademi.";


  document.getElementById(
    "category"
  ).textContent =
    material.kategori ||
    "Materi";


  const premium =
    material.premium === true ||
    material.premium === "true" ||
    material.premium === 1;


  if (premium) {

    document.getElementById(
      "premiumBadge"
    ).style.display =
      "inline-block";

  }


  /*
    PREMIUM LOCK
  */

  if (
    premium &&
    !membershipActive
  ) {

    document.getElementById(
      "premiumLock"
    ).style.display =
      "block";


    document.getElementById(
      "playerCard"
    ).innerHTML = `

      <div
        style="
          background:#111;
          color:#fff;
          padding:70px 20px;
          text-align:center;
        "
      >

        <div style="font-size:55px;">
          🔒
        </div>

        <h2 style="margin:15px 0;">
          Materi Premium
        </h2>

        <p style="color:#ccc;">
          Silakan aktifkan membership
          untuk membuka materi ini.
        </p>

      </div>

    `;


    document.getElementById(
      "completeBtn"
    ).style.display =
      "none";


    return;

  }


  renderPlayer();

}


/* =====================================================
   RENDER PLAYER
===================================================== */

function renderPlayer() {

  const material =
    currentMaterial;


  const type =
    getMaterialType(material);


  const container =
    document.getElementById(
      "playerContainer"
    );


  /*
    VIDEO YOUTUBE
  */

  if (
    type === "video"
  ) {

    const videoId =
      getYouTubeId(
        material.url
      );


    if (!videoId) {

      container.innerHTML = `

        <div class="unsupported">

          <div style="font-size:45px;">
            ⚠️
          </div>

          <h3>
            Link YouTube tidak valid
          </h3>

          <p style="margin-top:10px;">
            Periksa URL video di Supabase.
          </p>

        </div>

      `;

      return;

    }


    /*
      Privacy Enhanced Mode.
      Autoplay dimatikan supaya
      browser mobile tidak memblokir.
    */

    container.innerHTML = `

      <iframe
        id="youtubePlayer"
        src="https://www.youtube-nocookie.com/embed/${videoId}?rel=0&modestbranding=1"
        title="${escapeHtml(material.judul || "Video")}"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share
        "
        allowfullscreen
      ></iframe>

    `;


    container.className =
      "video-wrapper";


    return;

  }


  /*
    AUDIO
  */

  if (
    type === "audio"
  ) {

    container.className =
      "audio-player";


    container.innerHTML = `

      <div class="audio-icon">
        🎧
      </div>

      <h2 style="margin-bottom:8px;">
        ${escapeHtml(material.judul || "Audio")}
      </h2>

      <p style="
        margin-bottom:20px;
        opacity:.85;
      ">
        Murottal / Audio Pembelajaran
      </p>

      <audio
        id="audioPlayer"
        controls
        preload="metadata"
      >
        <source
          src="${escapeHtml(material.url || "")}"
        >

        Browser Anda tidak mendukung
        pemutar audio.
      </audio>

    `;


    audioElement =
      document.getElementById(
        "audioPlayer"
      );


    audioElement.addEventListener(
      "timeupdate",
      handleMediaProgress
    );


    audioElement.addEventListener(
      "ended",
      completeMaterial
    );


    return;

  }


  /*
    PDF
  */

  if (
    type === "pdf"
  ) {

    container.className =
      "pdf-wrapper";


    container.innerHTML = `

      <iframe
        src="${escapeHtml(material.url || "")}"
        title="${escapeHtml(material.judul || "PDF")}"
      ></iframe>

    `;


    /*
      PDF kita anggap selesai
      setelah halaman dibuka.
    */

    setTimeout(
      () => {

        setProgress(100);

      },
      1500
    );


    return;

  }


  /*
    UNKNOWN
  */

  container.className =
    "unsupported";


  container.innerHTML = `

    <div style="font-size:45px;">
      ⚠️
    </div>

    <h3>
      Format materi belum dikenali
    </h3>

    <p style="margin-top:10px;">
      Silakan periksa kolom
      <b>tipe</b> dan <b>url</b>
      di Supabase.
    </p>

  `;

}


/* =====================================================
   MEDIA PROGRESS
===================================================== */

function handleMediaProgress() {

  if (!audioElement) {
    return;
  }


  if (
    !audioElement.duration ||
    audioElement.duration === Infinity
  ) {
    return;
  }


  const percent =
    Math.round(
      (
        audioElement.currentTime /
        audioElement.duration
      ) * 100
    );


  setProgress(
    Math.min(
      percent,
      100
    )
  );

}


/* =====================================================
   PROGRESS LOCAL
===================================================== */

function getProgressKey() {

  if (!currentUser || !currentMaterial) {

    return null;

  }


  return (
    "ngajiplus_progress_" +
    currentUser.id +
    "_" +
    currentMaterial.id
  );

}


function loadSavedProgress() {

  const key =
    getProgressKey();


  if (!key) {
    return;
  }


  const saved =
    localStorage.getItem(
      key
    );


  if (!saved) {
    return;
  }


  const percent =
    Number(saved);


  if (
    Number.isFinite(percent)
  ) {

    setProgress(
      Math.max(
        0,
        Math.min(
          percent,
          100
        )
      ),
      false
    );

  }

}


function setProgress(
  percent,
  save = true
) {

  currentProgress =
    Math.max(
      0,
      Math.min(
        100,
        Math.round(percent)
      )
    );


  document.getElementById(
    "progressPercent"
  ).textContent =
    `${currentProgress}%`;


  document.getElementById(
    "progressFill"
  ).style.width =
    `${currentProgress}%`;


  const status =
    document.getElementById(
      "progressStatus"
    );


  if (
    currentProgress >= 100
  ) {

    status.textContent =
      "✓ Materi selesai";

    document.getElementById(
      "completeBtn"
    ).textContent =
      "✓ Sudah Selesai";

  } else if (
    currentProgress > 0
  ) {

    status.textContent =
      "Sedang dipelajari";

  } else {

    status.textContent =
      "Belum dimulai";

  }


  if (save) {

    const key =
      getProgressKey();


    if (key) {

      localStorage.setItem(
        key,
        String(currentProgress)
      );

    }

  }

}


/* =====================================================
   COMPLETE MATERIAL
===================================================== */

function completeMaterial() {

  setProgress(
    100
  );


  const btn =
    document.getElementById(
      "completeBtn"
    );


  btn.textContent =
    "✓ Sudah Selesai";


  /*
    Untuk sekarang progress disimpan
    di browser.

    Setelah player sudah stabil,
    kita sambungkan progress ini
    ke tabel progress Supabase.
  */

}


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

  document.getElementById(
    "loading"
  ).style.display =
    "none";


  document.getElementById(
    "content"
  ).style.display =
    "none";


  const errorBox =
    document.getElementById(
      "error"
    );


  errorBox.style.display =
    "block";


  errorBox.textContent =
    message;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  if (value === null || value === undefined) {

    return "";

  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   BACK
===================================================== */

function goBack() {

  if (
    document.referrer &&
    document.referrer.includes(
      "ngajiplus.id"
    )
  ) {

    history.back();

  } else {

    window.location.href =
      "index.html";

  }

}


/* =====================================================
   INITIALIZE
===================================================== */

async function init() {

  try {

    await checkUser();

    await loadMaterial();

    loadSavedProgress();


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "content"
    ).style.display =
      "block";


  } catch (error) {

    console.error(
      error
    );


    showError(
      "Terjadi kesalahan: " +
      error.message
    );

  }

}


init();

</script>
