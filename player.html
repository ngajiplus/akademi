<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="description"
  content="Pemutar materi pembelajaran NgajiPlus Akademi"
>

<title>Pemutar Materi - NgajiPlus Akademi</title>


<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:#f5f8f6;
  color:#202a24;
}


/* =====================================================
   HEADER
===================================================== */

header{
  background:#ffffff;
  border-bottom:1px solid #e3e9e5;
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{

  max-width:1100px;

  margin:auto;

  padding:
    12px
    20px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;
}

.logo{

  color:#008f58;

  font-weight:bold;

  font-size:16px;

  text-decoration:none;
}

.back-button{

  background:#e8f5ef;

  color:#087a47;

  padding:
    8px
    13px;

  border-radius:8px;

  text-decoration:none;

  font-size:13px;

  font-weight:bold;

  white-space:nowrap;
}

.back-button:hover{
  background:#d7eee3;
}


/* =====================================================
   MAIN
===================================================== */

main{

  max-width:1000px;

  margin:auto;

  padding:
    25px
    15px
    50px;
}


/* =====================================================
   LOADING
===================================================== */

.loading{

  background:#ffffff;

  border:1px solid #e2e8e4;

  border-radius:15px;

  padding:50px 20px;

  text-align:center;

  color:#666;

  font-size:15px;
}


/* =====================================================
   ERROR
===================================================== */

.error-box{

  background:#fff0f0;

  color:#b42318;

  border:
    1px
    solid
    #f2c3c3;

  border-radius:14px;

  padding:25px 20px;

  text-align:center;

  line-height:1.7;

  box-shadow:
    0
    5px
    20px
    rgba(0,0,0,.04);
}


/* =====================================================
   MATERIAL BOX
===================================================== */

.material-box{

  background:#ffffff;

  border:
    1px
    solid
    #e2e8e4;

  border-radius:16px;

  overflow:hidden;

  box-shadow:
    0
    5px
    20px
    rgba(0,0,0,.04);
}


/* =====================================================
   MATERIAL HEADER
===================================================== */

.material-header{

  padding:24px;
}

.material-title{

  margin:
    0
    0
    12px;

  font-size:27px;

  line-height:1.3;
}

.material-description{

  color:#666;

  line-height:1.7;

  font-size:14px;

  white-space:pre-line;
}


/* =====================================================
   BADGES
===================================================== */

.badge{

  display:inline-block;

  padding:
    6px
    11px;

  border-radius:20px;

  font-size:12px;

  font-weight:bold;

  margin-top:13px;
}

.badge-free{

  background:#ddf7e7;

  color:#087a47;
}

.badge-premium{

  background:#fff0b8;

  color:#8a6200;
}


/* =====================================================
   PLAYER
===================================================== */

.player{

  width:100%;

  background:#111;

  min-height:100px;
}


/* =====================================================
   YOUTUBE / VIDEO
===================================================== */

.video-frame{

  width:100%;

  aspect-ratio:16 / 9;

  border:0;

  display:block;

  background:#000;
}


/* =====================================================
   VIDEO BIASA
===================================================== */

.normal-video{

  width:100%;

  max-height:75vh;

  display:block;

  background:#000;
}


/* =====================================================
   AUDIO
===================================================== */

.audio-player{

  padding:
    50px
    25px;

  background:#f0f4f2;

  text-align:center;
}

.audio-icon{

  font-size:55px;

  margin-bottom:20px;
}

.audio-player audio{

  width:100%;

  max-width:700px;
}


/* =====================================================
   PDF
===================================================== */

.pdf-container{

  background:#eeeeee;

  padding:10px;
}

.pdf-frame{

  width:100%;

  height:75vh;

  border:0;

  display:block;

  background:#ffffff;
}


/* =====================================================
   INFO
===================================================== */

.info{

  padding:20px 24px;

  border-top:
    1px
    solid
    #e5e9e6;

  line-height:2;

  font-size:14px;

  color:#555;
}

.info strong{

  color:#202a24;
}


/* =====================================================
   BOTTOM BACK
===================================================== */

.back-area{

  text-align:center;

  padding-top:20px;
}

.back-bottom{

  display:inline-block;

  background:#008f58;

  color:white;

  padding:
    11px
    18px;

  border-radius:9px;

  text-decoration:none;

  font-size:14px;

  font-weight:bold;
}

.back-bottom:hover{

  background:#007849;
}


/* =====================================================
   SECURITY MESSAGE
===================================================== */

.access-note{

  margin-top:15px;

  padding:
    12px
    15px;

  background:#f5f8f6;

  border-radius:9px;

  color:#666;

  font-size:12px;

  text-align:center;
}


/* =====================================================
   HIDDEN
===================================================== */

.hidden{

  display:none !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .header-inner{

    padding:
      10px
      12px;
  }

  .logo{

    font-size:14px;
  }

  .back-button{

    font-size:12px;

    padding:
      7px
      10px;
  }

  main{

    padding:
      15px
      10px
      40px;
  }

  .material-header{

    padding:18px;
  }

  .material-title{

    font-size:20px;
  }

  .material-description{

    font-size:13px;
  }

  .info{

    padding:17px;

    font-size:13px;
  }

  .pdf-frame{

    height:70vh;
  }

  .audio-player{

    padding:
      40px
      15px;
  }

}


/* =====================================================
   VERY SMALL SCREEN
===================================================== */

@media(max-width:380px){

  .material-title{

    font-size:18px;
  }

  .logo{

    font-size:13px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

  <div class="header-inner">

    <a
      href="akademi.html"
      class="logo"
    >
      📖 NgajiPlus Akademi
    </a>


    <a
      href="akademi.html"
      class="back-button"
    >
      ← Kembali
    </a>

  </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >

    ⏳ Memeriksa akses materi...

  </div>



  <!-- ERROR -->

  <div
    id="errorBox"
    class="error-box hidden"
  ></div>



  <!-- MATERIAL -->

  <div
    id="materialBox"
    class="material-box hidden"
  >


    <!-- MATERIAL HEADER -->

    <div class="material-header">


      <h1
        id="title"
        class="material-title"
      >
      </h1>


      <div
        id="description"
        class="material-description"
      >
      </div>


      <div
        id="badge"
      >
      </div>


    </div>



    <!-- PLAYER -->

    <div
      id="player"
      class="player"
    >
    </div>



    <!-- INFO -->

    <div
      id="info"
      class="info"
    >
    </div>


  </div>



  <!-- BACK -->

  <div
    id="bottomBackArea"
    class="back-area hidden"
  >

    <a
      href="akademi.html"
      class="back-bottom"
    >
      ← Kembali ke Materi
    </a>

  </div>


</main>



<script>

/* =====================================================
   AMBIL ID DARI URL
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const materialId =
  params.get("id");



/* =====================================================
   ELEMENT
===================================================== */

const loading =
  document.getElementById(
    "loading"
  );


const errorBox =
  document.getElementById(
    "errorBox"
  );


const materialBox =
  document.getElementById(
    "materialBox"
  );


const bottomBackArea =
  document.getElementById(
    "bottomBackArea"
  );



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =====================================================
   ERROR
===================================================== */

function showError(message){

  loading.classList.add(
    "hidden"
  );


  materialBox.classList.add(
    "hidden"
  );


  errorBox.classList.remove(
    "hidden"
  );


  bottomBackArea.classList.remove(
    "hidden"
  );


  errorBox.innerHTML =
    message;

}



/* =====================================================
   YOUTUBE ID
===================================================== */

function getYoutubeId(url){

  if(!url){

    return null;

  }


  try{

    const parsed =
      new URL(url);


    const hostname =
      parsed.hostname
        .toLowerCase()
        .replace(
          "www.",
          ""
        );


    /* ================================================
       youtube.com
    ================================================ */

    if(
      hostname === "youtube.com" ||
      hostname === "m.youtube.com"
    ){


      /* WATCH */

      if(
        parsed.pathname === "/watch"
      ){

        return parsed.searchParams.get(
          "v"
        );

      }


      /* SHORTS */

      if(
        parsed.pathname.startsWith(
          "/shorts/"
        )
      ){

        return parsed.pathname
          .split("/")
          .filter(Boolean)[1]
          || null;

      }


      /* EMBED */

      if(
        parsed.pathname.startsWith(
          "/embed/"
        )
      ){

        return parsed.pathname
          .split("/")
          .filter(Boolean)[1]
          || null;

      }

    }


    /* ================================================
       youtu.be
    ================================================ */

    if(
      hostname === "youtu.be"
    ){

      return parsed.pathname
        .split("/")
        .filter(Boolean)[0]
        || null;

    }

  }

  catch(error){

    console.error(
      "URL YouTube tidak valid:",
      error
    );

  }


  return null;

}



/* =====================================================
   RENDER PLAYER
===================================================== */

function renderPlayer(material){

  const player =
    document.getElementById(
      "player"
    );


  const tipe =
    String(
      material.type ||
      material.tipe ||
      "video"
    )
    .toLowerCase()
    .trim();


  const url =
    String(
      material.url ||
      ""
    )
    .trim();



  /* ===================================================
     URL KOSONG
  =================================================== */

  if(!url){

    player.innerHTML = `

      <div
        style="
          padding:40px 20px;
          text-align:center;
          background:#fff0f0;
          color:#b42318;
        "
      >

        ❌ URL materi belum tersedia.

      </div>

    `;

    return;

  }



  /* ===================================================
     VIDEO
  =================================================== */

  if(
    tipe === "video" ||
    tipe === "youtube"
  ){

    const youtubeId =
      getYoutubeId(url);



    /* ================================================
       YOUTUBE
    ================================================ */

    if(youtubeId){

      const safeTitle =
        escapeHtml(
          material.judul ||
          "Video NgajiPlus"
        );


      player.innerHTML = `

        <iframe

          class="video-frame"

          src="https://www.youtube.com/embed/${encodeURIComponent(youtubeId)}"

          title="${safeTitle}"

          loading="lazy"

          referrerpolicy="strict-origin-when-cross-origin"

          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share
          "

          allowfullscreen

        ></iframe>

      `;

      return;

    }



    /* ================================================
       VIDEO URL BIASA
    ================================================ */

    player.innerHTML = `

      <video
        class="normal-video"
        controls
        playsinline
        preload="metadata"
      >

        <source
          src="${escapeHtml(url)}"
        >

        Browser Anda tidak mendukung
        pemutar video.

      </video>

    `;

    return;

  }



  /* ===================================================
     AUDIO
  =================================================== */

  if(
    tipe === "audio"
  ){

    player.innerHTML = `

      <div class="audio-player">

        <div class="audio-icon">
          🎧
        </div>

        <audio
          controls
          preload="metadata"
        >

          <source
            src="${escapeHtml(url)}"
          >

          Browser Anda tidak mendukung
          pemutar audio.

        </audio>

      </div>

    `;

    return;

  }



  /* ===================================================
     PDF
  =================================================== */

  if(
    tipe === "pdf"
  ){

    player.innerHTML = `

      <div class="pdf-container">

        <iframe
          class="pdf-frame"
          src="${escapeHtml(url)}"
          title="${escapeHtml(
            material.judul ||
            "Materi PDF NgajiPlus"
          )}"
        ></iframe>

      </div>

    `;

    return;

  }



  /* ===================================================
     TIPE TIDAK DIKENALI
  =================================================== */

  player.innerHTML = `

    <div
      style="
        padding:40px 20px;
        text-align:center;
        background:white;
      "
    >

      ❌ Tipe materi tidak dikenali.

      <br><br>

      Tipe:
      <strong>
        ${escapeHtml(tipe)}
      </strong>

    </div>

  `;

}



/* =====================================================
   LOAD MATERIAL
===================================================== */

async function loadMaterial(){


  /* ===================================================
     CEK SUPABASE
  =================================================== */

  if(
    typeof supabaseClient ===
    "undefined"
  ){

    showError(

      "❌ <strong>Supabase belum terhubung.</strong>" +

      "<br><br>" +

      "Periksa file " +

      "<strong>supabase-config.js</strong>."

    );

    return;

  }



  /* ===================================================
     CEK ID
  =================================================== */

  if(!materialId){

    showError(

      "❌ <strong>ID materi tidak ditemukan.</strong>" +

      "<br><br>" +

      "Silakan kembali ke halaman materi " +

      "dan pilih materi yang ingin dipelajari."

    );

    return;

  }



  try{


    console.log(
      "NgajiPlus PLAYER:",
      materialId
    );



    /* =================================================
       AMBIL MATERI

       RLS SUPABASE YANG MENENTUKAN
       APAKAH USER BOLEH MELIHAT DATA.
    ================================================= */

    const result =
      await supabaseClient

        .from("materials")

        .select("*")

        .eq(
          "id",
          materialId
        )

        .maybeSingle();



    console.log(
      "NgajiPlus PLAYER RESULT:",
      result
    );



    /* =================================================
       ERROR SUPABASE
    ================================================= */

    if(result.error){

      throw result.error;

    }



    const material =
      result.data;



    /* =================================================
       MATERI TIDAK TERSEDIA

       Bisa berarti:
       - ID salah
       - materi dihapus
       - user tidak memiliki akses
       - RLS menolak akses premium
    ================================================= */

    if(!material){

      showError(

        "🔐 <strong>Akses materi ditolak.</strong>" +

        "<br><br>" +

        "Materi tidak tersedia untuk akun Anda." +

        "<br><br>" +

        "Jika materi ini Premium, pastikan " +

        "Anda sudah login dan membership Anda " +

        "masih aktif."

      );

      return;

    }



    /* =================================================
       JUDUL
    ================================================= */

    document.getElementById(
      "title"
    ).innerText =

      material.judul ||
      "Tanpa Judul";



    /* =================================================
       DESKRIPSI
    ================================================= */

    document.getElementById(
      "description"
    ).innerText =

      material.deskripsi ||
      "";



    /* =================================================
       BADGE
    ================================================= */

    const badge =
      document.getElementById(
        "badge"
      );


    if(
      material.premium === true
    ){

      badge.innerHTML =

        '<span class="badge badge-premium">' +
        '🔐 PREMIUM' +
        '</span>';

    }

    else{

      badge.innerHTML =

        '<span class="badge badge-free">' +
        '🟢 GRATIS' +
        '</span>';

    }



    /* =================================================
       TIPE
    ================================================= */

    const tipe =
      material.type ||
      material.tipe ||
      "video";



    /* =================================================
       INFO
    ================================================= */

    document.getElementById(
      "info"
    ).innerHTML = `

      📁 Kategori:
      <strong>
        ${escapeHtml(
          material.kategori ||
          "-"
        )}
      </strong>

      <br>

      🎬 Tipe:
      <strong>
        ${escapeHtml(
          tipe
        )}
      </strong>

      <div class="access-note">

        🔒 Akses materi dikendalikan oleh
        sistem keamanan NgajiPlus.

      </div>

    `;



    /* =================================================
       PLAYER
    ================================================= */

    renderPlayer(
      material
    );



    /* =================================================
       TAMPILKAN
    ================================================= */

    loading.classList.add(
      "hidden"
    );


    materialBox.classList.remove(
      "hidden"
    );


    bottomBackArea.classList.remove(
      "hidden"
    );



    console.log(
      "NgajiPlus: materi berhasil dibuka."
    );

  }

  catch(error){

    console.error(
      "NgajiPlus PLAYER ERROR:",
      error
    );


    showError(

      "❌ <strong>Gagal membuka materi.</strong>" +

      "<br><br>" +

      escapeHtml(
        error.message ||
        "Terjadi kesalahan."
      )

    );

  }

}



/* =====================================================
   START
===================================================== */

window.addEventListener(
  "load",
  function(){

    loadMaterial();

  }
);

</script>


</body>

</html>
