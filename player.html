<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Player materi pembelajaran NgajiPlus Akademi"
  >

  <title>Materi - NgajiPlus Akademi</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- YOUTUBE IFRAME API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f4f7f6;
      color: #17231f;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font-family: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;

      height: 58px;

      background: rgba(255,255,255,.96);

      border-bottom: 1px solid #e4ebe8;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;

      color: #087f5b;
      font-weight: 800;
      font-size: 14px;
    }

    .brand-icon {
      width: 27px;
      height: 27px;

      border-radius: 7px;

      background: #087f5b;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 15px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-btn {
      border: 0;
      background: #edf8f3;
      color: #087f5b;

      padding: 8px 12px;

      border-radius: 8px;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;
    }

    .account {
      display: flex;
      align-items: center;
      gap: 7px;

      font-size: 12px;
      font-weight: 600;

      white-space: nowrap;
    }

    .avatar {
      width: 29px;
      height: 29px;

      border-radius: 50%;

      object-fit: cover;

      background: #dcebe5;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: min(100%, 1000px);

      margin: 0 auto;

      padding: 20px;
    }

    /* =========================
       TITLE
    ========================= */

    .material-info {
      background: white;

      border-radius: 15px;

      padding: 18px;

      margin-bottom: 14px;

      box-shadow:
        0 4px 18px rgba(0,0,0,.04);
    }

    .category {
      display: inline-block;

      padding: 5px 9px;

      border-radius: 999px;

      background: #e9f7f1;

      color: #087f5b;

      font-size: 10px;

      font-weight: 800;

      margin-bottom: 8px;
    }

    .material-info h1 {
      margin: 0;

      font-size: 24px;

      line-height: 1.25;
    }

    .description {
      margin: 7px 0 0;

      color: #77837f;

      font-size: 13px;

      line-height: 1.6;
    }

    /* =========================
       PLAYER CARD
    ========================= */

    .player-card {
      background: #111;

      border-radius: 15px;

      overflow: hidden;

      margin-bottom: 14px;

      box-shadow:
        0 6px 22px rgba(0,0,0,.10);
    }

    /* =========================
       YOUTUBE
    ========================= */

    .youtube-wrapper {
      position: relative;

      width: 100%;

      aspect-ratio: 16 / 9;

      background: #000;
    }

    #youtube-player {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;
    }

    /* =========================
       AUDIO
    ========================= */

    .audio-player {
      min-height: 205px;

      padding: 28px 20px;

      background:
        linear-gradient(
          135deg,
          #087f5b,
          #00965f
        );

      color: white;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;
    }

    .audio-icon {
      font-size: 45px;

      margin-bottom: 8px;
    }

    .audio-player h2 {
      margin: 0 0 3px;

      font-size: 20px;
    }

    .audio-player p {
      margin: 0 0 16px;

      opacity: .9;

      font-size: 12px;
    }

    audio {
      width: min(100%, 560px);

      height: 40px;
    }

    /* =========================
       PDF
    ========================= */

    .pdf-wrapper {
      background: #222;

      padding: 0;

      min-height: 500px;
    }

    .pdf-frame {
      display: block;

      width: 100%;

      height: 70vh;

      min-height: 500px;

      border: 0;

      background: white;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      min-height: 250px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      color: white;
    }

    .spinner {
      width: 35px;
      height: 35px;

      border: 4px solid rgba(255,255,255,.25);

      border-top-color: white;

      border-radius: 50%;

      animation: spin .8s linear infinite;

      margin-bottom: 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       ERROR
    ========================= */

    .error-box {
      background: #fff1f1;

      color: #a52b2b;

      border: 1px solid #ffd1d1;

      padding: 18px;

      border-radius: 12px;

      line-height: 1.6;

      font-size: 13px;
    }

    /* =========================
       PROGRESS
    ========================= */

    .progress-card {
      background: white;

      border-radius: 15px;

      padding: 16px;

      margin-bottom: 12px;

      box-shadow:
        0 4px 18px rgba(0,0,0,.04);
    }

    .progress-head {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 8px;

      font-size: 13px;

      font-weight: 700;
    }

    .progress-percent {
      color: #087f5b;
    }

    .progress-track {
      width: 100%;

      height: 7px;

      background: #e3e8e6;

      border-radius: 999px;

      overflow: hidden;
    }

    .progress-bar {
      height: 100%;

      width: 0%;

      background: #087f5b;

      border-radius: 999px;

      transition: width .25s ease;
    }

    .progress-status {
      margin-top: 8px;

      color: #7a8581;

      font-size: 11px;
    }

    /* =========================
       BUTTON AREA
    ========================= */

    .action-area {
      display: flex;

      gap: 8px;

      flex-wrap: wrap;

      margin-bottom: 25px;
    }

    .action-btn {
      border: 0;

      padding: 10px 14px;

      border-radius: 9px;

      font-size: 12px;

      font-weight: 700;

      cursor: pointer;

      background: #eaf7f2;

      color: #087f5b;
    }

    .action-btn.primary {
      background: #087f5b;

      color: white;
    }

    .action-btn:disabled {
      opacity: .6;

      cursor: not-allowed;
    }

    /* =========================
       SAVE INDICATOR
    ========================= */

    .save-indicator {
      position: fixed;

      left: 50%;

      bottom: 25px;

      transform:
        translateX(-50%)
        translateY(20px);

      opacity: 0;

      pointer-events: none;

      background: #087f5b;

      color: white;

      padding: 10px 18px;

      border-radius: 10px;

      font-size: 12px;

      font-weight: 700;

      transition:
        opacity .25s ease,
        transform .25s ease;

      z-index: 5000;
    }

    .save-indicator.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 768px) {

      header {
        padding: 0 30px;
      }

      main {
        padding:
          28px
          30px
          50px;
      }

      .material-info {
        padding: 24px;
      }

      .material-info h1 {
        font-size: 28px;
      }

      .pdf-frame {
        height: 75vh;
      }

    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 0 12px;
      }

      .brand {
        font-size: 12px;
      }

      .back-btn {
        padding: 7px 9px;
      }

      .account-name {
        max-width: 90px;

        overflow: hidden;

        text-overflow: ellipsis;
      }

      main {
        padding: 14px;
      }

      .material-info {
        padding: 16px;

        border-radius: 14px;
      }

      .material-info h1 {
        font-size: 23px;
      }

      .description {
        font-size: 12px;
      }

      .player-card {
        border-radius: 14px;
      }

      .pdf-frame {
        height: 65vh;

        min-height: 450px;
      }

    }

  </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <a
    href="index.html"
    class="brand"
  >

    <span class="brand-icon">
      📖
    </span>

    <span>
      NgajiPlus Akademi
    </span>

  </a>


  <div class="header-right">

    <button
      class="back-btn"
      id="backBtn"
    >
      ← Kembali
    </button>


    <a
      href="profile.html"
      class="account"
      id="accountLink"
    >

      <img
        id="avatar"
        class="avatar"
        src=""
        alt="Profil"
      >

      <span
        id="accountName"
        class="account-name"
      >
        Memuat...
      </span>

    </a>

  </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main>


  <!-- INFO -->

  <section
    class="material-info"
    id="materialInfo"
  >

    <span
      class="category"
      id="category"
    >
      Materi
    </span>

    <h1 id="title">
      Memuat materi...
    </h1>

    <p
      class="description"
      id="description"
    >
      Silakan tunggu...
    </p>

  </section>



  <!-- PLAYER -->

  <section
    class="player-card"
    id="playerCard"
  >

    <div class="loading">

      <div class="spinner"></div>

      <div>
        Memuat materi...

    </div>

  </section>



  <!-- PROGRESS -->

  <section
    class="progress-card"
  >

    <div class="progress-head">

      <span>
        Progress Materi
      </span>

      <span
        class="progress-percent"
        id="progressPercent"
      >
        0%
      </span>

    </div>


    <div class="progress-track">

      <div
        class="progress-bar"
        id="progressBar"

    >

    </div>

  </section>



  <!-- ACTION -->

  <div class="action-area">

    <a
      href="index.html"

    >
      📚 Semua Materi
    </a>


    <button
      class="action-btn primary"

    >

    </button>

  </div>


</main>



<!-- SAVE INDICATOR -->

<div
  class="save-indicator"
  id="saveIndicator"
>
  ✓ Progress berhasil disimpan
</div>



<script>

  /* =====================================================
     SUPABASE CONFIG
  ===================================================== */

  const SUPABASE_URL =
    "https://ksgywgdrfskqsufchbcm.supabase.co";


  /*
    PENTING:

    Ganti nilai di bawah dengan publishable key
    yang SAMA dengan index.html Anda.
  */

  const SUPABASE_KEY =
    "sb_publishable_HmFKwHMCISfN_YOoiLx3-A_MWnG9yG7";


  const {
    createClient
  } = supabase;


  const supabaseClient =
    createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );



  /* =====================================================
     GLOBAL
  ===================================================== */

  let currentUser = null;

  let material = null;

  let currentProgress = 0;

  let youtubePlayer = null;

  let saveTimer = null;

  let lastSavedProgress = -1;

  let audioElement = null;



  /* =====================================================
     ELEMENT
  ===================================================== */

  const titleEl =
    document.getElementById("title");

  const descriptionEl =
    document.getElementById("description");

  const categoryEl =
    document.getElementById("category");

  const playerCard =
    document.getElementById("playerCard");

  const progressPercentEl =
    document.getElementById("progressPercent");

  const progressBarEl =
    document.getElementById("progressBar");

  const progressStatusEl =
    document.getElementById("progressStatus");

  const completeBtn =
    document.getElementById("completeBtn");

  const accountNameEl =
    document.getElementById("accountName");

  const avatarEl =
    document.getElementById("avatar");

  const saveIndicator =
    document.getElementById("saveIndicator");



  /* =====================================================
     GET MATERIAL ID
  ===================================================== */

  function getMaterialId() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const id =
      params.get("id");

    if (!id) {
      return null;
    }

    return id.trim();

  }



  /* =====================================================
     INIT
  ===================================================== */

  async function init() {

    try {

      const materialId =
        getMaterialId();


      if (!materialId) {

        showError(
          "ID materi tidak ditemukan."
        );

        return;

      }


      /* =========================
         AUTH
      ========================= */

      const {
        data: authData,
        error: authError
      } =
        await supabaseClient
          .auth
          .getUser();


      if (
        authError ||
        !authData ||
        !authData.user
      ) {

        window.location.href =
          "login.html";

        return;

      }


      currentUser =
        authData.user;


      await loadProfile();


      /* =========================
         LOAD MATERIAL
      ========================= */

      await loadMaterial(
        materialId
      );


      /* =========================
         LOAD PROGRESS
      ========================= */

      await loadProgress(
        materialId
      );


      /* =========================
         PLAYER
      ========================= */

      renderPlayer();


    } catch (error) {

      console.error(error);

      showError(
        "Terjadi kesalahan saat memuat materi."
      );

    }

  }



  /* =====================================================
     PROFILE
  ===================================================== */

  async function loadProfile() {

    try {

      const {
        data
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "nama, avatar_url"
          )
          .eq(
            "id",
            currentUser.id
          )
          .maybeSingle();


      if (data) {

        accountNameEl.textContent =
          data.nama ||
          currentUser.email ||
          "Akun";


        if (data.avatar_url) {

          avatarEl.src =
            data.avatar_url;

        } else {

          avatarEl.src =
            createAvatar(
              data.nama ||
              currentUser.email
            );

        }

      } else {

        accountNameEl.textContent =
          currentUser.email ||
          "Akun";

        avatarEl.src =
          createAvatar(
            currentUser.email
          );

      }

    } catch (error) {

      console.warn(
        "Profile error:",
        error
      );

      accountNameEl.textContent =
        currentUser.email ||
        "Akun";

      avatarEl.src =
        createAvatar(
          currentUser.email
        );

    }

  }



  /* =====================================================
     DEFAULT AVATAR
  ===================================================== */

  function createAvatar(name) {

    const letter =
      encodeURIComponent(
        (name || "A")
          .charAt(0)
          .toUpperCase()
      );


    return `
      https://ui-avatars.com/api/
      ?name=${letter}
      &background=087f5b
      &color=ffffff
      &size=80
    `.replace(/\s/g, "");

  }



  /* =====================================================
     LOAD MATERIAL
  ===================================================== */

  async function loadMaterial(
    materialId
  ) {

    let result =
      await supabaseClient
        .from("materials")
        .select(`
          id,
          judul,
          deskripsi,
          kategori,
          tipe,
          type,
          url,
          thumbnail,
          premium
        `)
        .eq(
          "id",
          materialId
        )
        .maybeSingle();


    if (result.error) {

      console.error(
        result.error
      );

      throw result.error;

    }


    if (!result.data) {

      throw new Error(
        "Materi tidak ditemukan."
      );

    }


    material =
      result.data;


    titleEl.textContent =
      material.judul ||
      "Materi";


    descriptionEl.textContent =
      material.deskripsi ||
      "Materi pembelajaran NgajiPlus Akademi.";


    categoryEl.textContent =
      material.kategori ||
      "Materi";

  }



  /* =====================================================
     LOAD PROGRESS FROM SUPABASE
  ===================================================== */

  async function loadProgress(
    materialId
  ) {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("learning_progress")
        .select(`
          id,
          progress,
          status,
          completed_at,
          updated_at
        `)
        .eq(
          "user_id",
          currentUser.id
        )
        .eq(
          "material_id",
          String(materialId)
        )
        .maybeSingle();


    if (error) {

      console.error(
        "Load progress:",
        error
      );

      /*
        Kalau belum ada row,
        progress dimulai dari 0.
      */

      currentProgress = 0;

    } else {

      currentProgress =
        Number(
          data?.progress || 0
        );

    }


    currentProgress =
      clampProgress(
        currentProgress
      );


    updateProgressUI();

  }



  /* =====================================================
     SAVE PROGRESS
  ===================================================== */

  async function saveProgress(
    progress,
    force = false
  ) {

    if (!currentUser || !material) {
      return;
    }


    progress =
      clampProgress(progress);


    /*
      Hindari terlalu sering UPDATE.
    */

    if (
      !force &&
      Math.abs(
        progress -
        lastSavedProgress
      ) < 1
    ) {

      return;

    }


    const isCompleted =
      progress >= 100;


    const payload = {

      user_id:
        currentUser.id,

      material_id:
        String(material.id),

      status:
        isCompleted
          ? "completed"
          : "started",

      progress:
        progress,

      last_watched_at:
        new Date().toISOString(),

      completed_at:
        isCompleted
          ? new Date().toISOString()
          : null

    };


    const {
      error
    } =
      await supabaseClient
        .from("learning_progress")
        .upsert(
          payload,
          {
            onConflict:
              "user_id,material_id"
          }
        );


    if (error) {

      console.error(
        "Gagal menyimpan progress:",
        error
      );

      return;

    }


    lastSavedProgress =
      progress;


    currentProgress =
      progress;


    updateProgressUI();


    showSaved();

  }



  /* =====================================================
     UPDATE PROGRESS UI
  ===================================================== */

  function updateProgressUI() {

    const percent =
      Math.round(
        clampProgress(
          currentProgress
        )
      );


    progressPercentEl.textContent =
      `${percent}%`;


    progressBarEl.style.width =
      `${percent}%`;


    if (percent >= 100) {

      progressStatusEl.textContent =
        "✓ Materi selesai";


      completeBtn.textContent =
        "✓ Sudah Selesai";

    } else if (percent > 0) {

      progressStatusEl.textContent =
        "Sedang dipelajari";

      completeBtn.textContent =
        "✓ Tandai Selesai";

    } else {

      progressStatusEl.textContent =
        "Belum dimulai";

      completeBtn.textContent =
        "✓ Tandai Selesai";

    }

  }



  /* =====================================================
     COMPLETE BUTTON
  ===================================================== */

  completeBtn.addEventListener(
    "click",
    async () => {

      completeBtn.disabled =
        true;


      try {

        currentProgress =
          100;


        updateProgressUI();


        await saveProgress(
          100,
          true
        );


      } finally {

        completeBtn.disabled =
          false;

      }

    }
  );



  /* =====================================================
     RENDER PLAYER
  ===================================================== */

  function renderPlayer() {

    const type =
      (
        material.type ||
        material.tipe ||
        ""
      )
        .toLowerCase()
        .trim();


    const url =
      material.url ||
      "";


    /*
      VIDEO
    */

    if (
      type === "video"
    ) {

      renderYoutube(
        url
      );

      return;

    }


    /*
      AUDIO
    */

    if (
      type === "audio"
    ) {

      renderAudio(
        url
      );

      return;

    }


    /*
      PDF / EBOOK / DOKUMEN
    */

    if (
      type === "pdf" ||
      type === "ebook" ||
      type === "dokumen"
    ) {

      renderPdf(
        url
      );

      return;

    }


    showError(
      "Jenis materi tidak dikenali."
    );

  }



  /* =====================================================
     YOUTUBE URL → VIDEO ID
  ===================================================== */

  function extractYoutubeId(url) {

    if (!url) {
      return null;
    }


    const patterns = [

      /youtube\.com\/watch\?v=([^&]+)/i,

      /youtu\.be\/([^?&]+)/i,

      /youtube\.com\/embed\/([^?&]+)/i,

      /youtube\.com\/shorts\/([^?&]+)/i

    ];


    for (
      const pattern
      of patterns
    ) {

      const match =
        url.match(pattern);


      if (match) {

        return match[1];

      }

    }


    return null;

  }



  /* =====================================================
     YOUTUBE
  ===================================================== */

  function renderYoutube(
    url
  ) {

    const videoId =
      extractYoutubeId(
        url
      );


    if (!videoId) {

      showError(
        "Link YouTube tidak valid."
      );

      return;

    }


    playerCard.innerHTML = `

      <div
        class="youtube-wrapper"
      >

        <div
          id="youtube-player"
        ></div>

      </div>

    `;


    /*
      Kalau API YouTube sudah siap
      langsung buat player.
    */

    if (
      window.YT &&
      window.YT.Player
    ) {

      createYoutubePlayer(
        videoId
      );

    } else {

      window.pendingYoutubeVideoId =
        videoId;

    }

  }



  /* =====================================================
     YOUTUBE API CALLBACK
  ===================================================== */

  window.onYouTubeIframeAPIReady =
    function() {

      if (
        window.pendingYoutubeVideoId
      ) {

        createYoutubePlayer(
          window.pendingYoutubeVideoId
        );

      }

    };



  /* =====================================================
     CREATE YOUTUBE PLAYER
  ===================================================== */

  function createYoutubePlayer(
    videoId
  ) {

    youtubePlayer =
      new YT.Player(
        "youtube-player",
        {

          videoId:
            videoId,

          playerVars: {

            playsinline: 1,

            rel: 0,

            modestbranding: 1

          },

          events: {

            onStateChange:
              onYoutubeStateChange

          }

        }
      );

  }



  /* =====================================================
     YOUTUBE STATE
  ===================================================== */

  function onYoutubeStateChange(
    event
  ) {

    /*
      PLAYING
    */

    if (
      event.data ===
      YT.PlayerState.PLAYING
    ) {

      startYoutubeProgress();

    }


    /*
      PAUSED
    */

    if (
      event.data ===
      YT.PlayerState.PAUSED
    ) {

      saveYoutubeProgress();

    }


    /*
      ENDED
    */

    if (
      event.data ===
      YT.PlayerState.ENDED
    ) {

      stopYoutubeProgress();


      currentProgress =
        100;


      updateProgressUI();


      saveProgress(
        100,
        true
      );

    }

  }



  /* =====================================================
     YOUTUBE PROGRESS TIMER
  ===================================================== */

  function startYoutubeProgress() {

    stopYoutubeProgress();


    saveTimer =
      setInterval(
        () => {

          saveYoutubeProgress();

        },
        5000
      );

  }



  function stopYoutubeProgress() {

    if (saveTimer) {

      clearInterval(
        saveTimer
      );

      saveTimer =
        null;

    }

  }



  function saveYoutubeProgress() {

    if (
      !youtubePlayer ||
      typeof youtubePlayer.getCurrentTime !==
        "function"
    ) {

      return;

    }


    const duration =
      youtubePlayer.getDuration();


    const current =
      youtubePlayer.getCurrentTime();


    if (
      !duration ||
      duration <= 0
    ) {

      return;

    }


    const percent =
      Math.floor(
        (
          current /
          duration
        ) * 100
      );


    currentProgress =
      clampProgress(
        percent
      );


    updateProgressUI();


    saveProgress(
      currentProgress
    );

  }



  /* =====================================================
     AUDIO
  ===================================================== */

  function renderAudio(
    url
  ) {

    if (!url) {

      showError(
        "URL audio tidak ditemukan."
      );

      return;

    }


    playerCard.innerHTML = `

      <div class="audio-player">

        <div class="audio-icon">
          🎧
        </div>

        <h2>
          ${escapeHtml(
            material.judul ||
            "Audio Pembelajaran"
          )}
        </h2>

        <p>
          Murottal / Audio Pembelajaran
        </p>

        <audio
          id="audio-player"
          controls
          preload="metadata"
        >

          <source
            src="${escapeAttribute(url)}"
          >

          Browser Anda tidak mendukung
          audio.

        </audio>

      </div>

    `;


    audioElement =
      document.getElementById(
        "audio-player"
      );


    if (!audioElement) {
      return;
    }


    /*
      Ketika audio mulai diputar.
    */

    audioElement.addEventListener(
      "play",
      () => {

        startAudioProgress();

      }
    );


    /*
      Ketika pause.
    */

    audioElement.addEventListener(
      "pause",
      () => {

        saveAudioProgress();

      }
    );


    /*
      Ketika selesai.
    */

    audioElement.addEventListener(
      "ended",
      async () => {

        stopAudioProgress();


        currentProgress =
          100;


        updateProgressUI();


        await saveProgress(
          100,
          true
        );

      }
    );


    /*
      Saat metadata sudah terbaca,
      lanjutkan dari posisi progress terakhir.
    */

    audioElement.addEventListener(
      "loadedmetadata",
      () => {

        restoreAudioPosition();

      }
    );

  }



  /* =====================================================
     AUDIO TIMER
  ===================================================== */

  function startAudioProgress() {

    stopAudioProgress();


    saveTimer =
      setInterval(
        () => {

          saveAudioProgress();

        },
        5000
      );

  }



  function stopAudioProgress() {

    if (saveTimer) {

      clearInterval(
        saveTimer
      );

      saveTimer =
        null;

    }

  }



  /* =====================================================
     AUDIO PROGRESS
  ===================================================== */

  function saveAudioProgress() {

    if (
      !audioElement ||
      !audioElement.duration ||
      !isFinite(
        audioElement.duration
      )
    ) {

      return;

    }


    const percent =
      Math.floor(
        (
          audioElement.currentTime /
          audioElement.duration
        ) * 100
      );


    currentProgress =
      clampProgress(
        percent
      );


    updateProgressUI();


    saveProgress(
      currentProgress
    );

  }



  /* =====================================================
     RESTORE AUDIO
  ===================================================== */

  function restoreAudioPosition() {

    if (
      !audioElement ||
      !audioElement.duration ||
      currentProgress <= 0 ||
      currentProgress >= 100
    ) {

      return;

    }


    const seconds =
      (
        currentProgress /
        100
      ) *
      audioElement.duration;


    try {

      audioElement.currentTime =
        seconds;

    } catch (error) {

      console.warn(
        "Tidak bisa restore audio position:",
        error
      );

    }

  }



  /* =====================================================
     PDF
  ===================================================== */

  function renderPdf(
    url
  ) {

    if (!url) {

      showError(
        "URL PDF tidak ditemukan."
      );

      return;

    }


    const pdfUrl =
      convertGoogleDriveUrl(
        url
      );


    playerCard.innerHTML = `

      <div class="pdf-wrapper">

        <iframe
          class="pdf-frame"
          src="${escapeAttribute(pdfUrl)}"
          title="${escapeAttribute(
            material.judul ||
            "PDF"
          )}"
          loading="lazy"
        ></iframe>

      </div>

    `;


    /*
      PDF browser tidak memberikan
      API yang konsisten untuk mengetahui
      halaman yang sedang dibaca.

      Karena itu PDF menggunakan
      tombol "Tandai Selesai".
    */


    if (
      currentProgress === 0
    ) {

      currentProgress =
        10;


      updateProgressUI();


      saveProgress(
        10,
        true
      );

    }

  }



  /* =====================================================
     GOOGLE DRIVE → PREVIEW
  ===================================================== */

  function convertGoogleDriveUrl(
    url
  ) {

    if (
      url.includes(
        "drive.google.com"
      )
    ) {

      const match =
        url.match(
          /\/d\/([^/]+)/
        );


      if (
        match &&
        match[1]
      ) {

        return (
          "https://drive.google.com/file/d/" +
          match[1] +
          "/preview"
        );

      }

    }


    return url;

  }



  /* =====================================================
     ERROR
  ===================================================== */

  function showError(
    message
  ) {

    playerCard.innerHTML = `

      <div
        style="
          padding:20px;
          background:#fff;
        "
      >

        <div class="error-box">

          ⚠️
          ${escapeHtml(message)}

        </div>

      </div>

    `;

  }



  /* =====================================================
     PROGRESS CLAMP
  ===================================================== */

  function clampProgress(
    value
  ) {

    value =
      Number(value);


    if (
      !Number.isFinite(value)
    ) {

      return 0;

    }


    return Math.max(
      0,
      Math.min(
        100,
        Math.round(value)
      )
    );

  }



  /* =====================================================
     SAVE INDICATOR
  ===================================================== */

  let indicatorTimer =
    null;


  function showSaved() {

    saveIndicator.classList.add(
      "show"
    );


    clearTimeout(
      indicatorTimer
    );


    indicatorTimer =
      setTimeout(
        () => {

          saveIndicator.classList.remove(
            "show"
          );

        },
        1500
      );

  }



  /* =====================================================
     ESCAPE HTML
  ===================================================== */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }



  function escapeAttribute(
    value
  ) {

    return escapeHtml(
      value
    );

  }



  /* =====================================================
     BACK BUTTON
  ===================================================== */

  document
    .getElementById("backBtn")
    .addEventListener(
      "click",
      () => {

        if (
          document.referrer &&
          document.referrer.includes(
            window.location.hostname
          )
        ) {

          history.back();

        } else {

          window.location.href =
            "index.html";

        }

      }
    );



  /* =====================================================
     BEFORE LEAVING PAGE
  ===================================================== */

  window.addEventListener(
    "beforeunload",
    () => {

      /*
        Simpan progress terakhir
        sebelum meninggalkan halaman.
      */

      if (
        audioElement
      ) {

        saveAudioProgress();

      }


      if (
        youtubePlayer
      ) {

        saveYoutubeProgress();

      }

    }
  );



  /* =====================================================
     START
  ===================================================== */

  init();

</script>

</body>

</html>
