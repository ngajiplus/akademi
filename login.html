<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="Login Member NgajiPlus">

<meta name="theme-color"
      content="#238b57">

<title>Login Member - NgajiPlus</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f8f6;
    color:#1f2933;
}

.header{
    background:white;
    border-bottom:1px solid #e5ebe7;
    padding:14px 20px;
}

.logo{
    color:#238b57;
    font-weight:bold;
    font-size:20px;
    text-decoration:none;
}

.container{
    min-height:calc(100vh - 65px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
}

.card{
    width:100%;
    max-width:430px;
    background:white;
    padding:30px;
    border-radius:20px;
    border:1px solid #e2e9e5;
    box-shadow:0 15px 40px rgba(0,0,0,.06);
}

.logo-box{
    text-align:center;
    margin-bottom:25px;
}

.logo-icon{
    font-size:40px;
}

h1{
    margin:8px 0 5px;
    font-size:25px;
}

.subtitle{
    color:#7a8580;
    font-size:13px;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #dbe4df;
    border-radius:9px;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#238b57;
}

button{
    width:100%;
    border:none;
    padding:13px;
    border-radius:9px;
    background:#238b57;
    color:white;
    font-weight:bold;
    font-size:14px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:9px;
    display:none;
    font-size:13px;
}

.success{
    background:#e5f7eb;
    color:#16733f;
}

.error{
    background:#fdecea;
    color:#b42318;
}

.register-link{
    text-align:center;
    margin-top:20px;
    font-size:13px;
    color:#667085;
}

.register-link a{
    color:#238b57;
    font-weight:bold;
    text-decoration:none;
}

.back{
    text-align:center;
    margin-top:15px;
}

.back a{
    color:#667085;
    font-size:12px;
    text-decoration:none;
}

</style>

</head>


<body>


<header class="header">

<a href="index.html"
   class="logo">

📖 NgajiPlus

</a>

</header>



<div class="container">

<div class="card">


<div class="logo-box">

<div class="logo-icon">
🔐
</div>

<h1>
Login Member
</h1>

<div class="subtitle">
Masuk untuk melanjutkan belajar
</div>

</div>



<form id="loginForm">


<div class="form-group">

<label>
Email
</label>

<input
    type="email"
    id="email"
    placeholder="nama@email.com"
    required
>

</div>



<div class="form-group">

<label>
Password
</label>

<input
    type="password"
    id="password"
    placeholder="Masukkan password"
    required
>

</div>



<button
    type="submit"
    id="loginButton">

🔐 Masuk

</button>


</form>



<div
    id="message"
    class="message">
</div>



<div class="register-link">

Belum punya akun?

<a href="daftar.html">
Daftar sekarang
</a>

</div>



<div class="back">

<a href="index.html">
← Kembali ke NgajiPlus
</a>

</div>


</div>

</div>



<script>

/* ==========================================
   SUPABASE CONFIG
========================================== */

const SUPABASE_URL =
"https://ksgywgdrfskqsufchbcm.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_HmFKwHMCISfN_YOoiLx3-A_MWnG9yG7";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);



/* ==========================================
   ELEMENT
========================================== */

const form =
document.getElementById("loginForm");

const button =
document.getElementById("loginButton");

const message =
document.getElementById("message");



/* ==========================================
   MESSAGE
========================================== */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}



/* ==========================================
   LOGIN
========================================== */

form.addEventListener(
"submit",
async function(event){

    event.preventDefault();


    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    button.disabled = true;

    button.textContent =
        "⏳ Memeriksa...";


    message.style.display =
        "none";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.signInWithPassword({

            email:email,

            password:password

        });


        if(error){

            throw error;

        }


        showMessage(
            "✅ Login berhasil! Mengalihkan...",
            "success"
        );


        setTimeout(
            function(){

                window.location.href =
                    "akademi.html";

            },
            1000
        );


    }catch(error){

        console.error(error);


        let text =
            error.message ||
            "Login gagal.";


        if(
            text
            .toLowerCase()
            .includes("invalid login")
        ){

            text =
            "❌ Email atau password salah.";

        }


        showMessage(
            text,
            "error"
        );


    }finally{

        button.disabled = false;

        button.textContent =
            "🔐 Masuk";

    }

});



/* ==========================================
   CEK LOGIN
========================================== */

async function checkAlreadyLogin(){

    const {
        data
    } =
    await supabaseClient
    .auth
    .getSession();


    if(
        data &&
        data.session
    ){

        window.location.href =
            "akademi.html";

    }

}


checkAlreadyLogin();

</script>

</body>

</html>
