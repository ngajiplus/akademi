<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#238b57"
>

<title>Login - NgajiPlus</title>

<!-- TEMA GLOBAL NGajiPlus -->
<link rel="stylesheet" href="theme.css">
<script>
(function(){
  try {
    if (localStorage.getItem("ngajiplus-theme") === "dark") {
      document.documentElement.classList.add("ngp-dark-preload");
    }
  } catch(e) {}
})();
</script>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- CONFIG SUPABASE -->
<script src="supabase-config.js"></script>

<style>
:root{
  --ngp-bg:#f4f8f6;
  --ngp-surface:#ffffff;
  --ngp-text:#1f2933;
  --ngp-muted:#7a8580;
  --ngp-border:#e1e9e4;
  --ngp-input:#ffffff;
  --ngp-input-border:#d7e2dc;
  --ngp-green:#238b57;
  --ngp-green-dark:#197547;
  --ngp-shadow:0 18px 50px rgba(20,70,45,.10);
  --ngp-error-bg:#fff1f0;
  --ngp-error-text:#b42318;
  --ngp-error-border:#f3c5c0;
  --ngp-success-bg:#eaf8ef;
  --ngp-success-text:#167a45;
  --ngp-success-border:#c5e8d1;
}

html{min-height:100%;background:var(--ngp-bg);}
html.ngp-dark-preload{background:#111815;}

*{box-sizing:border-box;}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--ngp-bg);
  color:var(--ngp-text);
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  transition:background-color .2s ease,color .2s ease;
}

.header{
  min-height:64px;
  background:var(--ngp-surface);
  border-bottom:1px solid var(--ngp-border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:0 20px;
  transition:background-color .2s ease,border-color .2s ease;
}

.logo{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--ngp-green);
  font-weight:700;
  font-size:20px;
  text-decoration:none;
}
.logo-icon{font-size:23px;}

.header-actions{display:flex;align-items:center;gap:10px;}

.back{
  color:var(--ngp-green);
  text-decoration:none;
  font-size:13px;
  font-weight:700;
}
.back:hover{text-decoration:underline;}

.theme-button{
  width:40px;
  height:40px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--ngp-border);
  border-radius:50%;
  background:var(--ngp-surface);
  color:var(--ngp-text);
  cursor:pointer;
  font-size:18px;
  line-height:1;
  box-shadow:0 4px 14px rgba(0,0,0,.06);
  transition:background-color .2s ease,border-color .2s ease,transform .15s ease;
}
.theme-button:hover{transform:translateY(-1px);}
.theme-button:focus-visible{outline:3px solid rgba(35,139,87,.22);outline-offset:2px;}

.login-area{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 15px;
}

.login-card{
  width:100%;
  max-width:400px;
  background:var(--ngp-surface);
  border:1px solid var(--ngp-border);
  border-radius:20px;
  padding:32px;
  box-shadow:var(--ngp-shadow);
  transition:background-color .2s ease,border-color .2s ease,box-shadow .2s ease;
}

.login-icon{text-align:center;font-size:45px;margin-bottom:8px;}

h1{text-align:center;margin:0 0 7px;font-size:27px;color:var(--ngp-text);}

.subtitle{text-align:center;color:var(--ngp-muted);font-size:13px;margin:0 0 25px;}

.form-group{margin-bottom:16px;}

label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:var(--ngp-text);}

input{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--ngp-input-border);
  border-radius:9px;
  outline:none;
  font-size:13px;
  background:var(--ngp-input);
  color:var(--ngp-text);
  caret-color:var(--ngp-green);
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease;
}
input::placeholder{color:var(--ngp-muted);opacity:.9;}
input:focus{border-color:var(--ngp-green);box-shadow:0 0 0 3px rgba(35,139,87,.10);}

.login-button{
  width:100%;
  border:none;
  background:var(--ngp-green);
  color:#fff;
  padding:13px;
  border-radius:9px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  margin-top:5px;
  transition:background-color .2s ease,transform .15s ease,opacity .2s ease;
}
.login-button:hover:not(:disabled){background:var(--ngp-green-dark);transform:translateY(-1px);}
.login-button:active:not(:disabled){transform:translateY(0);}
.login-button:disabled{opacity:.6;cursor:not-allowed;}

.message{
  display:none;
  padding:11px 12px;
  border-radius:9px;
  margin-bottom:15px;
  font-size:12px;
  line-height:1.5;
}
.message.error{display:block;background:var(--ngp-error-bg);color:var(--ngp-error-text);border:1px solid var(--ngp-error-border);}
.message.success{display:block;background:var(--ngp-success-bg);color:var(--ngp-success-text);border:1px solid var(--ngp-success-border);}

.register{text-align:center;margin-top:20px;font-size:13px;color:var(--ngp-muted);}
.register a,.forgot a{color:var(--ngp-green);font-weight:700;text-decoration:none;}
.register a:hover,.forgot a:hover{text-decoration:underline;}

.forgot{text-align:right;margin-top:8px;}
.forgot a{font-size:11px;font-weight:400;}

.footer{text-align:center;padding:18px;color:var(--ngp-muted);font-size:11px;}

/* Login-specific dark mode. Kept explicit so legacy CSS cannot leave white surfaces behind. */
body.dark-mode,body.dark{
  --ngp-bg:#111815;
  --ngp-surface:#1a241f;
  --ngp-text:#e8f0eb;
  --ngp-muted:#b7c5bc;
  --ngp-border:#334139;
  --ngp-input:#111915;
  --ngp-input-border:#3a4a40;
  --ngp-shadow:0 18px 50px rgba(0,0,0,.28);
  --ngp-error-bg:#401d1d;
  --ngp-error-text:#ffaaa6;
  --ngp-error-border:#683131;
  --ngp-success-bg:#153b29;
  --ngp-success-text:#8de2b1;
  --ngp-success-border:#276342;
}

body.dark-mode .header,body.dark .header{background:#17211c;border-color:#2d3932;}
body.dark-mode .theme-button,body.dark .theme-button{background:#1f2b24;border-color:#425248;color:#fff;}
body.dark-mode .login-card,body.dark .login-card{background:#1a241f;border-color:#334139;}
body.dark-mode input,body.dark input{background:#111915;color:#eef5f0;border-color:#3a4a40;}
body.dark-mode input::placeholder,body.dark input::placeholder{color:#8e9d94;}
body.dark-mode .footer,body.dark .subtitle,body.dark-mode .subtitle,body.dark .register{color:#b7c5bc;}

@media(max-width:500px){
  .header{padding:0 14px;min-height:60px;}
  .logo{font-size:17px;}
  .logo-icon{font-size:20px;}
  .header-actions{gap:7px;}
  .back{font-size:12px;}
  .theme-button{width:38px;height:38px;font-size:17px;}
  .login-card{padding:25px 20px;border-radius:18px;}
  h1{font-size:24px;}
  .login-area{padding:28px 12px;}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;scroll-behavior:auto!important;}
}
</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <a
    href="index.html"
    class="logo"
  >

    <span class="logo-icon">
      📖
    </span>

    <span>
      NgajiPlus
    </span>

  </a>


  <div class="header-actions">

    <button
      type="button"
      id="themeToggle"
      class="theme-button"
      aria-label="Gunakan Mode Gelap"
      title="Gunakan Mode Gelap"
    >🌙</button>

    <a
      href="index.html"
      class="back"
    >
      ← Kembali
    </a>

  </div>

</header>



<!-- =========================
     LOGIN
========================= -->

<main class="login-area">

<div class="login-card">


<div class="login-icon">
  📚
</div>


<h1>
  Login Member
</h1>


<p class="subtitle">
  Masuk untuk mengakses pembelajaran NgajiPlus
</p>



<div
  id="message"
  class="message"
></div>



<form id="loginForm">


<div class="form-group">

<label for="email">
  Email
</label>

<input
  type="email"
  id="email"
  placeholder="nama@email.com"
  autocomplete="email"
  required
>

</div>



<div class="form-group">

<label for="password">
  Password
</label>

<input
  type="password"
  id="password"
  placeholder="Masukkan password"
  autocomplete="current-password"
  required
>

<div class="forgot">

<a href="#"
   id="forgotPassword">

  Lupa password?

</a>

</div>

</div>



<button
  type="submit"
  class="login-button"
  id="loginButton"
>

  🔐 Login

</button>


</form>



<div class="register">

  Belum punya akun?

  <a href="daftar.html">
    Daftar sekarang
  </a>

</div>


</div>

</main>



<footer class="footer">

  © 2026 NgajiPlus

</footer>



<script src="theme.js"></script>

<script>

/* ==================================================
   LOGIN
================================================== */

const loginForm =
  document.getElementById("loginForm");

const loginButton =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");


function showMessage(
  text,
  type = "error"
){

  message.textContent = text;

  message.className =
    "message " + type;

}


loginForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    if(!email || !password){

      showMessage(
        "Email dan password wajib diisi."
      );

      return;
    }


    loginButton.disabled = true;

    loginButton.textContent =
      "⏳ Memproses...";

    message.className =
      "message";


    try{

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({

          email:
            email,

          password:
            password

        });


      if(error){

        console.error(
          "LOGIN ERROR:",
          error
        );

        showMessage(
          getLoginErrorMessage(
            error
          )
        );

        loginButton.disabled = false;

        loginButton.textContent =
          "🔐 Login";

        return;
      }


      if(!data || !data.user){

        showMessage(
          "Login gagal. Pengguna tidak ditemukan."
        );

        loginButton.disabled = false;

        loginButton.textContent =
          "🔐 Login";

        return;
      }


      showMessage(
        "Login berhasil. Mengarahkan ke dashboard...",
        "success"
      );


      setTimeout(
        function(){

          window.location.href =
            "dashboard.html";

        },
        700
      );


    }catch(error){

      console.error(
        "SYSTEM ERROR:",
        error
      );

      showMessage(
        "Terjadi kesalahan koneksi. Silakan coba lagi."
      );

      loginButton.disabled = false;

      loginButton.textContent =
        "🔐 Login";
    }

  }
);


/* ==================================================
   ERROR MESSAGE
================================================== */

function getLoginErrorMessage(error){

  const msg =
    String(
      error?.message || ""
    ).toLowerCase();


  if(
    msg.includes(
      "invalid login credentials"
    )
  ){

    return "Email atau password salah.";

  }


  if(
    msg.includes(
      "email not confirmed"
    )
  ){

    return "Email Anda belum dikonfirmasi. Silakan cek email dari Supabase.";

  }


  if(
    msg.includes(
      "user not found"
    )
  ){

    return "Akun dengan email tersebut belum terdaftar.";

  }


  if(
    msg.includes(
      "network"
    )
  ){

    return "Koneksi internet bermasalah.";

  }


  return (
    "Login gagal: " +
    (
      error?.message ||
      "silakan coba lagi."
    )
  );

}


/* ==================================================
   LUPA PASSWORD
================================================== */

document
  .getElementById("forgotPassword")
  .addEventListener(
    "click",
    async function(event){

      event.preventDefault();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      if(!email){

        showMessage(
          "Masukkan email terlebih dahulu."
        );

        return;
      }


      try{

        const {
          error
        } =
          await supabaseClient.auth
            .resetPasswordForEmail(
              email,
              {
                redirectTo:
                  window.location.origin +
                  "/reset-password.html"
              }
            );


        if(error){

          showMessage(
            error.message
          );

          return;
        }


        showMessage(
          "Link reset password telah dikirim ke email Anda.",
          "success"
        );


      }catch(error){

        showMessage(
          "Gagal mengirim link reset password."
        );

      }

    }
  );


/* ==================================================
   CEK SESSION
================================================== */

async function checkSession(){

  try{

    const {
      data
    } =
      await supabaseClient
        .auth
        .getSession();


    if(
      data &&
      data.session
    ){

      /*
        Kalau sudah login,
        langsung ke dashboard.
      */

      window.location.href =
        "dashboard.html";

    }

  }catch(error){

    console.error(
      "SESSION CHECK ERROR:",
      error
    );

  }

}


checkSession();

</script>


</body>

</html>
